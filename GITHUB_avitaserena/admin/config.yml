backend:
  name: github
  repo: sabrina-avitaserena/avitaserena-site
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site — textes éditables"
    files:

      - name: "landing"
        label: "🌐 Landing page"
        file: "content/landing.json"
        fields:

          - label: "HERO"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Titre ligne 1", name: "titre1", widget: "string", default: "Quand le corps parle,"}
              - {label: "Titre ligne 2 (gras)", name: "titre2", widget: "string", default: "j'apprends à l'écouter avec vous."}
              - {label: "Sous-titre", name: "sous_titre", widget: "text", default: "Spécialisée en santé digestive (SIBO, SII) et équilibre hormonal féminin..."}
              - {label: "Texte bouton principal", name: "btn1", widget: "string", default: "Prendre rendez-vous →"}
              - {label: "Texte bouton secondaire", name: "btn2", widget: "string", default: "Découvrir l'approche"}

          - label: "CITATION BASELINE"
            name: "baseline"
            widget: "object"
            fields:
              - {label: "Citation", name: "citation", widget: "text"}
              - {label: "Accroche", name: "accroche", widget: "string", default: "Chaque symptôme est un message."}

          - label: "SECTION SPÉCIALITÉS"
            name: "specialites"
            widget: "object"
            fields:
              - {label: "Titre section", name: "titre", widget: "string", default: "Deux territoires. Une approche."}
              - {label: "Introduction", name: "intro", widget: "text"}
              - label: "Spécialité 1 — Digestion"
                name: "spec1"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 2 — Hormones"
                name: "spec2"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 3 — Micronutrition"
                name: "spec3"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 4 — Approche globale"
                name: "spec4"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}

          - label: "SECTION MON HISTOIRE"
            name: "portrait"
            widget: "object"
            fields:
              - {label: "Citation mise en avant", name: "citation", widget: "text"}
              - {label: "Paragraphe 1", name: "para1", widget: "text"}
              - {label: "Paragraphe 2", name: "para2", widget: "text"}
              - {label: "Signature", name: "signature", widget: "string", default: "Sabrina Castelli, naturopathe"}

          - label: "SECTION SIBO"
            name: "sibo"
            widget: "object"
            fields:
              - {label: "Statistique (ex: 38%)", name: "stat", widget: "string", default: "38%"}
              - {label: "Description statistique", name: "stat_desc", widget: "string"}
              - {label: "Paragraphe 1", name: "para1", widget: "text"}
              - {label: "Paragraphe 2", name: "para2", widget: "text"}

          - label: "SECTION ACCOMPAGNEMENT"
            name: "accompagnement"
            widget: "object"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Étape 1"
                name: "etape1"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Description", name: "desc", widget: "text"}
              - label: "Étape 2"
                name: "etape2"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Description", name: "desc", widget: "text"}
              - label: "Étape 3"
                name: "etape3"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Description", name: "desc", widget: "text"}

          - label: "CTA FINAL"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "titre", widget: "string", default: "Prête à comprendre ce que votre corps vous dit ?"}
              - {label: "Sous-titre", name: "sous_titre", widget: "string", default: "Consultations en visio · Partout en France · Depuis Porto-Vecchio, Corse"}
              - {label: "Email de contact", name: "email", widget: "string", default: "contact@avitaserena.fr"}

backend:
  name: git-gateway
  branch: main

media_folder: "GITHUB_avitaserena/images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site — textes éditables"
    files:
      - name: "landing"
        label: "🌐 Landing page"
        file: "GITHUB_avitaserena/content/landing.json"
        fields:
          - label: "HERO"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Titre ligne 1", name: "titre1", widget: "string"}
              - {label: "Titre ligne 2 (gras)", name: "titre2", widget: "string"}
              - {label: "Sous-titre", name: "sous_titre", widget: "text"}
              - {label: "Bouton principal", name: "btn1", widget: "string"}
              - {label: "Bouton secondaire", name: "btn2", widget: "string"}
          - label: "CITATION BASELINE"
            name: "baseline"
            widget: "object"
            fields:
              - {label: "Citation", name: "citation", widget: "text"}
              - {label: "Accroche", name: "accroche", widget: "string"}
          - label: "SPÉCIALITÉS"
            name: "specialites"
            widget: "object"
            fields:
              - {label: "Titre section", name: "titre", widget: "string"}
              - {label: "Introduction", name: "intro", widget: "text"}
              - label: "Spécialité 1"
                name: "spec1"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 2"
                name: "spec2"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 3"
                name: "spec3"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
              - label: "Spécialité 4"
                name: "spec4"
                widget: "object"
                fields:
                  - {label: "Titre", name: "titre", widget: "string"}
                  - {label: "Texte", name: "texte", widget: "text"}
          - label: "MON HISTOIRE"
            name: "portrait"
            widget: "object"
            fields:
              - {label: "Citation", name: "citation", widget: "text"}
              - {label: "Paragraphe 1", name: "para1", widget: "text"}
              - {label: "Paragraphe 2", name: "para2", widget: "text"}
              - {label: "Signature", name: "signature", widget: "string"}
          - label: "SECTION SIBO"
            name: "sibo"
            widget: "object"
            fields:
              - {label: "Statistique (ex: 38%)", name: "stat", widget: "string"}
              - {label: "Description statistique", name: "stat_desc", widget: "string"}
              - {label: "Paragraphe 1", name: "para1", widget: "text"}
              - {label: "Paragraphe 2", name: "para2", widget: "text"}
          - label: "CTA FINAL"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - {label: "Sous-titre", name: "sous_titre", widget: "string"}
              - {label: "Email de contact", name: "email", widget: "string"}

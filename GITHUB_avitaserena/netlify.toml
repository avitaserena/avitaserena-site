[build]
  publish = "."

# ── Sécurité espace praticien ──
[[headers]]
  for = "/outils/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# ── Redirections URL courtes ──
[[redirects]]
  from = "/bilan"
  to = "/questionnaire_cliente_avitaserena.html"
  status = 200

[[redirects]]
  from = "/questionnaire"
  to = "/questionnaire_cliente_avitaserena.html"
  status = 200

[[redirects]]
  from = "/praticien"
  to = "/outils/index.html"
  status = 200

[[redirects]]
  from = "/pro"
  to = "/outils/index.html"
  status = 200

[[redirects]]
  from = "/programmes"
  to = "/programmes.html"
  status = 200

[[redirects]]
  from = "/reservation"
  to = "/reservation.html"
  status = 200

[[redirects]]
  from = "/reserver"
  to = "/reservation.html"
  status = 200

[[redirects]]
  from = "/manifeste"
  to = "/manifeste.html"
  status = 200

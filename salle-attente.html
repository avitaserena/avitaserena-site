<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salle d'attente — A VITA SERENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blanc:#FFFFFF;--off:#F7F6F4;--grege:#EDE9E1;
  --taupe:#D5CFC6;--sable:#C4A882;--ocre:#B4906A;--or:#9B7230;
  --ardoise:#1E1E1C;--encre:#2C2C2A;--gris:#6B6560;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  background:var(--ardoise);
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  position:relative;
}

/* Glows d'ambiance, comme sur l'espace client */
body::before{
  content:'';position:fixed;right:-160px;top:-160px;width:520px;height:520px;
  border-radius:50%;background:radial-gradient(circle,rgba(196,169,125,.10) 0%,transparent 70%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;left:-140px;bottom:-140px;width:440px;height:440px;
  border-radius:50%;background:radial-gradient(circle,rgba(196,169,125,.07) 0%,transparent 70%);
  pointer-events:none;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:48px 24px;
  position:relative;
  z-index:1;
}

.logo-wrap{margin-bottom:44px}
.logo-wrap svg{height:34px;width:auto;fill:#fff}

/* Halo respirant derrière l'indicateur d'attente */
.pulse-wrap{position:relative;width:104px;height:104px;margin:0 auto 36px;display:flex;align-items:center;justify-content:center}
.pulse-ring{position:absolute;border-radius:50%;border:1px solid rgba(196,169,125,.35);animation:pulseRing 3.2s ease-out infinite}
.pulse-ring.r2{animation-delay:1.06s}
.pulse-ring.r3{animation-delay:2.12s}
@keyframes pulseRing{
  0%{width:36px;height:36px;opacity:.9}
  100%{width:104px;height:104px;opacity:0}
}
.pulse-core{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sable),var(--ocre));position:relative;z-index:2;box-shadow:0 0 24px rgba(196,169,125,.5)}

.eyebrow{
  font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sable);margin-bottom:18px;
}

.greeting{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:400;
  font-size:clamp(30px,5vw,46px);
  line-height:1.25;
  color:#fff;
  margin-bottom:16px;
  max-width:640px;
}
.greeting .prenom{color:var(--sable);font-weight:500}

.sub{
  font-size:15.5px;
  line-height:1.75;
  color:rgba(255,255,255,.7);
  max-width:440px;
  margin-bottom:40px;
}

.cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--ocre);color:#fff;text-decoration:none;
  border:none;border-radius:99px;padding:16px 36px;
  font-family:'Be Vietnam Pro',sans-serif;font-size:15px;font-weight:600;letter-spacing:.03em;
  cursor:pointer;transition:background .25s, transform .2s;
  box-shadow:0 12px 32px rgba(180,144,106,.25);
}
.cta:hover{background:var(--or);transform:translateY(-1px)}
.cta svg{width:18px;height:18px;flex-shrink:0}

.note{
  margin-top:28px;
  font-size:12.5px;
  color:rgba(255,255,255,.45);
  max-width:400px;
  line-height:1.7;
}

/* Bandeau défilant — signature de la page */
.ticker-wrap{
  width:100%;
  border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  overflow:hidden;
  padding:14px 0;
  position:relative;
  z-index:1;
}
.ticker-track{
  display:flex;
  width:max-content;
  animation:scrollTicker 28s linear infinite;
}
.ticker-item{
  display:flex;align-items:center;gap:14px;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;
  color:rgba(255,255,255,.82);
  white-space:nowrap;
  padding:0 36px;
}
.ticker-item .dot{width:4px;height:4px;border-radius:50%;background:var(--sable);flex-shrink:0}
@keyframes scrollTicker{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
@media(prefers-reduced-motion:reduce){
  .ticker-track{animation:none}
  .pulse-ring{animation:none;opacity:0}
}

@media(max-width:520px){
  .main{padding:36px 20px}
  .cta{padding:15px 28px;font-size:14px}
  .ticker-item{font-size:15px;padding:0 24px}
}
</style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-4v12l-6-4"/></svg>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<script>
(function(){
  // Récupère le prénom : priorité au paramètre d'URL, sinon session espace client existante
  var params = new URLSearchParams(window.location.search);
  var prenom = params.get('prenom');
  if(!prenom){
    try{
      var session = JSON.parse(localStorage.getItem('avs_client') || sessionStorage.getItem('avs_client') || '{}');
      if(session && session.prenom) prenom = session.prenom;
    }catch(e){}
  }
  var span = document.getElementById('prenomSpan');
  if(prenom){
    span.textContent = ' ' + prenom.charAt(0).toUpperCase() + prenom.slice(1).toLowerCase() + ',';
  }

  // Bandeau défilant — message dupliqué pour un défilement continu sans coupure
  var message = "J'arrive dans un instant — merci pour votre patience";
  var track = document.getElementById('tickerTrack');
  var html = '';
  for(var i=0;i<8;i++){
    html += '<span class="ticker-item"><span class="dot"></span>' + message + '</span>';
  }
  track.innerHTML = html + html; // dupliqué pour la boucle infinie (translateX -50%)
})();
</script>

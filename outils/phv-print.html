<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocole d'Hygiène Vitale — A Vita Serena</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script src="supabase-db.js"></script>
<script src="auth-guard.js"></script>
<style>
:root{
  --blanc:#FFFFFF;--off:#F7F6F4;--grege:#EDE9E1;
  --taupe:#D5CFC6;--sable:#C4A882;--ocre:#B4906A;--or:#9B7230;
  --ardoise:#1E1E1C;--gris:#6B6560;--gris-clair:#9B9590;
  --or-clair:#FBF3E4;--or-pale:#F5EDD8;
  --vert:#3D6B2C;--vert-cl:#EAF0E6;--vert-bg:#F3F8F1;
  --violet:#5C4578;--violet-cl:#EEE8F5;--violet-bg:#F7F4FB;
  --bleu:#2C5E8A;--bleu-cl:#E4EFF8;--bleu-bg:#F1F7FC;
  --or-acc:#8B6010;--or-cl:#FBF3E8;--or-bg:#FEFAF4;
  --rose:#7A3A52;--rose-cl:#F5E8EE;--rose-bg:#FCF5F8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;color:var(--ardoise);background:var(--off)}

/* ═══ LOADING ═══ */
#loading{position:fixed;inset:0;background:var(--ardoise);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.ld-logo{font-size:14px;letter-spacing:.2em;color:var(--sable);margin-bottom:16px}
.ld-logo .av{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px}
.ld-logo .se{font-weight:800;letter-spacing:.08em}
.ld-bar{width:120px;height:3px;background:rgba(196,168,130,.2);border-radius:99px;overflow:hidden}
.ld-fill{width:0%;height:100%;background:var(--sable);border-radius:99px;animation:ldPulse 1.5s ease-in-out infinite}
@keyframes ldPulse{0%{width:0%}50%{width:70%}100%{width:100%}}

/* ═══ BARRE PROGRESSION ═══ */
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(196,168,130,.15);z-index:100}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sable),var(--or));width:0%;transition:width .4s;box-shadow:0 0 10px rgba(155,114,48,.45)}

/* ═══ NAV FIXE ═══ */
.topnav{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;opacity:0;transition:opacity .4s}
.topnav.show{opacity:1}
.topnav-logo{font-size:12px;letter-spacing:.16em;color:var(--gris-clair);text-decoration:none}
.topnav-logo .av{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px}
.topnav-logo .se{font-weight:800;letter-spacing:.08em}
.topnav-actions{display:flex;gap:10px}
.topnav-btn{padding:8px 18px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--taupe);background:var(--blanc);color:var(--ardoise);font-family:'Be Vietnam Pro',sans-serif;transition:all .2s}
.topnav-btn:hover{border-color:var(--sable);background:var(--or-clair)}

/* ═══ DOTS NAV LATÉRALE ═══ */
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .4s}
.dots.show{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--taupe);cursor:pointer;transition:all .3s;border:none;padding:0}
.dot.on{background:var(--ocre);transform:scale(1.3)}
.dot:hover{background:var(--sable)}

/* ═══ SECTION PLEIN ÉCRAN ═══ */
.sec{min-height:100vh;min-height:100dvh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:80px 32px;position:relative;overflow:hidden}

/* ═══ COVER ═══ */
.sec-cover{background:var(--ardoise);color:var(--blanc);text-align:center}
.sec-cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(196,168,130,.1),transparent 70%);pointer-events:none}
.cover-inner{position:relative;z-index:1;max-width:600px}
.cover-logo{font-size:14px;letter-spacing:.22em;color:var(--sable);margin-bottom:32px;opacity:0;animation:fi .7s .2s ease forwards}
.cover-logo .av{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px}
.cover-logo .se{font-weight:800;letter-spacing:.08em}
.cover-rule{width:48px;height:2px;background:linear-gradient(90deg,var(--sable),var(--or));margin:0 auto 28px;opacity:0;animation:fi .7s .3s ease forwards}
.cover-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sable);font-weight:600;margin-bottom:14px;opacity:0;animation:fi .7s .35s ease forwards}
.cover-prenom{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,7vw,64px);line-height:1.1;margin-bottom:10px;opacity:0;animation:fi .7s .45s ease forwards}
.cover-titre{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(18px,3vw,24px);color:rgba(255,255,255,.55);margin-bottom:32px;opacity:0;animation:fi .7s .55s ease forwards}
.cover-date{font-size:12px;color:rgba(255,255,255,.35);letter-spacing:.1em;opacity:0;animation:fi .7s .65s ease forwards}
.cover-scroll{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.3);letter-spacing:.1em;animation:fi .7s .8s ease forwards,bounce 2.5s 1.5s ease-in-out infinite;opacity:0}
@keyframes fi{to{opacity:1}}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ═══ BLOC CONTENU ═══ */
.sec-content{flex-direction:column;text-align:left}
.sec-inner{max-width:680px;width:100%}
.sec-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;margin-bottom:14px}
.sec-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,4.5vw,38px);line-height:1.2;color:var(--ardoise);margin-bottom:24px}
.sec-body{font-size:15.5px;line-height:1.8;color:#3C3830}
.sec-body p{margin-bottom:14px}
.sec-body ul{list-style:none;padding:0;margin:0 0 14px}
.sec-body li{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;line-height:1.7}
.sec-body li .bd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:9px}
.sec-body .sub-heading{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ocre);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--grege)}

/* Ritual grid */
.ritual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:10px 0}
.ritual-item{background:var(--blanc);border:1.5px solid var(--grege);border-radius:16px;padding:20px 22px}
.ritual-time{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);margin-bottom:10px}
.ritual-item ul{list-style:none;padding:0;margin:0}
.ritual-item li{font-size:14.5px;line-height:1.7;color:#3C3830;padding:4px 0}
.ritual-item li.ritual-prose{font-style:italic;color:var(--gris);font-size:13.5px}

/* Signal timeline */
.signal-list{display:flex;flex-direction:column;gap:14px}
.signal-item{display:flex;gap:16px;align-items:flex-start}
.signal-period{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ocre);min-width:120px;padding-top:2px}
.signal-content{font-size:14.5px;line-height:1.7;color:#3C3830}

/* ═══ SECTION CTA PROGRAMME ═══ */
.sec-programme{background:var(--ardoise);color:var(--blanc);text-align:center}
.programme-inner{max-width:560px}
.programme-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sable);font-weight:600;margin-bottom:18px}
.programme-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:16px}
.programme-sub{font-size:15.5px;color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:32px}
.programme-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pgm-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px 20px;flex:1;min-width:150px;max-width:200px;text-align:center}
.pgm-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;margin-bottom:4px}
.pgm-dur{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sable);font-weight:600;margin-bottom:8px}
.pgm-price{font-size:20px;font-weight:700}
.pgm-after{font-size:11px;color:rgba(255,255,255,.4)}

/* ═══ DISCLAIMER ═══ */
.sec-disclaimer{min-height:auto;padding:40px 32px;background:var(--grege);text-align:center;scroll-snap-align:end}
.disclaimer-txt{max-width:600px;margin:0 auto;font-size:12px;color:var(--gris);line-height:1.7}

/* ═══ MOBILE ═══ */
@media(max-width:640px){
  .sec{padding:70px 20px}.dots{display:none}
  .topnav{padding:12px 16px}
  .ritual-grid{grid-template-columns:1fr}
  .programme-cards{flex-direction:column;align-items:center}
  .signal-item{flex-direction:column;gap:4px}.signal-period{min-width:auto}
}

/* ═══ IMPRESSION ═══ */
@media print{
  html{scroll-snap-type:none}
  .prog,.topnav,.dots,.cover-scroll,.sec-programme,.sec-disclaimer,.topnav-actions{display:none!important}
  .sec{min-height:auto;page-break-after:always;padding:40px 32px}
  .sec-cover{page-break-after:always;min-height:100vh}
  .sec-content{page-break-inside:avoid}
  body{background:#fff}
}

@media(prefers-reduced-motion:reduce){html{scroll-snap-type:none;scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="ld-logo"><span class="av">avita</span><span class="se">serena</span></div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<!-- PROGRESS -->
<div class="prog"><div class="prog-fill" id="prog-fill"></div></div>

<!-- NAV -->
<nav class="topnav" id="topnav">
  <a class="topnav-logo" href="https://avitaserena.com"><span class="av">avita</span><span class="se">serena</span></a>
  <div class="topnav-actions">
    <button class="topnav-btn" onclick="window.print()">🖨 Imprimer</button>
  </div>
</nav>

<!-- DOTS -->
<div class="dots" id="dots"></div>

<!-- CONTAINER -->
<div id="container"></div>

<script>
/* ══════════════════════════════════════
   CONSTANTES & DONNÉES
══════════════════════════════════════ */
let data = null;
let blocks = [];
let clientProgramme = null;

const PILIER_ICONS = { alimentation:'🌿', psychologie:'🧠', activite:'🏃', complements:'✦', bilan:'📊', autre:'—' };
const PILIER_LABELS = { alimentation:'Alimentation', psychologie:'Psychologie & émotions', activite:'Activité physique', complements:'Compléments ciblés', bilan:'Bilan & suivi', autre:'Autre' };
const SECTION_COLORS = { alimentation:'#3D6B2C', psychologie:'#5C4578', activite:'#2C5E8A', complements:'#8B6010', bilan:'#7A3A52', autre:'#6B6560' };
const EYEBROW_NAMES = { s1:'Comprendre votre terrain', s2:'Vos axes de travail', s3:'Votre protocole', s4:'Alimentation au quotidien', s5:'Votre semaine type', s6:'Ce que vous allez ressentir' };

function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ══════════════════════════════════════
   PARSING DU CONTENU (repris de l'ancien phv-print)
══════════════════════════════════════ */
function parseContent(raw, accentColor) {
  const lines = raw.split('\n');
  let html = '', inBullets = false;
  const bulletCol = accentColor || 'var(--ocre)';
  for (const line of lines) {
    const l = line.trim();
    if (!l) { if (inBullets) { html += '</ul>'; inBullets = false; } continue; }
    if (/^[•·\-–→*]/.test(l)) {
      if (!inBullets) { html += '<ul>'; inBullets = true; }
      html += `<li><span class="bd" style="background:${bulletCol}"></span><span>${escH(l.replace(/^[•·\-–→*]\s*/,''))}</span></li>`;
    } else {
      if (inBullets) { html += '</ul>'; inBullets = false; }
      if (/^\[.+\]$/.test(l) || (/^[A-ZÀÉÈÊÎÏÔÙÜ\s&–—\[\]:]+$/.test(l) && l.length < 60)) {
        html += `<div class="sub-heading">${escH(l.replace(/^\[|\]$/g,''))}</div>`;
      } else {
        html += `<p>${escH(l)}</p>`;
      }
    }
  }
  if (inBullets) html += '</ul>';
  return html;
}

function renderRituals(raw) {
  const RITUAL_KEYS = /^(MATIN|MIDI|SOIR|EN JOURNÉE|EN JOURNEE|JOURNÉE|HEBDOMADAIRE)/i;
  const RITUAL_ICONS = { MATIN:'🌅', MIDI:'☀️', SOIR:'🌙', 'EN JOURNÉE':'🕐', 'EN JOURNEE':'🕐', JOURNÉE:'🕐', HEBDOMADAIRE:'📅' };
  const sections = []; let current = null;
  for (const line of raw.split('\n')) {
    const l = line.trim(); if (!l) continue;
    const isHeader = RITUAL_KEYS.test(l) && !/^[•·\-–→*]/.test(l);
    if (isHeader) {
      if (current) sections.push(current);
      const label = l.replace(/[:\s]+$/, '').replace(/\*\*/g,'').replace(/\*/g,'');
      const km = label.match(/^(MATIN|MIDI|SOIR|EN JOURNÉE|EN JOURNEE|JOURNÉE|HEBDOMADAIRE)/i);
      current = { time: label, icon: km ? (RITUAL_ICONS[km[1].toUpperCase()] || '🕐') : '🕐', items: [], prose: [] };
    } else if (current) {
      if (/^[•·\-–→*]/.test(l)) current.items.push(l.replace(/^[•·\-–→*]\s*/,''));
      else current.prose.push(l);
    } else { sections.push({ intro: l }); }
  }
  if (current) sections.push(current);
  const intros = sections.filter(s => s.intro);
  const rituals = sections.filter(s => s.time);
  let html = '';
  if (intros.length) html += intros.map(s => `<p>${escH(s.intro)}</p>`).join('');
  if (rituals.length) {
    html += '<div class="ritual-grid">';
    for (const s of rituals) {
      const items = [...(s.prose||[]).map(p=>`<li class="ritual-prose">${escH(p)}</li>`), ...s.items.map(i=>`<li>${escH(i)}</li>`)];
      html += `<div class="ritual-item"><div class="ritual-time">${s.icon} ${escH(s.time)}</div><ul>${items.join('')}</ul></div>`;
    }
    html += '</div>';
  }
  return html;
}

function renderSignals(raw) {
  const lines = raw.split('\n').filter(l=>l.trim());
  let html = '<div class="signal-list">';
  let period = '', items = [];
  function flush() {
    if (!period && !items.length) return;
    html += `<div class="signal-item"><div class="signal-period">${escH(period)}</div><div class="signal-content">${items.map(i=>'• '+escH(i)).join('<br>')}</div></div>`;
    items = [];
  }
  for (const line of lines) {
    const l = line.trim();
    if (/^(En |À |Après |Si |Dès )/i.test(l) && !/^[•·\-–→*]/.test(l)) { flush(); period = l.replace(/:$/,''); }
    else if (/^[•·\-–→*]/.test(l)) items.push(l.replace(/^[•·\-–→*]\s*/,''));
    else { flush(); period = l; }
  }
  flush(); html += '</div>';
  return html;
}

/* ══════════════════════════════════════
   CONSTRUCTION DU DOCUMENT IMMERSIF
══════════════════════════════════════ */
function buildImmersive() {
  const container = document.getElementById('container');
  const cl = data._client || {};
  const prenom = cl.prenom || 'Cliente';
  const dateStr = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  const sousTitre = data.sous_titre || "Protocole d'Hygiène Vitale";

  let html = '';

  // ── COVER ──
  html += `
  <section class="sec sec-cover" id="sec-0">
    <div class="cover-inner">
      <div class="cover-logo"><span class="av">avita</span><span class="se">serena</span></div>
      <div class="cover-rule"></div>
      <div class="cover-eyebrow">Protocole d'Hygiène Vitale</div>
      <div class="cover-prenom">${escH(prenom)}</div>
      <div class="cover-titre">${escH(sousTitre)}</div>
      <div class="cover-date">${dateStr} · Sabrina Castelli, Naturopathe</div>
    </div>
    <div class="cover-scroll">↓ Faites défiler</div>
  </section>`;

  // ── SECTIONS CONTENU ──
  blocks.forEach((b, i) => {
    const color = SECTION_COLORS[b.pilier] || '#6B6560';
    const icon = PILIER_ICONS[b.pilier] || '—';
    const eyebrow = EYEBROW_NAMES[b.id] || PILIER_LABELS[b.pilier] || '';
    let bodyHtml;
    if (b.id === 's5') bodyHtml = renderRituals(b.content || '');
    else if (b.id === 's6') bodyHtml = renderSignals(b.content || '');
    else bodyHtml = parseContent(b.content || '', color);

    html += `
  <section class="sec sec-content" id="sec-${i+1}">
    <div class="sec-inner">
      <div class="sec-eyebrow" style="color:${color}">${icon} &nbsp;${escH(eyebrow)}</div>
      <div class="sec-title">${escH(b.title || '')}</div>
      <div class="sec-body">${bodyHtml}</div>
    </div>
  </section>`;
  });

  // ── PAGE PROGRAMME (sauf si la cliente en a déjà un) ──
  if (!clientProgramme) {
    html += `
  <section class="sec sec-programme" id="sec-programme">
    <div class="programme-inner">
      <div class="programme-eyebrow">✦ &nbsp;Et maintenant ?</div>
      <div class="programme-title">Un protocole, c'est un départ.<br>Un accompagnement, c'est une transformation.</div>
      <div class="programme-sub">Ce protocole vous donne une vraie base. Mais un terrain se réajuste au fil des semaines — c'est exactement ce que permet un accompagnement suivi.</div>
      <div class="programme-cards">
        <div class="pgm-card"><div class="pgm-name">Alba</div><div class="pgm-dur">3 mois</div><div class="pgm-price">210 €</div><div class="pgm-after">après bilan</div></div>
        <div class="pgm-card"><div class="pgm-name">Aria</div><div class="pgm-dur">6 mois</div><div class="pgm-price">390 €</div><div class="pgm-after">après bilan</div></div>
        <div class="pgm-card"><div class="pgm-name">Ora</div><div class="pgm-dur">9 mois</div><div class="pgm-price">540 €</div><div class="pgm-after">après bilan</div></div>
      </div>
    </div>
  </section>`;
  }

  // ── DISCLAIMER ──
  html += `
  <section class="sec-disclaimer">
    <div class="disclaimer-txt">Ce document est un outil d'accompagnement naturopathique personnalisé. Il ne se substitue pas à l'avis de votre médecin. En cas de doute ou d'interaction médicamenteuse, consultez votre médecin traitant.<br>A Vita Serena — Sabrina Castelli, Naturopathe · Porto-Vecchio, Corse</div>
  </section>`;

  container.innerHTML = html;

  // ── DOTS ──
  const total = blocks.length + 1 + (clientProgramme ? 0 : 1);
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let d = 0; d < total; d++) {
    const dot = document.createElement('button');
    dot.className = 'dot' + (d === 0 ? ' on' : '');
    dot.dataset.idx = d;
    dot.onclick = () => document.getElementById('sec-' + (d === total - 1 && !clientProgramme ? 'programme' : d)).scrollIntoView({ behavior: 'smooth' });
    dotsEl.appendChild(dot);
  }

  // ── SCROLL OBSERVER ──
  const allSecs = container.querySelectorAll('.sec');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        const idx = id === 'sec-programme' ? total - 1 : parseInt(id.replace('sec-',''));
        dotsEl.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i === idx));
        // Progress
        const pct = Math.round(((idx + 1) / total) * 100);
        document.getElementById('prog-fill').style.width = pct + '%';
        // Show/hide nav
        document.getElementById('topnav').classList.toggle('show', idx > 0);
        dotsEl.classList.toggle('show', idx > 0);
      }
    });
  }, { threshold: 0.4 });
  allSecs.forEach(s => obs.observe(s));
}

/* ══════════════════════════════════════
   CHARGEMENT DES DONNÉES
══════════════════════════════════════ */
async function chargerProtocoleCliente(clientKey) {
  try {
    const row = await DB.getProtocoleClient(clientKey);
    const pd = row?.data?.protocolData;
    const bl = row?.data?.blocks;
    if (!pd || !bl || !bl.length) throw new Error('no data');
    data = pd;
    blocks = bl;
    buildImmersive();
    document.getElementById('loading').classList.add('done');
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--sable);max-width:400px;padding:24px">
        <div style="font-size:40px;margin-bottom:16px">📋</div>
        <p style="font-size:16px;margin-bottom:8px">Impossible de charger ce protocole.</p>
        <p style="font-size:13px;color:rgba(255,255,255,.45)">Vérifiez que vous êtes bien connectée avec l'email associé à votre dossier.</p>
      </div>`;
    console.error('Erreur chargement protocole Supabase:', e);
  }
}

function chargerProtocoleLocal() {
  try {
    const raw = localStorage.getItem('avita_phv_print');
    if (!raw) throw new Error('no data');
    const parsed = JSON.parse(raw);
    data = parsed.data;
    blocks = parsed.blocks;
    if (!data || !blocks.length) throw new Error('empty');
    buildImmersive();
    document.getElementById('loading').classList.add('done');
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--sable);max-width:400px;padding:24px">
        <div style="font-size:40px;margin-bottom:16px">📋</div>
        <p style="font-size:16px;margin-bottom:8px">Aucun protocole à afficher.</p>
        <p style="font-size:13px;color:rgba(255,255,255,.45)">Retournez dans le <a href="generateur.html" style="color:var(--sable)">Générateur PHV</a>.</p>
      </div>`;
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const clientKey = params.get('client');
  if (clientKey) {
    showAuthGate('cliente', () => { removeAuthGate(); chargerProtocoleCliente(clientKey); });
  } else {
    showAuthGate('praticienne', () => { removeAuthGate(); chargerProtocoleLocal(); });
  }
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Protocole d'Hygiène Vitale — A VITA SERENA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<script src="supabase-db.js"></script>
<script src="auth-guard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --blanc:#FFFFFF;--off:#F7F6F4;--grege:#EDE9E1;
  --taupe:#D5CFC6;--sable:#C4A882;--ocre:#B4906A;--or:#9B7230;
  --ardoise:#1E1E1C;--gris:#6B6560;--gris-clair:#9B9590;
  --or-clair:#FBF3E4;--or-pale:#F5EDD8;
  --vert:#3D6B2C;--vert-cl:#EAF0E6;--vert-bg:#F3F8F1;
  --violet:#5C4578;--violet-cl:#EEE8F5;--violet-bg:#F7F4FB;
  --bleu:#2C5E8A;--bleu-cl:#E4EFF8;--bleu-bg:#F1F7FC;
  --or-acc:#8B6010;--or-cl:#FBF3E8;--or-bg:#FEFAF4;
  --rose:#7A3A52;--rose-cl:#F5E8EE;--rose-bg:#FCF5F8;
  --lavande:#6B5296;--lavande-cl:#EDE8F5;--lavande-bg:#F8F6FC;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;color:var(--ardoise);background:var(--off)}

/* ═══ LOADING ═══ */
#loading{position:fixed;inset:0;background:var(--ardoise);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
.ld-logo{color:var(--sable);margin-bottom:16px}
.ld-logo svg{height:16px;width:auto;display:block}
.ld-bar{width:120px;height:3px;background:rgba(196,168,130,.2);border-radius:99px;overflow:hidden}
.ld-fill{width:0%;height:100%;background:var(--sable);border-radius:99px;animation:ldPulse 1.5s ease-in-out infinite}
@keyframes ldPulse{0%{width:0%}50%{width:70%}100%{width:100%}}

/* ═══ BARRE PROGRESSION ═══ */
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(196,168,130,.15);z-index:100}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--sable),var(--or));width:0%;transition:width .4s;box-shadow:0 0 10px rgba(155,114,48,.45)}

/* ═══ NAV FIXE ═══ */
.topnav{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;opacity:0;transition:opacity .4s}
.topnav.show{opacity:1}
.topnav-logo{color:var(--gris-clair);text-decoration:none;display:inline-flex;align-items:center}
.topnav-logo svg{height:14px;width:auto;display:block}
.topnav-actions{display:flex;gap:10px}
.topnav-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--taupe);background:var(--blanc);color:var(--ardoise);font-family:'Be Vietnam Pro',sans-serif;transition:all .2s}
.topnav-btn svg{width:14px;height:14px;display:block;flex-shrink:0}
.topnav-btn:hover{border-color:var(--sable);background:var(--or-clair)}

/* ═══ DOTS NAV LATÉRALE ═══ */
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .4s}
.dots.show{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--taupe);cursor:pointer;transition:all .3s;border:none;padding:0}
.dot.on{background:var(--ocre);transform:scale(1.3)}
.dot:hover{background:var(--sable)}

/* ═══ SECTION PLEIN ÉCRAN ═══ */
.sec{min-height:100vh;min-height:100dvh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:80px 32px;position:relative;overflow:hidden}

/* ═══ COVER ═══ */
.sec-cover{background:var(--ardoise);color:var(--blanc);text-align:center}
.sec-cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 65% 55% at 50% 38%,rgba(196,168,130,.16),transparent 70%),radial-gradient(ellipse 50% 40% at 50% 100%,rgba(155,114,48,.1),transparent 70%);pointer-events:none}
.cover-inner{position:relative;z-index:1;max-width:600px}
.cover-logo{color:var(--blanc);margin-bottom:36px;opacity:0;animation:fi .7s .2s ease forwards;position:relative}
.cover-logo svg{position:relative;z-index:1;height:54px;width:auto;display:block;margin:0 auto}
.cover-rule{width:48px;height:2px;background:linear-gradient(90deg,var(--sable),var(--or));margin:0 auto 28px;opacity:0;animation:fi .7s .3s ease forwards}
.cover-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sable);font-weight:600;margin-bottom:14px;opacity:0;animation:fi .7s .35s ease forwards}
.cover-prenom{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,7vw,64px);line-height:1.1;margin-bottom:10px;opacity:0;animation:fi .7s .45s ease forwards}
.cover-titre{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(18px,3vw,24px);color:rgba(255,255,255,.85);margin-bottom:32px;opacity:0;animation:fi .7s .55s ease forwards}
.cover-date{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.1em;opacity:0;animation:fi .7s .65s ease forwards}
.cover-scroll-btn{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fi .7s .9s ease forwards;cursor:pointer;background:none;border:none;padding:6px;font-family:'Be Vietnam Pro',sans-serif}
.cover-scroll-btn .csb-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.cover-scroll-btn .csb-ring{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(196,168,130,.45);display:flex;align-items:center;justify-content:center;animation:scrollBounce 2s ease-in-out infinite;transition:border-color .2s,background .2s}
.cover-scroll-btn:hover .csb-ring{border-color:var(--sable);background:rgba(196,168,130,.1)}
.cover-scroll-btn .csb-ring svg{width:17px;height:17px;color:var(--sable)}
@keyframes scrollBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes fi{to{opacity:1}}

/* ═══ BLOC CONTENU ═══ */
.sec-content{flex-direction:column;text-align:left}
.sec-inner{max-width:680px;width:100%}
/* AJOUTÉ (26/08/2026) : petit logo répété en haut de CHAQUE page de contenu à l'impression/PDF
   — auparavant seule la page de couverture affichait le logo (.topnav est masqué à l'impression
   et n'existe que pour la navigation à l'écran), donc un document de plusieurs pages n'avait le
   logo que sur la première. Invisible à l'écran (où le header .topnav suffit déjà). */
.sec-page-logo{display:none}
@media print{
  .sec-page-logo{display:block;position:absolute;top:24px;right:32px;height:13px;width:auto;color:var(--gris-clair)}
  .sec-page-logo svg{height:100%;width:auto;display:block}
}
body.pdf-export-mode .sec-page-logo{display:block!important;position:absolute;top:24px;right:32px;height:13px;width:auto;color:var(--gris-clair)}
body.pdf-export-mode .sec-page-logo svg{height:100%;width:auto;display:block}
.sec-eyebrow{font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.eyebrow-ico{color:var(--ocre);display:inline-flex;flex-shrink:0}
.eyebrow-ico svg{width:17px;height:17px;display:block}
.sec-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,4.5vw,38px);line-height:1.2;color:var(--ardoise);margin-bottom:24px}
.sec-body{font-size:15.5px;line-height:1.8;color:#3C3830}
.sec-body p{margin-bottom:14px}
.sec-body ul{list-style:none;padding:0;margin:0 0 14px}
.sec-body li{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;line-height:1.7}
.sec-body li .bd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:9px}
.sec-body .sub-heading{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blanc);padding:11px 20px;border-radius:10px;margin:36px 0 18px}
.sec-body .sub-heading:first-child{margin-top:0}

/* Ritual grid */
.ritual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:10px 0}
.ritual-item{background:var(--blanc);border:1.5px solid var(--grege);border-radius:16px;padding:20px 22px}
.ritual-time{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);margin-bottom:10px}
.ritual-time svg{width:13px;height:13px;display:block;flex-shrink:0}
.ritual-item ul{list-style:none;padding:0;margin:0}
.ritual-item li{font-size:14.5px;line-height:1.7;color:#3C3830;padding:4px 0}
.ritual-item li.ritual-prose{font-style:italic;color:var(--gris);font-size:13.5px}

/* Signal timeline */
.signal-list{display:flex;flex-direction:column;gap:14px}
.signal-item{display:flex;gap:16px;align-items:flex-start}
.signal-period{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ocre);min-width:120px;padding-top:2px}
.signal-content{font-size:14.5px;line-height:1.7;color:#3C3830}

/* Aromathérapie — cartes huile + encart précaution toujours visible */
.aroma-intro{margin-bottom:18px}
.aroma-card{background:var(--blanc);border:1.5px solid var(--grege);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.aroma-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:var(--ardoise);margin-bottom:6px}
.aroma-usage{font-size:14.5px;line-height:1.7;color:#3C3830;margin-bottom:12px}
.aroma-precaution{display:flex;gap:10px;align-items:flex-start;background:var(--lavande-bg);border:1.5px solid var(--lavande-cl);border-radius:12px;padding:12px 14px}
.aroma-precaution .ap-ico{flex-shrink:0;font-size:15px;line-height:1.4}
.aroma-precaution .ap-txt{font-size:13.5px;line-height:1.6;color:#3C3830}
.aroma-precaution .ap-txt strong{color:var(--lavande);font-weight:700}

/* ═══ RECO — VALIDER / REFUSER UNE RECOMMANDATION (cartes) ═══ */
.sec-body p.lead-p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.6;color:var(--ardoise);margin-bottom:24px}

.sec-body .reco-card,.sec-body .reco-chip{background:var(--blanc);border:1.5px solid var(--grege);border-radius:16px;transition:border-color .25s,background .25s,box-shadow .25s}
.sec-body .reco-card{padding:20px 24px;margin-bottom:18px}
.sec-body .reco-card:hover{box-shadow:0 8px 24px rgba(30,30,28,.05)}
.sec-body .reco-card.is-oui{border-color:var(--vert-cl);background:var(--vert-bg)}
.sec-body .reco-card.is-non{border-color:var(--rose-cl);background:var(--rose-bg)}
.reco-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.reco-card-head-plain{padding-bottom:2px}
.reco-card-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19.5px;line-height:1.35;flex:1}
.reco-card-intro{margin-top:12px}
.reco-card-intro p{font-size:14.5px;line-height:1.75;color:#4A453E;margin-bottom:10px}
.reco-card-intro p:last-child{margin-bottom:0}
.reco-card-items{margin-top:14px}
.reco-card-items ul{list-style:none;padding:0;margin:0 0 4px}
.reco-card-items > ul + .reco-subcheck,.reco-card-items > .reco-subcheck + ul{margin-top:10px}
.reco-card-items li{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.7;color:#4A453E;padding:4px 0}
.reco-card-items li .bd{width:5px;height:5px;border-radius:50%;background:var(--taupe);flex-shrink:0;margin-top:9px}
.reco-card-items li strong{color:var(--ardoise);font-weight:700}
.reco-card-items li.reco-warning{background:var(--lavande-bg);border:1px solid var(--lavande-cl);border-radius:10px;padding:10px 12px;margin-top:8px}
.reco-card-items li.reco-warning .wi{flex-shrink:0;color:var(--lavande);line-height:1.5}
.reco-card-items li.reco-warning .wi svg{width:15px;height:15px;display:block;margin-top:2px}
.reco-card-items li.reco-warning strong{color:var(--lavande)}
.reco-card-items li.reco-step .step-num{flex-shrink:0;width:19px;height:19px;border-radius:50%;background:var(--grege);color:var(--ardoise);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
/* Recommandation cochable imbriquée dans une carte (ex. options de petit-déjeuner, aliments à éviter) */
.reco-card-items .reco-subcheck{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:11px;background:var(--off);border:1px solid var(--grege);transition:background .2s,border-color .2s}
.reco-card-items .reco-subcheck:last-child{margin-bottom:0}
.reco-card-items .reco-subcheck.is-oui{background:var(--vert-bg);border-color:var(--vert-cl)}
.reco-card-items .reco-subcheck.is-non{background:var(--rose-bg);border-color:var(--rose-cl)}
.reco-card-items .reco-subcheck .txt{flex:1;font-size:14px;line-height:1.6;color:#3C3830}
.reco-card-items .reco-subcheck .reco-btn{width:26px;height:26px;font-size:12px}

.sec-body .reco-chip{display:flex;align-items:center;gap:14px;padding:14px 20px;margin-bottom:10px}
.sec-body .reco-chip.is-oui{border-color:var(--vert-cl);background:var(--vert-bg)}
.sec-body .reco-chip.is-non{border-color:var(--rose-cl);background:var(--rose-bg)}
.reco-chip-txt{flex:1;font-size:15px;line-height:1.6;color:#3C3830}

.reco-controls{display:flex;gap:8px;flex-shrink:0}
.reco-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--taupe);background:var(--blanc);color:var(--gris);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;flex-shrink:0}
.reco-btn:hover{border-color:var(--ocre);transform:translateY(-1px)}
.reco-btn.active-ok{background:var(--vert);border-color:var(--vert);color:#fff}
.reco-btn.active-non{background:#B8323A;border-color:#B8323A;color:#fff}

/* En-tête non-interactif (pilier "bilan" — analyse, pas de recommandation à cocher) */
.sec-body p.reco-header-plain{font-weight:700;font-size:16px;margin:22px 0 8px}
.sec-body p.reco-header-plain:first-child{margin-top:0}

.reco-raison{margin-top:12px;padding:12px 14px;background:var(--off);border:1px solid var(--taupe);border-radius:10px}
.reco-raison textarea{width:100%;min-height:56px;border:1px solid var(--taupe);border-radius:8px;padding:8px 10px;font-family:'Be Vietnam Pro',sans-serif;font-size:13.5px;color:var(--ardoise);resize:vertical;outline:none;box-sizing:border-box}
.reco-raison textarea:focus{border-color:var(--ocre)}
.reco-raison-actions{display:flex;justify-content:flex-end;margin-top:8px}
.reco-raison-btn{padding:6px 16px;border-radius:99px;border:none;background:var(--ardoise);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif}

/* Barre flottante — envoi des réponses à Sabrina */
.reco-bar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ardoise);color:#fff;border-radius:99px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.28);z-index:120;transition:transform .35s ease,opacity .35s ease;opacity:0;max-width:90vw}
.reco-bar.show{transform:translate(-50%,0);opacity:1}
.reco-bar-txt{font-size:12.5px;color:rgba(255,255,255,.75);white-space:nowrap}
.reco-bar-btn{background:var(--sable);color:var(--ardoise);border:none;border-radius:99px;padding:9px 20px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;white-space:nowrap}
.reco-bar-btn:disabled{opacity:.55;cursor:default}
@media(max-width:640px){
  .reco-bar{left:16px;right:16px;transform:translate(0,120px);bottom:16px}
  .reco-bar.show{transform:translate(0,0)}
  .reco-bar-txt{white-space:normal}
  .sec-body .reco-card{padding:16px 18px}
}

/* ═══ SECTION CTA PROGRAMME ═══ */
.sec-programme{background:var(--ardoise);color:var(--blanc);text-align:center}
.programme-inner{max-width:560px}
.programme-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sable);font-weight:600;margin-bottom:18px}
.programme-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:16px}
.programme-body{font-size:15.5px;color:rgba(255,255,255,.85);line-height:1.75;margin-bottom:32px;text-align:left}
.programme-body p{margin-bottom:14px}
.pgm-reco-wrap{margin-top:8px}
.pgm-reco-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.pgm-reco-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:#fff;margin-bottom:6px}
.pgm-reco-sousnom{font-family:'Inter',sans-serif;font-style:normal;font-size:14px;color:rgba(255,255,255,.75)}
.pgm-reco-meta{font-size:15px;font-weight:600;color:#fff}
.pgm-reco-deja{font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}
.pgm-reco-aluma{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.8);background:rgba(108,71,255,.14);border:1px solid rgba(108,71,255,.3);border-radius:12px;padding:14px 18px;margin-bottom:16px;text-align:left}
.pgm-reco-aluma strong{color:#fff}
.pgm-reco-noobligation{font-size:13px;color:rgba(255,255,255,.75);font-style:italic}
.pgm-pay-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.pgm-pay-btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;border-radius:99px;font-family:'Be Vietnam Pro',sans-serif;font-size:14px;font-weight:600;text-decoration:none;transition:all .2s;cursor:pointer}
.pgm-pay-btn-primary{background:var(--sable);color:var(--ardoise);border:1.5px solid var(--sable)}
.pgm-pay-btn-primary:hover{background:var(--or);border-color:var(--or)}
.pgm-pay-btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.pgm-pay-btn-outline:hover{border-color:var(--sable);color:var(--sable)}
.pgm-pay-note{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px}

/* ═══ DISCLAIMER ═══ */
.sec-disclaimer{min-height:auto;padding:40px 32px;background:var(--grege);text-align:center;scroll-snap-align:end}
.disclaimer-txt{max-width:600px;margin:0 auto;font-size:12px;color:var(--gris);line-height:1.7}

/* ═══ MOBILE ═══ */
@media(max-width:640px){
  .sec{padding:70px 20px}.dots{display:none}
  .topnav{padding:12px 16px}
  .ritual-grid{grid-template-columns:1fr}
  .signal-item{flex-direction:column;gap:4px}.signal-period{min-width:auto}
}

/* ═══ IMPRESSION ═══ */
@media print{
  html{scroll-snap-type:none}
  .prog,.topnav,.dots,.cover-scroll-btn,.sec-programme,.sec-disclaimer,.topnav-actions,.reco-bar,.reco-controls,.reco-raison{display:none!important}
  .sec{min-height:auto;page-break-after:always;padding:40px 32px}
  .sec-cover{page-break-after:always;min-height:100vh}
  .sec-content{page-break-inside:avoid}
  body{background:#fff}
}

/* ═══ CAPTURE PDF (mêmes règles que l'impression, déclenchées par JS) ═══ */
body.pdf-export-mode{background:#fff}
body.pdf-export-mode .prog,
body.pdf-export-mode .topnav,
body.pdf-export-mode .dots,
body.pdf-export-mode .cover-scroll-btn,
body.pdf-export-mode .sec-programme,
body.pdf-export-mode .sec-disclaimer,
body.pdf-export-mode .reco-bar,
body.pdf-export-mode .reco-controls,
body.pdf-export-mode .reco-raison{display:none!important}
body.pdf-export-mode .sec{min-height:auto!important;height:auto!important;padding:40px 32px!important;page-break-after:always}

function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ══════════════════════════════════════
   PARSING DU CONTENU (repris de l'ancien phv-print)
══════════════════════════════════════ */
function isAllCapsHeading(l){
  if (l.length >= 70) return false;
  const stripped = l.replace(/\([^)]*\)/g, '').trim();
  if (!stripped) return false;
  return /^[A-ZÀÉÈÊÎÏÔÙÜ0-9\s&–—:,'’-]+$/.test(stripped);
}

function isHeaderLine(l){
  if(l.length > 110 || l.length < 6) return false;
  if(/[.!?]$/.test(l)) return false; // une phrase complète (explication) se termine toujours par une ponctuation — un titre non
  return true;
}

const LABEL_WHITELIST = /^(posologie|pourquoi|précaution|prudence|attention|contre[- ]indication|dosage|effet|usage|indication|composition|conseil|astuce|note|rappel|important|objectif|durée|fréquence)$/i;

function extractLabel(texte){
  const m = texte.match(/^([A-ZÀÂÉÈÊÎÏÔÖÙÛÜŸÇ][A-Za-zà-üÀ-Ü'’ -]{1,24})\s*:\s*(.+)$/);
  if (m && LABEL_WHITELIST.test(m[1].trim())) return { label: m[1].trim(), rest: m[2].trim() };
  return null;
}

// Paramètre de fréquence/dosage/minutage d'UNE recommandation (ex. "3 fois par jour", "Pendant 5 minutes", "À faire le soir, 2h après le dîner")
// — mais seulement s'il s'agit d'une ligne courte (un vrai paramètre, pas une recommandation complète qui mentionnerait juste une durée en passant)
const PARAM_FREQ_RE = /\b(\d+\s*fois\s*par\s*(jour|semaine|mois|heure)|\d+\s*respirations?\s*par\s*minute|^pendant\s+\d)/i;
const PARAM_INTRO_RE = /^(à\s+(faire|prendre|consommer|utiliser|appliquer)\b|chaque\s+(matin|soir|jour)\b|avant\s+(de|le|la)\b|après\s+(le|la|les)\b)/i;
function isParamBullet(texte){
  if (texte.length >= 70) return false; // trop long/riche pour n'être qu'un simple paramètre — c'est une recommandation à part entière
  return PARAM_FREQ_RE.test(texte) || PARAM_INTRO_RE.test(texte.trim());
}

const STEP_VERB_RE = /^(mélang|dilu|étal|appliqu|mass|vers|ajout|laiss|rinc|fricti|répét|renouvel|retir|essuy|inhal|respir|humidifi|chauff|press|filtr|couvr|dépos|frott|tremp|infus|agit|tamponn|imprégn|boi|mang|consomm|prend)/i;

function classifyBullet(texte){
  const lbl = extractLabel(texte);
  if (lbl) return { kind:'label', lbl };
  if (STEP_VERB_RE.test(texte.trim())) return { kind:'step' };
  if (isParamBullet(texte)) return { kind:'param' };
  return { kind:'check' };
}

function renderSubBullet(texte, bulletCol){
  const lbl = extractLabel(texte);
  if (lbl) {
    const isWarning = /^(précaution|attention|prudence|contre-indication)/i.test(lbl.label);
    const inner = `<strong>${escH(lbl.label)} :</strong> ${escH(lbl.rest)}`;
    if (isWarning) return `<li class="reco-warning"><span class="wi"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2 17.3 16H2.7L10 3.2Z"/><path d="M10 8.2v3.2"/><circle cx="10" cy="13.6" r=".2" fill="currentColor" stroke="none"/></svg></span><span>${inner}</span></li>`;
    return `<li><span class="bd" style="background:${bulletCol}"></span><span>${inner}</span></li>`;
  }
  return `<li><span class="bd" style="background:${bulletCol}"></span><span>${escH(texte)}</span></li>`;
}

/* Rendu simple (piliers d'analyse, ex. "bilan") — pas de recommandation à cocher, juste une mise en forme soignée */
function parseContentPlain(raw, accentColor) {
  const lines = raw.split('\n');
  let html = '', inBullets = false;
  const bulletCol = accentColor || 'var(--ocre)';
  for (const line of lines) {
    const l = line.trim();
    if (!l) { if (inBullets) { html += '</ul>'; inBullets = false; } continue; }
    if (/^[•·◦\-–→*]/.test(l)) {
      const texte = l.replace(/^[•·◦\-–→*]\s*/,'').trim();
      if (!texte || /^[-–—]+$/.test(texte)) continue;
      if (!inBullets) { html += '<ul>'; inBullets = true; }
      html += renderSubBullet(texte, bulletCol);
    } else {
      if (inBullets) { html += '</ul>'; inBullets = false; }
      if (/^\[.+\]$/.test(l) || isAllCapsHeading(l)) {
        html += `<div class="sub-heading" style="background:${bulletCol}">${escH(l.replace(/^\[|\]$/g,''))}</div>`;
      } else if (isHeaderLine(l)) {
        html += `<p class="reco-header-plain" style="color:${bulletCol}">${escH(l)}</p>`;
      } else {
        html += `<p>${escH(l)}</p>`;
      }
    }
  }
  if (inBullets) html += '</ul>';
  return html;
}

/* Rendu interactif : chaque recommandation devient une carte.
   - Le titre + TOUTE l'explication (même celle qui suit les puces dans le texte source) sont regroupés en intro, en haut de la carte.
   - Les puces sont ensuite classées : détail labellisé (Posologie/Pourquoi/Précaution) → info non cochable ;
     étape séquentielle (Mélanger, Étaler, Laisser poser…) → étape numérotée non cochable ;
     sinon → recommandation à part entière, cochable individuellement.
   - Le titre de la carte n'obtient sa propre case QUE si la carte ne contient aucun item cochable en dessous
     (ex. un complément alimentaire) — sinon ce sont les items qui portent les cases (ex. options de petit-déjeuner). */
function parseContent(raw, accentColor, pilier) {
  const interactif = !!pilier && !PILIERS_SANS_RECO.includes(pilier);
  if (!interactif) return parseContentPlain(raw, accentColor);

  const lines = raw.split('\n');
  const bulletCol = accentColor || 'var(--ocre)';
  let html = '';
  let card = null; // { title, introHtml, itemsHtml, listOpen, hasCheckable, stepNum }
  let leadUsed = false;

  function newCard(title){
    return { title: title, introHtml: '', itemsHtml: '', listOpen: false, hasCheckable: false, hasBulletDetail: false, stepNum: 0 };
  }
  function isEmpty(c){ return !c.introHtml && !c.itemsHtml; }
  function closeList(c){ if (c.listOpen) { c.itemsHtml += '</ul>'; c.listOpen = false; } }
  function openList(c){ if (!c.listOpen) { c.itemsHtml += '<ul>'; c.listOpen = true; } }

  function flushCard(){
    if (!card) return;
    closeList(card);
    // Une étape numérotée seule (aucune étape 2, 3…) n'a pas de sens à afficher comme "1" isolé — puce simple à la place
    if (card.stepNum === 1) {
      card.itemsHtml = card.itemsHtml.replace(
        /<li class="reco-step"><span class="step-num">1<\/span>/,
        `<li><span class="bd" style="background:${bulletCol}"></span>`
      );
    }
    const introBlock = card.introHtml ? `<div class="reco-card-intro">${card.introHtml}</div>` : '';
    const itemsBlock = card.itemsHtml ? `<div class="reco-card-items">${card.itemsHtml}</div>` : '';
    let head;
    if (card.hasCheckable) {
      head = `<div class="reco-card-head reco-card-head-plain"><div class="reco-card-title">${escH(card.title)}</div></div>`;
    } else {
      const itemId = 'reco' + (recoCounter++);
      recoState[itemId] = { pilier: pilier, texte: card.title, etat: null, raison: '' };
      head = `<div class="reco-card-head" id="li-${itemId}"><div class="reco-card-title" style="color:${bulletCol}">${escH(card.title)}</div><span class="reco-controls"><button type="button" class="reco-btn reco-btn-refuser" id="${itemId}-non" onclick="recoDecider('${itemId}')" title="Refuser cette recommandation">Refuser</button></span></div>`;
    }
    html += `<div class="reco-card">${head}${introBlock}${itemsBlock}</div>`;
    card = null;
  }

  for (const rawLine of lines) {
    const l = rawLine.trim();
    if (!l) continue; // simple séparateur entre lignes — ne referme pas un groupe en cours

    // Puce "◦" — sous-information explicite (RÈGLE N°1ter du générateur) : TOUJOURS non-cochable, rattachée à la carte en cours.
    // Signal fiable à 100% pour les protocoles générés après cette mise à jour — pas de devinette nécessaire.
    if (/^◦/.test(l)) {
      const texte = l.replace(/^◦\s*/,'').trim();
      if (texte && card) {
        card.hasBulletDetail = true;
        const c = classifyBullet(texte); // ne sert plus qu'à choisir l'HABILLAGE visuel (étape numérotée / libellé gras / puce simple)
        if (c.kind === 'step') {
          openList(card);
          card.stepNum++;
          card.itemsHtml += `<li class="reco-step"><span class="step-num">${card.stepNum}</span><span>${escH(texte)}</span></li>`;
        } else if (c.kind === 'label') {
          openList(card);
          card.itemsHtml += renderSubBullet(texte, bulletCol);
        } else {
          openList(card);
          card.itemsHtml += `<li><span class="bd" style="background:${bulletCol}"></span><span>${escH(texte)}</span></li>`;
        }
      } else if (texte) {
        // "◦" isolée sans carte ouverte (cas limite) : simple ligne d'information, jamais cochable
        html += `<p>${escH(texte)}</p>`;
      }
      continue;
    }

    if (/^[•·\-–→*]/.test(l)) {
      const texte = l.replace(/^[•·\-–→*]\s*/,'').trim();
      if (!texte || /^[-–—]+$/.test(texte)) continue; // artefact "--" — ignoré

      if (card) {
        const c = classifyBullet(texte);
        if (c.kind === 'check') {
          closeList(card);
          card.hasCheckable = true;
          card.hasBulletDetail = true;
          const itemId = 'reco' + (recoCounter++);
          recoState[itemId] = { pilier: pilier, texte: texte, etat: null, raison: '' };
          card.itemsHtml += `<div class="reco-subcheck" id="li-${itemId}"><span class="txt">${escH(texte)}</span><span class="reco-controls"><button type="button" class="reco-btn reco-btn-refuser" id="${itemId}-non" onclick="recoDecider('${itemId}')" title="Refuser cette recommandation">Refuser</button></span></div>`;
        } else if (c.kind === 'step') {
          openList(card);
          card.stepNum++;
          card.itemsHtml += `<li class="reco-step"><span class="step-num">${card.stepNum}</span><span>${escH(texte)}</span></li>`;
        } else if (c.kind === 'param') {
          openList(card);
          card.hasBulletDetail = true;
          card.itemsHtml += `<li><span class="bd" style="background:${bulletCol}"></span><span>${escH(texte)}</span></li>`;
        } else {
          openList(card);
          card.hasBulletDetail = true;
          card.itemsHtml += renderSubBullet(texte, bulletCol);
        }
      } else {
        // puce isolée, sans titre au-dessus : elle est elle-même une recommandation à part entière
        const itemId = 'reco' + (recoCounter++);
        recoState[itemId] = { pilier: pilier, texte: texte, etat: null, raison: '' };
        html += `<div class="reco-chip" id="li-${itemId}"><span class="reco-chip-txt">${escH(texte)}</span><span class="reco-controls"><button type="button" class="reco-btn reco-btn-refuser" id="${itemId}-non" onclick="recoDecider('${itemId}')" title="Refuser cette recommandation">Refuser</button></span></div>`;
      }
      continue;
    }

    // Ligne numérotée : étape d'une séquence en cours SI la carte n'a encore que des étapes (pas de vraie puce de détail),
    // sinon c'est un nouvel élément indépendant (ex. complément n°2) qui mérite sa propre carte.
    const numMatch = l.match(/^(\d+)[.)]\s+(.+)$/);
    if (numMatch && card && !card.hasBulletDetail) {
      openList(card);
      card.itemsHtml += `<li class="reco-step"><span class="step-num">${escH(numMatch[1])}</span><span>${escH(numMatch[2])}</span></li>`;
      continue;
    }

    if (card) closeList(card);

    const looksLikeDivider = /^\[.+\]$/.test(l) || isAllCapsHeading(l);
    if (looksLikeDivider) {
      if (card && isEmpty(card)) {
        // la carte vient d'être ouverte, encore vide : ce sous-titre est une précision d'intro ("MIDI (votre repas principal) :"), pas un nouveau bloc
        card.introHtml += `<p>${escH(l)}</p>`;
        continue;
      }
      flushCard();
      html += `<div class="sub-heading" style="background:${bulletCol}">${escH(l.replace(/^\[|\]$/g,''))}</div>`;
      continue;
    }

    if (isHeaderLine(l)) {
      if (card && isEmpty(card)) {
        // la carte vient d'être ouverte et n'a encore aucun contenu : cette 2e ligne-titre est une reformulation/consigne d'intro
        card.introHtml += `<p>${escH(l)}</p>`;
        continue;
      }
      flushCard();
      card = newCard(l);
      continue;
    }

    // Paragraphe normal → toujours versé dans l'intro de la carte en cours (même s'il arrive après des puces dans le texte source),
    // pour que l'explication complète reste groupée AVANT les éléments à cocher.
    if (card) {
      card.introHtml += `<p>${escH(l)}</p>`;
    } else if (!leadUsed) {
      html += `<p class="lead-p">${escH(l)}</p>`;
      leadUsed = true;
    } else {
      html += `<p>${escH(l)}</p>`;
    }
  }
  flushCard();
  return html;
}

/* ══════════════════════════════════════
   VALIDER / REFUSER UNE RECOMMANDATION
   → écrit dans phv_memos, lu par le CRM (carte Observance PHV)
══════════════════════════════════════ */
// RÈGLE (26/08/2026) : plus de bouton "Valider" — une recommandation non refusée est
// considérée comme suivie (silence = acceptation). La cliente ne peut que la REFUSER, avec un
// motif obligatoire (pour que Sabrina puisse proposer une alternative pertinente). Cliquer à
// nouveau sur "Refuser" quand c'est déjà refusé permet d'annuler le refus (retour à l'état
// "suivi" par défaut).
function recoDecider(itemId){
  const state = recoState[itemId];
  if(!state) return;
  const li = document.getElementById('li-'+itemId);

  if(state.etat === 'non'){
    // déjà refusée -> on annule le refus, retour à l'état "suivi" par défaut
    state.etat = null; state.raison = '';
    if(li){ li.classList.remove('is-non'); }
    const btnNon = document.getElementById(itemId+'-non');
    if(btnNon){ btnNon.classList.remove('active-non'); btnNon.textContent = 'Refuser'; }
    fermerRaisonBox(itemId);
    majBarreReco();
    return;
  }

  ouvrirRaisonBox(itemId, li, state.raison || '');
}

function ouvrirRaisonBox(itemId, li, raisonActuelle){
  if(!li) return;
  let box = document.getElementById('raison-'+itemId);
  if(box){ const ta=box.querySelector('textarea'); if(ta) ta.focus(); return; }
  li.insertAdjacentHTML('beforeend', `<div class="reco-raison" id="raison-${itemId}"><textarea placeholder="Pourquoi refusez-vous cette recommandation ? (obligatoire — ça permet à Sabrina de vous proposer une alternative)">${escH(raisonActuelle)}</textarea><div class="reco-raison-actions"><span class="reco-raison-err" id="err-${itemId}" style="display:none;color:#B8323A;font-size:11.5px;margin-right:auto">Merci de préciser un motif.</span><button type="button" class="reco-raison-btn" onclick="confirmerRefus('${itemId}')">Confirmer le refus</button></div></div>`);
  const ta = document.getElementById('raison-'+itemId).querySelector('textarea');
  if(ta) ta.focus();
}

function fermerRaisonBox(itemId){
  const box = document.getElementById('raison-'+itemId);
  if(box) box.remove();
}

function confirmerRefus(itemId){
  const box = document.getElementById('raison-'+itemId);
  const ta = box ? box.querySelector('textarea') : null;
  const raison = ta ? ta.value.trim() : '';
  if(!raison){
    const err = document.getElementById('err-'+itemId);
    if(err) err.style.display = 'inline';
    if(ta) ta.focus();
    return;
  }
  const state = recoState[itemId];
  if(!state) return;
  state.etat = 'non'; state.raison = raison;
  const li = document.getElementById('li-'+itemId);
  if(li) li.classList.add('is-non');
  const btnNon = document.getElementById(itemId+'-non');
  if(btnNon){ btnNon.classList.add('active-non'); btnNon.textContent = 'Refusé — modifier'; }
  fermerRaisonBox(itemId);
  majBarreReco();
}

function majBarreReco(){
  const refus = Object.values(recoState).filter(s => s.etat === 'non');
  let bar = document.getElementById('recoBar');
  if(!refus.length){ if(bar) bar.classList.remove('show'); return; }
  if(!bar){
    document.body.insertAdjacentHTML('beforeend', `<div class="reco-bar" id="recoBar"><span class="reco-bar-txt" id="recoBarTxt"></span><button type="button" class="reco-bar-btn" id="recoBarBtn" onclick="envoyerReponsesReco()">Envoyer à Sabrina →</button></div>`);
    bar = document.getElementById('recoBar');
  }
  const txtEl = document.getElementById('recoBarTxt');
  if(txtEl) txtEl.textContent = refus.length+' recommandation'+(refus.length>1?'s':'')+' refusée'+(refus.length>1?'s':'')+' avec motif';
  const btn = document.getElementById('recoBarBtn');
  if(btn){
    if(currentClientKey){ btn.disabled=false; btn.textContent='Envoyer à Sabrina →'; }
    else { btn.disabled=true; btn.textContent='Aperçu praticienne — non envoyé'; }
  }
  bar.classList.add('show');
}

function setClientIdentity(clientKey, cl){
  let prenom = cl.prenom || '';
  let nom = cl.nom || '';
  let ddn = cl.ddn || '';
  if((!prenom || !nom) && clientKey){
    const m = clientKey.match(/^(.+)-(\d{8})$/);
    if(m){
      if(!ddn) ddn = m[2].slice(0,4)+'-'+m[2].slice(4,6)+'-'+m[2].slice(6,8);
      const parts = m[1].split('-');
      if(!prenom) prenom = parts[0] || '';
      if(!nom) nom = parts.slice(1).join(' ') || '';
    }
  }
  clientIdentity = { prenom: prenom, nom: nom, ddn: ddn };
}

async function envoyerReponsesReco(){
  if(!currentClientKey) return; // aperçu praticienne — rien à envoyer
  const btn = document.getElementById('recoBarBtn');
  if(btn){ btn.disabled=true; btn.textContent='Envoi…'; }
  try{
    const token = await Auth.getValidAccessToken();
    // Seuls les refus sont envoyés — les recommandations non refusées sont considérées comme
    // suivies par défaut (26/08/2026), donc rien à signaler à leur sujet.
    const refuses = Object.values(recoState).filter(s => s.etat === 'non');
    const details = {};
    refuses.forEach(s => {
      if(!details[s.pilier]) details[s.pilier] = [];
      details[s.pilier].push({ texte: s.texte, etat: s.etat, raison: s.raison || '' });
    });
    const stats = { ok: 0, non: refuses.length, total: refuses.length };
    const genId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('memo-'+Date.now()+'-'+Math.random().toString(36).slice(2));
    await fetch(SUPA_URL + '/rest/v1/phv_memos', {
      method: 'POST',
      headers: {
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + (token || SUPA_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        id: genId,
        client_key: currentClientKey,
        prenom: clientIdentity.prenom,
        nom: clientIdentity.nom,
        ddn: clientIdentity.ddn,
        stats: stats,
        details: details,
        // AJOUTÉ (26/08/2026) : priorité "urgente" dès qu'il y a au moins un refus, pour que le
        // CRM affiche une alerte visible — Sabrina doit pouvoir proposer une alternative vite.
        priorite: refuses.length ? 'urgente' : 'normale',
        traite: false,
        created_at: new Date().toISOString()
      })
    });
    if(btn) btn.textContent = '✓ Envoyé à Sabrina';
    setTimeout(function(){ const bar=document.getElementById('recoBar'); if(bar) bar.classList.remove('show'); }, 2200);
  }catch(e){
    console.warn('Réponses non envoyées à Sabrina :', e);
    if(btn){ btn.disabled=false; btn.textContent='Réessayer →'; }
  }
}

function renderRituals(raw) {
  const RITUAL_KEYS = /^(MATIN|MIDI|SOIR|EN JOURNÉE|EN JOURNEE|JOURNÉE|HEBDOMADAIRE)/i;
  const RI_SUNRISE = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="11" r="3.2"/><path d="M10 3v2M4 8l1.4 1.4M16 8l-1.4 1.4"/><path d="M3 16h14"/></svg>';
  const RI_SUN = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7"/></svg>';
  const RI_MOON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.5A6.8 6.8 0 1 1 7.5 4a5.3 5.3 0 0 0 8.5 8.5z"/></svg>';
  const RI_CLOCK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.2"/><path d="M10 6v4l3 2"/></svg>';
  const RI_CAL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="1.6"/><path d="M3 8.3h14M7 3v3M13 3v3"/></svg>';
  const RITUAL_ICONS = { MATIN:RI_SUNRISE, MIDI:RI_SUN, SOIR:RI_MOON, 'EN JOURNÉE':RI_CLOCK, 'EN JOURNEE':RI_CLOCK, JOURNÉE:RI_CLOCK, HEBDOMADAIRE:RI_CAL };
  const sections = []; let current = null;
  for (const line of raw.split('\n')) {
    const l = line.trim(); if (!l) continue;
    const isHeader = RITUAL_KEYS.test(l) && !/^[•·\-–→*]/.test(l);
    if (isHeader) {
      if (current) sections.push(current);
      const label = l.replace(/[:\s]+$/, '').replace(/\*\*/g,'').replace(/\*/g,'');
      const km = label.match(/^(MATIN|MIDI|SOIR|EN JOURNÉE|EN JOURNEE|JOURNÉE|HEBDOMADAIRE)/i);
      current = { time: label, icon: km ? (RITUAL_ICONS[km[1].toUpperCase()] || RI_CLOCK) : RI_CLOCK, items: [], prose: [] };
    } else if (current) {
      if (/^[•·\-–→*]/.test(l)) current.items.push(l.replace(/^[•·\-–→*]\s*/,''));
      else current.prose.push(l);
    } else { sections.push({ intro: l }); }
  }
  if (current) sections.push(current);
  const intros = sections.filter(s => s.intro);
  const rituals = sections.filter(s => s.time);
  let html = '';
  if (intros.length) html += intros.map(s => `<p>${escH(s.intro)}</p>`).join('');
  if (rituals.length) {
    html += '<div class="ritual-grid">';
    for (const s of rituals) {
      const items = [...(s.prose||[]).map(p=>`<li class="ritual-prose">${escH(p)}</li>`), ...s.items.map(i=>`<li>${escH(i)}</li>`)];
      html += `<div class="ritual-item"><div class="ritual-time">${s.icon} ${escH(s.time)}</div><ul>${items.join('')}</ul></div>`;
    }
    html += '</div>';
  }
  return html;
}

function renderSignals(raw) {
  const lines = raw.split('\n').filter(l=>l.trim());
  let html = '<div class="signal-list">';
  let period = '', items = [];
  function flush() {
    if (!period && !items.length) return;
    html += `<div class="signal-item"><div class="signal-period">${escH(period)}</div><div class="signal-content">${items.map(i=>'• '+escH(i)).join('<br>')}</div></div>`;
    items = [];
  }
  for (const line of lines) {
    const l = line.trim();
    if (/^(En |À |Après |Si |Dès )/i.test(l) && !/^[•·\-–→*]/.test(l)) { flush(); period = l.replace(/:$/,''); }
    else if (/^[•·\-–→*]/.test(l)) items.push(l.replace(/^[•·\-–→*]\s*/,''));
    else { flush(); period = l; }
  }
  flush(); html += '</div>';
  return html;
}

// Appelle create-parcours-checkout pour obtenir un lien de paiement Stripe généré à la volée
// (coupon "bilan déjà réglé" appliqué automatiquement côté serveur), puis redirige vers Stripe.
// mode: 'unique' (paiement en une fois) ou 'fois3' (3 échéances, arrêt automatique après la 3e).
async function payerParcours(mode, btnEl) {
  if (!currentClientKey) { alert("Impossible d'identifier votre fiche — merci de recharger la page."); return; }
  const boutons = document.querySelectorAll('.pgm-pay-btn');
  boutons.forEach(b => b.disabled = true);
  const texteOriginal = btnEl ? btnEl.textContent : '';
  if (btnEl) btnEl.textContent = 'Un instant…';
  try {
    const res = await fetch(SUPA_URL + '/functions/v1/create-parcours-checkout', {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_key: currentClientKey, mode, cancel_url: window.location.href })
    });
    const out = await res.json();
    if (!res.ok || !out.url) throw new Error(out.error || 'Erreur lors de la génération du lien de paiement.');
    window.location.href = out.url;
  } catch (err) {
    console.error('Erreur payerParcours:', err);
    alert("Une erreur est survenue en préparant le paiement. Vous pouvez réessayer, ou contacter Sabrina directement si le problème persiste.");
    boutons.forEach(b => b.disabled = false);
    if (btnEl) btnEl.textContent = texteOriginal;
  }
}

    <div class="disclaimer-txt">Ce document est un outil d'accompagnement naturopathique personnalisé. Il ne se substitue pas à l'avis de votre médecin. En cas de doute ou d'interaction médicamenteuse, consultez votre médecin traitant.<br>A VITA SERENA — Sabrina Castelli, Naturopathe · Porto-Vecchio, Corse</div>
  </section>`;

  container.innerHTML = html;

  // ── DOTS ──
  const total = blocks.length + 1;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let d = 0; d < total; d++) {
    const dot = document.createElement('button');
    dot.className = 'dot' + (d === 0 ? ' on' : '');
    dot.dataset.idx = d;
    dot.onclick = () => document.getElementById('sec-' + d).scrollIntoView({ behavior: 'smooth' });
    dotsEl.appendChild(dot);
  }

  // ── SCROLL OBSERVER ──
  const allSecs = container.querySelectorAll('.sec');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        const idx = parseInt(id.replace('sec-',''));
        dotsEl.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i === idx));
        // Progress
        const pct = Math.round(((idx + 1) / total) * 100);
        document.getElementById('prog-fill').style.width = pct + '%';
        // Show/hide nav
        document.getElementById('topnav').classList.toggle('show', idx > 0);
        dotsEl.classList.toggle('show', idx > 0);
      }
    });
  }, { threshold: 0.4 });
  allSecs.forEach(s => obs.observe(s));
}

/* ══════════════════════════════════════
   CHARGEMENT DES DONNÉES
══════════════════════════════════════ */
/* ══════════════════════════════════════
   DÉLAI D'ACCÈS — 24h après la consultation
   AJOUTÉ le 26/08/2026, PRÉCISÉ le 26/08/2026 : ancré sur l'heure réelle du dernier
   rendez-vous passé (table rendez_vous, colonnes date+time), plus fiable que la seule
   date_protocole (qui n'a pas d'heure). Garantit que la cliente ne reçoit jamais son
   protocole plus de 24h après sa consultation, ni avant.
   Repli sur date_protocole (minuit le lendemain) si aucun rendez-vous n'est retrouvé
   pour cette cliente — ne bloque jamais l'accès si les données sont incomplètes.
   ══════════════════════════════════════ */
async function getDerniereConsultation(clientKey) {
  try {
    const now = new Date();
    const todayLocal = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    const res = await fetch(SUPA_URL + '/rest/v1/rendez_vous?client_key=eq.' + encodeURIComponent(clientKey) +
      '&status=neq.annule&date=lte.' + todayLocal + '&order=date.desc,time.desc&limit=1&select=date,time', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return (rows && rows[0] && rows[0].date) ? rows[0] : null;
  } catch (e) { console.error('Erreur lecture rendez_vous:', e); return null; }
}

async function getDateProtocole(clientKey) {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/clientes?id=eq.' + encodeURIComponent(clientKey) + '&select=date_protocole', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows && rows[0] ? rows[0].date_protocole : null;
  } catch (e) { console.error('Erreur lecture date_protocole:', e); return null; }
}

async function calculerVisibleDepuis(clientKey) {
  const rdv = await getDerniereConsultation(clientKey);
  if (rdv) {
    const heure = (rdv.time || '09:00').slice(0, 5);
    const debut = new Date(rdv.date + 'T' + heure + ':00');
    if (!isNaN(debut.getTime())) {
      debut.setHours(debut.getHours() + 24);
      return debut;
    }
  }
  // Repli : pas de RDV retrouvé — on se cale sur date_protocole (minuit le lendemain).
  const dateProtocole = await getDateProtocole(clientKey);
  if (!dateProtocole) return null; // aucune donnée -> ne bloque pas (comportement historique)
  const debutFallback = new Date(dateProtocole + 'T00:00:00');
  debutFallback.setDate(debutFallback.getDate() + 1);
  return debutFallback;
}

function afficherEnAttente(visibleFrom) {
  const heureTxt = visibleFrom.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }) +
    ' à partir de ' + visibleFrom.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('loading').innerHTML = `
    <div style="text-align:center;color:var(--sable);max-width:420px;padding:24px">
      <div style="margin-bottom:16px"><svg viewBox="0 0 20 20" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/></svg></div>
      <p style="font-size:18px;margin-bottom:10px;font-family:'Cormorant Garamond',serif">Votre protocole prend forme.</p>
      <p style="font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.7">Sabrina finalise chaque recommandation avec soin après votre séance. Il sera disponible ici <strong style="color:#fff">${heureTxt}</strong>.</p>
    </div>`;
  document.getElementById('loading').classList.add('done');
}

async function chargerProtocoleCliente(clientKey) {
  try {
    currentClientKey = clientKey;

    const visibleFrom = await calculerVisibleDepuis(clientKey);
    if (visibleFrom && new Date() < visibleFrom) {
      afficherEnAttente(visibleFrom);
      return;
    }

    const row = await DB.getProtocoleClient(clientKey);
    const pd = row?.data?.protocolData;
    const bl = row?.data?.blocks;
    if (!pd || !bl || !bl.length) throw new Error('no data');
    data = pd;
    blocks = bl;
    buildImmersive();
    document.getElementById('loading').classList.add('done');
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--sable);max-width:400px;padding:24px">
        <div style="margin-bottom:16px"><svg viewBox="0 0 20 20" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="14" rx="1.3"/><path d="M8 3V2.2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V3M7.5 8h5M7.5 11h5M7.5 14h3"/></svg></div>
        <p style="font-size:16px;margin-bottom:8px">Impossible de charger ce protocole.</p>
        <p style="font-size:13px;color:rgba(255,255,255,.75)">Vérifiez que vous êtes bien connectée avec l'email associé à votre dossier.</p>
      </div>`;
    console.error('Erreur chargement protocole Supabase:', e);
  }
}

function chargerProtocoleLocal() {
  try {
    const raw = localStorage.getItem('avita_phv_print');
    if (!raw) throw new Error('no data');
    const parsed = JSON.parse(raw);
    data = parsed.data;
    blocks = parsed.blocks;
    if (!data || !blocks.length) throw new Error('empty');
    buildImmersive();
    document.getElementById('loading').classList.add('done');
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--sable);max-width:400px;padding:24px">
        <div style="margin-bottom:16px"><svg viewBox="0 0 20 20" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="14" rx="1.3"/><path d="M8 3V2.2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V3M7.5 8h5M7.5 11h5M7.5 14h3"/></svg></div>
        <p style="font-size:16px;margin-bottom:8px">Aucun protocole à afficher.</p>
        <p style="font-size:13px;color:rgba(255,255,255,.75)">Retournez dans le <a href="generateur.html" style="color:var(--sable)">Générateur PHV</a>.</p>
      </div>`;
  }
}

async function chargerProtocoleHistorique(histId) {
  try {
    let authToken = SUPA_KEY;
    if (typeof Auth !== 'undefined') {
      const token = await Auth.getValidAccessToken();
      if (token) authToken = token;
    }
    const res = await fetch(SUPA_URL + '/rest/v1/protocoles_history?id=eq.' + encodeURIComponent(histId) + '&select=data,blocks,created_at', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + authToken }
    });
    const rows = await res.json();
    const row = rows && rows[0];
    if (!row || !row.data || !row.blocks || !row.blocks.length) throw new Error('no data');
    data = row.data;
    blocks = row.blocks;
    buildImmersive();
    document.getElementById('loading').classList.add('done');
  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--sable);max-width:400px;padding:24px">
        <div style="margin-bottom:16px"><svg viewBox="0 0 20 20" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="14" rx="1.3"/><path d="M8 3V2.2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V3M7.5 8h5M7.5 11h5M7.5 14h3"/></svg></div>
        <p style="font-size:16px;margin-bottom:8px">Impossible de charger cette version archivée.</p>
      </div>`;
    console.error('Erreur chargement protocole archivé:', e);
  }
}

async function telechargerPDF(){
  const btn = document.getElementById('pdf-dl-btn');
  const container = document.getElementById('container');
  if(!container || typeof html2pdf === 'undefined'){ alert('Le module PDF n\'a pas pu se charger — vérifiez votre connexion et réessayez.'); return; }

  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Génération…';
  document.body.classList.add('pdf-export-mode');
  // Laisser le temps au navigateur de recalculer la mise en page avant la capture
  await new Promise(r => setTimeout(r, 200));

  try{
    const cl = (data && data._client) || clientIdentity || {};
    const prenomSlug = (cl.prenom || 'protocole').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
    const filename = `PHV-${prenomSlug}-${new Date().toISOString().slice(0,10)}.pdf`;

    const worker = html2pdf().set({
      margin: 10,
      filename,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(container);

    // Télécharge toujours localement, immédiatement
    await worker.save();

    // Si on visualise le protocole réel d'une cliente (pas un aperçu ni une ancienne version
    // archivée), on enregistre aussi une copie permanente dans Supabase — lien stable,
    // partageable, sans repasser par cet écran.
    if(currentClientKey){
      try{
        const blob = await worker.outputPdf('blob');
        let authToken = SUPA_KEY;
        if (typeof Auth !== 'undefined') {
          const token = await Auth.getValidAccessToken();
          if (token) authToken = token;
        }
        const storagePath = currentClientKey + '/' + filename;
        const upRes = await fetch(SUPA_URL + '/storage/v1/object/phv-pdfs/' + encodeURIComponent(storagePath), {
          method: 'POST',
          headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/pdf', 'x-upsert': 'true' },
          body: blob
        });
        if(upRes.ok){
          const publicUrl = SUPA_URL + '/storage/v1/object/public/phv-pdfs/' + storagePath;
          await fetch(SUPA_URL + '/rest/v1/clientes?id=eq.' + encodeURIComponent(currentClientKey), {
            method: 'PATCH',
            headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
            body: JSON.stringify({ phv_pdf_url: publicUrl, updated_at: new Date().toISOString() })
          });
          console.log('✓ PDF enregistré durablement :', publicUrl);
        } else {
          console.warn('⚠ Upload PDF Supabase échoué (le téléchargement local a fonctionné) :', await upRes.text());
        }
      }catch(e){
        console.warn('⚠ Sauvegarde permanente du PDF échouée (le téléchargement local a fonctionné) :', e);
      }
    }
  }catch(e){
    console.error('Erreur génération PDF:', e);
    alert('La génération du PDF a échoué. Réessayez, ou utilisez « Imprimer → Enregistrer en PDF ».');
  }finally{
    document.body.classList.remove('pdf-export-mode');
    btn.disabled = false; btn.textContent = original;
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const clientKey = params.get('client');
  const histId = params.get('history');
  if (histId) {
    showAuthGate('praticienne', () => { removeAuthGate(); chargerProtocoleHistorique(histId); });
  } else if (clientKey) {
    showAuthGate('cliente', () => { removeAuthGate(); chargerProtocoleCliente(clientKey); });
  } else {
    showAuthGate('praticienne', () => { removeAuthGate(); chargerProtocoleLocal(); });
  }
}

init();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocole d'Hygiène Vitale · Avita Serena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ocre:#C4A97D; --ocre-deep:#9A7A4A; --ocre-lt:#F5EFE3;
  --ardoise:#3A3228; --gris:#7A6A52; --taupe:#E2D9CE;
  --bg:#FAF8F4; --blanc:#FFFFFF; --off:#F7F4EF;
  --vert:#4A7A50; --rose:#9B87C0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); font-family:'Be Vietnam Pro',sans-serif; color:var(--ardoise); }

/* ── BARRE PRATICIEN (masquée à l'impression) ── */
.bar-praticien {
  position:sticky; top:0; z-index:100;
  background:var(--ardoise); color:#fff;
  padding:10px 32px; display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap;
}
.bar-label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; }
.bar-title { font-size:13px; font-weight:500; }
.bar-actions { display:flex; gap:8px; }
.bar-btn {
  font-family:'Be Vietnam Pro',sans-serif; font-size:12px; font-weight:500;
  padding:7px 16px; border-radius:6px; cursor:pointer; border:none; transition:all .2s;
}
.bar-btn.primary { background:var(--ocre); color:#fff; }
.bar-btn.primary:hover { background:var(--ocre-deep); }
.bar-btn.secondary { background:rgba(255,255,255,0.12); color:#fff; }
.bar-btn.secondary:hover { background:rgba(255,255,255,0.2); }
.bar-btn.danger { background:rgba(220,60,60,0.2); color:#ffaaaa; }
.bar-btn.danger:hover { background:rgba(220,60,60,0.35); }
.edit-badge {
  font-size:10px; background:rgba(196,169,125,0.3); color:var(--ocre);
  padding:2px 8px; border-radius:20px; margin-left:8px;
}
.edit-mode-info {
  font-size:11px; color:rgba(255,255,255,0.5);
  padding:4px 10px; background:rgba(255,255,255,0.06); border-radius:4px;
}

/* ── PAGE DOCUMENT ── */
.doc-wrap { max-width:780px; margin:0 auto; padding:32px 24px 80px; }

/* ── COVER ── */
.cover {
  background:var(--ardoise);
  border-radius:20px; padding:56px 48px 48px;
  margin-bottom:40px; position:relative; overflow:hidden;
}
.cover::before {
  content:''; position:absolute; top:-60px; right:-60px;
  width:280px; height:280px; border-radius:50%;
  background:rgba(196,169,125,0.08);
}
.cover::after {
  content:''; position:absolute; bottom:-80px; left:-40px;
  width:220px; height:220px; border-radius:50%;
  background:rgba(196,169,125,0.05);
}
.cover-eyebrow {
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ocre); font-weight:500; margin-bottom:12px;
}
.cover-name {
  font-family:'Cormorant Garamond',serif; font-size:52px; font-weight:300;
  color:#fff; line-height:1.1; margin-bottom:6px;
}
.cover-subtitle {
  font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:32px;
  letter-spacing:.04em;
}
.cover-meta {
  display:flex; gap:24px; flex-wrap:wrap; margin-bottom:32px;
}
.cover-meta-item { display:flex; flex-direction:column; gap:2px; }
.cover-meta-label { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
.cover-meta-value { font-size:13px; color:rgba(255,255,255,0.8); font-weight:400; }
.cover-divider { height:1px; background:rgba(255,255,255,0.08); margin-bottom:24px; }
.cover-signature { font-size:12px; color:rgba(255,255,255,0.4); }
.cover-signature strong { color:rgba(255,255,255,0.7); font-weight:500; }

/* ── RADAR SECTION ── */
.radar-section {
  background:var(--blanc); border:1px solid var(--taupe);
  border-radius:16px; padding:32px; margin-bottom:32px;
  text-align:center;
}
.radar-section-title {
  font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300;
  color:var(--ardoise); margin-bottom:4px;
}
.radar-section-sub {
  font-size:12px; color:var(--gris); margin-bottom:24px; letter-spacing:.03em;
}
#radar-doc-canvas { display:block; margin:0 auto; }

.radar-legend {
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:20px;
}
.radar-legend-item {
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:var(--gris);
}
.radar-legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* ── SECTIONS CONTENU ── */
.phv-section {
  background:var(--blanc); border:1px solid var(--taupe);
  border-radius:16px; padding:32px; margin-bottom:24px;
  position:relative;
}
.phv-section:hover .edit-hint { opacity:1; }
.edit-hint {
  position:absolute; top:12px; right:12px;
  font-size:10px; color:var(--ocre); opacity:0;
  transition:opacity .2s; pointer-events:none;
  background:var(--ocre-lt); padding:3px 8px; border-radius:4px;
}
.section-eyebrow {
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ocre); font-weight:600; margin-bottom:8px;
}
.section-title {
  font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:300;
  color:var(--ardoise); margin-bottom:20px; line-height:1.3;
}
.section-body {
  font-size:14px; line-height:1.85; color:var(--ardoise);
  white-space:pre-wrap;
}
.section-body[contenteditable="true"] {
  outline:none; border-radius:8px; padding:8px;
  transition:background .2s;
}
.section-body[contenteditable="true"]:focus {
  background:var(--ocre-lt);
}

/* ── PILIERS ── */
.piliers-grid { display:grid; grid-template-columns:1fr; gap:16px; margin-top:8px; }
.pilier-card {
  border-radius:12px; padding:20px 24px;
  border-left:3px solid;
}
.pilier-card.alim { background:#F2F7EE; border-color:#4A7A50; }
.pilier-card.psy  { background:#F4F0FA; border-color:#9B87C0; }
.pilier-card.sport{ background:#EEF4F8; border-color:#4A6A8A; }
.pilier-card.comp { background:var(--ocre-lt); border-color:var(--ocre); }
.pilier-label {
  font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:600; margin-bottom:8px;
}
.pilier-card.alim .pilier-label  { color:#4A7A50; }
.pilier-card.psy  .pilier-label  { color:#9B87C0; }
.pilier-card.sport .pilier-label { color:#4A6A8A; }
.pilier-card.comp .pilier-label  { color:var(--ocre-deep); }
.pilier-body {
  font-size:13.5px; line-height:1.8; color:var(--ardoise);
  white-space:pre-wrap;
}
.pilier-body[contenteditable="true"] {
  outline:none; border-radius:6px; padding:6px;
  transition:background .2s;
}
.pilier-body[contenteditable="true"]:focus { background:rgba(255,255,255,0.6); }

/* ── RITUELS ── */
.rituels-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
@media(max-width:600px) { .rituels-grid { grid-template-columns:1fr; } }
.rituel-card {
  background:var(--off); border-radius:10px; padding:16px 18px;
  border:1px solid var(--taupe);
}
.rituel-moment {
  font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ocre); font-weight:600; margin-bottom:8px;
}
.rituel-body {
  font-size:13px; line-height:1.75; color:var(--ardoise);
  white-space:pre-wrap;
}
.rituel-body[contenteditable="true"] { outline:none; }
.rituel-body[contenteditable="true"]:focus { background:rgba(196,169,125,0.05); border-radius:4px; padding:4px; }

/* ── SIGNAUX ── */
.signal-block { margin-top:16px; }
.signal-periode {
  font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ocre-deep); font-weight:600; margin-bottom:6px; margin-top:14px;
}
.signal-body {
  font-size:13.5px; line-height:1.8; color:var(--ardoise);
  white-space:pre-wrap;
}
.signal-body[contenteditable="true"] { outline:none; }

/* ── MOT PERSO ── */
.mot-perso {
  background:linear-gradient(135deg, var(--ardoise) 0%, #2a2018 100%);
  border-radius:16px; padding:32px 36px; margin-bottom:24px;
  color:#fff; position:relative; overflow:hidden;
}
.mot-perso::before {
  content:'"'; font-family:'Cormorant Garamond',serif;
  font-size:180px; position:absolute; top:-20px; left:16px;
  color:rgba(196,169,125,0.12); line-height:1; pointer-events:none;
}
.mot-perso-label {
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ocre); margin-bottom:12px; font-weight:600;
}
.mot-perso-body {
  font-size:14px; line-height:1.9; color:rgba(255,255,255,0.85);
  font-style:italic; position:relative; z-index:1;
  white-space:pre-wrap;
}
.mot-perso-body[contenteditable="true"] { outline:none; }
.mot-perso-body[contenteditable="true"]:focus { background:rgba(255,255,255,0.05); border-radius:6px; padding:8px; }
.mot-perso-sign {
  margin-top:16px; font-size:12px; color:rgba(255,255,255,0.4);
  font-style:normal;
}
.mot-perso-sign strong { color:rgba(255,255,255,0.7); font-weight:500; }

/* ── FOOTER ── */
.doc-footer {
  text-align:center; margin-top:48px; padding-top:24px;
  border-top:1px solid var(--taupe);
  font-size:11px; color:var(--gris); letter-spacing:.05em;
}

/* ── ENGAGEMENTS ── */
.engagements-intro {
  font-size:13px; line-height:1.75; color:var(--gris);
  margin-bottom:20px; font-style:italic;
}
.engagement-list { display:flex; flex-direction:column; gap:10px; }
.engagement-item {
  display:flex; align-items:flex-start; gap:14px;
  padding:14px 18px; border-radius:10px; border:1.5px solid var(--taupe);
  background:var(--off); transition:all .2s; cursor:default;
}
.engagement-item.accepted {
  border-color:var(--vert); background:#F0F7F1;
}
.engagement-item.refused {
  border-color:#C47A7A; background:#FAF0F0; opacity:.65;
}
.engagement-actions { display:flex; gap:6px; flex-shrink:0; margin-top:1px; }
.eng-btn {
  width:28px; height:28px; border-radius:50%; border:1.5px solid var(--taupe);
  background:#fff; cursor:pointer; font-size:13px; display:flex; align-items:center;
  justify-content:center; transition:all .18s; flex-shrink:0;
}
.eng-btn.accept { border-color:var(--vert); color:var(--vert); }
.eng-btn.accept:hover, .engagement-item.accepted .eng-btn.accept { background:var(--vert); color:#fff; border-color:var(--vert); }
.eng-btn.refuse { border-color:#C47A7A; color:#C47A7A; }
.eng-btn.refuse:hover, .engagement-item.refused .eng-btn.refuse { background:#C47A7A; color:#fff; border-color:#C47A7A; }
.engagement-text {
  font-size:13.5px; line-height:1.65; color:var(--ardoise); flex:1;
}
.engagement-item.refused .engagement-text { text-decoration:line-through; color:var(--gris); }
.eng-save-bar {
  margin-top:18px; padding:12px 16px; background:var(--ocre-lt);
  border-radius:8px; display:flex; align-items:center; justify-content:space-between;
  font-size:12px; color:var(--gris);
}
.eng-save-btn {
  font-family:'Be Vietnam Pro',sans-serif; font-size:12px; font-weight:500;
  padding:7px 18px; border-radius:6px; cursor:pointer; border:none;
  background:var(--ocre); color:#fff; transition:background .2s;
}
.eng-save-btn:hover { background:var(--ocre-deep); }
.eng-save-btn.saved { background:var(--vert); }
@media print {
  .engagement-actions { display:none !important; }
  .eng-save-bar { display:none !important; }
  .engagement-item.refused { display:none !important; }
}

/* ── VIDE / LOADING ── */
.empty-state {
  text-align:center; padding:80px 32px; color:var(--gris);
}
.empty-state h2 {
  font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300;
  color:var(--ardoise); margin-bottom:12px;
}
.empty-state p { font-size:14px; line-height:1.7; }

/* ── PRINT ── */
@media print {
  .bar-praticien { display:none !important; }
  body { background:#fff; }
  .doc-wrap { padding:20px; max-width:100%; }
  .cover { border-radius:0; }
  .phv-section, .radar-section { break-inside:avoid; }
  .edit-hint { display:none !important; }
  [contenteditable] { border:none !important; outline:none !important; background:transparent !important; }
}
</style>
</head>
<body>

<!-- Barre praticien -->
<div class="bar-praticien" id="bar-praticien">
  <div>
    <div class="bar-label">Avita Serena · Outil praticien</div>
    <div class="bar-title">Protocole d'Hygiène Vitale <span class="edit-badge" id="edit-badge" style="display:none">✎ Mode édition actif</span></div>
  </div>
  <div class="bar-actions">
    <div class="edit-mode-info" id="edit-info">Cliquez sur n'importe quel texte pour le modifier</div>
    <button class="bar-btn secondary" onclick="toggleEdit()" id="btn-edit">✎ Activer l'édition</button>
    <button class="bar-btn secondary" onclick="window.print()">⎙ Imprimer / PDF</button>
    <button class="bar-btn primary" onclick="copyShareText()">✉ Copier le texte pour email</button>
  </div>
</div>

<!-- Document -->
<div class="doc-wrap" id="doc-wrap">
  <div class="empty-state" id="empty-state">
    <h2>Aucun protocole chargé</h2>
    <p>Générez un PHV depuis le <a href="generateur.html" style="color:var(--ocre)">générateur</a>,<br>ou chargez un protocole sauvegardé.</p>
  </div>
</div>

<script>
const RADAR_AXES = [
  { id:'digestif',    label:'Digestif',       color:'#C4A97D' },
  { id:'hormonal',    label:'Hormonal',        color:'#9B87C0' },
  { id:'thyroide',    label:'Thyroïde',        color:'#5A9BAE' },
  { id:'surrenales',  label:'Surrénales',      color:'#C4A050' },
  { id:'inflam',      label:'Inflammation',    color:'#C4614A' },
  { id:'detox',       label:'Détoxification',  color:'#78A078' },
  { id:'neuro',       label:'Neuro-stress',    color:'#B8916A' },
  { id:'metabolique', label:'Métabolisme',     color:'#8E7A9E' },
];

let phvData = null;
let radarScores = {};
let editMode = false;
let engagementStates = {};
let radarAnimFrame = null;
let radarAnimProgress = 0;
let radarAnimStart = null;

// ── Chargement ──
function loadPHV() {
  try {
    const raw = localStorage.getItem('avita_phv_client');
    if (raw) {
      const parsed = JSON.parse(raw);
      phvData = parsed.phv;
      radarScores = parsed.radar || {};
      engagementStates = parsed.engagements_etats || {};
      renderDocument();
      return;
    }
  } catch(e) {}
  document.getElementById('empty-state').style.display = 'block';
}

function renderDocument() {
  if (!phvData) return;
  const d = phvData;
  const wrap = document.getElementById('doc-wrap');
  const today = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});

  wrap.innerHTML = `
  <!-- COVER -->
  <div class="cover">
    <div class="cover-eyebrow">Protocole d'Hygiène Vitale · Avita Serena</div>
    <div class="cover-name" contenteditable="false" id="cover-name">${d.prenom || 'Votre protocole'}</div>
    <div class="cover-subtitle" contenteditable="false" id="cover-subtitle">${d.sous_titre || 'Programme personnalisé · Avita Serena'}</div>
    <div class="cover-divider"></div>
    <div class="cover-meta">
      <div class="cover-meta-item">
        <span class="cover-meta-label">Date</span>
        <span class="cover-meta-value">${today}</span>
      </div>
      <div class="cover-meta-item">
        <span class="cover-meta-label">Praticienne</span>
        <span class="cover-meta-value">Sabrina Castelli</span>
      </div>
      <div class="cover-meta-item">
        <span class="cover-meta-label">Cabinet</span>
        <span class="cover-meta-value">Avita Serena · Porto-Vecchio</span>
      </div>
    </div>
    <div class="cover-signature">
      <strong>Sabrina Castelli</strong> · Naturopathe · avitaserena.com
    </div>
  </div>

  <!-- MOT PERSONNALISÉ -->
  <div class="mot-perso">
    <div class="mot-perso-label">Un mot avant de commencer</div>
    <div class="mot-perso-body" contenteditable="false" id="mot-perso">Écrivez ici votre mot personnalisé pour cette cliente — ce que vous ressentez de sa consultation, ce qui vous a touché, votre intention pour ce protocole. Ce texte ne sera visible que d'elle.</div>
    <div class="mot-perso-sign"><strong>Sabrina</strong> · Avita Serena</div>
  </div>

  <!-- RADAR -->
  <div class="radar-section" id="radar-section">
    <div class="radar-section-title">Votre profil de terrain</div>
    <div class="radar-section-sub">Intensité des déséquilibres identifiés lors de votre bilan</div>
    <canvas id="radar-doc-canvas"></canvas>
    <div class="radar-legend" id="radar-legend"></div>
  </div>

  <!-- SECTION 1 -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">01 · Comprendre</div>
    <div class="section-title">Ce qui se passe dans votre organisme</div>
    <div class="section-body" contenteditable="false" id="s1">${d.s1_corps || ''}</div>
  </div>

  <!-- SECTION 2 -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">02 · Stratégie</div>
    <div class="section-title">Vos axes prioritaires & pourquoi</div>
    <div class="section-body" contenteditable="false" id="s2">${d.s2_axes || ''}</div>
  </div>

  <!-- SECTION 3 — PILIERS -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">03 · Le protocole</div>
    <div class="section-title">Vos 3 piliers & soutiens ciblés</div>
    <div id="piliers-wrap">${renderPiliers(d.s3_protocole)}</div>
  </div>

  <!-- SECTION 4 -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">04 · Alimentation</div>
    <div class="section-title">Votre alimentation au quotidien</div>
    <div class="section-body" contenteditable="false" id="s4">${d.s4_alimentation || ''}</div>
  </div>

  <!-- SECTION 5 — RITUELS -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">05 · Rituels</div>
    <div class="section-title">Votre semaine type</div>
    <div id="rituels-wrap">${renderRituels(d.s5_rituels)}</div>
  </div>

  <!-- SECTION 6 — SIGNAUX -->
  <div class="phv-section">
    <div class="edit-hint">Cliquez pour modifier</div>
    <div class="section-eyebrow">06 · Suivi</div>
    <div class="section-title">Ce que vous allez ressentir</div>
    <div class="section-body" contenteditable="false" id="s6">${d.s6_signaux || ''}</div>
  </div>

  <!-- SECTION 7 — ENGAGEMENTS -->
  <div class="phv-section" id="section-engagements">
    <div class="section-eyebrow">07 · Engagements</div>
    <div class="section-title">Votre contrat avec vous-même</div>
    <div id="engagements-wrap">${renderEngagements(d.s7_engagements)}</div>
  </div>

  <!-- FOOTER -->
  <div class="doc-footer">
    Avita Serena · Sabrina Castelli, Naturopathe · Porto-Vecchio, Corse · avitaserena.com<br>
    <span style="opacity:.5">Ce protocole est personnel et confidentiel · Naturopathie complémentaire au suivi médical</span>
  </div>
  `;

  // Radar
  setTimeout(() => {
    buildRadarDoc();
    buildRadarLegend();
  }, 100);
}

function renderPiliers(text) {
  if (!text) return '<div class="section-body" contenteditable="false" id="s3">—</div>';
  // Détecter les blocs [PILIER X]
  const blocks = [
    { key:'ALIMENTATION', cls:'alim', label:'🌿 Pilier 1 — Alimentation', id:'p1' },
    { key:'PSYCHOLOGIE',  cls:'psy',  label:'🧠 Pilier 2 — Psychologie & émotions', id:'p2' },
    { key:'ACTIVITÉ',     cls:'sport',label:'🏃 Pilier 3 — Activité physique', id:'p3' },
    { key:'SOUTIENS',     cls:'comp', label:'✦ Soutiens ciblés & compléments', id:'p4' },
  ];
  let html = '<div class="piliers-grid">';
  blocks.forEach(b => {
    const re = new RegExp(`\\[${b.key}[^\\]]*\\]([\\s\\S]*?)(?=\\[|$)`, 'i');
    const match = text.match(re);
    const content = match ? match[1].trim() : '';
    html += `<div class="pilier-card ${b.cls}">
      <div class="pilier-label">${b.label}</div>
      <div class="pilier-body" contenteditable="false" id="${b.id}">${content || '—'}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderRituels(text) {
  if (!text) return '<div class="section-body" contenteditable="false" id="s5">—</div>';
  const moments = [
    { key:'MATIN', label:'🌅 Matin', id:'r1' },
    { key:'SOIR',  label:'🌙 Soir', id:'r2' },
    { key:'EN JOURNÉE', label:'☀️ En journée', id:'r3' },
    { key:'HEBDOMADAIRE', label:'📅 Hebdomadaire', id:'r4' },
  ];
  let hasBlocks = false;
  let html = '<div class="rituels-grid">';
  moments.forEach(m => {
    const re = new RegExp(`${m.key}[^:]*:([\\s\\S]*?)(?=MATIN|SOIR|EN JOURNÉE|HEBDOMADAIRE|$)`, 'i');
    const match = text.match(re);
    if (match) {
      hasBlocks = true;
      html += `<div class="rituel-card">
        <div class="rituel-moment">${m.label}</div>
        <div class="rituel-body" contenteditable="false" id="${m.id}">${match[1].trim()}</div>
      </div>`;
    }
  });
  html += '</div>';
  return hasBlocks ? html : `<div class="section-body" contenteditable="false" id="s5">${text}</div>`;
}

function renderEngagements(data) {
  // data peut être : tableau de strings, string newline-séparé, ou absent
  let items = [];
  if (Array.isArray(data)) {
    items = data.filter(Boolean);
  } else if (typeof data === 'string' && data.trim()) {
    items = data.split('\n').map(s => s.trim()).filter(Boolean);
  }

  if (!items.length) {
    return '<div class="section-body" contenteditable="false" style="color:var(--gris);font-style:italic">Aucun engagement généré. Régénérez le protocole depuis le générateur.</div>';
  }

  // Lire les états sauvegardés
  const savedStates = loadEngagementStates();

  let html = '<p class="engagements-intro">Cochez les engagements que vous acceptez de tenir pendant la durée de votre programme. Vous pouvez les modifier à tout moment avec votre praticienne.</p>';
  html += '<div class="engagement-list">';
  items.forEach((text, i) => {
    const state = savedStates[i] || 'neutral'; // neutral | accepted | refused
    html += `<div class="engagement-item ${state === 'accepted' ? 'accepted' : state === 'refused' ? 'refused' : ''}" data-idx="${i}" id="eng-${i}">
      <div class="engagement-actions">
        <button class="eng-btn accept" onclick="toggleEngagement(${i},'accepted')" title="J'accepte cet engagement">✓</button>
        <button class="eng-btn refuse" onclick="toggleEngagement(${i},'refused')" title="Je refuse / reporte">✗</button>
      </div>
      <div class="engagement-text">${escH(text)}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="eng-save-bar">
    <span id="eng-status">Cliquez sur ✓ ou ✗ pour chaque engagement, puis sauvegardez.</span>
    <button class="eng-save-btn" id="eng-save-btn" onclick="saveEngagements()">Sauvegarder mes choix</button>
  </div>`;
  return html;
}

function escH(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let engagementStates = {};

function loadEngagementStates() {
  try {
    const raw = localStorage.getItem('avita_phv_client');
    if (raw) {
      const parsed = JSON.parse(raw);
      return parsed.engagements_etats || {};
    }
  } catch(e) {}
  return {};
}

function toggleEngagement(idx, newState) {
  const item = document.getElementById('eng-' + idx);
  if (!item) return;
  const current = engagementStates[idx] || loadEngagementStates()[idx] || 'neutral';
  // Toggle : si déjà dans cet état, repasser à neutral
  const next = current === newState ? 'neutral' : newState;
  engagementStates[idx] = next;
  item.className = 'engagement-item' + (next === 'accepted' ? ' accepted' : next === 'refused' ? ' refused' : '');

  const statusEl = document.getElementById('eng-status');
  const accepted = Object.values({...loadEngagementStates(), ...engagementStates}).filter(v => v === 'accepted').length;
  if (statusEl) statusEl.textContent = `${Object.keys(engagementStates).length} engagement(s) évalué(s) — pensez à sauvegarder.`;
}

function saveEngagements() {
  try {
    const raw = localStorage.getItem('avita_phv_client');
    let stored = raw ? JSON.parse(raw) : {};
    // Merger les états
    const existing = stored.engagements_etats || {};
    stored.engagements_etats = { ...existing, ...engagementStates };

    // Construire la liste des engagements acceptés pour le CRM
    const items = stored.phv && stored.phv.s7_engagements ? 
      (Array.isArray(stored.phv.s7_engagements) ? stored.phv.s7_engagements : stored.phv.s7_engagements.split('\n').filter(Boolean)) : [];
    stored.engagements_acceptes = items.filter((_, i) => stored.engagements_etats[i] === 'accepted');
    stored.engagements_refuses = items.filter((_, i) => stored.engagements_etats[i] === 'refused');

    localStorage.setItem('avita_phv_client', JSON.stringify(stored));

    const btn = document.getElementById('eng-save-btn');
    const statusEl = document.getElementById('eng-status');
    if (btn) { btn.textContent = '✓ Sauvegardé !'; btn.className = 'eng-save-btn saved'; setTimeout(() => { btn.textContent = 'Sauvegarder mes choix'; btn.className = 'eng-save-btn'; }, 2500); }
    const nb = stored.engagements_acceptes.length;
    if (statusEl) statusEl.textContent = `${nb} engagement(s) accepté(s) sur ${items.length} — synchronisé avec votre dossier.`;
  } catch(e) {
    alert('Erreur de sauvegarde : ' + e.message);
  }
}

// ── Radar ──
function buildRadarDoc() {
  const canvas = document.getElementById('radar-doc-canvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement;
  const SIZE = Math.min(wrap.clientWidth - 64, 420);
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  if (radarAnimFrame) cancelAnimationFrame(radarAnimFrame);
  radarAnimStart = null;
  radarAnimProgress = 0;
  radarAnimFrame = requestAnimationFrame(animateRadarDoc);
}

function animateRadarDoc(ts) {
  if (!radarAnimStart) radarAnimStart = ts;
  const p = Math.min(1, (ts - radarAnimStart) / 1400);
  const ease = 1 - Math.pow(1 - p, 3);
  drawRadarDoc(ease);
  if (p < 1) {
    radarAnimFrame = requestAnimationFrame(animateRadarDoc);
  } else {
    pulseRadarDoc();
  }
}

function pulseRadarDoc() {
  let t = 0;
  function tick() {
    t++;
    drawRadarDoc(1, 1 + 0.012 * Math.sin(t * 0.05));
    radarAnimFrame = requestAnimationFrame(tick);
  }
  tick();
}

function drawRadarDoc(progress, pulse) {
  pulse = pulse || 1;
  const canvas = document.getElementById('radar-doc-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const SIZE = parseInt(canvas.style.width) || 420;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = SIZE / 2, cy = SIZE / 2;
  const R = SIZE * 0.33;
  const N = RADAR_AXES.length;
  const angles = RADAR_AXES.map((_, i) => (Math.PI * 2 * i / N) - Math.PI / 2);

  ctx.clearRect(0, 0, SIZE, SIZE);

  // Grilles
  for (let lv = 1; lv <= 5; lv++) {
    const r = R * lv / 5;
    ctx.beginPath();
    angles.forEach((a, i) => {
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = lv === 5 ? 'rgba(196,169,125,0.3)' : 'rgba(0,0,0,0.06)';
    ctx.lineWidth = lv === 5 ? 1 : 0.5;
    ctx.stroke();
  }
  // Axes
  angles.forEach(a => {
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 0.5; ctx.stroke();
  });

  // Zone
  const hasData = Object.values(radarScores).some(v => v > 0);
  if (hasData) {
    ctx.beginPath();
    angles.forEach((a, i) => {
      const ax = RADAR_AXES[i];
      const score = (radarScores[ax.id] || 0) * progress;
      const r = R * score / 10;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(196,169,125,0.15)'; ctx.fill();
    ctx.strokeStyle = 'rgba(196,169,125,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();

    // Points
    angles.forEach((a, i) => {
      const ax = RADAR_AXES[i];
      const score = (radarScores[ax.id] || 0) * progress;
      if (score < 0.1) return;
      const r = R * score / 10 * pulse;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, SIZE * 0.038, 0, Math.PI * 2);
      ctx.fillStyle = ax.color + '22'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, SIZE * 0.02, 0, Math.PI * 2);
      ctx.fillStyle = ax.color; ctx.shadowColor = ax.color; ctx.shadowBlur = 6; ctx.fill();
      if (progress > 0.8 && radarScores[ax.id] > 0) {
        const op = Math.min(1, (progress - 0.8) / 0.2);
        ctx.globalAlpha = op;
        const lx = cx + Math.cos(a) * (r + SIZE * 0.055);
        const ly = cy + Math.sin(a) * (r + SIZE * 0.055);
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(lx, ly, SIZE * 0.025, 0, Math.PI * 2);
        ctx.fillStyle = ax.color; ctx.fill();
        ctx.font = `600 ${SIZE * 0.02}px 'Be Vietnam Pro',sans-serif`;
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(radarScores[ax.id], lx, ly);
      }
      ctx.restore();
    });
  } else {
    // Empty state
    ctx.font = `300 ${SIZE*0.035}px 'Cormorant Garamond',serif`;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Profil non calculé', cx, cy);
  }

  // Labels
  const labelR = R + SIZE * 0.12;
  angles.forEach((a, i) => {
    const ax = RADAR_AXES[i];
    const score = radarScores[ax.id] || 0;
    const x = cx + Math.cos(a) * labelR, y = cy + Math.sin(a) * labelR;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${score > 0 ? 600 : 400} ${SIZE * 0.027}px 'Be Vietnam Pro',sans-serif`;
    ctx.fillStyle = score > 0 ? ax.color : 'rgba(0,0,0,0.25)';
    if (score > 0) { ctx.shadowColor = ax.color; ctx.shadowBlur = 3; }
    ctx.fillText(ax.label, x, y - SIZE * 0.01);
    if (score > 0) {
      const bw = SIZE * 0.07, bh = SIZE * 0.007;
      const bx = x - bw / 2, by = y + SIZE * 0.013;
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.fill();
      ctx.fillStyle = ax.color;
      ctx.beginPath(); ctx.roundRect(bx, by, bw * score / 10, bh, bh/2); ctx.fill();
    }
    ctx.restore();
  });

  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, SIZE*0.02, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(196,169,125,0.5)'; ctx.fill(); ctx.restore();
}

function buildRadarLegend() {
  const wrap = document.getElementById('radar-legend');
  if (!wrap) return;
  const active = RADAR_AXES.filter(ax => (radarScores[ax.id] || 0) > 0)
    .sort((a, b) => (radarScores[b.id] || 0) - (radarScores[a.id] || 0));
  if (!active.length) { wrap.style.display = 'none'; return; }
  wrap.innerHTML = active.map(ax =>
    `<div class="radar-legend-item">
      <span class="radar-legend-dot" style="background:${ax.color}"></span>
      <span>${ax.label} <strong style="color:${ax.color}">${radarScores[ax.id]}/10</strong></span>
    </div>`
  ).join('');
}

// ── Mode édition ──
function toggleEdit() {
  editMode = !editMode;
  const editables = document.querySelectorAll('[contenteditable]');
  editables.forEach(el => {
    el.contentEditable = editMode ? 'true' : 'false';
  });
  document.getElementById('btn-edit').textContent = editMode ? '✓ Désactiver l\'édition' : '✎ Activer l\'édition';
  document.getElementById('btn-edit').className = editMode ? 'bar-btn primary' : 'bar-btn secondary';
  document.getElementById('edit-badge').style.display = editMode ? 'inline' : 'none';
  document.getElementById('edit-info').textContent = editMode
    ? '✎ Mode actif — cliquez sur n\'importe quel texte pour le modifier'
    : 'Cliquez sur n\'importe quel texte pour le modifier';
}

// ── Copier texte pour email ──
function copyShareText() {
  if (!phvData) return;
  const d = phvData;
  const el = document.getElementById('mot-perso');
  const motPerso = el ? el.textContent.trim() : '';
  const today = new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'});

  let txt = `Objet : Votre Protocole d'Hygiène Vitale · Avita Serena\n\n`;
  txt += `Chère ${d.prenom},\n\n`;
  if (motPerso && motPerso !== 'Écrivez ici votre mot personnalisé') txt += `${motPerso}\n\n`;
  txt += `Je vous adresse votre Protocole d'Hygiène Vitale personnalisé, établi suite à notre consultation du ${today}.\n\n`;
  txt += `Vous y trouverez :\n`;
  txt += `• Une explication de ce qui se passe dans votre organisme\n`;
  txt += `• Vos axes prioritaires et leur logique\n`;
  txt += `• Vos 3 piliers (alimentation, émotions, mouvement)\n`;
  txt += `• Vos rituels quotidiens\n`;
  txt += `• Les signaux de progression à observer\n\n`;
  txt += `Je reste disponible pour toute question.\n\n`;
  txt += `Avec soin,\nSabrina Castelli\nNaturopathe · Avita Serena\navitaserena.com`;

  navigator.clipboard.writeText(txt)
    .then(() => {
      const btn = document.querySelector('.bar-btn.primary');
      btn.textContent = '✓ Copié !';
      btn.style.background = '#4A7A50';
      setTimeout(() => { btn.textContent = '✉ Copier le texte pour email'; btn.style.background = ''; }, 2500);
    })
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
}

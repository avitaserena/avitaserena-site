ie": "Les coussinets hémorroïdaires contribuent à la continence. Les efforts de poussée, la constipation, la grossesse, la sédentarité et un transit accéléré augmentent la pression et font glisser les coussinets vers le bas, ce qui les congestionne. Une thrombose hémorroïdaire (caillot) donne une boule bleutée très douloureuse.", "symptomes": "Sang rouge vif sur le papier ou dans la cuvette, démangeaisons, brûlures, boule, douleur lors de la crise.", "diagnostic": "Examen proctologique. Tout saignement doit être exploré (coloscopie selon l'âge et les facteurs de risque), car il peut cacher une autre cause.", "pec": "Régularisation du transit, traitements topiques et veinotoniques lors des crises, ligature ou sclérose, chirurgie dans les formes sévères.", "traitements": [{"label": "Veinotoniques", "marques": ["Daflon", "Ginkor"]}, {"label": "Topiques (crème, suppositoire)", "marques": ["Proctolog", "Titanoréïne"]}, {"label": "Laxatifs osmotiques", "marques": ["Movicol", "Forlax"]}], "operations": [], "naturo": "Traiter la cause : fibres progressives, hydratation, magnésium, position aux toilettes (surélever les pieds), pas de poussée prolongée. Bains tièdes. Vigilance sur les laxatifs irritants.", "alertes": ["Saignement abondant, répété ou récent après 45-50 ans : avis médical", "Douleur intense avec boule dure : thrombose, avis rapide", "Sang mêlé à des selles noires ou perte de poids : bilan digestif"], "aNePasFaire": ["Attribuer un saignement aux hémorroïdes sans examen", "Proposer des laxatifs stimulants au long cours"], "questions": ["Depuis quand ? Y a-t-il du sang ?", "Quel est votre transit ?", "Avez-vous eu un examen proctologique ou une coloscopie ?"], "outils": "Voir fiche Constipation chronique.", "voirAussi": ["Constipation chronique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Intolérance au lactose", "type": "maladie", "categorie": "Digestif", "alias": ["lactose", "malabsorption du lactose", "lactase", "test respiratoire lactose"], "enBref": "Difficulté à digérer le lactose, le sucre du lait, par manque de lactase. Ballonnements, gaz et diarrhée surviennent quelques heures après la consommation de produits laitiers.", "physiologie": "La lactase, enzyme de la bordure en brosse de l'intestin grêle, coupe le lactose en glucose et galactose. Son activité baisse naturellement après l'enfance chez une grande partie de la population adulte. Le lactose non digéré arrive au côlon, attire l'eau et fermente (gaz). La forme secondaire apparaît après une lésion de la muqueuse (cœliaque, MICI, gastro-entérite, SIBO) et peut disparaître quand la cause est traitée.", "symptomes": "Ballonnements, gaz, diarrhée, crampes, gargouillis, 30 minutes à 2 heures après un produit laitier.", "diagnostic": "Test respiratoire à l'hydrogène après charge en lactose, ou test d'éviction suivi d'une réintroduction. Chercher une cause secondaire.", "pec": "Réduction de la quantité de lactose selon la tolérance (la plupart des personnes tolèrent un verre de lait), lactase en gélules.", "traitements": [{"label": "Lactase en gélules (pas de médicament spécifique)", "marques": []}], "operations": [], "naturo": "Expliquer qu'il s'agit d'une quantité tolérée, pas d'une allergie. Fromages affinés et yaourts sont souvent bien tolérés. Garder des apports en calcium. Ne pas confondre avec une allergie aux protéines de lait. En cas de TCA, aucune éviction (RÈGLE N°59). Chercher SIBO ou cœliaque si les troubles sont majeurs.", "alertes": ["Sang dans les selles, amaigrissement, diarrhée persistante : avis médical"], "aNePasFaire": ["Supprimer tous les laitages sans test ni suivi des apports en calcium", "Confondre intolérance et allergie"], "questions": ["Quelle quantité de lait tolérez-vous ?", "Les troubles sont-ils apparus après une gastro-entérite ou un traitement ?", "Mangez-vous des fromages affinés et des yaourts ?"], "outils": "Voir fiches SIBO, Maladie cœliaque.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)", "Maladie cœliaque"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Parodontite", "type": "maladie", "categorie": "Dentaire et maxillo-facial", "alias": ["déchaussement des dents", "gingivite", "maladie parodontale", "gencives qui saignent"], "enBref": "Infection inflammatoire des tissus de soutien de la dent (gencive, os), qui peut conduire à la mobilité et à la perte des dents. Elle succède souvent à une gingivite non traitée.", "physiologie": "La plaque dentaire est un biofilm bactérien. Chez une personne prédisposée, la réponse inflammatoire détruit l'attache de la gencive et l'os alvéolaire. Cette inflammation locale a un retentissement général : les bactéries et les cytokines passent dans la circulation, ce qui est associé au diabète (relation à double sens), aux maladies cardiovasculaires et à l'accouchement prématuré. Le tabac, le stress et le diabète aggravent le risque.", "symptomes": "Gencives rouges qui saignent au brossage, mauvaise haleine, gencives qui reculent, dents qui bougent, espaces entre les dents.", "diagnostic": "Examen par un dentiste ou un parodontiste (sondage, radiographies).", "pec": "Détartrage et surfaçage radiculaire, hygiène rigoureuse, antiseptique de courte durée, chirurgie parodontale selon les cas, entretien régulier.", "traitements": [{"label": "Antiseptique buccal de courte durée", "marques": ["Eludril", "Paroex"]}, {"label": "Antibiotiques (cas sélectionnés)", "marques": ["Amoxicilline", "Métronidazole"]}], "operations": [], "naturo": "Expliquer le lien bouche–corps (diabète, cœur, grossesse). Brossage, brossettes interdentaires, arrêt du tabac, contrôle de la glycémie, vitamine C et D selon bilan. Aucun substitut à la prise en charge dentaire.", "alertes": ["Abcès, gonflement du visage, fièvre : urgence dentaire", "Dents mobiles ou douleur : parodontiste"], "aNePasFaire": ["Retarder une consultation dentaire", "Proposer des bains de bouche prolongés à la chlorhexidine"], "questions": ["Vos gencives saignent-elles ?", "Quand a eu lieu votre dernier détartrage ?", "Avez-vous un diabète ou fumez-vous ?"], "outils": "Voir fiche Diabète de type 2.", "voirAussi": ["Diabète de type 2 / résistance à l'insuline"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Infertilité du couple", "type": "maladie", "categorie": "Fertilité, grossesse et post-partum", "alias": ["infertilité", "difficulté à concevoir", "PMA", "FIV", "AMH", "spermogramme", "projet de grossesse"], "enBref": "Absence de grossesse après 12 mois de rapports réguliers sans contraception (6 mois si la femme a 35 ans ou plus). L'origine est féminine, masculine ou mixte, parfois inexpliquée.", "physiologie": "Une grossesse suppose une ovulation, un sperme de bonne qualité, des trompes perméables, un utérus accueillant et un bon équilibre hormonal. Causes féminines : trouble de l'ovulation (SOPK, hypothalamique, thyroïde), endométriose, trompes bouchées, réserve ovarienne diminuée. Causes masculines : paramètres du sperme (nombre, mobilité, forme). L'âge de la femme est le principal facteur. Le mode de vie (tabac, alcool, poids, stress, chaleur testiculaire) pèse sur les deux.", "symptomes": "Absence de grossesse malgré un désir, cycles irréguliers ou absents, douleurs, antécédents d'infection ou de chirurgie.", "diagnostic": "Bilan du couple : spermogramme, bilan hormonal et échographie, évaluation de la perméabilité des trompes (hystérosalpingographie), AMH. Le bilan est prescrit et interprété par un médecin.", "pec": "Traitement de la cause, stimulation ovarienne, insémination, fécondation in vitro (FIV, ICSI). La PMA est prise en charge par l'Assurance maladie en France.", "traitements": [{"label": "Stimulation de l'ovulation", "marques": ["Clomid", "Gonal-f"]}, {"label": "Soutien de la phase lutéale", "marques": ["Utrogestan"]}, {"label": "Acide folique", "marques": ["Speciafoldine", "Gestarelle"]}], "operations": [], "naturo": "Accompagner sans jamais retarder le parcours médical, surtout après 35 ans. Soutien préconceptionnel : acide folique (B9) avant la conception, vitamine D, alimentation de type méditerranéen, fer selon bilan, arrêt du tabac et de l'alcool. Chez l'homme : tabac, alcool, chaleur, poids. Charge émotionnelle importante : écoute et orientation psychologique si besoin.", "alertes": ["Douleur pelvienne brutale, saignements anormaux : avis médical", "Détresse psychologique, idées noires : conduite à tenir immédiate (RÈGLE N°61)"], "aNePasFaire": ["Promettre une grossesse", "Proposer des compléments ou des plantes sans vérifier la possible grossesse ou le traitement de PMA", "Retarder le bilan médical"], "questions": ["Depuis combien de temps essayez-vous ?", "Un bilan a-t-il été fait chez votre conjoint ?", "Quel est l'âge, le cycle et les antécédents ?"], "outils": "Générateur : RÈGLE N°63 (grossesse), rubrique « Désir de grossesse ».", "voirAussi": ["SOPK (syndrome des ovaires polykystiques)", "Endométriose", "Grossesse et allaitement"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Post-partum", "type": "maladie", "categorie": "Fertilité, grossesse et post-partum", "alias": ["suites de couches", "baby blues", "dépression post-partum", "thyroïdite du post-partum", "après l'accouchement"], "enBref": "Période qui suit l'accouchement (environ 6 à 12 semaines pour le corps, plus longtemps pour l'équilibre). Elle associe récupération physique, bouleversements hormonaux, manque de sommeil et adaptation à la parentalité.", "physiologie": "Après l'accouchement, l'œstradiol et la progestérone chutent brutalement ; la prolactine monte en cas d'allaitement. Les réserves (fer, B12, zinc, oméga-3) sont souvent entamées. Le sommeil fragmenté augmente la vulnérabilité à l'anxiété et à la dépression. Une thyroïdite du post-partum touche environ 5 à 10 % des femmes entre 1 et 12 mois. Le plancher pelvien et les muscles abdominaux demandent une rééducation.", "symptomes": "Fatigue, humeur variable, anxiété, chute de cheveux (à partir du 3e mois), douleurs périnéales ou de cicatrice, douleurs de dos, troubles du sommeil, baisse de libido.", "diagnostic": "Suivi sage-femme ou médecin. Bilan en cas de fatigue persistante : NFS, ferritine, TSH. Dépistage de la dépression post-partum (échelle EPDS).", "pec": "Rééducation périnéale et abdominale, supplémentation en fer si carence, soutien psychologique, antidépresseurs si dépression, traitement d'une thyroïdite.", "traitements": [{"label": "Fer", "marques": ["Tardyferon"]}, {"label": "Antidépresseurs (compatibles avec l'allaitement selon avis)", "marques": ["Sertraline"]}], "operations": [], "naturo": "Priorité au repos, aux repas réguliers, aux protéines, au fer selon bilan et à l'aide de l'entourage. Compléments validés par le médecin et compatibles avec l'allaitement (RÈGLE N°63). Aucun régime restrictif. Expliquer la chute de cheveux comme normale et temporaire. Vigilance sur l'humeur.", "alertes": ["Pensées de se faire du mal ou de nuire au bébé, désespoir, hallucinations : urgence 15 ou 3114", "Fièvre, saignements abondants, caillots volumineux, douleur de mollet : avis médical immédiat"], "aNePasFaire": ["Proposer un régime, un jeûne ou une « détox » à une jeune maman", "Minimiser une tristesse qui dure plus de 2 semaines", "Proposer des plantes non validées pendant l'allaitement"], "questions": ["Comment vous sentez-vous sur le plan moral ?", "Allaitez-vous ?", "Quel est votre sommeil ?"], "outils": "Générateur : RÈGLES N°61 et N°63.", "voirAussi": ["Grossesse et allaitement", "Idées suicidaires — conduite à tenir", "Hypothyroïdie et Hashimoto"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Arthrose", "type": "maladie", "categorie": "Orthopédie et rhumatologie", "alias": ["gonarthrose", "coxarthrose", "arthrose des mains", "usure articulaire"], "enBref": "Atteinte du cartilage et de l'ensemble de l'articulation, avec douleurs mécaniques et raideur. Fréquente après 50 ans (genou, hanche, mains, rachis).", "physiologie": "Le cartilage s'amincit sous l'effet de contraintes répétées, du surpoids, d'un traumatisme ou de facteurs génétiques. L'os sous-jacent se remodèle et la membrane synoviale s'enflamme par poussées. L'articulation perd en mobilité et en amortissement. L'inflammation de bas grade et la fonte musculaire entretiennent le cercle.", "symptomes": "Douleur qui augmente à l'effort et se calme au repos, raideur au démarrage (de courte durée), craquements, gonflement par poussées.", "diagnostic": "Examen clinique et radiographie. Un bilan est utile en cas de douleur inflammatoire pour écarter une polyarthrite.", "pec": "Activité physique adaptée, renforcement musculaire, perte de poids si surpoids, antalgiques, AINS de courte durée, infiltrations, prothèse en dernier recours.", "traitements": [{"label": "Antalgiques", "marques": ["Doliprane"]}, {"label": "Anti-inflammatoires (courte durée)", "marques": ["Ibuprofène", "Voltarène"]}, {"label": "Infiltrations", "marques": ["Corticoïdes", "Acide hyaluronique"]}, {"label": "Prothèse", "marques": []}], "operations": [], "naturo": "Expliquer que le mouvement protège le cartilage et que le muscle soulage l'articulation. Alimentation anti-inflammatoire (oméga-3), poids, vitamine D. Plantes (curcuma, harpagophytum) avec prudence : interactions avec les anticoagulants et risque digestif. Ne pas promettre de régénération du cartilage.", "alertes": ["Articulation chaude, rouge, gonflée avec fièvre : avis urgent", "Raideur matinale prolongée, plusieurs articulations : suspicion de polyarthrite"], "aNePasFaire": ["Conseiller le repos strict", "Associer curcuma ou harpagophytum à un anticoagulant sans avis", "Promettre une réparation du cartilage"], "questions": ["Quelle articulation, depuis quand ?", "La douleur est-elle surtout à l'effort ?", "Prenez-vous des anti-inflammatoires ou des anticoagulants ?"], "outils": "Voir fiche Polyarthrite rhumatoïde.", "voirAussi": ["Polyarthrite rhumatoïde", "Tendinopathies"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Tendinopathies", "type": "maladie", "categorie": "Orthopédie et rhumatologie", "alias": ["tendinite", "tendinopathie", "épicondylite", "tennis elbow", "tendon d'Achille", "coiffe des rotateurs"], "enBref": "Douleur d'un tendon liée à une surcharge. Il s'agit surtout d'une désorganisation du tendon plus que d'une inflammation, d'où le terme moderne de tendinopathie.", "physiologie": "Le tendon transmet la force du muscle à l'os. Quand la charge dépasse sa capacité d'adaptation (sport, geste répété, reprise trop rapide), ses fibres de collagène se désorganisent. La douleur survient à la mise en charge. La récupération passe par une remise en charge progressive plutôt que par le repos total. Certains médicaments (fluoroquinolones, corticoïdes répétés) augmentent le risque de rupture.", "symptomes": "Douleur localisée à l'effort, raideur au démarrage, sensibilité à la palpation, force diminuée.", "diagnostic": "Examen clinique, échographie si doute sur une rupture.", "pec": "Adaptation de la charge, exercices excentriques ou isométriques encadrés par kinésithérapeute, antalgiques, ondes de choc, infiltrations avec prudence, chirurgie exceptionnelle.", "traitements": [{"label": "Antalgiques", "marques": ["Paracétamol"]}, {"label": "Anti-inflammatoires locaux", "marques": ["Flector", "Voltarène gel"]}, {"label": "Infiltrations (avec prudence)", "marques": ["Corticoïdes"]}], "operations": [], "naturo": "Expliquer le principe de charge progressive. Protéines suffisantes, vitamine C, magnésium, sommeil. Éviter l'arrêt total du mouvement. Ne pas promettre une guérison rapide.", "alertes": ["Craquement soudain avec perte de force : rupture, avis urgent", "Douleur après prise de fluoroquinolone : arrêter et appeler son médecin"], "aNePasFaire": ["Prescrire un repos complet prolongé", "Conseiller des infiltrations répétées"], "questions": ["Quelle activité a précédé la douleur ?", "Avez-vous pris un antibiotique de la famille des fluoroquinolones ?", "Quel est votre niveau d'activité sportive ?"], "outils": "Voir fiche Arthrose.", "voirAussi": ["Arthrose"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Santé de l'enfant — principes d'accompagnement", "type": "conduite", "categorie": "Enfants et adolescents", "alias": ["enfant", "pédiatrie", "bébé", "enfants", "doses enfant"], "enBref": "L'enfant n'est pas un petit adulte : croissance, immaturité du foie et des reins, besoins nutritionnels élevés et vulnérabilité à certains produits imposent une prudence particulière.", "physiologie": "Un enfant grandit en continu : toute restriction alimentaire peut ralentir la croissance et la puberté. Son foie et ses reins métabolisent plus lentement certaines substances. Sa peau et ses voies respiratoires absorbent davantage les huiles essentielles. La barrière intestinale et l'immunité se construisent jusqu'à environ 6 ans. Le suivi de la croissance (courbes de poids, taille, IMC) est un outil médical.", "symptomes": "Motifs fréquents : infections ORL à répétition, troubles digestifs, eczéma, troubles du sommeil, énergie, alimentation sélective.", "diagnostic": "Le pédiatre ou le médecin traitant. Carnet de santé et courbes de croissance.", "pec": "Suivi médical régulier, vaccination selon le calendrier officiel, prise en charge de chaque maladie.", "traitements": [{"label": "Traitements selon la maladie", "marques": []}], "operations": [], "naturo": "Toujours un accompagnement en lien avec le pédiatre. Alimentation variée sans éviction sans avis médical. Aucune huile essentielle avant 6 ans sans avis, aucun complément sans dose adaptée à l'âge et au poids. Aider les parents à comprendre, sans culpabiliser. Pour un mineur, le consentement des parents est requis.", "alertes": ["Fièvre chez un nourrisson de moins de 3 mois, léthargie, respiration difficile, déshydratation : urgence 15", "Cassure de la courbe de croissance : pédiatre", "Refus alimentaire marqué ou perte de poids : orientation médicale (RÈGLE N°59)"], "aNePasFaire": ["Appliquer à l'enfant un protocole d'adulte", "Supprimer des groupes d'aliments", "Utiliser des huiles essentielles chez le jeune enfant", "Déconseiller la vaccination"], "questions": ["Quel âge, quel poids, quelle taille ?", "Un médecin suit-il l'enfant ?", "Que mange l'enfant dans la journée ?"], "outils": "Générateur : prudence sur âge, poids, mineur.", "voirAussi": ["Santé de l'adolescent", "Allergie alimentaire"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Santé de l'adolescent", "type": "conduite", "categorie": "Enfants et adolescents", "alias": ["adolescence", "puberté", "ado", "adolescente"], "enBref": "Période de croissance rapide et de puberté, avec forte vulnérabilité psychologique et nutritionnelle. Les besoins en énergie, fer, calcium et vitamine D sont élevés.", "physiologie": "La puberté repose sur la montée des hormones sexuelles, qui déclenchent la croissance, les règles, la masse osseuse (le pic de masse osseuse se construit avant 20 ans) et la maturation cérébrale. Les premiers cycles sont souvent irréguliers pendant 2 à 3 ans. Le cerveau, très sensible au regard des autres, est vulnérable aux troubles anxieux, dépressifs et alimentaires. Le manque de sommeil et les écrans pèsent sur l'humeur.", "symptomes": "Acné, règles douloureuses ou irrégulières, fatigue, humeur variable, régimes, troubles du sommeil.", "diagnostic": "Médecin traitant, pédiatre, gynécologue. Bilan seulement sur indication médicale.", "pec": "Prise en charge de chaque situation. Soutien psychologique si besoin.", "traitements": [{"label": "Traitements selon la situation", "marques": []}], "operations": [], "naturo": "Accompagner en présence ou avec accord des parents (mineur). Jamais de régime, de jeûne ni d'éviction (risque de TCA et de ralentissement de la croissance). Parler de règles, de peau et de sommeil simplement. Repérer l'anxiété, l'isolement, les restrictions et les idées noires.", "alertes": ["Règles absentes à 15 ans ou perte de règles : avis médical", "Perte de poids, restriction, vomissements : orientation médicale (RÈGLE N°59)", "Idées noires, automutilation : conduite à tenir immédiate (3114, 15)"], "aNePasFaire": ["Proposer un régime à une adolescente", "Doser les hormones sous pilule ou aux premières années de règles pour « diagnostiquer »", "Traiter sans l'accord des parents un mineur"], "questions": ["Quel âge ? Quels sont les cycles et depuis quand ?", "Comment se passe l'école et le moral ?", "Y a-t-il des restrictions alimentaires ?"], "outils": "Générateur : RÈGLES N°59 et N°61.", "voirAussi": ["Santé de l'enfant — principes d'accompagnement", "Anorexie mentale", "Acné de l'adulte", "Idées suicidaires — conduite à tenir"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Colite microscopique", "type": "maladie", "categorie": "Digestif", "alias": ["colite lymphocytaire", "colite collagène", "diarrhée chronique aqueuse", "diarrhée de la femme de 50 ans"], "enBref": "Inflammation du côlon visible seulement au microscope : la muqueuse paraît normale à la coloscopie. Elle donne une diarrhée aqueuse chronique, sans sang, et touche surtout les femmes autour de la cinquantaine.", "physiologie": "Les biopsies montrent une infiltration de lymphocytes (forme lymphocytaire) ou un épaississement de la couche de collagène sous l'épithélium (forme collagène). Le côlon réabsorbe mal l'eau et les sels. Des facteurs favorisants sont décrits : certains médicaments (anti-inflammatoires, inhibiteurs de la pompe à protons, certains antidépresseurs, statines), le tabac et un terrain auto-immun (cœliaque, thyroïde).", "symptomes": "Diarrhée aqueuse abondante, souvent nocturne, urgences, crampes, fatigue, parfois perte de poids. Pas de sang.", "diagnostic": "Coloscopie avec biopsies étagées. Une coloscopie « normale » sans biopsies ne l'élimine pas. Rechercher aussi une maladie cœliaque.", "pec": "Arrêt des médicaments déclenchants si possible, budésonide en première ligne, antidiarrhéique en appoint, suivi médical des rechutes.", "traitements": [{"label": "Budésonide", "marques": ["Budenofalk", "Entocort"]}, {"label": "Antidiarrhéique", "marques": ["Imodium (lopéramide)"]}], "operations": [], "naturo": "À évoquer dès qu'une cliente de plus de 45 ans a une diarrhée aqueuse chronique étiquetée SII sans coloscopie avec biopsies. Ensuite : hydratation, sels minéraux, repérage des médicaments en cause (avec le médecin), soutien de la muqueuse en rémission. Ne jamais arrêter un traitement soi-même.", "alertes": ["Sang dans les selles, perte de poids importante, fièvre : avis médical sans délai", "Diarrhée avec déshydratation (soif, vertiges, urines rares) : avis urgent"], "aNePasFaire": ["Étiqueter SII une diarrhée aqueuse récente après 45 ans sans bilan", "Proposer un régime FODMAP restrictif au long cours", "Conseiller d'arrêter l'IPP ou un antidépresseur de soi-même"], "questions": ["Depuis quand avez-vous cette diarrhée, et vous réveille-t-elle la nuit ?", "Prenez-vous un anti-inflammatoire, un IPP, une statine ?", "Une coloscopie avec biopsies a-t-elle été faite ?"], "outils": "Générateur : à signaler en repérage digestif.", "voirAussi": ["SII (syndrome de l'intestin irritable)", "Maladie cœliaque", "MICI (Crohn / RCH)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Sensibilité au gluten non cœliaque", "type": "maladie", "categorie": "Digestif", "alias": ["intolérance au gluten", "sensibilité au blé", "ballonnements après le pain", "sans gluten"], "enBref": "Troubles digestifs ou généraux déclenchés par le blé et les céréales apparentées, alors que la maladie cœliaque et l'allergie au blé sont éliminées.", "physiologie": "Il n'existe pas de marqueur biologique. Plusieurs pistes sont étudiées : les fructanes du blé (des sucres fermentescibles de la famille des FODMAP), d'autres protéines du blé (inhibiteurs d'amylase-trypsine) et un effet nocebo important dans les études. Beaucoup de personnes qui se sentent mieux sans pain réagissent en fait aux fructanes, pas au gluten.", "symptomes": "Ballonnements, douleurs, transit irrégulier, fatigue, brouillard mental, maux de tête, après des produits à base de blé.", "diagnostic": "Diagnostic d'exclusion : dépister la maladie cœliaque (anticorps et biopsies) tant que la cliente MANGE du gluten, éliminer l'allergie au blé, puis tester l'éviction suivie d'une réintroduction.", "pec": "Pas de traitement médical. Éviction du blé selon la tolérance, avec réintroduction pour déterminer le seuil.", "traitements": [{"label": "Pas de traitement médicamenteux", "marques": []}], "operations": [], "naturo": "Ne jamais retirer le gluten avant d'avoir fait dépister la maladie cœliaque : le test devient faux. Expliquer la piste des fructanes, tester par paliers, garder une alimentation variée. Pas d'éviction durable sans réintroduction. En cas de TCA ou de profil restrictif : aucune éviction (RÈGLE N°59).", "alertes": ["Diarrhée chronique, anémie, perte de poids : bilan cœliaque d'abord", "Antécédents familiaux de maladie cœliaque : dépistage avant tout régime"], "aNePasFaire": ["Supprimer le gluten avant le dépistage cœliaque", "Annoncer que la cliente a une « maladie » du gluten", "Maintenir une éviction sans test de réintroduction"], "questions": ["Un dépistage de la maladie cœliaque a-t-il été fait, et mangiez-vous du gluten à ce moment ?", "Que se passe-t-il avec les autres FODMAP (ail, oignon, légumineuses) ?", "Avez-vous retiré le gluten de vous-même, depuis quand ?"], "outils": "Voir fiche FODMAP du générateur.", "voirAussi": ["Maladie cœliaque", "SII (syndrome de l'intestin irritable)", "Dysbiose intestinale"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Intolérance au fructose et au sorbitol", "type": "maladie", "categorie": "Digestif", "alias": ["malabsorption du fructose", "sorbitol", "polyols", "ballonnements après fruits", "FODMAP fructose"], "enBref": "Difficulté à absorber le fructose ou les polyols (sorbitol, mannitol, xylitol) dans l'intestin grêle. Les sucres non absorbés fermentent dans le côlon.", "physiologie": "Le fructose passe dans l'intestin par des transporteurs (GLUT5, GLUT2) en quantité limitée, mieux quand il est accompagné de glucose. Quand le fructose est en excès par rapport au glucose (pomme, poire, miel, jus), ou que les polyols sont présents (chewing-gum, produits « sans sucre »), l'eau et les gaz augmentent. Ce n'est pas la même chose que l'intolérance héréditaire au fructose, maladie rare et grave de l'enfant.", "symptomes": "Ballonnements, gaz, diarrhée ou inconfort, après fruits, jus, miel, sirops, produits « sans sucre ».", "diagnostic": "Test respiratoire à l'hydrogène après charge en fructose ou sorbitol (non remboursé, à interpréter avec prudence) ou éviction suivie de réintroduction. Éliminer SIBO, cœliaque.", "pec": "Réduction temporaire des aliments en cause, puis réintroduction progressive selon la tolérance.", "traitements": [{"label": "Pas de traitement spécifique", "marques": []}], "operations": [], "naturo": "Cibler seulement ce qui pose problème, sans régime global. Fruits à faible teneur en fructose et en quantités tolérées, associer glucose et fructose. Repérer les polyols cachés (chewing-gum, produits light). Pas de restriction en cas de TCA (RÈGLE N°59).", "alertes": ["Vomissements, hypoglycémie après un repas sucré chez l'enfant, jaunisse : intolérance héréditaire, urgence médicale"], "aNePasFaire": ["Supprimer tous les fruits", "Interpréter un test respiratoire commercial sans clinique", "Confondre avec l'intolérance héréditaire au fructose"], "questions": ["Quels aliments sucrés déclenchent les gaz ?", "Consommez-vous des produits « sans sucre » ?", "Avez-vous déjà eu un test respiratoire ?"], "outils": "Voir fiche SIBO et FODMAP.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)", "Intolérance au lactose", "SII (syndrome de l'intestin irritable)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Dyspepsie fonctionnelle", "type": "maladie", "categorie": "Digestif", "alias": ["digestion lente", "lourdeur d'estomac", "estomac paresseux", "brûlures d'estomac sans cause", "crise de foie"], "enBref": "Douleur ou gêne chronique du haut du ventre (épigastre), satiété précoce ou lourdeur après les repas, sans lésion trouvée à l'endoscopie. Très fréquente.", "physiologie": "L'estomac s'adapte mal au repas (accommodation réduite), vidange lentement ou devient hypersensible à l'acidité et à l'étirement. Le stress, une infection digestive passée, Helicobacter pylori et une hypersensibilité viscérale y contribuent. L'axe intestin–cerveau est central.", "symptomes": "Satiété précoce, lourdeur après les repas, ballonnement haut, nausées, douleur ou brûlure de l'épigastre, éructations.", "diagnostic": "Clinique (critères de Rome IV). Recherche d'Helicobacter pylori. Endoscopie en présence de signes d'alarme ou après 50 ans.", "pec": "Éradication d'Helicobacter pylori si présent, inhibiteurs de la pompe à protons, prokinétiques, faible dose d'antidépresseur tricyclique, prise en charge du stress.", "traitements": [{"label": "Inhibiteurs de la pompe à protons", "marques": ["Mopral", "Inexium", "Pariet"]}, {"label": "Prokinétiques", "marques": ["Motilium (dompéridone)"]}, {"label": "Antidépresseur à faible dose", "marques": ["Laroxyl (amitriptyline)"]}], "operations": [], "naturo": "Expliquer le rôle de l'estomac et de l'axe intestin–cerveau. Repas plus petits et plus fréquents, mastication, repas calmes, limiter graisses et boissons gazeuses en cas de gêne. Repérer l'usage d'IPP au long cours et ses conséquences (RÈGLE sevrage IPP). Si les repas sont évités par peur, penser TCA.", "alertes": ["Dysphagie, vomissements répétés, perte de poids, anémie, sang dans les vomissements ou selles noires : endoscopie sans délai", "Symptômes nouveaux après 50 ans : avis médical"], "aNePasFaire": ["Poser un diagnostic de « mauvais foie »", "Arrêter un IPP brutalement", "Banaliser une perte de poids associée"], "questions": ["La gêne survient-elle pendant ou après le repas ?", "Un test Helicobacter pylori ou une endoscopie ont-ils été faits ?", "Perdez-vous du poids ?"], "outils": "Générateur : RÈGLE sevrage IPP.", "voirAussi": ["Gastrite", "RGO", "Helicobacter pylori", "Gastroparésie"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Gastroparésie", "type": "maladie", "categorie": "Digestif", "alias": ["vidange gastrique lente", "estomac qui ne se vide pas", "nausées chroniques"], "enBref": "Vidange anormalement lente de l'estomac en l'absence d'obstacle. Les causes sont le diabète, une infection virale passée, des médicaments ou une cause inconnue.", "physiologie": "L'estomac se vide grâce à des contractions coordonnées par le nerf vague et par des cellules pacemaker (cellules interstitielles de Cajal). Quand le nerf vague est abîmé (diabète) ou la coordination perturbée, la nourriture stagne : nausées, ballonnement, vomissements d'aliments non digérés, glycémies imprévisibles. Elle peut accompagner l'hypermobilité (Ehlers-Danlos) et la dysautonomie.", "symptomes": "Nausées, vomissements, satiété très précoce, ballonnements, douleurs hautes, fluctuations de la glycémie.", "diagnostic": "Scintigraphie de vidange gastrique après repas test, endoscopie pour éliminer un obstacle, recherche de diabète et de médicaments en cause.", "pec": "Repas fractionnés, pauvres en graisses et en fibres, prokinétiques, antiémétiques, ajustement du diabète. Traitements spécialisés dans les formes sévères.", "traitements": [{"label": "Prokinétiques", "marques": ["Motilium (dompéridone)", "Primpéran (métoclopramide, durée limitée)"]}, {"label": "Antiémétiques", "marques": ["Zophren"]}], "operations": [], "naturo": "Adapter la texture et la fréquence des repas : petits repas, mixés si besoin, faibles en graisses et en fibres insolubles, liquides nutritifs. Surveiller les carences. Éviter les fibres crues, les compléments volumineux, les opiacés. Ne pas ajouter de prokinétique naturel sans avis.", "alertes": ["Vomissements répétés avec déshydratation ou perte de poids : avis médical rapide", "Diabète déséquilibré : médecin"], "aNePasFaire": ["Conseiller de manger plus de fibres crues", "Recommander une cure « détox »", "Prendre des symptômes pour un TCA sans bilan"], "questions": ["Mangez-vous des petites quantités ou vous sentez-vous vite rassasié·e ?", "Y a-t-il un diabète ?", "Un examen de vidange gastrique a-t-il été fait ?"], "outils": "Voir fiche Dyspepsie fonctionnelle.", "voirAussi": ["Dyspepsie fonctionnelle", "Diabète de type 1", "Syndrome d'Ehlers-Danlos hypermobile et spectre de l'hypermobilité"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Adénomyose", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["adénomyose utérine", "règles très abondantes et douloureuses", "utérus augmenté de volume"], "enBref": "Présence de tissu endométrial dans la paroi musculaire de l'utérus (myomètre). L'utérus grossit et devient douloureux. Elle accompagne souvent l'endométriose mais peut exister seule.", "physiologie": "Les glandes endométriales infiltrent le muscle utérin. À chaque cycle, ce tissu réagit aux hormones, saigne et enflamme la paroi. L'utérus se contracte plus fort (crampes), saigne plus et peut gêner l'implantation d'un embryon. L'inflammation locale et l'excès relatif d'œstrogènes semblent jouer.", "symptomes": "Règles abondantes, caillots, douleurs pelviennes, douleurs lors des rapports, saignements entre les règles, difficulté à concevoir, fatigue et carence en fer.", "diagnostic": "Échographie pelvienne endovaginale par un opérateur expérimenté et IRM pelvienne. Le diagnostic définitif est histologique, mais ne nécessite pas d'opération.", "pec": "Contraception progestative continue, DIU au lévonorgestrel, analogues de la GnRH, traitement de la carence en fer, chirurgie conservatrice ou hystérectomie selon le projet.", "traitements": [{"label": "Progestatifs", "marques": ["Visanne (diénogest)", "Mirena (DIU lévonorgestrel)", "Lutényl"]}, {"label": "Analogues de la GnRH", "marques": ["Decapeptyl", "Zoladex"]}, {"label": "Anti-inflammatoires", "marques": ["Ibuprofène"]}], "operations": [], "naturo": "Même cadre que l'endométriose : douleur, inflammation, foie et œstrogènes, intestin, fer, perturbateurs endocriniens, gestion de la douleur. Bilan de la ferritine. Ne pas interpréter le bilan hormonal sous contraception. Ne pas retarder le parcours de PMA après 35 ans.", "alertes": ["Saignements très abondants avec malaise ou essoufflement : urgence", "Douleur brutale, fièvre, saignements en post-ménopause : avis médical"], "aNePasFaire": ["Banaliser des règles qui empêchent de vivre", "Promettre une guérison par l'alimentation", "Doser les hormones sous pilule"], "questions": ["Vos règles sont-elles abondantes avec des caillots ?", "Une IRM ou une échographie spécialisée a-t-elle été faite ?", "Avez-vous un désir de grossesse ?"], "outils": "Générateur : endométriose, RÈGLE N°19.", "voirAussi": ["Endométriose", "Anémie par carence en fer", "Infertilité du couple"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Lichen scléreux vulvaire", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["lichen scléro-atrophique", "démangeaisons vulvaires chroniques", "taches blanches vulve"], "enBref": "Maladie inflammatoire chronique de la peau de la vulve (et parfois de l'anus), probablement auto-immune, avec démangeaisons, plaques blanches et risque de cicatrices qui modifient l'anatomie.", "physiologie": "Le système immunitaire attaque la peau génitale. La peau s'amincit, devient blanche, fragile et fissurée, puis les petites lèvres peuvent fusionner et l'entrée du vagin se rétrécir. Le risque de carcinome épidermoïde est faible (environ 3 à 5 %) mais réel, ce qui impose un suivi à vie.", "symptomes": "Démangeaisons intenses, brûlures, douleurs aux rapports, fissures, taches blanches nacrées, rétrécissement, difficulté d'uriner.", "diagnostic": "Examen par un gynécologue ou un dermatologue ; biopsie en cas de doute ou de lésion suspecte. Ce n'est pas une mycose.", "pec": "Dermocorticoïde très puissant (clobétasol) selon un schéma dégressif puis d'entretien, émollients, suivi régulier.", "traitements": [{"label": "Dermocorticoïde très puissant", "marques": ["Dermoval (clobétasol)"]}, {"label": "Émollients", "marques": ["Vaseline", "Cicaplast"]}], "operations": [], "naturo": "Expliquer qu'il s'agit d'une maladie de la peau, pas d'hygiène ni de mycose, et que le dermocorticoïde est le traitement efficace et sûr à cette dose. Éviter les irritants (savons, lingettes, antifongiques répétés sans preuve). Encourager le suivi. Pas de promesse de guérison par la nutrition.", "alertes": ["Lésion qui s'ulcère, saigne, ne guérit pas : avis dermatologique rapide (risque de cancer)", "Douleurs rendant les rapports ou la miction impossibles : avis spécialisé"], "aNePasFaire": ["Traiter à répétition par des antifongiques sans diagnostic", "Déconseiller le dermocorticoïde par peur des corticoïdes", "Retarder une biopsie"], "questions": ["Depuis quand les démangeaisons ? Quels traitements ont déjà été essayés ?", "Un examen spécialisé a-t-il été fait ?", "Y a-t-il des douleurs aux rapports ?"], "outils": "Voir fiches Mycoses, Vulvodynie.", "voirAussi": ["Vulvodynie", "Mycoses vaginales récidivantes", "Psoriasis"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Vulvodynie", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["douleur vulvaire chronique", "vestibulodynie", "brûlures vulvaires", "douleur aux rapports"], "enBref": "Douleur ou brûlure de la vulve de plus de 3 mois sans cause visible évidente. La forme la plus fréquente est la vestibulodynie provoquée : douleur au toucher ou à la pénétration.", "physiologie": "Les terminaisons nerveuses du vestibule vulvaire sont hypersensibles (sensibilisation périphérique et centrale). Une hypertonie des muscles du plancher pelvien, des antécédents d'infections répétées, une muqueuse fragilisée par les hormones ou des irritants entretiennent la douleur. Le lien avec le stress et l'anxiété passe par la tension musculaire, pas par une cause « psychologique ».", "symptomes": "Brûlure, piqûres, douleur à la pénétration, au port de vêtements serrés, à l'insertion d'un tampon, au toucher léger.", "diagnostic": "Examen gynécologique avec test au coton-tige, élimination de mycose, dermatose (lichen), infection, atrophie. Consultation d'un centre douleur ou d'un gynécologue spécialisé.", "pec": "Rééducation périnéale, kinésithérapie du plancher pelvien, anesthésiques locaux, antidépresseurs ou antiépileptiques à faible dose, thérapie sexuelle, infiltration ou chirurgie en dernier recours.", "traitements": [{"label": "Anesthésique local", "marques": ["Xylocaïne gel"]}, {"label": "Neuromodulateurs", "marques": ["Laroxyl (amitriptyline)", "Neurontin (gabapentine)"]}], "operations": [], "naturo": "Valider la douleur et expliquer la sensibilisation nerveuse. Éviter les irritants, les antifongiques répétés sans preuve, l'excès d'hygiène. Orienter vers une kiné périnéale formée. Gestion du stress, détente du plancher pelvien, sommeil. Rester sobre sur les promesses.", "alertes": ["Plaie, saignement, lésion visible, fièvre : avis médical", "Douleur invalidante avec détresse : orienter vers un centre spécialisé"], "aNePasFaire": ["Dire « c'est dans la tête »", "Multiplier les traitements antifongiques ou antibiotiques sans prélèvement", "Proposer des crèmes irritantes ou des huiles essentielles locales"], "questions": ["La douleur survient-elle au toucher, aux rapports, en continu ?", "Quels traitements ont été essayés ?", "Un examen spécialisé a-t-il été fait ?"], "outils": "Voir fiches Lichen scléreux, Mycoses.", "voirAussi": ["Lichen scléreux vulvaire", "Mycoses vaginales récidivantes", "Cystite interstitielle (syndrome de la vessie douloureuse)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cystite interstitielle (syndrome de la vessie douloureuse)", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["vessie douloureuse", "cystites sans microbe", "envies pressantes chroniques", "SVD"], "enBref": "Douleur pelvienne ou vésicale chronique associée à des envies fréquentes et pressantes d'uriner, avec des urines stériles. Souvent prise à tort pour une cystite infectieuse à répétition.", "physiologie": "La couche protectrice de la paroi vésicale (glycosaminoglycanes) est altérée ; l'urine irrite la paroi et active les nerfs. La douleur augmente avec le remplissage et se calme après la miction. Un plancher pelvien contracturé, une inflammation et une sensibilisation du système nerveux participent.", "symptomes": "Douleur pelvienne ou sus-pubienne, fréquence urinaire élevée de jour et de nuit, urgence, douleur aux rapports.", "diagnostic": "Éliminer l'infection par des ECBU répétés négatifs, éliminer les autres causes, cystoscopie spécialisée. Avis d'un urologue ou d'un centre douleur.", "pec": "Mesures alimentaires et comportementales, rééducation périnéale, antalgiques, instillations vésicales, traitements spécialisés.", "traitements": [{"label": "Antalgiques", "marques": ["Paracétamol"]}, {"label": "Pentosan polysulfate", "marques": ["Elmiron"]}, {"label": "Neuromodulateurs", "marques": ["Laroxyl (amitriptyline)"]}], "operations": [], "naturo": "Expliquer la différence avec la cystite infectieuse : pas d'antibiotiques répétés sans ECBU positif. Repérer les irritants individuels (café, alcool, aliments acides, épicés), hydratation régulière, gestion du stress, détente du plancher pelvien. Pas de D-mannose ni de canneberge en promesse : ils agissent sur les infections à E. coli.", "alertes": ["Sang dans les urines, fièvre, douleurs lombaires : avis médical", "Antécédent de tabagisme et sang dans les urines : bilan urologique"], "aNePasFaire": ["Répéter des cures d'antibiotiques sans ECBU", "Imposer un régime restrictif large", "Promettre une guérison"], "questions": ["Les ECBU étaient-ils positifs ?", "Quels aliments ou boissons aggravent ?", "Un urologue a-t-il été consulté ?"], "outils": "Voir fiche Cystites récidivantes.", "voirAussi": ["Cystites récidivantes", "Vulvodynie", "Prolapsus et incontinence urinaire"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Prolapsus et incontinence urinaire", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["fuites urinaires", "descente d'organes", "plancher pelvien", "périnée", "incontinence"], "enBref": "Le prolapsus est la descente d'un organe pelvien (vessie, utérus, rectum) dans le vagin ; l'incontinence est la perte involontaire d'urine. Les deux viennent d'un plancher pelvien affaibli et sont très fréquents après les accouchements et la ménopause.", "physiologie": "Le plancher pelvien est un hamac de muscles et de ligaments qui soutient la vessie, l'utérus et le rectum. Les accouchements, la constipation chronique, la toux chronique, le surpoids, l'effort répété et la baisse des œstrogènes à la ménopause l'affaiblissent. À l'effort (toux, saut), la pression dépasse la capacité de fermeture : fuites d'effort. Dans l'incontinence par urgence, c'est la vessie qui se contracte trop tôt.", "symptomes": "Fuites à la toux, à l'effort ou par urgence, pesanteur pelvienne, boule vaginale, difficulté à vider la vessie ou le rectum.", "diagnostic": "Examen gynécologique, bilan urodynamique selon les cas. Rééducation d'abord.", "pec": "Rééducation périnéale par kinésithérapeute ou sage-femme, pessaire, œstrogènes locaux après la ménopause, chirurgie (bandelette, promontofixation) si échec.", "traitements": [{"label": "Œstrogènes locaux", "marques": ["Colpotrophine", "Trophigil"]}, {"label": "Anticholinergiques / bêta-3", "marques": ["Vesicare", "Betmiga"]}, {"label": "Pessaire", "marques": []}], "operations": [], "naturo": "Expliquer le rôle du plancher pelvien et orienter vers la rééducation. Traiter constipation et toux, limiter les charges lourdes, garder un poids stable, hydratation sans excès. Caféine selon tolérance. Rester discret et rassurant : le sujet est souvent tabou.", "alertes": ["Rétention d'urine, douleur, fièvre, sang dans les urines : avis médical", "Boule qui sort, ulcérée ou douloureuse : avis gynécologique"], "aNePasFaire": ["Réduire l'eau bue pour éviter les fuites", "Recommander des exercices de Kegel sans apprentissage", "Banaliser les fuites comme « normales après un enfant »"], "questions": ["Les fuites surviennent-elles à l'effort ou par urgence ?", "Combien d'accouchements ? Avez-vous fait une rééducation ?", "Souffrez-vous de constipation ?"], "outils": "Voir fiches Constipation, Périménopause.", "voirAussi": ["Constipation chronique", "Périménopause et ménopause", "Cystite interstitielle (syndrome de la vessie douloureuse)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Aménorrhée hypothalamique fonctionnelle", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["absence de règles", "règles disparues", "aménorrhée de stress", "RED-S", "déficit énergétique relatif", "triade de l'athlète"], "enBref": "Absence de règles depuis au moins 3 mois, liée à un ralentissement de l'axe hormonal du cerveau par manque d'énergie, stress ou exercice excessif, en l'absence de maladie organique.", "physiologie": "L'hypothalamus coupe la production de GnRH quand l'énergie disponible est insuffisante : la LH et la FSH baissent, l'ovulation s'arrête, l'œstradiol chute. C'est un mécanisme de protection. Conséquences : perte osseuse, risque cardiovasculaire, fertilité, humeur. Elle accompagne souvent une restriction alimentaire, un sport intensif, un stress majeur ou un TCA.", "symptomes": "Absence de règles, froid, fatigue, humeur basse, perte de libido, sécheresse vaginale, fractures de fatigue, chute de cheveux.", "diagnostic": "Éliminer la grossesse, le SOPK, la thyroïde, l'hyperprolactinémie, l'insuffisance ovarienne. Bilan hormonal : LH, FSH, œstradiol bas. Ostéodensitométrie si durée prolongée.", "pec": "Restaurer l'apport énergétique, diminuer la charge d'entraînement, prise en charge psychologique. La pilule ne « répare » pas l'os ni l'axe hormonal. Œstrogènes transdermiques dans certains cas.", "traitements": [{"label": "Estrogènes transdermiques (cas sélectionnés)", "marques": ["Estreva", "Oestrogel"]}, {"label": "Calcium et vitamine D", "marques": ["Orocal D3"]}], "operations": [], "naturo": "Priorité à l'énergie : manger suffisamment est le traitement. Aucune restriction, aucun jeûne, aucun « drainage » (RÈGLE N°59). Repérer le rapport à l'alimentation avec douceur et orienter vers le médecin. Ne jamais proposer de chiffres. Éviter les compléments à visée hormonale.", "alertes": ["Absence de règles chez une adolescente de 15 ans ou plus, fractures, perte de poids rapide : avis médical", "Signes de TCA : orientation médicale et conduite à tenir (RÈGLE N°59)"], "aNePasFaire": ["Prescrire un régime ou un jeûne", "Conseiller de la pilule pour « faire revenir les règles »", "Conseiller des plantes hormonales (gattilier, maca, ginseng) pour déclencher les règles"], "questions": ["Depuis quand n'avez-vous plus vos règles ?", "Avez-vous perdu du poids ou intensifié le sport ?", "Comment vivez-vous votre alimentation ?"], "outils": "Générateur : RÈGLES N°57 et N°59.", "voirAussi": ["Anorexie mentale", "SOPK (syndrome des ovaires polykystiques)", "Ostéoporose", "Hyperprolactinémie"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Insuffisance ovarienne prématurée", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["ménopause précoce", "IOP", "POI", "FSH élevée avant 40 ans"], "enBref": "Arrêt du fonctionnement des ovaires avant 40 ans, avec règles absentes ou irrégulières, FSH élevée et œstradiol bas. Elle touche environ 1 % des femmes.", "physiologie": "Le stock de follicules s'épuise trop tôt ou ne répond plus aux hormones. Causes : génétiques (syndrome de Turner, prémutation du gène FMR1), auto-immunes (avec thyroïdite, maladie d'Addison), traitements (chimiothérapie, radiothérapie, chirurgie), infections, ou cause inconnue. L'absence d'œstrogènes à un âge précoce expose l'os et les vaisseaux.", "symptomes": "Cycles irréguliers puis absents, bouffées de chaleur, sécheresse vaginale, baisse de libido, troubles de l'humeur, infertilité.", "diagnostic": "FSH élevée sur deux dosages à au moins 4 semaines d'intervalle, œstradiol bas, AMH basse. Recherche de la cause : caryotype, FMR1, anticorps surrénaliens et thyroïdiens.", "pec": "Traitement hormonal substitutif recommandé jusqu'à l'âge habituel de la ménopause (environ 50-51 ans) pour protéger l'os et le système cardiovasculaire. Don d'ovocytes en cas de désir d'enfant.", "traitements": [{"label": "Traitement hormonal substitutif", "marques": ["Oestrogel + Utrogestan", "Climaval + progestérone"]}], "operations": [], "naturo": "Ne jamais suggérer d'arrêter le traitement hormonal substitutif, qui est ici une protection et non un confort. Soutenir le choc émotionnel, orienter vers un accompagnement psychologique et un centre de PMA. Os : calcium, vitamine D, activité de résistance. Pas de phytothérapie hormonale à la place du traitement.", "alertes": ["Fractures, douleurs osseuses : bilan osseux", "Désir de grossesse : orientation PMA sans délai", "Détresse psychologique, idées noires : RÈGLE N°61"], "aNePasFaire": ["Déconseiller le traitement hormonal substitutif", "Parler d'une « ménopause naturelle »", "Retarder l'orientation en PMA"], "questions": ["À quel âge vos règles se sont-elles arrêtées ?", "Quel traitement suivez-vous ?", "Existe-t-il un projet d'enfant ?"], "outils": "Générateur : RÈGLE N°19, projet de grossesse.", "voirAussi": ["Périménopause et ménopause", "Infertilité du couple", "Ostéoporose", "Maladie d'Addison"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hyperprolactinémie", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["prolactine élevée", "prolactinome", "galactorrhée", "écoulement du mamelon"], "enBref": "Taux de prolactine trop élevé, qui bloque l'ovulation et peut provoquer des écoulements de lait en dehors de l'allaitement. Les causes vont du simple stress à une petite tumeur bénigne de l'hypophyse (prolactinome).", "physiologie": "La prolactine, produite par l'hypophyse, est freinée en permanence par la dopamine. Tout ce qui diminue la dopamine ou stimule l'hypophyse l'augmente : grossesse, allaitement, médicaments (neuroleptiques, métoclopramide, certains antidépresseurs), hypothyroïdie, insuffisance rénale, prolactinome. Une prolactine haute freine la GnRH, donc l'ovulation.", "symptomes": "Cycles irréguliers ou absents, galactorrhée, infertilité, baisse de libido, sécheresse vaginale, maux de tête, troubles visuels (gros prolactinome).", "diagnostic": "Dosage au repos, à distance d'un stress, d'un effort, d'un rapport, d'un repas. Confirmer sur deux dosages, rechercher une macroprolactine, doser TSH, tester la grossesse, IRM hypophysaire si besoin.", "pec": "Selon la cause : arrêt du médicament en cause avec le médecin, agoniste de la dopamine (cabergoline), suivi. La chirurgie est rare.", "traitements": [{"label": "Agonistes de la dopamine", "marques": ["Dostinex (cabergoline)", "Parlodel (bromocriptine)"]}], "operations": [], "naturo": "Respecter les conditions de dosage. Rechercher les causes médicamenteuses et la thyroïde avant d'évoquer un prolactinome. Ne pas utiliser le gattilier (Vitex) sans avis : il agit sur la dopamine et peut interférer avec le traitement. Stress, sommeil, rythme.", "alertes": ["Maux de tête intenses, troubles de la vision : IRM en urgence", "Grossesse suspectée : test"], "aNePasFaire": ["Doser la prolactine sans respecter les conditions", "Associer gattilier et cabergoline", "Arrêter un neuroleptique ou un antidépresseur sans le médecin"], "questions": ["Avez-vous un écoulement du mamelon ?", "Quels médicaments prenez-vous ?", "Les cycles sont-ils réguliers ?"], "outils": "Générateur : bilans hormonaux (prolactine, RÈGLE 8ter).", "voirAussi": ["Aménorrhée hypothalamique fonctionnelle", "Hypothyroïdie et Hashimoto", "SOPK (syndrome des ovaires polykystiques)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Seins fibrokystiques (mastose)", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["mastose", "seins douloureux", "mastalgie", "kystes du sein", "seins tendus avant les règles"], "enBref": "Seins nodulaires, tendus et douloureux, surtout avant les règles. C'est une variante bénigne et fréquente, pas une maladie précancéreuse en soi.", "physiologie": "Les seins réagissent aux variations des œstrogènes et de la progestérone au cours du cycle : les canaux se dilatent, de petits kystes se forment, le tissu se gorge. La douleur cyclique suit le rythme hormonal. Les facteurs de confusion sont les kystes, les fibroadénomes et les tensions musculaires de la paroi.", "symptomes": "Seins tendus, lourds, douloureux avant les règles, nodules mobiles, sensibilité au toucher.", "diagnostic": "Examen clinique, échographie, mammographie selon l'âge et les antécédents. Toute masse nouvelle, dure et fixe, relève d'un bilan.", "pec": "Rassurer, soutien-gorge adapté, antalgiques, parfois traitement hormonal.", "traitements": [{"label": "Antalgiques", "marques": ["Paracétamol"]}, {"label": "Anti-inflammatoire local", "marques": ["Voltarène gel"]}], "operations": [], "naturo": "Expliquer le rôle du cycle. Magnésium, vitamine B6 selon profil, oméga-3, apport de caféine selon tolérance, soutien du foie et de l'intestin pour l'élimination des œstrogènes. Insister sur la surveillance : autopalpation, dépistage organisé selon l'âge.", "alertes": ["Masse nouvelle, dure, fixe, écoulement sanglant du mamelon, rétraction de la peau, ganglion de l'aisselle : avis médical rapide", "Asymétrie récente : consultation"], "aNePasFaire": ["Dire que « ce n'est rien » sans examen", "Promettre qu'un complément protège du cancer du sein"], "questions": ["La douleur suit-elle le cycle ?", "Une échographie ou une mammographie a-t-elle été faite ?", "Des antécédents de cancer du sein dans la famille ?"], "outils": "Voir fiches Cancer du sein, Axe des hormones sexuelles.", "voirAussi": ["Cancer du sein hormono-dépendant", "Syndrome prémenstruel et règles douloureuses", "Axe des hormones sexuelles (œstrogènes, progestérone, androgènes)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hépatite auto-immune", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["hépatite auto immune", "transaminases élevées", "anticorps anti-muscle lisse"], "enBref": "Inflammation chronique du foie provoquée par le système immunitaire. Elle touche surtout les femmes, à tout âge, et peut rester silencieuse longtemps.", "physiologie": "Les lymphocytes T attaquent les cellules du foie (hépatocytes), ce qui élève les transaminases et peut conduire à la fibrose puis à la cirrhose. Les anticorps (anti-noyau, anti-muscle lisse, anti-LKM1) et les IgG élevées orientent le diagnostic. Elle s'associe parfois à d'autres maladies auto-immunes (thyroïde, cœliaque).", "symptomes": "Fatigue, douleurs articulaires, jaunisse, démangeaisons ou aucun signe.", "diagnostic": "Transaminases, IgG, auto-anticorps, biopsie hépatique, élimination d'une hépatite virale ou médicamenteuse.", "pec": "Corticoïdes puis azathioprine, au long cours. La rechute est fréquente à l'arrêt. Suivi hépatologique.", "traitements": [{"label": "Corticoïdes", "marques": ["Cortancyl (prednisone)", "Solupred"]}, {"label": "Immunosuppresseur", "marques": ["Imurel (azathioprine)"]}], "operations": [], "naturo": "Ne jamais proposer de plantes ou de compléments hépatiques sans accord de l'hépatologue : le foie est fragile et certaines plantes sont hépatotoxiques. Aucun immunostimulant (échinacée, propolis, champignons) sans avis du spécialiste. Soutenir os (vitamine D, calcium) sous corticoïdes, vaccinations à jour, alimentation protectrice.", "alertes": ["Jaunisse, ventre gonflé, confusion, vomissement de sang : urgence", "Fièvre sous immunosuppresseur : avis médical sans délai"], "aNePasFaire": ["Proposer une cure « détox du foie »", "Ajouter des plantes hépatiques sans avis", "Arrêter le traitement immunosuppresseur"], "questions": ["Qui suit votre foie ? Quelle est la date du dernier bilan hépatique ?", "Quels médicaments et compléments prenez-vous ?", "Avez-vous d'autres maladies auto-immunes ?"], "outils": "Générateur : RÈGLE auto-immunité, aucun immunostimulant.", "voirAussi": ["Cholangite sclérosante primitive", "Cirrhose biliaire primitive", "Stéatose hépatique métabolique (foie gras)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cholangite sclérosante primitive", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["CSP", "voies biliaires inflammatoires", "RCH et foie"], "enBref": "Maladie rare qui inflamme et rétrécit les voies biliaires à l'intérieur et à l'extérieur du foie. Elle est fortement associée aux maladies inflammatoires de l'intestin, surtout la rectocolite hémorragique.", "physiologie": "L'inflammation des canaux biliaires provoque des cicatrices et des rétrécissements, qui gênent l'écoulement de la bile (cholestase). Le foie s'abîme peu à peu. Le lien avec l'intestin évoque un rôle de la perméabilité et du microbiote. Le risque de cancer des voies biliaires et du côlon est augmenté.", "symptomes": "Fatigue, démangeaisons, jaunisse, douleurs de l'hypochondre droit ; parfois aucun signe.", "diagnostic": "Phosphatases alcalines élevées, IRM des voies biliaires (bili-IRM), coloscopie systématique si MICI.", "pec": "Pas de traitement curatif ; la transplantation est la seule option dans les formes avancées. Surveillance régulière, coloscopies annuelles.", "traitements": [{"label": "Acide ursodésoxycholique (discuté)", "marques": ["Delursan"]}], "operations": [], "naturo": "Rôle de soutien : vitamines liposolubles (A, D, E, K) à doser, os, fatigue, démangeaisons, nutrition. Aucune plante cholérétique ni drainage du foie : risque de blocage des voies biliaires. Aucun immunostimulant (échinacée, propolis, champignons) sans avis du spécialiste.", "alertes": ["Fièvre, frissons, jaunisse : angiocholite, urgence", "Sang dans les selles : coloscopie"], "aNePasFaire": ["Proposer des plantes cholérétiques ou une cure de citron/huile d'olive", "Négliger la coloscopie annuelle"], "questions": ["Avez-vous une MICI ?", "Qui vous suit ? Quand a eu lieu la dernière coloscopie ?", "Avez-vous des démangeaisons ?"], "outils": "Voir fiches MICI, Hépatite auto-immune.", "voirAussi": ["MICI (Crohn / RCH)", "Hépatite auto-immune", "Cirrhose biliaire primitive"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome des anti-phospholipides", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["SAPL", "anticoagulant circulant", "fausses couches répétées", "thrombose"], "enBref": "Maladie auto-immune où des anticorps favorisent la formation de caillots et provoquent des complications de grossesse (fausses couches répétées, mort fœtale, prééclampsie).", "physiologie": "Les anticorps antiphospholipides (anticoagulant circulant, anticardiolipine, anti-bêta2-glycoprotéine I) activent les plaquettes et la coagulation. Des caillots peuvent se former dans les veines ou les artères, y compris dans le placenta. Il peut exister seul ou avec un lupus.", "symptomes": "Phlébite, embolie pulmonaire, AVC, fausses couches à répétition, migraines, livedo (marbrures de la peau).", "diagnostic": "Tests sanguins répétés à 12 semaines d'intervalle, évaluation par un médecin interniste ou hématologue.", "pec": "Antiagrégants (aspirine) ou anticoagulants au long cours selon le cas, héparine pendant la grossesse. Pas d'œstrogènes.", "traitements": [{"label": "Anticoagulants", "marques": ["Préviscan (fluindione)", "Coumadine", "Lovenox"]}, {"label": "Aspirine à faible dose", "marques": ["Kardégic"]}], "operations": [], "naturo": "Surveiller les interactions : vitamine K (légumes verts, compléments) avec les antivitamines K, oméga-3 à forte dose, ginkgo, ail, curcuma, vitamine E. Éviter la pilule œstroprogestative et le THM par voie orale (avis médical). Informer sur l'hydratation et la mobilité lors des voyages.", "alertes": ["Jambe gonflée, douloureuse, essoufflement brutal, douleur thoracique, déficit neurologique : urgence 15", "Grossesse : suivi spécialisé"], "aNePasFaire": ["Proposer des compléments fluidifiants du sang avec un anticoagulant", "Modifier brutalement l'apport en vitamine K"], "questions": ["Avez-vous eu une thrombose ou des fausses couches répétées ?", "Prenez-vous un anticoagulant ?", "Quelle contraception utilisez-vous ?"], "outils": "Générateur : RÈGLES N°19 (contraception), N°63.", "voirAussi": ["Lupus érythémateux disséminé", "Grossesse et allaitement"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Pseudo-polyarthrite rhizomélique", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["PPR", "douleurs des épaules et des hanches", "raideur matinale après 50 ans"], "enBref": "Inflammation des muscles et tissus autour des épaules et des hanches chez les personnes de plus de 50 ans, avec une raideur matinale intense. Elle est étroitement liée à la maladie de Horton.", "physiologie": "Une inflammation systémique (CRP et vitesse de sédimentation élevées) touche les bourses synoviales et les tendons proches des ceintures scapulaire et pelvienne. Une partie des patients développe une artérite à cellules géantes (maladie de Horton).", "symptomes": "Douleurs et raideur des épaules, du cou, des hanches, surtout le matin (plus de 45 minutes), fatigue, fièvre légère, perte de poids.", "diagnostic": "Clinique, CRP, VS, élimination de polyarthrite, myosite, cancer. Réponse rapide à une faible dose de corticoïdes.", "pec": "Prednisone à faible dose avec décroissance lente sur 1 à 2 ans. Surveillance de l'os et du diabète.", "traitements": [{"label": "Corticoïdes", "marques": ["Cortancyl (prednisone)"]}, {"label": "Protection osseuse", "marques": ["Calcium + vitamine D", "Bisphosphonates"]}], "operations": [], "naturo": "Soutien sous corticoïdes : os, glycémie, tension, sommeil, alimentation. Vitamine D selon dosage. Activité physique douce. Pas d'immunostimulants. Vigilance sur toute nouvelle céphalée.", "alertes": ["Maux de tête nouveaux, douleur du cuir chevelu, mâchoire douloureuse en mâchant, trouble visuel : suspicion de Horton, urgence"], "aNePasFaire": ["Banaliser des douleurs matinales après 50 ans", "Arrêter les corticoïdes sans avis"], "questions": ["La raideur dure-t-elle plus de 45 minutes ?", "Avez-vous des maux de tête ou des troubles de la vue ?", "Un bilan inflammatoire a-t-il été fait ?"], "outils": "Voir fiche Maladie de Horton.", "voirAussi": ["Maladie de Horton (artérite à cellules géantes)", "Polyarthrite rhumatoïde", "Arthrose"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Maladie de Horton (artérite à cellules géantes)", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["Horton", "artérite temporale", "céphalée après 50 ans", "claudication de la mâchoire"], "enBref": "Inflammation des artères de la tête (temporales) après 50 ans, qui peut provoquer une cécité si elle n'est pas traitée immédiatement.", "physiologie": "Les parois artérielles s'épaississent sous l'effet d'une inflammation, ce qui diminue le flux sanguin vers l'œil et le cerveau. Le nerf optique peut être privé d'oxygène en quelques heures. Elle est souvent associée à la pseudo-polyarthrite rhizomélique.", "symptomes": "Maux de tête récents, cuir chevelu sensible, douleur de la mâchoire en mâchant, troubles de la vision, fièvre, fatigue, perte de poids.", "diagnostic": "CRP et VS très élevées, échographie des artères temporales ou biopsie. Le traitement ne doit pas attendre les résultats.", "pec": "Corticoïdes à forte dose en urgence, puis décroissance lente, parfois tocilizumab. Aspirine possible.", "traitements": [{"label": "Corticoïdes", "marques": ["Solupred", "Cortancyl"]}, {"label": "Anti-IL6", "marques": ["RoActemra (tocilizumab)"]}], "operations": [], "naturo": "Rôle d'alerte avant tout : toute céphalée nouvelle après 50 ans avec douleur du cuir chevelu ou de la mâchoire est une urgence médicale le jour même. Sous corticoïdes : os, glycémie, tension.", "alertes": ["Perte brutale de vision, double vision, céphalée intense nouvelle : appeler le 15 immédiatement"], "aNePasFaire": ["Attendre un rendez-vous ordinaire", "Proposer des antidouleurs en attendant"], "questions": ["Depuis quand ces maux de tête ?", "Votre cuir chevelu est-il douloureux au peigne ?", "Avez-vous eu un trouble de la vue ?"], "outils": "Générateur : à intégrer aux signaux d'alarme céphalées > 50 ans.", "voirAussi": ["Pseudo-polyarthrite rhizomélique", "Migraines chroniques"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Diabète LADA (diabète auto-immun de l'adulte)", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["LADA", "diabète de type 1.5", "anti-GAD", "diabète lent"], "enBref": "Forme de diabète auto-immun qui débute à l'âge adulte, évolue lentement et ressemble à un type 2, mais finit par nécessiter de l'insuline.", "physiologie": "Comme dans le type 1, des anticorps (anti-GAD le plus souvent) détruisent les cellules bêta du pancréas, mais plus lentement. Le patient est souvent mince, sans surpoids, et répond d'abord aux comprimés avant que la production d'insuline ne chute en quelques mois ou années.", "symptomes": "Soif, fatigue, perte de poids, diabète qui se déséquilibre malgré un régime et des comprimés.", "diagnostic": "Glycémie, HbA1c, anticorps anti-GAD, peptide C. Un diabète « de type 2 » mince ou qui se dégrade vite doit faire chercher des anticorps.", "pec": "Insuline, souvent précoce, et suivi diabétologique. Éviter les sulfamides hypoglycémiants qui épuisent les cellules restantes.", "traitements": [{"label": "Insuline", "marques": ["Lantus", "Toujeo", "NovoRapid"]}, {"label": "Metformine (au début)", "marques": ["Glucophage"]}], "operations": [], "naturo": "Traiter comme un diabète insulino-traité (RÈGLE N°60) : aucune plante hypoglycémiante, pas de régime low-carb strict ni de jeûne, ne jamais toucher au traitement. Éducation à l'alimentation et à l'activité, soutien du terrain auto-immun.", "alertes": ["Soif intense, vomissements, haleine acétonique, respiration rapide : acidocétose, urgence", "Hypoglycémie avec malaise : sucre rapide puis avis"], "aNePasFaire": ["Appliquer un jeûne ou un régime low-carb strict", "Associer berbérine ou cannelle à l'insuline", "Arrêter un traitement"], "questions": ["Avez-vous un diabète de type 2 qui s'aggrave ?", "Des anticorps ont-ils été dosés ?", "Prenez-vous de l'insuline ?"], "outils": "Générateur : RÈGLE N°60.", "voirAussi": ["Diabète de type 1", "Diabète de type 2 / résistance à l'insuline"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Purpura thrombopénique immunologique", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["PTI", "plaquettes basses", "thrombopénie auto-immune", "bleus spontanés"], "enBref": "Maladie auto-immune où les anticorps détruisent les plaquettes, ce qui expose à des saignements et à des bleus spontanés.", "physiologie": "Des auto-anticorps se fixent aux plaquettes qui sont éliminées par la rate. La production dans la moelle est aussi freinée. Le taux de plaquettes bas (inférieur à 100 G/L, souvent à 30 G/L) augmente le risque de saignements. Elle suit parfois une infection ou accompagne un lupus ou une infection par H. pylori.", "symptomes": "Bleus spontanés, saignements de nez ou de gencives, règles abondantes, petites taches rouges sur la peau (pétéchies).", "diagnostic": "NFS, frottis, élimination des autres causes de thrombopénie. Avis hématologue.", "pec": "Surveillance si plaquettes correctes, corticoïdes, immunoglobulines, agonistes du récepteur de la thrombopoïétine, rituximab, splénectomie dans certains cas.", "traitements": [{"label": "Corticoïdes", "marques": ["Solupred"]}, {"label": "Immunoglobulines", "marques": ["Tégéline"]}, {"label": "Agonistes de la TPO", "marques": ["Revolade (eltrombopag)", "Nplate"]}], "operations": [], "naturo": "Éviter tout produit qui altère les plaquettes : anti-inflammatoires (aspirine, ibuprofène), oméga-3 à forte dose, ginkgo, ail, curcuma, vitamine E, gingembre à forte dose. Éviter les sports à risque de choc. Aucun immunostimulant (échinacée, propolis, champignons) sans avis du spécialiste.", "alertes": ["Saignements importants, sang dans les selles ou les urines, maux de tête intenses : urgence", "Chute avec choc à la tête : urgence"], "aNePasFaire": ["Proposer des compléments fluidifiants", "Conseiller de l'aspirine ou des anti-inflammatoires"], "questions": ["Quel est votre taux de plaquettes récent ?", "Prenez-vous des anti-inflammatoires ou des compléments ?", "Saignez-vous facilement ?"], "outils": "Voir fiche Lupus, Helicobacter pylori.", "voirAussi": ["Lupus érythémateux disséminé", "Helicobacter pylori"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Uvéite", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["uvéite antérieure", "œil rouge douloureux", "inflammation de l'œil", "iritis"], "enBref": "Inflammation de l'uvée, la couche intermédiaire de l'œil. Elle provoque rougeur, douleur et baisse de la vue, et peut être le premier signe d'une maladie générale.", "physiologie": "L'uvée est très vascularisée : une inflammation y est rapidement agressive pour la rétine et le nerf optique. L'uvéite peut accompagner la spondylarthrite (HLA-B27), les MICI, la sarcoïdose, le psoriasis ou une infection. Sans traitement, elle peut entraîner des cicatrices et une perte de vision.", "symptomes": "Œil rouge, douleur, sensibilité à la lumière, vision floue, corps flottants.", "diagnostic": "Examen à la lampe à fente par un ophtalmologue en urgence, bilan général (HLA-B27, sarcoïdose, infections).", "pec": "Collyres corticoïdes et dilatateurs de pupille, corticoïdes locaux ou généraux, immunosuppresseurs ou biothérapies dans les formes récidivantes.", "traitements": [{"label": "Collyres corticoïdes", "marques": ["Maxidrol", "Pred Forte"]}, {"label": "Biothérapies (cas sélectionnés)", "marques": ["Humira (adalimumab)"]}], "operations": [], "naturo": "Aucune démarche naturopathique ne remplace l'examen ophtalmologique. Rechercher la maladie générale sous-jacente, soutenir le terrain inflammatoire. Avertir de ne pas appliquer de produit naturel dans l'œil.", "alertes": ["Œil rouge douloureux avec baisse de vision : ophtalmologue en urgence le jour même"], "aNePasFaire": ["Appliquer des huiles essentielles ou des compresses de plantes sur l'œil", "Attendre"], "questions": ["Depuis quand l'œil est-il rouge ?", "La vision est-elle diminuée ?", "Avez-vous une spondylarthrite, une MICI ?"], "outils": "Voir fiche Spondylarthrite ankylosante.", "voirAussi": ["Spondylarthrite ankylosante", "MICI (Crohn / RCH)", "Psoriasis"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Thyroïdite du post-partum", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["thyroïde après accouchement", "hyperthyroïdie transitoire post-partum", "TSH post-partum"], "enBref": "Inflammation auto-immune transitoire de la thyroïde dans l'année qui suit l'accouchement, touchant environ 5 à 10 % des femmes, davantage en présence d'anticorps anti-TPO.", "physiologie": "Après la grossesse, l'immunité, qui avait été modulée, se réactive. La thyroïde libère d'abord ses réserves d'hormones (phase d'hyperthyroïdie, 1 à 4 mois), puis s'épuise (phase d'hypothyroïdie, 4 à 8 mois). La plupart des femmes récupèrent, mais une partie devient hypothyroïdienne à long terme.", "symptomes": "Palpitations, nervosité, insomnie, perte de poids (phase 1), puis fatigue, frilosité, constipation, moral bas (phase 2), souvent attribués à la maternité.", "diagnostic": "TSH et T4 libre, anticorps anti-TPO, échographie si besoin.", "pec": "Surveillance en phase d'hyperthyroïdie, lévothyroxine si hypothyroïdie symptomatique, contrôle de la TSH à 12 mois.", "traitements": [{"label": "Lévothyroxine", "marques": ["Levothyrox"]}, {"label": "Bêta-bloquant (phase 1, symptômes)", "marques": ["Avlocardyl"]}], "operations": [], "naturo": "Penser à doser la TSH devant toute fatigue, anxiété ou moral bas du post-partum, avant d'évoquer le burn-out ou la dépression. Pas d'iode. Sélénium selon avis. Accompagner l'épuisement maternel.", "alertes": ["Palpitations importantes, fièvre, douleur du cou : avis médical", "Pensées de se faire du mal ou de nuire au bébé : urgence"], "aNePasFaire": ["Mettre sur le compte du « baby blues » une fatigue qui dure", "Proposer de l'iode ou du kelp"], "questions": ["Quand avez-vous accouché ?", "Une TSH a-t-elle été dosée depuis ?", "Allaitez-vous ?"], "outils": "Générateur : RÈGLES N°11, N°61, N°63.", "voirAussi": ["Post-partum", "Hypothyroïdie et Hashimoto", "Basedow / hyperthyroïdie"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Dysautonomie et POTS (tachycardie posturale)", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["POTS", "PoTS", "tachycardie à l'orthostatisme", "malaise en position debout", "dysautonomie"], "enBref": "Dérèglement du système nerveux autonome : le cœur s'accélère trop quand on se lève, avec vertiges, fatigue et brouillard mental. Elle touche surtout les femmes jeunes et peut suivre une infection virale (dont la COVID longue).", "physiologie": "En position debout, le sang descend vers les jambes. Normalement, les vaisseaux se resserrent et le cœur ajuste son rythme. Dans le POTS, la compensation est insuffisante : le cœur accélère de 30 battements par minute ou plus dans les 10 minutes sans baisse de tension. Le volume sanguin, le tonus des vaisseaux, la neuropathie des petites fibres et l'hypermobilité y participent.", "symptomes": "Palpitations en se levant, vertiges, presque-malaises, fatigue majeure, brouillard mental, intolérance à la chaleur, nausées, mains froides.", "diagnostic": "Test de position debout active (10 minutes) ou table basculante, ECG, bilan (anémie, thyroïde, glycémie). Avis cardiologue ou spécialiste de la dysautonomie.", "pec": "Hydratation importante, apport de sel sur avis médical, bas de contention, réentraînement progressif en position allongée ou assise, médicaments (ivabradine, midodrine, bêta-bloquants à faible dose).", "traitements": [{"label": "Ivabradine", "marques": ["Procoralan"]}, {"label": "Midodrine", "marques": ["Gutron"]}, {"label": "Bêta-bloquant à faible dose", "marques": ["Avlocardyl"]}], "operations": [], "naturo": "Expliquer le mécanisme avec des mots simples. Hydratation, repas plus petits, éviter la station debout prolongée et la chaleur. Le sel et les électrolytes ne se prescrivent qu'avec le médecin (hypertension, reins). Penser à l'hypermobilité et à l'activation mastocytaire. Pas de stimulants (caféine à doses fortes).", "alertes": ["Perte de connaissance, douleur thoracique, essoufflement : avis médical rapide", "Fatigue invalidante : orienter, ne pas banaliser"], "aNePasFaire": ["Prescrire du sel en quantité sans avis", "Dire que « c'est de l'anxiété »", "Pousser à l'effort intense debout"], "questions": ["Que se passe-t-il quand vous vous levez ?", "Le début a-t-il suivi une infection ?", "Avez-vous des articulations très souples ?"], "outils": "Voir fiches SFC, Ehlers-Danlos, MCAS.", "voirAussi": ["Syndrome de fatigue chronique (encéphalomyélite myalgique)", "Syndrome d'Ehlers-Danlos hypermobile et spectre de l'hypermobilité", "Syndrome d'activation mastocytaire (SAMA)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome d'activation mastocytaire (SAMA)", "type": "maladie", "categorie": "Terrain et axes fonctionnels", "alias": ["MCAS", "mastocytes", "sensibilité multiple", "réactions chroniques", "tryptase"], "enBref": "Réactions répétées de plusieurs organes (peau, digestif, cœur, voies respiratoires) liées à une libération excessive de médiateurs par les mastocytes, en dehors de toute allergie classique. Le diagnostic reste débattu et demande des critères stricts.", "physiologie": "Les mastocytes libèrent histamine, tryptase, prostaglandines. Leur sensibilité excessive provoque des bouffées de chaleur, de l'urticaire, des crampes, de la diarrhée, des chutes de tension. Les critères publiés exigent des symptômes de plusieurs organes, une élévation de la tryptase pendant la crise et une réponse aux traitements qui bloquent les médiateurs. La mastocytose est une maladie distincte, à rechercher.", "symptomes": "Rougeurs, urticaire, démangeaisons, douleurs abdominales, diarrhée, palpitations, malaises, brouillard mental, réactions à des aliments, odeurs, chaleur, stress.", "diagnostic": "Dosage de la tryptase de base et pendant

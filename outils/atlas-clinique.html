du transit.", "physiologie": "Trois « climats » favorisent le SIBO (RÈGLE N°24) : chimique (peu d'acide gastrique, de bile ou d'enzymes pancréatiques), nutritionnel (mauvaise mastication, grignotage, absence de jeûne nocturne) et mécanique (le complexe moteur migrant, la « vague de nettoyage » de l'intestin grêle entre les repas, est ralenti par le stress, l'hypothyroïdie, le diabète, certaines chirurgies ou des médicaments comme les IPP). Les gaz produits ralentissent encore le transit : le méthane favorise la constipation, l'hydrogène la diarrhée.", "symptomes": "Ballonnements rapides après le repas, douleurs, gaz, reflux, transit variable, fatigue, intolérances alimentaires multiples, carences (B12, fer), peau réactive.", "diagnostic": "Test respiratoire au lactulose ou au glucose (hydrogène et méthane) prescrit par un médecin. Les symptômes seuls ne suffisent pas : éliminer d'abord maladie cœliaque, MICI et autres causes.", "pec": "Antibiotiques peu absorbés (rifaximine, parfois associée à un autre antibiotique pour le SIBO à méthane) ou, en seconde intention, antimicrobiens à base de plantes ; correction des causes ; réintroduction progressive des aliments ; prévention des récidives.", "traitements": [{"label": "Rifaximine (antibiotique non absorbé), ± associé pour le SIBO à méthane", "marques": []}, {"label": "Prokinétiques pour relancer la motricité, selon prescription", "marques": []}], "naturo": "Traiter les trois climats, jamais « un protocole anti-SIBO » isolé (RÈGLE N°24) : protocole FODMAP d'un mois au maximum puis réintroduction catégorie par catégorie, mastication, jeûne nocturne, espacement des repas, activation du complexe moteur migrant (gingembre, safran, stress). Aucun prébiotique tant que le SIBO est suspecté ; pas de complexe de cicatrisation contenant des probiotiques. ⚠️ Vérifier avant toute éviction qu'aucun TCA n'est présent (RÈGLE N°59).", "alertes": ["Sang dans les selles, selles noires, perte de poids inexpliquée, anémie, fièvre, difficulté à avaler : avis médical avant toute chose", "Début récent après 50 ans, antécédents familiaux de cancer du côlon ou de maladie cœliaque"], "aNePasFaire": ["Proposer FODMAP sans vérifier le rapport à l'alimentation (risque de TCA, orthorexie)", "Prolonger l'éviction FODMAP au-delà d'un mois ou la présenter comme un régime", "Recommander des prébiotiques ou un complexe de cicatrisation avec probiotiques en SIBO"], "questions": ["Un test respiratoire a-t-il été fait ? Avec quel résultat ?", "Prenez-vous un IPP depuis longtemps ?", "Avez-vous déjà fait un régime d'éviction ? Comment l'avez-vous vécu ?"], "outils": "Générateur : RÈGLES N°5bis, N°22, N°23, N°24, N°25 ; garde-fou TCA N°59 prioritaire. Questionnaires : module SIBO dans la section digestive.", "voirAussi": ["SII (syndrome de l'intestin irritable)", "Orthorexie", "Maladie cœliaque"], "sources": [{"t": "Recommandations de la société française de gastro-entérologie et de la littérature internationale sur le SIBO (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "SII (syndrome de l'intestin irritable)", "type": "maladie", "categorie": "Digestif", "alias": ["SII", "côlon irritable", "intestin irritable", "colopathie fonctionnelle", "IBS", "Rome IV"], "enBref": "Trouble fonctionnel de l'intestin : douleurs abdominales récurrentes liées à la défécation, avec un transit modifié (constipation, diarrhée, ou alternance), sans lésion visible. Il altère la qualité de vie mais n'augmente pas le risque de cancer.", "physiologie": "L'axe intestin-cerveau est dérégulé : l'intestin est hypersensible (une distension normale devient douloureuse), sa motricité est modifiée et le microbiote est souvent perturbé. Une gastro-entérite, un stress prolongé ou des antibiotiques peuvent le déclencher. Le stress augmente la sensibilité de l'intestin, qui perturbe en retour l'humeur et le sommeil.", "symptomes": "Douleurs abdominales soulagées ou aggravées par les selles, ballonnements, gaz, constipation, diarrhée ou alternance, sensation d'évacuation incomplète, fatigue, anxiété.", "diagnostic": "Critères de Rome IV : douleur abdominale au moins un jour par semaine depuis 3 mois, avec au moins 2 des critères suivants : liée à la défécation, changement de fréquence des selles, changement de forme des selles. Diagnostic d'élimination par le médecin (cœliaque, MICI, etc.).", "pec": "Explication du mécanisme, hygiène de vie, antispasmodiques, régulateurs du transit, régime pauvre en FODMAP encadré par un diététicien, gestion du stress (hypnose, thérapies cognitivo-comportementales).", "traitements": [{"label": "Antispasmodiques", "marques": ["Spasfon (phloroglucinol)", "Météospasmyl", "Duspatalin (mébévérine)"]}, {"label": "Régulateurs du transit (constipation)", "marques": ["Forlax (macrogol)"]}, {"label": "Ralentisseur du transit (diarrhée)", "marques": ["Imodium (lopéramide)"]}], "naturo": "Écouter le stress et le sommeil autant que l'assiette. FODMAP limité dans le temps et uniquement après avoir écarté un TCA ou une orthorexie (RÈGLE N°59). Régularité des repas, mastication, activité physique douce, cohérence cardiaque. Aucune éviction durable.", "alertes": ["Sang dans les selles, perte de poids, anémie, fièvre, diarrhée nocturne, début après 50 ans, antécédents familiaux de cancer colorectal ou de maladie cœliaque : avis médical, ce n'est plus un SII présumé"], "aNePasFaire": ["Poser le diagnostic", "Enchaîner les évictions ou prolonger le FODMAP", "Ignorer l'anxiété et le sommeil"], "questions": ["Les douleurs sont-elles liées aux selles ?", "Y a-t-il du sang, un amaigrissement, des réveils la nuit pour aller à la selle ?", "Quel est le lien avec le stress ?"], "outils": "Générateur : RÈGLES N°21 à 25, N°50 ; garde-fou TCA N°59. Questionnaires : module SII.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)", "MICI (Crohn / RCH)", "Orthorexie"], "sources": [{"t": "Critères de Rome IV (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "SOPK (syndrome des ovaires polykystiques)", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["SOPK", "ovaires polykystiques", "hyperandrogénie", "anovulation", "insulinorésistance", "acné", "hirsutisme"], "enBref": "Trouble hormonal fréquent chez la femme en âge de procréer, marqué par des cycles irréguliers ou absents (peu ou pas d'ovulation), un excès d'hormones androgènes et/ou des ovaires d'aspect polykystique. C'est un ensemble hétérogène, pas une maladie unique.", "physiologie": "L'insulinorésistance et l'hyperinsulinisme stimulent la production d'androgènes par les ovaires et abaissent la SHBG, qui lie la testostérone : l'excès d'androgènes libres donne acné, pilosité, chute de cheveux. L'axe hypothalamo-hypophysaire est perturbé (LH élevée), l'ovulation ne se fait pas, d'où cycles longs. L'inflammation de bas grade, le stress, la perturbation du sommeil et le microbiote entretiennent le cycle. Il faut chercher la ou les causes réelles chez chaque femme (RÈGLE N°14).", "symptomes": "Cycles longs ou absents, acné, excès de poils, chute de cheveux, prise de poids abdominale, fatigue après les repas, difficultés à concevoir, humeur basse.", "diagnostic": "Critères de Rotterdam : au moins 2 sur 3 (troubles de l'ovulation, hyperandrogénie clinique ou biologique, ovaires polykystiques à l'échographie ; le taux d'AMH peut remplacer l'échographie selon les recommandations internationales récentes), après exclusion d'autres causes (thyroïde, prolactine, hyperplasie des surrénales).", "pec": "Hygiène de vie en premier (activité, alimentation, sommeil), contraception hormonale pour régulariser les cycles, metformine en cas d'insulinorésistance (hors AMM), anti-androgènes, induction de l'ovulation en cas de désir de grossesse.", "traitements": [{"label": "Contraception œstroprogestative (régularise les cycles, atténue l'acné)", "marques": []}, {"label": "Metformine (insulinorésistance, usage hors AMM)", "marques": ["Glucophage (metformine)"]}, {"label": "Anti-androgène", "marques": ["Spironolactone (Aldactone)"]}, {"label": "Induction de l'ovulation (désir de grossesse)", "marques": ["Clomifène", "Létrozole"]}], "naturo": "Chercher les causes réelles (insulinorésistance, surrénales, inflammation, thyroïde) plutôt que de traiter « le SOPK » (RÈGLES N°14, 29 et 55). Les femmes avec un SOPK ont un risque plus élevé de TCA, en particulier d'hyperphagie boulimique : vérifier le rapport à l'alimentation avant toute proposition alimentaire (RÈGLE N°59). Pas de régime ni de jeûne. Sous metformine ou antidiabétique, pas de berbérine (RÈGLE N°60).", "alertes": ["Absence de règles depuis plus de 3 mois, pilosité d'apparition brutale ou voix qui se modifie : avis médical (tumeur sécrétante possible)", "Prise de poids rapide, soif intense : bilan glycémique"], "aNePasFaire": ["Promettre une guérison", "Proposer régime ou jeûne sans avoir vérifié le rapport à l'alimentation", "Associer berbérine et metformine"], "questions": ["Depuis quand vos cycles sont-ils irréguliers ?", "Prenez-vous la pilule ? Depuis combien de temps ?", "Avez-vous déjà eu un bilan d'insuline ?"], "outils": "Générateur : RÈGLES N°14, N°17, N°29, N°55 ; garde-fous N°59 et N°60. Questionnaires : module SOPK.", "voirAussi": ["Hyperphagie boulimique", "Diabète de type 2 / résistance à l'insuline"], "sources": [{"t": "Recommandations internationales sur le SOPK, 2023 (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Endométriose", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["endométriose", "endométriome", "adénomyose", "douleurs de règles", "douleurs pelviennes", "infertilité"], "enBref": "Du tissu semblable à la muqueuse de l'utérus se développe en dehors de l'utérus (ovaires, péritoine, intestin, vessie...). Il réagit aux hormones à chaque cycle, ce qui provoque inflammation, douleurs et adhérences. Le diagnostic prend en moyenne plusieurs années.", "physiologie": "Les œstrogènes nourrissent ces lésions, qui saignent à chaque cycle sans pouvoir s'évacuer. Le corps réagit par une inflammation locale (prostaglandines), des douleurs, de la fibrose et des adhérences. Un cercle vicieux s'installe : plus d'inflammation, plus d'œstrogènes locaux (l'aromatase est activée dans les lésions), plus de douleur. Le système nerveux s'hypersensibilise avec le temps. Le foie et l'intestin interviennent dans l'élimination des œstrogènes (RÈGLE N°15).", "symptomes": "Règles très douloureuses, douleurs pelviennes chroniques, douleurs pendant les rapports, douleurs en allant à la selle ou en urinant, ballonnements cycliques, fatigue importante, difficultés à concevoir.", "diagnostic": "Interrogatoire, examen gynécologique, échographie pelvienne et IRM pelvienne réalisées par des équipes entraînées ; la cœlioscopie n'est plus systématique.", "pec": "Antalgiques et anti-inflammatoires, traitement hormonal en continu pour mettre les lésions au repos (pilule ou progestatif, dispositif intra-utérin, analogues ou antagonistes du GnRH), chirurgie dans certaines formes (kystes, atteintes profondes), prise en charge de la douleur chronique et de la fertilité.", "traitements": [{"label": "Progestatif en continu", "marques": ["Visanne (diénogest)"]}, {"label": "Antagoniste oral du GnRH avec add-back", "marques": ["Ryeqo", "Yselty"]}, {"label": "Dispositif intra-utérin hormonal, pilule en continu", "marques": []}, {"label": "Antalgiques et anti-inflammatoires", "marques": []}], "naturo": "Cibler le cercle vicieux inflammation / œstrogènes (RÈGLE N°15) : alimentation anti-inflammatoire sans restriction, soutien du foie et de l'élimination, transit, magnésium, oméga-3, gestion de la douleur et du stress. Sous Ryeqo ou Yselty : jamais de gattilier, de phytoestrogènes ni de DHEA (RÈGLE N°53). Ne jamais suggérer de modifier le traitement.", "alertes": ["Douleur brutale et intense, fièvre, malaise : avis médical urgent (torsion, rupture de kyste)", "Saignements rectaux ou dans les urines pendant les règles, occlusion : avis médical rapide"], "aNePasFaire": ["Annoncer une guérison", "Proposer des phytoestrogènes ou du gattilier sous antagoniste du GnRH", "Banaliser des douleurs invalidantes (« c'est normal pendant les règles »)"], "questions": ["Les douleurs vous empêchent-elles de travailler ou d'avoir une vie normale pendant vos règles ?", "Une IRM ou une échographie spécialisée a-t-elle été réalisée ?", "Quel traitement hormonal prenez-vous ?"], "outils": "Générateur : RÈGLES N°15, N°18, N°53. Questionnaires : module endométriose.", "voirAussi": ["Cœlioscopie — exérèse de lésions d'endométriose", "Fibrome utérin"], "sources": [{"t": "HAS / CNGOF — Prise en charge de l'endométriose (2017) (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cancer — principes d'accompagnement", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["cancer", "chimiothérapie", "radiothérapie", "tumeur", "oncologie", "soins de support", "hormonothérapie"], "enBref": "Fiche générale pour accompagner une cliente atteinte d'un cancer. Le traitement et le suivi sont décidés par l'équipe d'oncologie en réunion de concertation pluridisciplinaire ; la naturopathe n'intervient qu'en soutien, après accord de l'équipe pour tout complément.", "physiologie": "Les cellules cancéreuses échappent aux mécanismes de contrôle de la division, de la mort programmée et de la réparation de l'ADN. Les traitements ciblent les cellules qui se divisent vite : c'est pourquoi la chimiothérapie touche aussi les muqueuses digestives, les cheveux et la moelle (défenses, globules rouges, plaquettes), avec nausées, fatigue, perte d'appétit, aphtes, infections. Beaucoup de plantes et d'antioxydants modifient l'élimination des médicaments (enzymes du foie, transporteurs) ou leur efficacité.", "symptomes": "Selon le cancer et le traitement : fatigue, nausées, perte d'appétit et de poids, altération du goût, bouche douloureuse, neuropathie, troubles du sommeil, anxiété, bouffées de chaleur (hormonothérapie).", "diagnostic": "Imagerie, biopsie et analyses spécialisées. Tout est géré par l'équipe médicale.", "pec": "Chirurgie, chimiothérapie, radiothérapie, hormonothérapie, immunothérapie, thérapies ciblées, selon le cancer. Les soins de support (diététicien, onco-psychologue, activité physique adaptée, socio-esthéticienne) font partie de la prise en charge.", "traitements": [{"label": "Chirurgie, chimiothérapie, radiothérapie, immunothérapie, thérapies ciblées", "marques": []}, {"label": "Hormonothérapie (cancer du sein ou de la prostate hormono-dépendants)", "marques": ["Tamoxifène", "Arimidex (anastrozole)", "Femara (létrozole)", "Aromasine (exémestane)"]}, {"label": "Soins de support de l'hôpital ou du centre", "marques": []}], "naturo": "Soutien du terrain, jamais « contre le cancer » (RÈGLE N°62). Par défaut, aucun complément ni plante sans accord de l'oncologue. Priorité à l'alimentation maintenue (risque de dénutrition), adaptée aux symptômes, sans restriction ni jeûne. Axes possibles : sommeil, stress, activité physique adaptée, nausées, fatigue. Ne jamais lire le stress oxydatif comme une priorité pendant un traitement (RÈGLE N°41 point 12).", "alertes": ["Fièvre à 38 °C ou plus pendant une chimiothérapie : appeler l'équipe de soins sans attendre (risque d'infection grave)", "Saignements, vomissements empêchant de boire, essoufflement, douleur thoracique : appeler l'équipe ou le 15", "Perte d'appétit et de poids importante : alerter l'équipe et le diététicien"], "aNePasFaire": ["Promettre une action sur la tumeur", "Encourager à retarder, alléger ou arrêter un traitement", "Proposer jeûne, régime cétogène ou restriction", "Proposer millepertuis, pamplemousse, antioxydants à forte dose, curcuma concentré, thé vert concentré, immunostimulants, huiles essentielles par voie interne ou détox hépatique"], "questions": ["Quel est votre traitement actuel et qui vous suit ?", "Votre équipe est-elle d'accord pour que vous preniez des compléments ?", "Que mangez-vous en ce moment ? Avez-vous perdu du poids ?"], "outils": "Générateur : RÈGLES N°6, N°8, N°37, N°41, N°48 et N°62. Questionnaires : champ « cancer » dans les antécédents de sécurité, chip de traitement anticancéreux en cours.", "voirAussi": ["Cancer du sein hormono-dépendant"], "sources": [{"t": "Recommandations des sociétés savantes d'oncologie intégrative (SIO) et de l'Institut national du cancer (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cancer du sein hormono-dépendant", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["cancer du sein", "hormonodépendant", "tamoxifène", "inhibiteur de l'aromatase", "phytoestrogènes", "bouffées de chaleur"], "enBref": "Environ 7 cancers du sein sur 10 portent des récepteurs aux œstrogènes ou à la progestérone : ils sont stimulés par ces hormones. Le traitement associe chirurgie, radiothérapie, parfois chimiothérapie et une hormonothérapie de plusieurs années.", "physiologie": "Les œstrogènes se fixent sur les récepteurs des cellules tumorales et stimulent leur multiplication. L'hormonothérapie bloque ces récepteurs (tamoxifène) ou supprime la production d'œstrogènes (inhibiteurs de l'aromatase). Ces traitements provoquent une carence œstrogénique : bouffées de chaleur, sécheresse, douleurs articulaires, fragilisation de l'os.", "symptomes": "Bouffées de chaleur, sécheresse vaginale, douleurs articulaires, fatigue, troubles du sommeil, humeur basse, perte de densité osseuse sous inhibiteurs de l'aromatase.", "diagnostic": "Mammographie, échographie, biopsie avec étude des récepteurs hormonaux, par l'équipe d'oncologie.", "pec": "Chirurgie, radiothérapie, chimiothérapie si besoin, hormonothérapie pendant 5 à 10 ans, surveillance régulière, soins de support.", "traitements": [{"label": "Anti-œstrogène (femme non ménopausée)", "marques": ["Tamoxifène"]}, {"label": "Inhibiteurs de l'aromatase (femme ménopausée)", "marques": ["Arimidex (anastrozole)", "Femara (létrozole)", "Aromasine (exémestane)"]}], "naturo": "Sécurité hormonale absolue (RÈGLE N°6) : jamais de phytoestrogènes (soja, houblon, sauge, trèfle rouge), de DHEA, de gattilier ni d'huiles essentielles à action œstrogénique. Pour les bouffées de chaleur, seule l'actée à grappes noires est documentée comme option (RÈGLE N°6) et uniquement après accord de l'oncologue. Millepertuis interdit (interaction avec le tamoxifène). Soutenir l'os (activité physique, vitamine D validée par le médecin), le sommeil et le stress.", "alertes": ["Nouvelle boule au sein, écoulement, changement de la peau : avis médical rapide", "Douleur osseuse persistante, saignements vaginaux anormaux sous tamoxifène : avis médical"], "aNePasFaire": ["Proposer un phytoestrogène, du gattilier, de la DHEA ou du millepertuis", "Suggérer d'arrêter l'hormonothérapie en raison des effets gênants", "Annoncer qu'un régime « anti-œstrogènes » protège de la récidive"], "questions": ["Quel traitement hormonal prenez-vous et depuis quand ?", "Qui vous suit en oncologie ? Est-il au courant des compléments que vous prenez ?", "Quels effets du traitement vous gênent le plus ?"], "outils": "Générateur : RÈGLE N°6 (cancer hormono-dépendant) et RÈGLE N°62. Questionnaires : champ de sécurité « cancer hormono-dépendant ».", "voirAussi": ["Cancer — principes d'accompagnement"], "sources": [{"t": "Institut national du cancer — Cancer du sein, traitements (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Grossesse et allaitement", "type": "maladie", "categorie": "Fertilité, grossesse et post-partum", "alias": ["grossesse", "enceinte", "allaitement", "désir de grossesse", "folates", "nausées de grossesse", "listériose", "toxoplasmose"], "enBref": "Fiche de sécurité pour accompagner une femme enceinte, qui allaite ou qui souhaite concevoir. Le suivi médical (sage-femme, gynécologue) est obligatoire ; la naturopathe n'intervient qu'avec son accord pour tout complément.", "physiologie": "Les besoins augmentent (fer, folates, iode, vitamine D, oméga-3, protéines). La progestérone ralentit le transit (constipation, reflux) et détend les vaisseaux (vertiges, jambes lourdes) ; l'hormone hCG explique les nausées du premier trimestre. Le système immunitaire est modulé, ce qui augmente la sensibilité à certaines infections alimentaires (listériose, toxoplasmose). Beaucoup de plantes et d'huiles essentielles passent la barrière placentaire ou dans le lait.", "symptomes": "Nausées, fatigue, constipation, reflux, crampes, jambes lourdes, insomnie, douleurs de dos, carences (fer).", "diagnostic": "Suivi médical : 7 consultations prénatales, échographies, bilans sanguins, dépistage du diabète gestationnel, selon les recommandations.", "pec": "Suivi obstétrical régulier. Supplémentation prescrite : acide folique avant la conception et jusqu'à 12 semaines, vitamine D, fer ou iode selon les bilans.", "traitements": [{"label": "Acide folique avant et en début de grossesse", "marques": []}, {"label": "Vitamine D, fer, iode selon le bilan et la prescription", "marques": []}], "naturo": "Aucune restriction ni cure (FODMAP, jeûne, détox, régime) : RÈGLE N°63. Tout complément et toute plante sont validés par la sage-femme ou le gynécologue. Aucun rétinol en complément, aucune plante emménagogue ou abortive, aucune huile essentielle par voie interne (RÈGLE N°6). Sécurité alimentaire pendant la grossesse : pas de lait ni fromages au lait cru, charcuterie crue, poisson, coquillage, viande ou œuf cru ; légumes bien lavés. Allaitement : vérifier chaque plante (par exemple sauge et menthe poivrée en excès peuvent réduire la lactation).", "alertes": ["Saignements, douleurs abdominales intenses, perte de liquide, diminution des mouvements du bébé, fièvre, maux de tête violents avec troubles de la vue : contacter la maternité ou le 15", "Vomissements qui empêchent de boire ou de manger : avis médical rapide"], "aNePasFaire": ["Proposer un régime, un jeûne, une détox ou une perte de poids", "Doubler ou remplacer les folates et la vitamine D prescrits", "Proposer rétinol, plantes emménagogues ou huiles essentielles par voie interne", "Négliger la sécurité alimentaire (listériose, toxoplasmose)"], "questions": ["Où en êtes-vous de la grossesse et qui vous suit ?", "Quels compléments vous ont déjà été prescrits ?", "Allaitez-vous ou souhaitez-vous le faire ?"], "outils": "Générateur : RÈGLE N°6 (aucune huile essentielle par voie interne) et RÈGLE N°63 (aucune restriction, sécurité alimentaire). Questionnaires : champ de sécurité « grossesse / allaitement / désir de grossesse ».", "voirAussi": ["Césarienne"], "sources": [{"t": "HAS — Suivi et accompagnement de la grossesse physiologique ; Santé publique France — alimentation pendant la grossesse (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome métabolique", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["résistance à l'insuline", "obésité abdominale", "prédiabète"], "enBref": "Association de plusieurs anomalies (tour de taille élevé, tension, glycémie, triglycérides élevés, HDL bas) qui multiplie le risque de diabète de type 2 et de maladie cardiovasculaire.", "physiologie": "L'excès de graisse viscérale libère des acides gras et des messagers inflammatoires qui rendent les cellules moins sensibles à l'insuline. Le pancréas en produit davantage (hyperinsulinisme), ce qui favorise le stockage abdominal, la montée des triglycérides, de la tension et la baisse du HDL. Le foie se charge de graisse. Le cercle se renforce tant que l'insuline reste haute.", "symptomes": "Tour de taille augmenté, fatigue après les repas, envies de sucre, somnolence digestive, tension élevée, taches foncées aux plis (acanthosis), cycles irréguliers chez la femme.", "diagnostic": "Diagnostic médical : au moins 3 critères parmi tour de taille élevé, triglycérides élevés, HDL bas, tension élevée, glycémie à jeun élevée (définition IDF / harmonisée). Glycémie, bilan lipidique, tension, parfois HbA1c.", "pec": "Mesures de mode de vie en premier. Selon les cas : antihypertenseurs, statines, metformine. Suivi médical régulier.", "traitements": [{"label": "Metformine", "marques": ["Glucophage", "Stagid"]}, {"label": "Statines", "marques": ["Crestor", "Tahor", "Zocor"]}, {"label": "Antihypertenseurs", "marques": ["Triatec", "Coversyl", "Cozaar"]}], "operations": [], "naturo": "Expliquer le rôle de l'insuline, du muscle et du sommeil. Priorité : alimentation riche en fibres, protéines à chaque repas, activité physique (la masse musculaire est le premier consommateur de glucose), sommeil et stress. Ne jamais toucher au traitement. Si hypoglycémiants naturels envisagés : prévenir le médecin, risque de cumul avec metformine (RÈGLE N°60).", "alertes": ["Douleur thoracique, essoufflement, déficit neurologique : urgence", "Soif intense, urines abondantes, perte de poids : glycémie en urgence"], "aNePasFaire": ["Promettre une perte de poids", "Proposer un jeûne ou un régime très restrictif sans accord médical", "Cumuler plantes hypoglycémiantes et metformine sans avis"], "questions": ["Qui, dans votre famille, a un diabète ou un infarctus ?", "Quand ont été mesurées votre tension et votre glycémie ?", "Combien de temps dormez-vous ?"], "outils": "Générateur : RÈGLES N°55 (HOMA), N°60 (diabète traité). Voir la fiche Diabète de type 2.", "voirAussi": ["Diabète de type 2 / résistance à l'insuline", "Stéatose hépatique métabolique (foie gras)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Stéatose hépatique métabolique (foie gras)", "type": "maladie", "categorie": "Digestif", "alias": ["NAFLD", "MASLD", "foie gras", "NASH", "MASH"], "enBref": "Accumulation de graisse dans le foie en dehors de toute consommation excessive d'alcool, très liée à l'insulinorésistance. Le plus souvent silencieuse.", "physiologie": "Quand l'insuline est chroniquement haute, le foie fabrique et stocke plus de graisses à partir du sucre (lipogenèse) et reçoit plus d'acides gras du tissu adipeux. Dans une partie des cas, la graisse devient inflammatoire (stéatohépatite) et peut mener à la fibrose. Le foie gras est une composante du syndrome métabolique.", "symptomes": "Souvent aucun : fatigue, gêne sous les côtes à droite, transaminases légèrement élevées, tour de taille augmenté.", "diagnostic": "Échographie hépatique, transaminases (ALAT, ASAT, GGT), score de fibrose (FIB-4, élastométrie / Fibroscan). Décision médicale.", "pec": "Perte de poids progressive si surpoids, activité physique, contrôle de la glycémie et des lipides. Suivi hépatologique si fibrose.", "traitements": [{"label": "Pas de médicament spécifique de première ligne", "marques": []}, {"label": "Traitement des facteurs associés (diabète, lipides)", "marques": ["Metformine", "Statines"]}], "operations": [], "naturo": "Appuyer les mesures de mode de vie : fibres, protéines, activité physique, alcool réduit au minimum, sommeil. Éviter les compléments à forte dose sans bilan hépatique (certaines plantes sont hépatotoxiques : kava, grande chélidoine, cascara en excès). Pas de « détox » (RÈGLE N°59 si TCA).", "alertes": ["Jaunisse, ventre gonflé, vomissement de sang, confusion : urgence"], "aNePasFaire": ["Proposer des cures « détox du foie » agressives", "Associer plusieurs plantes hépatiques sans avis"], "questions": ["Une échographie du foie a-t-elle été faite ?", "Quelle est votre consommation d'alcool ?", "Prenez-vous des médicaments ou des compléments en ce moment ?"], "outils": "Voir fiche Syndrome métabolique.", "voirAussi": ["Syndrome métabolique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hypothyroïdie fonctionnelle (sans auto-immunité)", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["thyroïde ralentie", "T3 basse", "T3 reverse", "TSH limite"], "enBref": "Signes évocateurs d'une thyroïde qui ralentit alors que les anticorps sont absents et la TSH proche de la norme. Souvent un ralentissement adaptatif (stress, manque d'énergie, carences), pas une maladie de la glande.", "physiologie": "La glande produit surtout de la T4, peu active. La T3, active, naît de sa conversion dans le foie, l'intestin et les tissus, qui demande du sélénium, du zinc, du fer et de l'énergie disponible. Le stress chronique (cortisol), le jeûne, un régime restrictif, une maladie ou un sport excessif détournent la T4 vers la T3 reverse, inactive : le corps ralentit volontairement pour économiser l'énergie.", "symptomes": "Frilosité, fatigue, constipation, peau sèche, chute de cheveux, cycles perturbés, moral bas.", "diagnostic": "TSH, T4 libre, T3 libre, anticorps anti-TPO (négatifs ici), T3 reverse si doute. Un médecin décide d'un traitement ; la TSH seule peut passer à côté d'un problème de conversion.", "pec": "Traitement seulement si la TSH et la T4 le justifient. Sinon surveillance et correction des causes.", "traitements": [{"label": "Lévothyroxine si hypothyroïdie confirmée", "marques": ["Levothyrox"]}], "operations": [], "naturo": "Chercher la cause du ralentissement : apports énergétiques suffisants (jamais de restriction), carences (fer, zinc, sélénium, vitamine D), stress, sommeil, intestin. Bilan à distance d'un jeûne ou d'une restriction (RÈGLE bilans). Ne pas proposer d'iode.", "alertes": ["Fatigue extrême, ralentissement marqué, frilosité intense : avis médical rapide"], "aNePasFaire": ["Conclure à une hypothyroïdie sans dosage", "Proposer de l'iode concentré", "Recommander un régime hypocalorique"], "questions": ["Mangez-vous suffisamment ? Avez-vous perdu du poids récemment ?", "Quand a été dosée la T3 libre ?", "Faites-vous beaucoup de sport ?"], "outils": "Générateur : RÈGLES N°11 et N°43.", "voirAussi": ["Hypothyroïdie et Hashimoto"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Acné de l'adulte", "type": "maladie", "categorie": "Peau", "alias": ["acné tardive", "acné hormonale", "boutons"], "enBref": "Acné qui persiste après l'adolescence ou apparaît après 25 ans, surtout chez la femme, souvent sur le bas du visage, la mâchoire et le cou, avec poussées avant les règles.", "physiologie": "Les androgènes stimulent les glandes sébacées. Un excès de sébum, un follicule obstrué par des cellules mortes et la bactérie Cutibacterium acnes déclenchent l'inflammation. Chez l'adulte, les androgènes sont souvent normaux mais la peau y est plus sensible ; l'insuline élevée (qui stimule aussi les androgènes) et le stress (cortisol) peuvent aggraver. Un SOPK est à rechercher en cas de cycles irréguliers ou de pilosité.", "symptomes": "Papules, pustules, kystes douloureux, séborrhée, cicatrices, poussées prémenstruelles.", "diagnostic": "Examen médical ou dermatologique. Bilan hormonal seulement si signes d'hyperandrogénie ou cycles irréguliers (SOPK, hyperplasie des surrénales).", "pec": "Dermocosmétique, rétinoïdes locaux, antibiotiques ou isotrétinoïne selon la gravité, parfois pilule ou spironolactone. L'isotrétinoïne impose une contraception stricte.", "traitements": [{"label": "Rétinoïdes locaux", "marques": ["Differine", "Epiduo", "Effederm"]}, {"label": "Antibiotiques (cyclines)", "marques": ["Doxycycline", "Lymecycline"]}, {"label": "Isotrétinoïne orale", "marques": ["Curacné", "Roaccutane"]}, {"label": "Spironolactone", "marques": ["Aldactone"]}], "operations": [], "naturo": "Expliquer l'axe insuline–androgènes–sébum et l'axe intestin–peau. Alimentation à charge glycémique modérée (sans excès de restriction), zinc selon bilan, sommeil et gestion du stress. Sous isotrétinoïne : pas de vitamine A, pas de grossesse (RÈGLE N°63).", "alertes": ["Acné kystique sévère, cicatrices, retentissement moral important : dermatologue", "Sous isotrétinoïne : pas de grossesse, signes dépressifs à signaler"], "aNePasFaire": ["Conseiller de la vitamine A avec l'isotrétinoïne", "Promettre une peau nette en quelques semaines", "Imposer une éviction laitière stricte sans l'expliquer"], "questions": ["Depuis quand ? Y a-t-il un lien avec le cycle ?", "Utilisez-vous un traitement local ou oral ?", "Avez-vous des poils en excès ou des cycles irréguliers ?"], "outils": "Voir fiche SOPK.", "voirAussi": ["SOPK (syndrome des ovaires polykystiques)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Rosacée", "type": "maladie", "categorie": "Peau", "alias": ["couperose", "rougeurs du visage"], "enBref": "Maladie inflammatoire chronique de la peau du visage, avec rougeurs persistantes, flushs, petits vaisseaux visibles et parfois boutons sans comédons.", "physiologie": "Une hyperréactivité des petits vaisseaux du visage, une inflammation de la peau, un excès de peptides antimicrobiens (cathélicidine) et parfois des acariens Demodex entretiennent la rougeur. Les déclencheurs (chaleur, soleil, alcool, repas épicés, stress) dilatent les vaisseaux. Un lien avec l'intestin (SIBO, Helicobacter pylori) est étudié.", "symptomes": "Rougeurs centro-faciales, flushs, sensation de brûlure, papules et pustules, nez épaissi (rhinophyma), yeux irrités.", "diagnostic": "Examen clinique. L'atteinte oculaire (yeux secs, rougeurs, sensation de grain) mérite un avis ophtalmologique.", "pec": "Soins doux, protection solaire, métronidazole ou ivermectine locale, antibiotiques oraux, laser vasculaire.", "traitements": [{"label": "Ivermectine locale", "marques": ["Soolantra"]}, {"label": "Métronidazole local", "marques": ["Rozex"]}, {"label": "Cyclines", "marques": ["Doxycycline"]}], "operations": [], "naturo": "Identifier les déclencheurs personnels (carnet), apaiser la barrière cutanée, soutenir l'intestin si troubles digestifs associés. Pas d'huiles essentielles sur le visage.", "alertes": ["Atteinte oculaire (douleur, baisse de vision) : ophtalmologue", "Rougeur brutale avec fièvre : avis médical"], "aNePasFaire": ["Conseiller des gommages ou des huiles essentielles", "Promettre une disparition définitive"], "questions": ["Qu'est-ce qui déclenche vos rougeurs ?", "Avez-vous des troubles digestifs ?", "Vos yeux sont-ils irrités ?"], "outils": "Voir fiche SIBO.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Burn-out et « épuisement surrénalien »", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["fatigue surrénalienne", "burn out", "épuisement professionnel", "surmenage"], "enBref": "Le burn-out est un épuisement lié à un stress professionnel prolongé (épuisement, cynisme, perte d'efficacité). L'« épuisement surrénalien » n'est pas une maladie reconnue médicalement : c'est un concept de terrain utilisé en naturopathie.", "physiologie": "Face au stress, l'axe hypothalamus–hypophyse–surrénales libère du cortisol. Sur le long terme, le rythme du cortisol se dérègle (réveil difficile, coup de fatigue le matin, regain le soir), le sommeil se dégrade, la thyroïde ralentit et l'intestin devient plus perméable. Il n'y a pas, en général, de « surrénales épuisées » : l'insuffisance surrénale réelle (maladie d'Addison) est rare et grave.", "symptomes": "Fatigue persistante, sommeil non réparateur, irritabilité, troubles de concentration, anxiété, envies de sel ou de sucre, baisse de libido, infections répétées.", "diagnostic": "Le burn-out est un diagnostic clinique du médecin (évaluation de la dépression, arrêt maladie). Cortisol salivaire ou sanguin possible mais d'interprétation délicate. Il faut éliminer thyroïde, anémie, apnées du sommeil, dépression.", "pec": "Repos, arrêt de travail si besoin, psychothérapie, parfois antidépresseurs. Prise en charge globale.", "traitements": [{"label": "Antidépresseurs si dépression associée", "marques": ["Escitalopram", "Sertraline"]}, {"label": "Anxiolytiques (courte durée)", "marques": ["Atarax"]}], "operations": [], "naturo": "Expliquer l'axe du stress et pourquoi le repos est le premier traitement. Sommeil, rythme, lumière du matin, respiration, activité douce, protéines, magnésium selon bilan. Pas de gros stimulants. Rester vigilante : idées noires = RÈGLE N°61. Ne pas annoncer de « fatigue des surrénales ».", "alertes": ["Idées noires ou envie de ne plus vivre : conduite à tenir immédiate", "Perte de poids, malaises, hypotension, pigmentation : suspicion d'Addison, avis médical"], "aNePasFaire": ["Annoncer un « épuisement des surrénales » comme diagnostic", "Proposer ashwagandha ou rhodiola en cas de bipolarité ou d'antidépresseur", "Pousser à reprendre le travail trop vite"], "questions": ["Depuis quand êtes-vous épuisé·e ? Un arrêt est-il en cours ?", "Pensez-vous parfois que ce serait plus simple de ne plus être là ?", "Comment dormez-vous ?"], "outils": "Générateur : RÈGLE N°61 (santé mentale), questionnaires, repérage « idées noires ».", "voirAussi": ["Idées suicidaires — conduite à tenir", "Dépression / anxiété diagnostiquée", "Insomnies chroniques"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Insomnies chroniques", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["troubles du sommeil", "réveils nocturnes", "insomnie"], "enBref": "Difficultés à s'endormir, réveils nocturnes ou réveil trop précoce, au moins 3 nuits par semaine pendant au moins 3 mois, avec retentissement la journée.", "physiologie": "Le sommeil est régi par la pression de sommeil (adénosine) et l'horloge biologique (mélatonine, lumière). Le stress maintient l'hyperéveil (cortisol, adrénaline) ; les écrans le soir retardent la mélatonine ; l'alcool et la caféine fragmentent le sommeil. Les réveils vers 3-4 h peuvent venir d'une baisse de glycémie, de la ménopause (bouffées de chaleur) ou d'une anxiété. Les apnées du sommeil, le syndrome des jambes sans repos et la dépression sont à éliminer.", "symptomes": "Endormissement long, réveils, sommeil léger, fatigue diurne, irritabilité.", "diagnostic": "Interrogatoire, agenda du sommeil sur 2 semaines. Étude du sommeil si suspicion d'apnées ou de jambes sans repos.", "pec": "Thérapie cognitivo-comportementale de l'insomnie (TCC-I, référence). Hypnotiques à courte durée seulement ; aucun traitement chronique.", "traitements": [{"label": "Hypnotiques", "marques": ["Zolpidem", "Stilnox", "Imovane"]}, {"label": "Benzodiazépines", "marques": ["Lexomil", "Xanax", "Témesta"]}, {"label": "Mélatonine", "marques": ["Circadin"]}], "operations": [], "naturo": "Hygiène du sommeil, régularité des horaires, lumière du matin, repas du soir, coupure caféine, relaxation, respiration. Plantes douces (valériane, passiflore) en prévenant des interactions. Mélatonine seulement selon avis. Ne jamais arrêter seul·e un hypnotique ou une benzodiazépine.", "alertes": ["Ronflements forts avec pauses respiratoires, somnolence au volant : suspicion d'apnées", "Idées noires : conduite à tenir immédiate"], "aNePasFaire": ["Proposer 5-HTP ou tryptophane en cas d'antidépresseur ou de bipolarité", "Conseiller l'arrêt d'une benzodiazépine", "Imposer des siestes"], "questions": ["À quelle heure vous couchez-vous et réveillez-vous ?", "Prenez-vous un somnifère ?", "Ronflez-vous ?"], "outils": "Générateur : RÈGLE N°61.", "voirAussi": ["Burn-out et « épuisement surrénalien »"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome de fatigue chronique (encéphalomyélite myalgique)", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["SFC", "EM/SFC", "ME/CFS", "fatigue chronique", "post-viral", "COVID long"], "enBref": "Maladie chronique avec fatigue profonde, aggravation après un effort (malaise post-effort), sommeil non réparateur et troubles cognitifs, souvent après une infection virale.", "physiologie": "Les mécanismes restent débattus : dérèglement immunitaire post-infectieux, neuro-inflammation, dysfonction mitochondriale, dysautonomie. Le signe central est le malaise post-effort : un effort anodin déclenche une aggravation 12 à 48 h plus tard. Le COVID long recouvre une partie de ces tableaux.", "symptomes": "Fatigue invalidante, malaise post-effort, sommeil non réparateur, brouillard mental, vertiges en position debout, douleurs musculaires, maux de gorge.", "diagnostic": "Diagnostic clinique (critères du consensus américain de 2015 ou critères canadiens) après élimination d'autres causes : anémie, thyroïde, apnées, dépression, maladie auto-immune, infection.", "pec": "Pas de traitement curatif. Gestion de l'énergie (pacing), prise en charge des symptômes, soutien psychologique. Les programmes d'exercice progressif ne sont plus recommandés car ils peuvent aggraver.", "traitements": [{"label": "Traitement des symptômes (douleurs, sommeil)", "marques": ["Paracétamol", "Amitriptyline"]}], "operations": [], "naturo": "Priorité au pacing : rester sous le seuil d'énergie pour éviter l'effondrement. Alimentation facile, protéines, hydratation, sel si dysautonomie (avis médical). Compléments au cas par cas, introduits un par un à faible dose. Accompagnement bienveillant : la cliente n'est pas « paresseuse » ni « dépressive ».", "alertes": ["Aggravation brutale, fièvre, douleur thoracique, dyspnée : avis médical", "Idées noires : conduite à tenir immédiate"], "aNePasFaire": ["Prescrire une reprise sportive progressive", "Promettre une guérison rapide", "Multiplier les compléments d'un coup"], "questions": ["Que se passe-t-il après un effort, le lendemain ou surlendemain ?", "Cela a-t-il commencé après une infection ?", "Quel est votre niveau d'énergie réel dans la semaine ?"], "outils": "Voir aussi Fibromyalgie.", "voirAussi": ["Fibromyalgie", "Burn-out et « épuisement surrénalien »"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Dysbiose intestinale", "type": "maladie", "categorie": "Digestif", "alias": ["dysbiose", "déséquilibre du microbiote", "fermentation", "putréfaction", "dysbiose de fermentation", "dysbiose de putréfaction"], "enBref": "Déséquilibre du microbiote intestinal (diversité réduite, espèces bénéfiques en baisse, bactéries inflammatoires ou levures en excès). Concept scientifique en construction, pas un diagnostic médical.", "physiologie": "Le microbiote produit des acides gras à chaîne courte (butyrate) qui nourrissent le côlon et apaisent l'immunité. Une alimentation pauvre en fibres, des antibiotiques, le stress, les IPP et un transit lent réduisent la diversité. On décrit une dysbiose de fermentation (trop de sucres fermentés : gaz, ballonnements) ou de putréfaction (protéines mal digérées : selles malodorantes, gaz soufrés). Les tests de microbiote du commerce restent difficiles à interpréter.", "symptomes": "Ballonnements, gaz, transit irrégulier, inconfort, intolérances apparentes, fatigue, peau réactive.", "diagnostic": "Clinique d'abord. Les analyses de selles du commerce sont un outil complémentaire, jamais un diagnostic. Éliminer cœliaque, MICI, SIBO, parasites.", "pec": "Pas de traitement médical spécifique. Prise en charge des maladies associées.", "traitements": [{"label": "Pas de traitement spécifique", "marques": []}], "operations": [], "naturo": "Diversifier les fibres et les plantes par paliers, prébiotiques lents, aliments fermentés tolérés, mastication, rythme des repas. Probiotiques ciblés selon souches. Pas de restriction durable (régime FODMAP limité dans le temps, jamais en cas de TCA : RÈGLE N°59).", "alertes": ["Sang dans les selles, perte de poids, anémie, fièvre : avis médical sans délai"], "aNePasFaire": ["Sur-interpréter un test de microbiote", "Imposer un régime d'éviction durable", "Proposer un drainage ou un jeûne"], "questions": ["Quels symptômes digestifs avez-vous, depuis quand ?", "Avez-vous pris des antibiotiques récemment ?", "Quelle est votre alimentation d'une journée type ?"], "outils": "Générateur : RÈGLES SIBO, FODMAP, candidose.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)", "Hyperperméabilité intestinale (« leaky gut »)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hyperperméabilité intestinale (« leaky gut »)", "type": "maladie", "categorie": "Digestif", "alias": ["leaky gut", "perméabilité intestinale", "intestin poreux", "zonuline"], "enBref": "Augmentation de la perméabilité de la barrière intestinale. Le phénomène est réel et étudié, mais ce n'est pas un diagnostic médical et le test de zonuline est non validé.", "physiologie": "La paroi intestinale laisse passer les nutriments et bloque les toxines grâce aux jonctions serrées entre cellules. Le stress, l'alcool, les AINS, les infections et un microbiote appauvri peuvent les relâcher : des fragments bactériens (LPS) passent dans le sang et entretiennent une inflammation de bas grade. Le lien est démontré dans la maladie cœliaque et certaines MICI ; pour les autres maladies, l'hypothèse reste débattue.", "symptomes": "Ballonnements, intolérances multiples, fatigue, douleurs articulaires, peau réactive, brouillard mental (non spécifiques).", "diagnostic": "Aucun test fiable en pratique courante. Éliminer cœliaque et MICI devant des signes digestifs.", "pec": "Pas de traitement spécifique. Prise en charge de la maladie associée.", "traitements": [{"label": "Pas de traitement spécifique", "marques": []}], "operations": [], "naturo": "Retirer les agresseurs (AINS, alcool, tabac), soutenir la barrière (fibres, glutamine selon avis, vitamine D, zinc), apaiser le stress et le sommeil. Ne pas annoncer « vous avez un leaky gut » comme un diagnostic ; ne pas promettre la guérison de maladies auto-immunes.", "alertes": ["Sang dans les selles, amaigrissement, fièvre : avis médical"], "aNePasFaire": ["Poser le « leaky gut » comme diagnostic", "Proposer un régime d'éviction long sans bilan", "Promettre la guérison d'une maladie auto-immune"], "questions": ["Prenez-vous des anti-inflammatoires régulièrement ?", "Quels aliments semblent poser problème ?", "Un test de maladie cœliaque a-t-il été fait ?"], "outils": "Générateur : fiche perméabilité (RÈGLES intestin).", "voirAussi": ["Dysbiose intestinale", "Maladie cœliaque", "Inflammation chronique de bas grade"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Inflammation chronique de bas grade", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["inflammation silencieuse", "CRP ultrasensible", "inflammaging", "stress oxydant"], "enBref": "Inflammation légère mais persistante, sans signe aigu, mesurable par une CRP ultrasensible légèrement élevée. Elle accompagne le syndrome métabolique, l'obésité abdominale, la sédentarité, le stress et le vieillissement.", "physiologie": "Le tissu adipeux viscéral, un microbiote déséquilibré, un excès de sucres et de graisses oxydées, le manque de sommeil et le stress chronique activent le système immunitaire inné (cytokines IL-6, TNF-α). Cette inflammation entretient l'insulinorésistance et le risque cardiovasculaire. Le stress oxydant (excès de radicaux libres par rapport aux antioxydants) l'accompagne. Les antioxydants sont utiles par les aliments, mais les fortes doses isolées n'ont pas montré de bénéfice.", "symptomes": "Fatigue, douleurs diffuses, prise de poids abdominale, peau réactive, infections traînantes.", "diagnostic": "CRP ultrasensible, bilan lipidique, glycémie, ferritine (aussi protéine de l'inflammation), numération. Toute CRP très élevée relève du médecin.", "pec": "Traiter les causes : syndrome métabolique, maladies inflammatoires, infections. Pas de traitement de l'« inflammation » seule.", "traitements": [{"label": "Pas de traitement spécifique", "marques": []}], "operations": [], "naturo": "Alimentation de type méditerranéen (oméga-3, légumes, fibres, huile d'olive), activité physique, sommeil, gestion du stress, réduction de l'alcool. Antioxydants par l'alimentation plutôt qu'en fortes doses.", "alertes": ["CRP très élevée, fièvre, douleur localisée : avis médical"], "aNePasFaire": ["Interpréter une CRP isolée comme une maladie", "Proposer des antioxydants à forte dose (surtout en cancer)", "Prescrire un régime d'éviction large"], "questions": ["Une prise de sang récente montre-t-elle une CRP élevée ?", "Quel est votre niveau d'activité physique ?", "Dormez-vous suffisamment ?"], "outils": "Voir fiches Syndrome métabolique, Hyperperméabilité.", "voirAussi": ["Syndrome métabolique", "Hyperperméabilité intestinale (« leaky gut »)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Axe de l'insuline et de la glycémie", "type": "conduite", "categorie": "Terrain et axes fonctionnels", "alias": ["insuline", "HOMA", "glycémie", "charge glycémique", "hypoglycémie fonctionnelle"], "enBref": "L'insuline est l'hormone qui fait entrer le glucose dans les cellules et indique au corps de stocker. Elle est l'axe central du terrain métabolique.", "physiologie": "Après un repas, la glycémie monte, le pancréas libère de l'insuline, les muscles et le foie captent le glucose. Si l'insuline est trop souvent haute (repas riches en sucres rapides, sédentarité, graisse viscérale, manque de sommeil, stress), les cellules y répondent moins : c'est l'insulinorésistance. Elle favorise le stockage abdominal, la faim, la stimulation des androgènes ovariens (SOPK) et l'inflammation. À l'inverse, une chute rapide de la glycémie après un pic provoque fatigue, tremblements et envies de sucre.", "symptomes": "Fatigue après repas, envies de sucre, prise de poids abdominale, acné, cycles irréguliers, somnolence, faim rapide.", "diagnostic": "Glycémie à jeun, insuline à jeun et HOMA, HbA1c. Médecin pour l'interprétation. Un HOMA couplé à un jeûne n'est pas adapté en cas de TCA.", "pec": "Selon le cas : mesures de mode de vie, metformine, antidiabétiques.", "traitements": [{"label": "Metformine", "marques": ["Glucophage", "Stagid"]}], "operations": [], "naturo": "Expliquer pourquoi l'ordre des aliments (légumes, protéines puis féculents), les fibres, les protéines et l'activité musculaire stabilisent l'insuline. Marche après repas. Sommeil. Plantes hypoglycémiantes : jamais avec un traitement antidiabétique (RÈGLE N°60).", "alertes": ["Hypoglycémie sévère, malaise : urgence si traitement antidiabétique", "Soif intense, perte de poids : glycémie rapide"], "aNePasFaire": ["Appliquer un régime low-carb strict à un diabète de type 1 ou en TCA", "Cumuler berbérine et metformine sans avis"], "questions": ["Avez-vous un HOMA ou une HbA1c récents ?", "Avez-vous des coups de fatigue après les repas ?", "Prenez-vous un antidiabétique ?"], "outils": "Générateur : RÈGLES N°55 et N°60.", "voirAussi": ["Syndrome métabolique", "Diabète de type 2 / résistance à l'insuline", "SOPK (syndrome des ovaires polykystiques)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Axe du stress et du cortisol", "type": "conduite", "categorie": "Terrain et axes fonctionnels", "alias": ["cortisol", "axe HPA", "stress chronique", "rythme circadien", "hypothalamo-hypophyso-surrénalien"], "enBref": "Le cortisol, hormone des surrénales, suit un rythme : pic au réveil, baisse progressive jusqu'au soir. Il mobilise l'énergie et module l'immunité et l'inflammation.", "physiologie": "L'hypothalamus et l'hypophyse commandent les surrénales. Sous stress, le cortisol monte ; en cas de stress chronique, le rythme s'aplatit ou s'inverse, avec conséquences sur le sommeil, l'insuline, la thyroïde, les hormones sexuelles et la perméabilité intestinale. Le cortisol et la progestérone partagent un précurseur, ce qui illustre le lien entre stress et cycle.", "symptomes": "Réveil difficile, fatigue matinale, coup de fatigue 15-17 h, regain le soir, sommeil perturbé, envies de sucre, irritabilité.", "diagnostic": "Cortisol salivaire sur plusieurs points de la journée ou cortisol au réveil (CAR) : interprétation prudente. Éliminer Addison et Cushing.", "pec": "Pas de traitement d'un « déséquilibre du rythme ». Traitement médical des maladies surrénaliennes.", "traitements": [{"label": "Hydrocortisone (si insuffisance surrénale)", "marques": ["Hydrocortisone Roussel"]}], "operations": [], "naturo": "Régularité des horaires, lumière du matin, petit-déjeuner riche en protéines, respiration, activité douce, coupure des écrans le soir. Plantes adaptogènes avec prudence (RÈGLES N°61). Sous corticoïdes : aucun conseil sur le traitement.", "alertes": ["Fatigue majeure avec vomissements, hypotension, malaise : suspicion d'insuffisance surrénale, urgence", "Sous corticoïdes prolongés : ne jamais arrêter brutalement"], "aNePasFaire": ["Déduire un « épuisement surrénalien » d'un test isolé", "Conseiller de l'hydrocortisone ou de la DHEA sans médecin"], "questions": ["Comment évolue votre énergie dans la journée ?", "Prenez-vous ou avez-vous pris des corticoïdes ?", "Quels sont vos horaires de sommeil ?"], "outils": "Générateur : RÈGLES N°43 et N°61.", "voirAussi": ["Burn-out et « épuisement surrénalien »", "Insomnies chroniques", "Syndrome de Cushing", "Maladie d'Addison"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Axe des hormones sexuelles (œstrogènes, progestérone, androgènes)", "type": "conduite", "categorie": "Terrain et axes fonctionnels", "alias": ["œstrogènes", "progestérone", "testostérone", "SHBG", "cycle menstruel", "dominance œstrogénique"], "enBref": "Les ovaires, les surrénales et le tissu adipeux produisent œstrogènes, progestérone et androgènes. Leur équilibre règle le cycle, l'humeur, la peau, l'énergie et les os.", "physiologie": "Dans la première moitié du cycle, l'œstradiol monte, déclenche l'ovulation, puis la progestérone, produite après l'ovulation, apaise et stabilise la deuxième moitié. Les androgènes sont convertis en œstrogènes par l'aromatase. Le foie et l'intestin éliminent les œstrogènes usagés. L'insuline haute baisse la SHBG et augmente les androgènes libres. Le stress consomme la progestérone. Le déséquilibre relatif se traduit dans le SPM, le SOPK, l'endométriose et la périménopause.", "symptomes": "Cycles irréguliers, règles abondantes ou douloureuses, SPM, acné, pilosité, bouffées de chaleur, sécheresse.", "diagnostic": "Dosages à date précise du cycle (J3 pour FSH, LH, œstradiol ; Pic+7 pour la progestérone). Non interprétables sous contraception hormonale ni en cas de restriction ou de poids bas.", "pec": "Selon la cause : contraception, traitement hormonal substitutif, anti-androgènes, chirurgie.", "traitements": [{"label": "Contraception hormonale", "marques": ["Pilule", "DIU hormonal", "Implant"]}, {"label": "Traitement hormonal de la ménopause", "marques": ["Estreva", "Utrogestan"]}, {"label": "Anti-androgènes", "marques": ["Androcur", "Aldactone"]}], "operations": [], "naturo": "Expliquer le cycle phase par phase, soutenir foie, intestin, insuline, sommeil, minéraux (magnésium, zinc, fer), perturbateurs endocriniens. Respecter la RÈGLE N°19 sur la contraception hormonale. Ne jamais suggérer d'arrêter un traitement hormonal.", "alertes": ["Règles très abondantes avec malaise, saignements en ménopause, douleur pelvienne brutale : avis médical"], "aNePasFaire": ["Doser les hormones sous pilule pour « voir où on en est »", "Conseiller de la progestérone ou de la DHEA sans médecin", "Conclure « dominance œstrogénique » sans clinique ni bilan"], "questions": ["Quel est votre contraceptif ?", "Quel est la durée de vos cycles ?", "Quand a été fait votre dernier bilan hormonal ?"], "outils": "Générateur : RÈGLES N°19 et bilans hormonaux.", "voirAussi": ["SOPK (syndrome des ovaires polykystiques)", "Endométriose", "Périménopause et ménopause", "Syndrome prémenstruel et règles douloureuses"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Périménopause et ménopause", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["périménopause", "ménopause", "bouffées de chaleur", "THM", "traitement hormonal de la ménopause"], "enBref": "La périménopause est la période de transition (souvent dès 45 ans) avant l'arrêt des règles ; la ménopause est confirmée après 12 mois sans règles (âge moyen autour de 51 ans).", "physiologie": "Les ovaires libèrent moins d'ovocytes. La progestérone diminue d'abord (cycles sans ovulation), puis l'œstradiol fluctue puis baisse. Cette baisse touche le cerveau (bouffées de chaleur, sommeil, humeur), les os, la peau, les vaisseaux et la muqueuse vaginale. La graisse abdominale et l'insulinorésistance augmentent.", "symptomes": "Cycles irréguliers, bouffées de chaleur, sueurs nocturnes, insomnie, humeur variable, sécheresse vaginale, baisse de libido, douleurs articulaires, prise de poids abdominale.", "diagnostic": "Diagnostic clinique après 45 ans. Pas de dosage hormonal nécessaire en cas de signes typiques. Bilan avant traitement hormonal : mammographie, lipides, tension.", "pec": "Traitement hormonal de la ménopause (THM) si symptômes gênants et en l'absence de contre-indication (cancer du sein, antécédent thromboembolique…), œstrogènes vaginaux locaux, traitements non hormonaux.", "traitements": [{"label": "Œstrogènes + progestérone", "marques": ["Estreva", "Oestrogel", "Utrogestan"]}, {"label": "Œstrogènes vaginaux", "marques": ["Colpotrophine", "Trophigil"]}, {"label": "Non hormonal", "marques": ["Veoza (fézolinétant)", "Antidépresseurs ISRS"]}], "operations": [], "naturo": "Expliquer l'évolution hormonale et ses conséquences. Soutenir sommeil, muscle (résistance), os (calcium, vitamine D, protéines), insuline, foie, microbiote. Phytoestrogènes alimentaires possibles ; ne pas en prescrire en cas de cancer du sein hormono-dépendant (RÈGLE N°62). Ne pas déconseiller le THM.", "alertes": ["Saignements après 12 mois sans règles : avis gynécologique", "Antécédent de cancer du sein : aucune plante œstrogénique sans oncologue", "Douleur thoracique, jambe gonflée : urgence"], "aNePasFaire": ["Déconseiller un THM prescrit", "Proposer des phytoestrogènes concentrés en cas de cancer hormono-dépendant", "Doser les hormones pour « confirmer » la ménopause"], "questions": ["Où en sont vos règles ?", "Avez-vous un traitement hormonal ?", "Y a-t-il des antécédents de cancer du sein ou de thrombose ?"], "outils": "Générateur : RÈGLE N°62 (cancer), pages ménopause.", "voirAussi": ["Cancer du sein hormono-dépendant", "Ostéoporose"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome prémenstruel et règles douloureuses", "type": "maladie", "categorie": "Gynécologie et hormones", "alias": ["SPM", "TDPM", "dysménorrhée", "règles douloureuses"], "enBref": "Le SPM regroupe les symptômes physiques et émotionnels des jours précédant les règles. La dysménorrhée désigne les règles douloureuses. Un TDPM (trouble dysphorique prémenstruel) est une forme sévère à traiter médicalement.", "physiologie": "Après l'ovulation, la progestérone et ses métabolites modifient l'activité de la sérotonine et du GABA ; une sensibilité accrue à ces variations explique l'irritabilité et l'anxiété. Les prostaglandines contractent l'utérus et provoquent les douleurs. Une douleur sévère ou croissante doit faire chercher une endométriose ou une adénomyose.", "symptomes": "Irritabilité, tristesse, seins tendus, ballonnements, fatigue, envies sucrées, crampes menstruelles.", "diagnostic": "Carnet des symptômes sur 2-3 cycles. Échographie pelvienne et IRM en cas de douleur sévère.", "pec": "AINS contre les douleurs, contraception hormonale, antidépresseurs ISRS dans le TDPM.", "traitements": [{"label": "Anti-inflammatoires", "marques": ["Ibuprofène", "Antadys"]}, {"label": "Contraception hormonale", "marques": ["Pilule"]}, {"label": "Antispasmodiques", "marques": ["Spasfon"]}], "operations": [], "naturo": "Expliquer le lien entre progestérone, stress, intestin, glycémie et douleurs. Magnésium, vitamine B6 selon profil, oméga-3, activité, chaleur. Plantes à usage prudent. Toujours se demander s'il faut chercher une endométriose.", "alertes": ["Douleur invalidante qui s'aggrave : endométriose à rechercher", "Idées noires prémenstruelles : conduite à tenir immédiate (RÈGLE N°61)"], "aNePasFaire": ["Banaliser une douleur invalidante", "Proposer des plantes progestatives sans cadre"], "questions": ["Les douleurs vous empêchent-elles de travailler ?", "Quand surviennent les symptômes dans le cycle ?", "Avez-vous déjà eu des examens ?"], "outils": "Générateur : RÈGLES SPM.", "voirAussi": ["Endométriose", "SOPK (syndrome des ovaires polykystiques)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Anémie par carence en fer", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["carence en fer", "ferritine basse", "anémie ferriprive"], "enBref": "Manque de fer qui diminue l'hémoglobine. La carence en fer sans anémie est fréquente chez la femme réglée et pèse déjà sur l'énergie, les cheveux et la thyroïde.", "physiologie": "Le fer sert à fabriquer l'hémoglobine (transport de l'oxygène), mais aussi à convertir la T4 en T3 et à fabriquer les neurotransmetteurs. Les pertes (règles abondantes, saignements digestifs), les apports insuffisants, une absorption réduite (cœliaque, gastrite, IPP) ou un besoin accru (grossesse) créent la carence. La ferritine baisse d'abord ; l'hémoglobine ensuite.", "symptomes": "Fatigue, pâleur, essoufflement, chute de cheveux, ongles cassants, jambes sans repos, palpitations.", "diagnostic": "NFS, ferritine, coefficient de saturation de la transferrine, CRP. Rechercher la cause (gynécologique ou digestive).", "pec": "Fer par voie orale ou intraveineuse selon le cas et la cause, traitement de la cause.", "traitements": [{"label": "Fer oral", "marques": ["Tardyferon", "Fumafer", "Ferrostrane"]}, {"label": "Fer intraveineux", "marques": ["Venofer", "Ferinject"]}], "operations": [], "naturo": "Alimentation riche en fer héminique, vitamine C avec les repas, thé et café à distance. Fer en cure avec avis ; espacer de 4 h de la lévothyroxine. Rechercher la cause avant de supplémenter.", "alertes": ["Essoufflement au repos, malaise, palpitations marquées : avis médical rapide", "Anémie chez l'homme ou après la ménopause : bilan digestif"], "aNePasFaire": ["Supplémenter à forte dose sans bilan (hémochromatose)", "Ignorer la cause de la perte"], "questions": ["Vos règles sont-elles abondantes ?", "Prenez-vous un IPP ?", "Quand a été dosée votre ferritine ?"], "outils": "Voir fiches Hypothyroïdie, Hémochromatose.", "voirAussi": ["Hémochromatose", "Hypothyroïdie et Hashimoto"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Constipation chronique", "type": "maladie", "categorie": "Digestif", "alias": ["constipation", "transit lent"], "enBref": "Selles rares (moins de 3 par semaine), dures, difficiles à évacuer, depuis plus de 3 mois.", "physiologie": "Le transit dépend des fibres, de l'eau, de l'activité, de la motricité du côlon et de la coordination du plancher pelvien. Un transit lent favorise la fermentation et le SIBO. Hypothyroïdie, médicaments (opiacés, fer, anticholinergiques), diabète et maladies neurologiques peuvent y contribuer. Le stress et le fait de se retenir ralentissent le réflexe.", "symptomes": "Selles dures, efforts, sensation d'évacuation incomplète, ballonnements, douleurs.", "diagnostic": "Clinique, bilan thyroïdien et glycémique, coloscopie si âge, signes d'alerte ou antécédents familiaux.", "pec": "Fibres, laxatifs osmotiques, rééducation périnéale (biofeedback), traitements spécifiques.", "traitements": [{"label": "Laxatifs osmotiques", "marques": ["Movicol", "Forlax", "Duphalac"]}, {"label": "Prucalopride", "marques": ["Resolor"]}], "operations": [], "naturo": "Expliquer le rôle des fibres solubles, de l'hydratation, du magnésium, de la position aux toilettes et de la routine matinale. Éviter les laxatifs stimulants au long cours et les plantes laxatives irritantes (RÈGLE N°59 si TCA : jamais).", "alertes": ["Sang dans les selles, amaigrissement, constipation récente après 50 ans, douleurs vives : avis médical"], "aNePasFaire": ["Proposer des plantes laxatives stimulantes (séné, cascara) en continu", "Passer sous silence l'usage de laxatifs en cas de TCA"], "questions": ["Depuis quand ? Y a-t-il eu un changement récent ?", "Prenez-vous des laxatifs ?", "Combien de selles par semaine ?"], "outils": "Voir fiches SII, SIBO.", "voirAussi": ["SII (syndrome de l'intestin irritable)", "SIBO (pullulation bactérienne de l'intestin grêle)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Ostéoporose", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["perte osseuse", "ostéopénie", "densitométrie"], "enBref": "Fragilisation du squelette avec risque de fracture. La baisse des œstrogènes à la ménopause, la carence en vitamine D, la restriction alimentaire, les corticoïdes et la sédentarité en sont les principaux facteurs.", "physiologie": "L'os se renouvelle en permanence : les ostéoclastes détruisent, les ostéoblastes reconstruisent. Les œstrogènes freinent la destruction ; leur baisse accélère la perte. Les contraintes mécaniques (muscle, charge) stimulent la construction. Calcium, vitamines D et K2, protéines, magnésium sont nécessaires.", "symptomes": "Souvent silencieuse jusqu'à la fracture : tassement vertébral, perte de taille, dos voûté.", "diagnostic": "Ostéodensitométrie (DXA), bilan phosphocalcique, vitamine D, recherche de causes secondaires.", "pec": "Calcium et vitamine D, bisphosphonates, dénosumab, tériparatide, traitement hormonal de la ménopause selon le cas, renforcement musculaire.", "traitements": [{"label": "Bisphosphonates", "marques": ["Fosamax", "Actonel", "Aclasta"]}, {"label": "Dénosumab", "marques": ["Prolia"]}, {"label": "Calcium + vitamine D", "marques": ["Orocal D3", "Calcidose"]}], "operations": [], "naturo": "Expliquer la construction osseuse, l'importance de la musculation et de l'impact. Protéines suffisantes, vitamine D selon dosage, apports calciques alimentaires. Prudence avec les compléments calciques à forte dose.", "alertes": ["Douleur dorsale brutale après un faux mouvement : suspicion de tassement, avis médical", "Perte de règles prolongée chez une jeune femme ou TCA : bilan osseux médical"], "aNePasFaire": ["Proposer des compléments de calcium à forte dose sans avis", "Déconseiller un traitement prescrit"], "questions": ["Avez-vous eu une densitométrie ?", "Avez-vous déjà eu une fracture ?", "Prenez-vous des corticoïdes ?"], "outils": "Voir fiche Périménopause et ménopause.", "voirAussi": ["Périménopause et ménopause", "Anorexie mentale"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Infections récidivantes et immunité", "type": "maladie", "categorie": "Auto-immun et inflammatoire", "alias": ["infections à répétition", "immunité faible", "rhumes fréquents", "angines à répétition"], "enBref": "Plusieurs infections par an (ORL, urinaires, gynécologiques, herpès) qui amènent à se demander si l'immunité est en cause.", "physiologie": "Le système immunitaire repose sur la barrière (peau, muqueuses, microbiote) et sur des cellules. Un sommeil insuffisant, un stress prolongé (cortisol), une carence (vitamine D, zinc, fer) ou une maladie sous-jacente (diabète, immunodéficience) augmentent la vulnérabilité. Le microbiote intestinal et le sommeil sont des leviers majeurs.", "symptomes": "Rhumes, angines, sinusites, cystites, herpès, mycoses récidivants.", "diagnostic": "Bilan médical si infections sévères ou inhabituelles : NFS, CRP, glycémie, dosage des immunoglobulines, sérologies.", "pec": "Traitement de chaque infection et de la cause. Immunologue en cas de suspicion de déficit.", "traitements": [{"label": "Antibiotiques ou antiviraux selon le cas", "marques": ["Amoxicilline", "Valaciclovir"]}], "operations": [], "naturo": "Expliquer le lien entre sommeil, stress, microbiote et immunité. Vitamine D, zinc, fer selon bilan. Pas d'immunostimulants chez un patient sous traitement immunosuppresseur, auto-immun ou en cancer.", "alertes": ["Infection grave, fièvre persistante, perte de poids, infections inhabituelles : avis médical"], "aNePasFaire": ["Proposer des immunostimulants en maladie auto-immune ou en cancer", "Retarder une consultation pour une infection sévère"], "questions": ["Combien d'infections par an, de quel type ?", "Des antibiotiques ont-ils été pris récemment ?", "Avez-vous un diabète ?"], "outils": "Voir fiches Cystites récidivantes, Mycoses.", "voirAussi": ["Cystites récidivantes", "Mycoses vaginales récidivantes"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Chute de cheveux (alopécie diffuse)", "type": "maladie", "categorie": "Peau", "alias": ["alopécie", "perte de cheveux", "effluvium télogène", "cheveux fins"], "enBref": "Chute de cheveux importante et durable. La forme la plus fréquente est l'effluvium télogène (chute diffuse 2 à 3 mois après un événement) ; l'alopécie androgénétique est l'autre grande cause.", "physiologie": "Le cheveu alterne phase de croissance (3 à 6 ans) et de repos. Un choc (fièvre, accouchement, régime restrictif, stress, chirurgie) fait basculer beaucoup de cheveux en phase de repos, avec chute 2-3 mois plus tard. Carences (fer, zinc, protéines), thyroïde, androgènes (SOPK) et auto-immunité (pelade) sont les causes à chercher.", "symptomes": "Chute à la brosse ou sous la douche, cheveux raréfiés, plaques rondes (pelade), élargissement de la raie.", "diagnostic": "Examen du cuir chevelu, ferritine, TSH, glycémie, vitamine D, bilan androgénique selon contexte, dermatologue.", "pec": "Traitement de la cause. Minoxidil local dans l'alopécie androgénétique.", "traitements": [{"label": "Minoxidil local", "marques": ["Alostil", "Regaine"]}, {"label": "Anti-androgènes", "marques": ["Aldactone"]}], "operations": [], "naturo": "Expliquer le cycle du cheveu et le délai de récupération (6 mois). Corriger les causes : apport énergétique et protéique suffisant, fer, zinc, thyroïde, stress. Pas de promesse de repousse rapide. En TCA, la chute est une conséquence : orientation médicale.", "alertes": ["Plaques sans cheveux, perte rapide et importante : dermatologue", "Perte sur un fond de restriction alimentaire : RÈGLE N°59"], "aNePasFaire": ["Proposer un régime ou un jeûne en cas de chute", "Promettre une repousse rapide"], "questions": ["Depuis quand ? Un événement l'a-t-il précédée ?", "Vos règles sont-elles abondantes ?", "Mangez-vous suffisamment de protéines ?"], "outils": "Voir fiches Pelade, Hypothyroïdie.", "voirAussi": ["Pelade", "Anémie par carence en fer", "Hypothyroïdie et Hashimoto"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Allergies respiratoires et rhinite allergique", "type": "maladie", "categorie": "Respiratoire et allergies", "alias": ["rhume des foins", "allergie pollens", "allergie acariens", "rhinite", "allergie saisonnière"], "enBref": "Réaction exagérée du système immunitaire à des allergènes inhalés (pollens, acariens, poils d'animaux, moisissures) : nez qui coule ou bouché, éternuements, yeux qui piquent.", "physiologie": "Chez une personne sensibilisée, les IgE fixées sur les mastocytes déclenchent, au contact de l'allergène, la libération d'histamine : gonflement des muqueuses, écoulement, démangeaison. L'allergie repose sur une prédisposition (atopie) et sur l'état des barrières (muqueuses, peau, microbiote). Elle peut évoluer vers l'asthme si elle n'est pas prise en charge.", "symptomes": "Éternuements en salves, nez qui coule ou bouché, démangeaisons du nez, des yeux et du palais, larmoiement, toux irritative, fatigue.", "diagnostic": "Interrogatoire sur la saisonnalité, tests cutanés (prick-tests) ou IgE spécifiques par un allergologue.", "pec": "Éviction de l'allergène quand c'est possible, lavages de nez, antihistaminiques, corticoïdes nasaux. Immunothérapie allergénique (désensibilisation) en cas de forme persistante ou sévère.", "traitements": [{"label": "Antihistaminiques", "marques": ["Aerius", "Zyrtec", "Xyzall"]}, {"label": "Corticoïdes nasaux", "marques": ["Nasonex", "Rhinocort"]}, {"label": "Immunothérapie allergénique", "marques": ["Staloral", "Oralair", "Acarizax"]}], "operations": [], "naturo": "Expliquer le mécanisme de l'histamine et le rôle du terrain (intestin, vitamine D, stress). Hygiène de l'environnement (literie, aération), lavages de nez, alimentation anti-inflammatoire. Vitamine C et quercétine possibles en saison. Ne jamais arrêter un traitement ni une désensibilisation.", "alertes": ["Gêne respiratoire, sifflements, serrement de poitrine : évoquer un asthme, avis médical", "Gonflement du visage ou de la gorge, difficulté à avaler : urgence 15"], "aNePasFaire": ["Proposer des huiles essentielles à un enfant de moins de 6 ans ou à une personne asthmatique sans précaution", "Arrêter une désensibilisation en cours"], "questions": ["À quelle période de l'année les symptômes surviennent-ils ?", "Y a-t-il de l'asthme ou de l'eczéma dans la famille ?", "Prenez-vous un traitement ?"], "outils": "Voir fiches Asthme, Histaminose, Eczéma.", "voirAussi": ["Asthme", "Histaminose", "Eczéma / dermatite atopique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Asthme", "type": "maladie", "categorie": "Respiratoire et allergies", "alias": ["asthme allergique", "asthme à l'effort", "crise d'asthme", "bronchodilatateur"], "enBref": "Maladie inflammatoire chronique des bronches, avec crises de gêne respiratoire, sifflements et toux, le plus souvent la nuit ou à l'effort.", "physiologie": "Les bronches sont hypersensibles : face à un déclencheur (allergènes, infection, air froid, effort, fumée, stress), la muqueuse gonfle, produit du mucus et le muscle bronchique se contracte. L'air passe mal à l'expiration. L'inflammation sous-jacente doit être traitée en continu, pas seulement lors des crises.", "symptomes": "Toux sèche, sifflements, oppression thoracique, essoufflement, réveils nocturnes.", "diagnostic": "Examen médical, spirométrie (EFR) avec test de réversibilité, bilan allergologique.", "pec": "Traitement de fond par corticoïdes inhalés (± bronchodilatateur de longue durée) et traitement de crise par bronchodilatateur de courte durée. Plan d'action écrit. Contrôle des déclencheurs.", "traitements": [{"label": "Corticoïdes inhalés ± bronchodilatateur longue durée", "marques": ["Symbicort", "Seretide", "Flixotide"]}, {"label": "Bronchodilatateur de crise", "marques": ["Ventoline", "Bricanyl"]}, {"label": "Montélukast", "marques": ["Singulair"]}], "operations": [], "naturo": "Expliquer pourquoi le traitement de fond est indispensable même sans symptômes. Soutenir le terrain (vitamine D, oméga-3, microbiote, poids), arrêt du tabac, qualité de l'air. Huiles essentielles : déconseillées par voie inhalée chez l'asthmatique. Ne jamais arrêter ni diminuer l'inhalateur.", "alertes": ["Difficulté à parler, lèvres bleutées, pas d'amélioration après le bronchodilatateur : appeler le 15", "Utilisation du bronchodilatateur de crise de plus en plus fréquente : avis médical rapide"], "aNePasFaire": ["Proposer des huiles essentielles en diffusion ou inhalation", "Suggérer de remplacer ou d'alléger le traitement par des plantes", "Banaliser une toux nocturne répétée"], "questions": ["Quel traitement de fond prenez-vous, et le prenez-vous tous les jours ?", "Combien de fois par semaine utilisez-vous le bronchodilatateur ?", "Quels sont vos déclencheurs ?"], "outils": "Générateur : prudence aromathérapie.", "voirAussi": ["Allergies respiratoires et rhinite allergique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Allergie alimentaire", "type": "maladie", "categorie": "Respiratoire et allergies", "alias": ["allergie à l'arachide", "allergie aux protéines de lait de vache", "choc anaphylactique", "adrénaline"], "enBref": "Réaction immunitaire (IgE) à une protéine alimentaire, parfois immédiate et grave. À distinguer de l'intolérance (lactose, histamine, FODMAP), qui n'est pas immunitaire.", "physiologie": "Après sensibilisation, une très petite quantité de l'aliment provoque la libération d'histamine et d'autres médiateurs : urticaire, gonflement, vomissements, chute de tension, gêne respiratoire. La gravité varie d'un épisode à l'autre. Les allergies croisées (pollens et fruits crus) provoquent souvent des démangeaisons de la bouche.", "symptomes": "Urticaire, gonflement des lèvres, démangeaisons buccales, douleurs abdominales, vomissements, gêne respiratoire, malaise.", "diagnostic": "Allergologue : prick-tests, IgE spécifiques, test de provocation en milieu hospitalier. Les tests d'« intolérance » par IgG du commerce ne sont pas validés.", "pec": "Éviction stricte de l'aliment, trousse d'urgence avec adrénaline auto-injectable, plan d'action, parfois induction de tolérance orale supervisée.", "traitements": [{"label": "Adrénaline auto-injectable", "marques": ["Anapen", "Jext"]}, {"label": "Antihistaminiques", "marques": ["Aerius", "Zyrtec"]}], "operations": [], "naturo": "Lire les étiquettes, connaître l'adrénaline et la démarche à suivre. Veiller aux carences quand un groupe d'aliments est évincé (calcium, protéines, vitamines). Ne jamais tester un aliment suspect à la maison.", "alertes": ["Gonflement de la gorge, gêne respiratoire, malaise : adrénaline puis 15 immédiatement"], "aNePasFaire": ["Tester un aliment suspect sans cadre médical", "Prescrire un régime d'éviction large sur un test IgG", "Minimiser une réaction légère répétée"], "questions": ["Quelle réaction avez-vous eue, quand, et quel aliment ?", "Avez-vous une trousse d'urgence ?", "Un allergologue vous suit-il ?"], "outils": "Voir fiche Histaminose.", "voirAussi": ["Histaminose", "Allergies respiratoires et rhinite allergique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hémorroïdes", "type": "maladie", "categorie": "Digestif", "alias": ["hémorroïde", "crise hémorroïdaire", "saignement anal"], "enBref": "Dilatation des coussinets vasculaires de l'anus, qui peuvent saigner, gonfler ou sortir. Très fréquentes, souvent liées à la constipation ou aux efforts.", "physiolog

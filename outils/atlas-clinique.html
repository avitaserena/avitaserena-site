la crise (dans les 4 heures), histamine urinaire selon avis, élimination d'allergie, de mastocytose, de POTS. Allergologue ou immunologue.", "pec": "Antihistaminiques H1 et H2, cromoglicate, antileucotriènes, évitement des déclencheurs, trousse d'urgence dans les formes sévères.", "traitements": [{"label": "Antihistaminiques H1/H2", "marques": ["Zyrtec", "Aerius", "Pepcid (famotidine)"]}, {"label": "Cromoglicate", "marques": ["Intercron", "Nalcrom"]}, {"label": "Antileucotriène", "marques": ["Singulair"]}], "operations": [], "naturo": "Repérer les déclencheurs sans régime large : le régime pauvre en histamine est temporaire. Stabiliser le terrain (sommeil, stress, intestin), quercétine et vitamine C selon avis. Penser à la co-occurrence avec POTS et hypermobilité. Pas de suppression alimentaire en cas de TCA.", "alertes": ["Gonflement du visage ou de la gorge, malaise, difficulté à respirer : adrénaline et 15", "Chute de tension : urgence"], "aNePasFaire": ["Poser le diagnostic « MCAS » sans critères", "Éliminer de nombreux aliments", "Arrêter les antihistaminiques"], "questions": ["Quels sont les déclencheurs ? Les crises touchent-elles plusieurs organes ?", "Une tryptase a-t-elle été dosée ?", "Avez-vous une trousse d'urgence ?"], "outils": "Voir fiches Histaminose, Dysautonomie.", "voirAussi": ["Histaminose", "Dysautonomie et POTS (tachycardie posturale)", "Allergie alimentaire"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome d'Ehlers-Danlos hypermobile et spectre de l'hypermobilité", "type": "maladie", "categorie": "Orthopédie et rhumatologie", "alias": ["hypermobilité", "Ehlers-Danlos", "SED hypermobile", "Beighton", "hyperlaxité"], "enBref": "Groupe de maladies du tissu conjonctif avec des articulations trop souples, des douleurs chroniques, une fatigue et souvent une dysautonomie ou une activation mastocytaire. Les formes les plus graves (vasculaire) sont rares mais exigent d'être reconnues.", "physiologie": "Le collagène, protéine de soutien des articulations, de la peau et des vaisseaux, est de moindre résistance. Les articulations se luxent ou se subluxent, les tendons se surchargent, les muscles compensent et se contractent. Le tube digestif (gastroparésie, constipation), la vessie, le système nerveux autonome sont touchés. Il n'y a pas de test génétique pour la forme hypermobile ; en revanche, la forme vasculaire (gène COL3A1) peut provoquer des ruptures d'artères ou d'organes.", "symptomes": "Articulations souples, entorses et luxations, douleurs diffuses, fatigue, peau extensible, ecchymoses faciles, palpitations, troubles digestifs.", "diagnostic": "Score de Beighton, critères internationaux de 2017, avis d'un rhumatologue, d'un généticien ou d'un centre de référence. Exclure la forme vasculaire en cas de signes évocateurs.", "pec": "Kinésithérapie de renforcement doux, protection articulaire, gestion de la douleur, prise en charge de la dysautonomie et du tube digestif.", "traitements": [{"label": "Antalgiques", "marques": ["Paracétamol"]}, {"label": "Traitement de la dysautonomie (selon avis)", "marques": ["Procoralan"]}], "operations": [], "naturo": "Insister sur le renforcement musculaire progressif et le travail postural, les repas fractionnés, l'hydratation, le sommeil. Éviter les étirements forcés. Prudence avec les fluoroquinolones (risque de rupture de tendon). Rechercher POTS, SAMA, gastroparésie.", "alertes": ["Douleur thoracique ou abdominale brutale et intense, déchirure : urgence (forme vasculaire possible)", "Luxation répétée : kiné et rhumatologue"], "aNePasFaire": ["Prescrire des étirements profonds", "Promettre une guérison", "Banaliser les douleurs"], "questions": ["Avez-vous des luxations, des entorses fréquentes ?", "Des antécédents familiaux de rupture artérielle ?", "Avez-vous des malaises en position debout ?"], "outils": "Voir fiche Dysautonomie et POTS.", "voirAussi": ["Dysautonomie et POTS (tachycardie posturale)", "Syndrome d'activation mastocytaire (SAMA)", "Gastroparésie", "Fibromyalgie"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Apnée du sommeil", "type": "maladie", "categorie": "Respiratoire et allergies", "alias": ["SAOS", "ronflements", "pauses respiratoires", "somnolence", "fatigue au réveil"], "enBref": "Arrêts ou diminutions répétés de la respiration pendant le sommeil, qui fragmentent le repos et épuisent le cœur. Très sous-diagnostiquée chez les femmes.", "physiologie": "Pendant le sommeil, les muscles de la gorge se relâchent et les voies aériennes se ferment. L'oxygène baisse, le cerveau déclenche un micro-éveil pour reprendre la respiration. Chaque nuit, des dizaines de micro-éveils et de poussées d'adrénaline fatiguent le sommeil et élèvent la tension, la glycémie et le risque cardiovasculaire.", "symptomes": "Ronflements, pauses respiratoires, réveil non reposant, maux de tête au réveil, somnolence diurne, nycturie, irritabilité. Chez les femmes : insomnie, fatigue, anxiété, plutôt que ronflement bruyant.", "diagnostic": "Questionnaires (STOP-BANG, Epworth), polygraphie ou polysomnographie.", "pec": "Pression positive continue (PPC), orthèse d'avancée mandibulaire, perte de poids, chirurgie ORL ou stimulation du nerf hypoglosse selon le cas.", "traitements": [{"label": "Pression positive continue (PPC)", "marques": []}, {"label": "Orthèse d'avancée mandibulaire", "marques": []}], "operations": [], "naturo": "Penser à l'apnée devant fatigue, hypertension, reflux, insomnie, sommeil non réparateur, surtout après la ménopause. Orienter vers un test. Éviter alcool le soir et sédatifs. Position de sommeil, poids, narines. Ne pas traiter une insomnie à l'aveugle.", "alertes": ["Somnolence au volant, endormissements involontaires : bilan sans délai", "Pauses respiratoires prolongées observées par le conjoint : avis rapide"], "aNePasFaire": ["Proposer des plantes sédatives sans avoir exclu l'apnée", "Banaliser des ronflements forts"], "questions": ["Ronflez-vous, a-t-on observé des pauses ?", "Êtes-vous fatigué·e malgré une nuit complète ?", "Un test du sommeil a-t-il été fait ?"], "outils": "Voir fiches Insomnies, Syndrome métabolique.", "voirAussi": ["Insomnies chroniques", "Syndrome métabolique", "Hypertension artérielle"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Trouble de stress post-traumatique et traumatismes", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["TSPT", "PTSD", "traumatisme", "choc post-traumatique", "EMDR", "trauma complexe"], "enBref": "Réaction durable après un événement menaçant (violence, accident, agression, deuil brutal) ou des traumatismes répétés, avec souvenirs intrusifs, évitement, hypervigilance et tristesse. Le trauma complexe suit des expériences répétées, souvent dans l'enfance.", "physiologie": "Face au danger, l'amygdale déclenche la réponse de stress (adrénaline, cortisol). Dans le TSPT, le souvenir n'est pas « rangé » : le cerveau garde l'alerte en mode ouvert. Le sommeil se dégrade, l'intestin, la thyroïde, les hormones et l'immunité en pâtissent. Les troubles digestifs, douleurs chroniques et fatigue sont fréquents.", "symptomes": "Cauchemars, flash-backs, sursauts, évitement, engourdissement émotionnel, irritabilité, troubles du sommeil, douleurs diffuses, troubles digestifs.", "diagnostic": "Évaluation par un psychiatre ou un psychologue formé au trauma. Elle ne se fait pas en consultation de naturopathie.", "pec": "Psychothérapies centrées sur le trauma (EMDR, TCC centrée sur le trauma), parfois ISRS. Prise en charge du sommeil.", "traitements": [{"label": "ISRS", "marques": ["Zoloft (sertraline)", "Deroxat (paroxétine)"]}, {"label": "Prazosine (cas sélectionnés)", "marques": ["Minipress"]}], "operations": [], "naturo": "Ne pas faire revivre l'événement en consultation : pas d'exploration du trauma, pas d'interrogatoire détaillé. Offrir un cadre sécurisant, laisser la cliente décider de ce qu'elle dit. Soutenir sommeil, régularité, respiration, activité douce, intestin. Orienter vers un professionnel formé. Vigilance suicidaire (RÈGLE N°61).", "alertes": ["Idées noires ou envie de mourir : conduite à tenir immédiate, 3114", "Violences en cours ou danger : 17 ou 3919 (violences conjugales)", "Dissociation sévère, flash-backs envahissants : orientation psychiatrique"], "aNePasFaire": ["Pousser la cliente à raconter son histoire", "Promettre de « guérir » le trauma par l'alimentation", "Proposer des plantes psychoactives sans avis"], "questions": ["Souhaitez-vous en parler ou préférez-vous ne pas détailler ?", "Un professionnel vous accompagne-t-il ?", "Comment dormez-vous ?"], "outils": "Générateur : RÈGLE N°61.", "voirAussi": ["Idées suicidaires — conduite à tenir", "Anxiété généralisée", "Insomnies chroniques"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Troubles anxieux, attaques de panique et phobies", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["panique", "angoisse", "spasmophilie", "crise d'angoisse", "phobie", "anxiété sociale", "hyperventilation"], "enBref": "Ensemble de troubles où la peur est excessive ou survient sans danger réel : attaques de panique, phobies, anxiété sociale, anxiété généralisée. « Spasmophilie » est un terme populaire qui recouvre le plus souvent une crise de panique ou une hyperventilation.", "physiologie": "Face à une menace perçue, le système nerveux sympathique accélère le cœur et la respiration. En cas d'hyperventilation, le CO2 sanguin chute (hypocapnie), ce qui provoque fourmillements, crampes des mains, vertiges, sensation d'étouffement : ces signes entretiennent la peur et alimentent la crise. Le cerveau anticipe alors la prochaine crise.", "symptomes": "Palpitations, oppression thoracique, fourmillements, sensation d'étouffement, peur de mourir ou de perdre le contrôle, évitement de certaines situations.", "diagnostic": "Évaluation médicale pour éliminer thyroïde, arythmie, hypoglycémie, anémie, effets de substances. Évaluation psychologique ou psychiatrique.", "pec": "Thérapie cognitivo-comportementale, antidépresseurs ISRS, anxiolytiques de courte durée en dernier recours.", "traitements": [{"label": "ISRS", "marques": ["Seroplex (escitalopram)", "Zoloft"]}, {"label": "Anxiolytiques (courte durée)", "marques": ["Atarax", "Xanax", "Lexomil"]}, {"label": "Lavande orale (Silexan)", "marques": ["Lasea"]}], "operations": [], "naturo": "Expliquer le cycle de la panique et la respiration : respirer lentement, expirer longuement, cohérence cardiaque. Caféine, alcool, sucre rapide, manque de sommeil aggravent. Magnésium selon bilan, sans promettre. Plantes calmantes avec prudence selon traitement et bipolarité. Ne jamais sevrer un anxiolytique soi-même.", "alertes": ["Douleur thoracique persistante ou irradiante, essoufflement important : avis urgent, ne pas supposer l'angoisse", "Idées noires : RÈGLE N°61"], "aNePasFaire": ["Poser « spasmophilie » comme diagnostic", "Proposer 5-HTP ou millepertuis sans avoir exclu bipolarité et traitement", "Arrêter un anxiolytique brutalement"], "questions": ["À quel moment surviennent les crises ?", "Quelle respiration avez-vous pendant la crise ?", "Prenez-vous un anxiolytique ou un antidépresseur ?"], "outils": "Générateur : RÈGLE N°61.", "voirAussi": ["Anxiété généralisée", "Dépression / anxiété diagnostiquée", "Trouble de stress post-traumatique et traumatismes"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Autisme chez l'adulte et chez la femme", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["autisme", "TSA", "Asperger", "autisme féminin", "masking", "hypersensibilité sensorielle"], "enBref": "Fonctionnement neurodéveloppemental avec des particularités de communication, de sensorialité et d'intérêts. Chez les femmes, il est souvent repéré tard, car il est masqué par l'adaptation sociale (masking).", "physiologie": "Le cerveau traite différemment les informations sensorielles et sociales. L'adaptation constante épuise (burn-out autistique). Les particularités sensorielles expliquent une sélectivité alimentaire, une sensibilité aux textures, au bruit, à la lumière. Troubles digestifs, anxiété, troubles du sommeil, hypermobilité et TCA sont plus fréquents.", "symptomes": "Difficulté à lire les codes sociaux, épuisement après les interactions, besoin de routine, hypersensibilité sensorielle, intérêts intenses, anxiété, troubles digestifs, sélectivité alimentaire.", "diagnostic": "Évaluation spécialisée (centre ressources autisme, psychiatre ou psychologue formé aux femmes autistes). Un diagnostic tardif est courant.", "pec": "Pas de traitement de l'autisme lui-même. Aménagements, psychoéducation, accompagnement de l'anxiété, du sommeil, des troubles associés.", "traitements": [{"label": "Traitements des troubles associés", "marques": []}], "operations": [], "naturo": "Adapter la consultation : consignes écrites, déroulé clair, pas d'injonctions floues, temps de réponse, respect des particularités sensorielles. Ne pas forcer l'élargissement alimentaire ni retirer les aliments « sûrs » : l'alimentation sélective peut relever d'un ARFID. Soutenir sommeil, intestin, énergie. Ne pas pathologiser ni promettre de « guérir ».", "alertes": ["Épuisement majeur, idées noires : RÈGLE N°61", "Perte de poids ou restriction : orientation médicale (RÈGLE N°59)"], "aNePasFaire": ["Pousser à manger tout ce qui est refusé", "Parler d'un « problème » à corriger", "Multiplier les consignes orales ou vagues"], "questions": ["Comment préférez-vous que nous échangions ?", "Y a-t-il des aliments ou textures qui posent problème ?", "Avez-vous un diagnostic ou des questions à ce sujet ?"], "outils": "Générateur : RÈGLE N°59 (ARFID).", "voirAussi": ["Restriction alimentaire évitante (ARFID)", "TDAH", "Troubles anxieux, attaques de panique et phobies"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Addictions : alcool, tabac, cannabis", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": ["alcool", "dépendance à l'alcool", "tabagisme", "sevrage tabagique", "cannabis", "addiction"], "enBref": "Consommation répétée malgré les dommages, avec perte de contrôle, tolérance et sevrage. L'alcool, le tabac et le cannabis sont les plus fréquents. L'addiction est une maladie du circuit de la récompense, pas un manque de volonté.", "physiologie": "Les substances stimulent le circuit de la dopamine (récompense). Avec la répétition, le cerveau s'adapte : il faut plus pour le même effet, et l'arrêt provoque un sevrage. L'alcool altère le foie, le pancréas, l'intestin, le sommeil, les hormones et les vitamines (B1). Le tabac touche les vaisseaux, les poumons et la fertilité. Le cannabis perturbe l'humeur, le sommeil et la motivation.", "symptomes": "Consommation difficile à contrôler, sevrage (tremblements, sueurs, anxiété), troubles du sommeil, troubles digestifs, humeur basse, honte.", "diagnostic": "Évaluation par le médecin ou un centre spécialisé (CSAPA). Questionnaires de repérage (AUDIT).", "pec": "Entretien motivationnel, accompagnement psychologique, traitements : naltrexone, acamprosate, nalméfène, baclofène (alcool), substituts nicotiniques, varénicline (tabac). Le sevrage de l'alcool doit être encadré médicalement.", "traitements": [{"label": "Aides au maintien de l'abstinence (alcool)", "marques": ["Revia (naltrexone)", "Aotal (acamprosate)"]}, {"label": "Substituts nicotiniques", "marques": ["Nicopatch", "Nicorette"]}, {"label": "Varénicline", "marques": ["Champix"]}], "operations": [], "naturo": "Poser la question sans jugement. Le sevrage brutal de l'alcool peut provoquer des convulsions et un délirium : ne jamais conseiller d'arrêter d'un coup en cas de consommation importante. Soutenir la réparation : thiamine (B1) sur avis médical, hydratation, alimentation, foie, sommeil. Alcool Info Service 0 980 980 930, Tabac Info Service 39 89, Drogues Info Service 0 800 23 13 13 (numéros à vérifier avant diffusion).", "alertes": ["Tremblements, hallucinations, confusion, convulsions à l'arrêt : urgence 15", "Idées noires : RÈGLE N°61"], "aNePasFaire": ["Conseiller l'arrêt brutal de l'alcool", "Proposer des plantes psychoactives pour compenser", "Culpabiliser"], "questions": ["Quelle est votre consommation sur une semaine ?", "Avez-vous déjà essayé d'arrêter ?", "Souhaitez-vous de l'aide médicale ?"], "outils": "Générateur : RÈGLE N°61.", "voirAussi": ["Stéatose hépatique métabolique (foie gras)", "Insomnies chroniques", "Idées suicidaires — conduite à tenir"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Obésité et traitements par analogues du GLP-1", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["obésité", "surpoids", "Ozempic", "Wegovy", "Mounjaro", "sémaglutide", "tirzépatide", "GLP-1"], "enBref": "Maladie chronique de la régulation du poids et de la graisse corporelle (IMC de 30 ou plus), influencée par la génétique, les hormones, le sommeil, le stress et l'environnement. Les médicaments de la famille du GLP-1 sont de plus en plus prescrits.", "physiologie": "Le cerveau défend un « poids d'équilibre » par des signaux de faim et de satiété (leptine, ghréline, GLP-1). Les régimes répétés augmentent la faim et baissent la dépense. Les analogues du GLP-1 augmentent la satiété et ralentissent la vidange gastrique ; ils font perdre du poids, mais aussi de la masse musculaire si les protéines et l'entraînement manquent. Ils peuvent provoquer nausées, constipation, carences, reflux, et réduire l'efficacité de certaines pilules orales (tirzépatide).", "symptomes": "Prise de poids, essoufflement, douleurs articulaires, apnée du sommeil, insulinorésistance, SOPK, problèmes de fertilité ; sous GLP-1 : nausées, constipation, fonte musculaire, carences.", "diagnostic": "Médecin ou centre spécialisé de l'obésité : IMC, tour de taille, bilan métabolique et cardiovasculaire.", "pec": "Mode de vie, soutien psychologique, analogues du GLP-1, chirurgie bariatrique. Le traitement médical doit être suivi.", "traitements": [{"label": "Analogues du GLP-1 et GIP", "marques": ["Wegovy (sémaglutide)", "Ozempic", "Mounjaro (tirzépatide)", "Saxenda"]}], "operations": [], "naturo": "Parler de santé et de fonctions, jamais de kilos : aucun chiffre de poids ou de calories (RÈGLE N°59 en cas de TCA). Sous GLP-1 : protéines suffisantes, entraînement de résistance, hydratation, fibres progressives, repas fractionnés, surveillance des carences. Rechercher un TCA (hyperphagie). Ne pas conseiller d'arrêter le traitement.", "alertes": ["Douleur abdominale intense, vomissements incoercibles : urgence (pancréatite)", "Perte de poids trop rapide, signes de restriction : orientation médicale"], "aNePasFaire": ["Promettre une perte de poids", "Proposer des régimes hypocaloriques ou des jeûnes", "Conseiller des « brûleurs de graisse »"], "questions": ["Suivez-vous un traitement ou un parcours médical ?", "Comment vivez-vous votre alimentation ?", "Quelles sont vos priorités de santé ?"], "outils": "Générateur : RÈGLES N°55, N°59.", "voirAussi": ["Syndrome métabolique", "Hyperphagie boulimique", "Sarcopénie et perte de muscle", "Apnée du sommeil"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Goutte et hyperuricémie", "type": "maladie", "categorie": "Orthopédie et rhumatologie", "alias": ["goutte", "acide urique", "uricémie", "crise de goutte", "crises articulaires du gros orteil"], "enBref": "Inflammation articulaire provoquée par des cristaux d'urate dans l'articulation, le plus souvent le gros orteil. Elle est liée à un excès d'acide urique dans le sang.", "physiologie": "L'acide urique vient de la dégradation des purines (alimentation et cellules). Quand il dépasse sa solubilité, des cristaux se déposent dans les articulations et déclenchent une crise très douloureuse. L'alcool (surtout la bière), les sodas fructosés, la déshydratation, l'obésité, l'insulinorésistance, certains médicaments (diurétiques) et la génétique augmentent le risque.", "symptomes": "Douleur brutale, rougeur, chaleur et gonflement d'une articulation (souvent le gros orteil), souvent la nuit.", "diagnostic": "Dosage de l'uricémie (à distance de la crise), ponction articulaire, échographie ou scanner double énergie.", "pec": "Crise : colchicine, anti-inflammatoires ou corticoïdes. Fond : allopurinol ou fébuxostat selon l'avis, jamais pendant une crise aiguë sans cadre. Hygiène de vie.", "traitements": [{"label": "Traitement de crise", "marques": ["Colchicine", "Ibuprofène", "Solupred"]}, {"label": "Traitement de fond", "marques": ["Zyloric (allopurinol)", "Adenuric (fébuxostat)"]}], "operations": [], "naturo": "Hydratation, réduction de l'alcool et des sodas sucrés, poids, activité physique, limiter abats et excès de viande rouge et de fruits de mer. Les cerises sont un bon aliment mais ne remplacent pas le traitement. Éviter le jeûne et les régimes très restrictifs (ils augmentent l'uricémie). Interaction : prudence avec colchicine et jus de pamplemousse.", "alertes": ["Articulation chaude avec fièvre : avis urgent (arthrite infectieuse)", "Colique néphrétique : urgence"], "aNePasFaire": ["Proposer un jeûne ou un régime très hypocalorique", "Arrêter ou débuter l'allopurinol soi-même"], "questions": ["Quelle articulation, quelle fréquence de crises ?", "Quelle est votre uricémie ?", "Prenez-vous des diurétiques ?"], "outils": "Voir fiches Syndrome métabolique, Arthrose.", "voirAussi": ["Syndrome métabolique", "Arthrose"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Syndrome de Gilbert", "type": "maladie", "categorie": "Digestif", "alias": ["Gilbert", "bilirubine élevée", "jaunisse bénigne", "bilirubine libre"], "enBref": "Variante génétique bénigne et très fréquente (3 à 7 % de la population) qui élève légèrement la bilirubine libre, surtout à jeun, en cas de fatigue, de stress ou de maladie.", "physiologie": "L'enzyme UGT1A1 du foie conjugue la bilirubine pour l'éliminer. Dans le syndrome de Gilbert, son activité est réduite d'environ 70 %. La bilirubine non conjuguée monte légèrement, surtout lors du jeûne, de la déshydratation, du stress ou d'une infection. Les autres tests hépatiques (transaminases, phosphatases) restent normaux.", "symptomes": "Souvent aucun ; parfois un léger jaunissement des yeux, une fatigue, de l'inconfort digestif lors du jeûne ou de la maladie.", "diagnostic": "Bilirubine élevée à prédominance libre avec transaminases normales et sans hémolyse. Le diagnostic est clinique et biologique.", "pec": "Aucun traitement n'est nécessaire. Informer le médecin avant certains médicaments (irinotécan, certains antirétroviraux).", "traitements": [{"label": "Aucun traitement", "marques": []}], "operations": [], "naturo": "Rassurer : ce n'est pas une maladie du foie. Éviter les jeûnes prolongés, la déshydratation, le manque de sommeil, qui augmentent la bilirubine. Ne pas proposer de cure « détox ». L'informer des médicaments concernés.", "alertes": ["Jaunisse persistante, selles décolorées, urines foncées, douleur abdominale : bilan hépatique complet"], "aNePasFaire": ["Proposer des cures de détox du foie", "Prescrire un jeûne", "Dire qu'il y a une maladie du foie"], "questions": ["Votre bilirubine augmente-t-elle surtout à jeun ou quand vous êtes fatigué·e ?", "Vos transaminases sont-elles normales ?", "Prenez-vous un médicament métabolisé par le foie ?"], "outils": "Générateur : jeûne déconseillé.", "voirAussi": ["Stéatose hépatique métabolique (foie gras)", "Hémochromatose"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Sarcopénie et perte de muscle", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["sarcopénie", "fonte musculaire", "perte de force", "masse musculaire", "résistance à l'insuline musculaire"], "enBref": "Perte de masse et de force musculaires, liée à l'âge, à la sédentarité, à une alimentation pauvre en protéines, à certaines maladies ou à une perte de poids rapide (régimes, analogues du GLP-1). Elle augmente le risque de chutes et de diabète.", "physiologie": "Le muscle est un organe métabolique : il stocke le glucose, produit des myokines anti-inflammatoires et protège les os. Avec l'âge, la synthèse musculaire répond moins aux protéines (résistance anabolique). La ménopause (baisse des œstrogènes), la sédentarité, l'inflammation, la carence en vitamine D, la restriction énergétique accélèrent la perte.", "symptomes": "Fatigue, faiblesse, lenteur à la marche, difficulté à se lever d'une chaise, perte de force de préhension, chutes.", "diagnostic": "Force de préhension, test de lever de chaise, vitesse de marche, composition corporelle (DXA, impédancemétrie).", "pec": "Exercices de résistance, apport suffisant en protéines et en énergie, correction de la vitamine D, traitement des causes.", "traitements": [{"label": "Vitamine D", "marques": ["Uvedose", "Zyma D"]}], "operations": [], "naturo": "Priorité à l'entraînement de résistance et aux protéines réparties sur les repas (chez les personnes âgées, davantage que chez l'adulte jeune). Ne jamais prescrire de régime hypocalorique à une personne à risque. Vitamine D selon dosage. Chiffres de protéines réservés à l'usage praticien, jamais en cas de TCA.", "alertes": ["Chute, perte de poids involontaire rapide, faiblesse brutale : avis médical"], "aNePasFaire": ["Proposer un régime restrictif", "Promettre une prise de muscle sans entraînement"], "questions": ["Pratiquez-vous un travail de force ?", "Mangez-vous des protéines à chaque repas ?", "Avez-vous perdu du poids récemment ?"], "outils": "Voir fiches Ostéoporose, Périménopause.", "voirAussi": ["Ostéoporose", "Périménopause et ménopause", "Obésité et traitements par analogues du GLP-1"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hidradénite suppurée", "type": "maladie", "categorie": "Peau", "alias": ["maladie de Verneuil", "acné inversée", "abcès récidivants aisselles", "nodules sous les seins"], "enBref": "Maladie inflammatoire chronique des plis (aisselles, aines, sous les seins, fesses), avec des nodules douloureux, des abcès et des tunnels. Elle est souvent diagnostiquée avec 7 à 10 ans de retard.", "physiologie": "L'obstruction des follicules pileux déclenche une inflammation profonde qui ne guérit pas et forme des cicatrices. Le tabac, l'obésité, les frictions, les hormones et une prédisposition génétique favorisent la maladie. Elle est associée au syndrome métabolique, au SOPK, aux MICI, à la spondylarthrite.", "symptomes": "Nodules douloureux dans les plis, abcès qui s'ouvrent, cicatrices, tunnels, douleur, retentissement psychologique.", "diagnostic": "Clinique par un dermatologue (nodules, tunnels, cicatrices, récidives). Échographie pour évaluer l'extension.", "pec": "Soins locaux, antibiotiques (cyclines, clindamycine + rifampicine), biothérapies (adalimumab, sécukinumab, bimekizumab), chirurgie.", "traitements": [{"label": "Antibiotiques", "marques": ["Doxycycline", "Clindamycine + rifampicine"]}, {"label": "Biothérapies", "marques": ["Humira (adalimumab)", "Cosentyx", "Bimzelx"]}], "operations": [], "naturo": "Valider la douleur, qui n'est ni un défaut d'hygiène ni une infection banale. Arrêt du tabac, poids, éviter les frictions, soutenir l'intestin, rechercher un syndrome métabolique ou SOPK. Pas de promesse de guérison. Soutien psychologique.", "alertes": ["Fièvre, abcès étendus, douleur intense : avis médical", "Isolement, détresse : RÈGLE N°61"], "aNePasFaire": ["Imposer un régime d'éviction large sans appui", "Promettre une guérison naturelle", "Banaliser ou parler de manque d'hygiène"], "questions": ["Depuis combien de temps avez-vous ces lésions ?", "Un dermatologue vous suit-il ?", "Fumez-vous ?"], "outils": "Voir fiches SOPK, MICI.", "voirAussi": ["SOPK (syndrome des ovaires polykystiques)", "MICI (Crohn / RCH)", "Syndrome métabolique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Dermatite séborrhéique", "type": "maladie", "categorie": "Peau", "alias": ["pellicules", "séborrhée", "plaques rouges sur le visage", "dermite séborrhéique"], "enBref": "Inflammation chronique de la peau riche en glandes sébacées (cuir chevelu, sourcils, ailes du nez, torse), avec rougeurs et squames grasses. Les pellicules en sont la forme légère.", "physiologie": "La levure Malassezia, présente normalement sur la peau, métabolise le sébum et libère des acides gras irritants. Chez les personnes prédisposées, le système immunitaire réagit par une inflammation. Les poussées sont favorisées par le stress, la fatigue, le froid, certaines maladies (Parkinson, VIH).", "symptomes": "Squames jaunes grasses, rougeurs, démangeaisons, poussées par périodes.", "diagnostic": "Clinique. Éliminer psoriasis, eczéma, rosacée.", "pec": "Shampooing antifongique (kétoconazole), crème antifongique, dermocorticoïde court, émollients.", "traitements": [{"label": "Antifongiques", "marques": ["Kétoderm (kétoconazole)", "Selsun"]}, {"label": "Dermocorticoïdes courts", "marques": ["Locoïd"]}], "operations": [], "naturo": "Expliquer le rôle de la levure et du stress. Soins doux, éviter les savons agressifs, sommeil, gestion du stress. Zinc et oméga-3 selon profil, sans promesse. Pas d'huiles essentielles sur la peau du visage.", "alertes": ["Lésions étendues, suintantes ou douloureuses : avis dermatologique"], "aNePasFaire": ["Appliquer des huiles essentielles", "Décaper le cuir chevelu"], "questions": ["Où sont les plaques ? Les poussées suivent-elles le stress ?", "Quels shampooings utilisez-vous ?", "Existe-t-il un psoriasis ?"], "outils": "Voir fiches Psoriasis, Rosacée.", "voirAussi": ["Psoriasis", "Rosacée", "Eczéma / dermatite atopique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Mononucléose et réactivation du virus d'Epstein-Barr", "type": "maladie", "categorie": "Infections et IST", "alias": ["EBV", "Epstein-Barr", "mono", "mononucléose", "maladie du baiser", "fatigue post-virale"], "enBref": "Le virus d'Epstein-Barr infecte plus de 90 % des adultes. La mononucléose, parfois très fatigante, en est la forme aiguë. La « réactivation chronique » détectée par des sérologies est un diagnostic très contesté.", "physiologie": "Le virus infecte les lymphocytes B puis reste latent à vie. Lors de la primo-infection, la réponse immunitaire provoque angine, fièvre, ganglions, rate augmentée. Chez certaines personnes, la fatigue persiste des mois. Des anticorps positifs (EBNA, VCA IgG) signent seulement un contact ancien. Le virus est associé à un risque accru de sclérose en plaques et de certains lymphomes.", "symptomes": "Angine, fièvre, fatigue intense, ganglions du cou, rate augmentée, éruption ; fatigue prolongée après la phase aiguë.", "diagnostic": "Test rapide (MNI test), sérologie (VCA IgM, VCA IgG, EBNA IgG). Ne pas diagnostiquer une réactivation sur une sérologie isolée.", "pec": "Repos, antalgiques, hydratation. Pas d'antibiotiques (aminopénicillines : éruption). Éviter les sports de contact pendant plusieurs semaines.", "traitements": [{"label": "Antalgiques et antipyrétiques", "marques": ["Paracétamol"]}], "operations": [], "naturo": "Repos réel et progressif, alimentation légère, hydratation, sommeil. Éviter l'alcool pendant la convalescence hépatique. Ne pas poser de diagnostic de « réactivation » sur une sérologie. Penser à d'autres causes de fatigue (thyroïde, anémie, dépression, SFC).", "alertes": ["Douleur vive à gauche sous les côtes, malaise : rupture de rate, urgence 15", "Difficulté à respirer ou à avaler : urgence", "Fatigue invalidante qui dure plus de 6 mois : bilan, voir SFC"], "aNePasFaire": ["Poser un diagnostic de réactivation sur une sérologie", "Conseiller le sport de contact précoce", "Proposer un immunostimulant sans avis"], "questions": ["Quand a eu lieu l'infection ? A-t-elle été confirmée ?", "La fatigue dure-t-elle depuis plusieurs mois ?", "Quel test a été réalisé ?"], "outils": "Voir fiche SFC.", "voirAussi": ["Syndrome de fatigue chronique (encéphalomyélite myalgique)", "Infections récidivantes et immunité"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Parasitoses intestinales", "type": "maladie", "categorie": "Digestif", "alias": ["parasites", "giardia", "blastocystis", "oxyures", "vers", "dientamoeba", "amibes"], "enBref": "Infection du tube digestif par des protozoaires (Giardia, Blastocystis, Dientamoeba, amibes) ou des helminthes (oxyures, ascaris). Elle peut provoquer des troubles chroniques ou n'en provoquer aucun.", "physiologie": "Les parasites se transmettent par l'eau, les aliments ou les mains. Certains, comme Giardia, abîment la bordure en brosse et provoquent diarrhée, ballonnements, malabsorption. D'autres, comme Blastocystis, sont souvent des portages sans conséquence. Une infection peut déclencher ensuite un SII post-infectieux ou un SIBO.", "symptomes": "Diarrhée, ballonnements, gaz, douleurs, fatigue, perte de poids, démangeaisons anales (oxyures), voyage récent.", "diagnostic": "Examen parasitologique des selles (EPS) sur 3 prélèvements, PCR selon indication. Les analyses de selles du commerce sans validation sont à manier avec prudence.", "pec": "Antiparasitaires ciblés (tinidazole, métronidazole, albendazole, mébendazole), traitement de l'entourage pour les oxyures.", "traitements": [{"label": "Antiparasitaires", "marques": ["Fasigyne (tinidazole)", "Flagyl (métronidazole)", "Zentel (albendazole)", "Vermox (mébendazole)"]}], "operations": [], "naturo": "Ne pas poser de diagnostic de parasitose sans examen médical. Les « cures antiparasitaires » à base de plantes (artemisia, noyer noir) ne remplacent pas un traitement validé. Hygiène des mains, eau, cuisson. Après traitement : restaurer la muqueuse et le microbiote, penser au SIBO et au SII post-infectieux.", "alertes": ["Diarrhée sanglante, fièvre, déshydratation, retour de voyage avec fièvre : avis médical rapide"], "aNePasFaire": ["Proposer une cure antiparasitaire naturelle comme traitement", "Poser le diagnostic à partir d'un test du commerce", "Traiter l'enfant sans avis"], "questions": ["Avez-vous voyagé récemment ?", "Quel examen de selles a été fait ?", "La diarrhée a-t-elle commencé après un épisode aigu ?"], "outils": "Voir fiches SIBO, SII.", "voirAussi": ["SIBO (pullulation bactérienne de l'intestin grêle)", "SII (syndrome de l'intestin irritable)", "Dysbiose intestinale"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Sinusite chronique et rhinosinusite", "type": "maladie", "categorie": "Respiratoire et allergies", "alias": ["sinusite", "nez bouché chronique", "polypes nasaux", "rhinosinusite", "sinus"], "enBref": "Inflammation des sinus qui dure plus de 12 semaines, avec nez bouché, écoulement, douleur ou pesanteur du visage et perte de l'odorat. Elle peut s'accompagner de polypes.", "physiologie": "La muqueuse des sinus gonfle sous l'effet d'une allergie, d'une infection, d'un asthme ou d'une inflammation de type 2. Les orifices de drainage se bouchent, le mucus stagne, l'odorat disparaît. Une intolérance à l'aspirine et aux AINS peut être associée à l'asthme et aux polypes.", "symptomes": "Nez bouché, écoulement épais, douleur du visage, perte de l'odorat, toux, maux de tête.", "diagnostic": "Examen ORL (nasofibroscopie), scanner des sinus, bilan allergique.", "pec": "Lavages de nez, corticoïdes nasaux, chirurgie endoscopique, biothérapies dans les formes sévères.", "traitements": [{"label": "Corticoïdes nasaux", "marques": ["Nasonex", "Rhinocort"]}, {"label": "Biothérapies", "marques": ["Dupixent (dupilumab)"]}], "operations": [], "naturo": "Lavages au sérum physiologique, humidité de l'air, traitement de l'allergie. Aucun produit irritant dans le nez. Penser à l'asthme associé. Éviter les huiles essentielles en inhalation en cas d'asthme.", "alertes": ["Atteinte d'un seul côté, saignement, douleur d'un œil, œdème autour de l'œil, fièvre élevée : urgence", "Perte de l'odorat brutale : avis ORL"], "aNePasFaire": ["Multiplier les antibiotiques", "Appliquer des huiles essentielles dans le nez"], "questions": ["Depuis combien de temps ?", "Avez-vous de l'asthme ou des allergies ?", "L'odorat est-il atteint ?"], "outils": "Voir fiches Allergies respiratoires, Asthme.", "voirAussi": ["Allergies respiratoires et rhinite allergique", "Asthme", "Infections récidivantes et immunité"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cancer colorectal : dépistage et signes d'alerte", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["cancer du côlon", "cancer du rectum", "polypes", "sang dans les selles", "dépistage colorectal"], "enBref": "Cancer fréquent, souvent curable s'il est détecté tôt. Il naît d'un polype qui se transforme lentement. Le dépistage organisé repose sur un test immunologique de recherche de sang dans les selles, proposé entre 50 et 74 ans.", "physiologie": "Des polypes de la muqueuse du côlon peuvent évoluer sur plusieurs années. Des facteurs de risque sont connus : âge, antécédents familiaux, MICI, alimentation pauvre en fibres, viandes transformées, alcool, tabac, sédentarité, obésité. Un saignement chronique peut provoquer une anémie par carence en fer.", "symptomes": "Sang dans les selles, changement durable du transit, douleur abdominale, amaigrissement, fatigue, anémie par carence en fer.", "diagnostic": "Test immunologique de dépistage (50-74 ans, tous les 2 ans), coloscopie en cas de test positif, de symptômes ou de risque familial.", "pec": "Chirurgie, chimiothérapie, radiothérapie du rectum, immunothérapie selon le stade.", "traitements": [{"label": "Chimiothérapies", "marques": ["FOLFOX", "Xeloda (capécitabine)"]}, {"label": "Thérapies ciblées", "marques": ["Avastin", "Erbitux"]}], "operations": [], "naturo": "Rôle d'alerte : ne jamais attribuer un saignement, une anémie ou un changement de transit récent à un SII ou à des hémorroïdes sans examen. Rappeler le dépistage organisé. Après diagnostic : suivre la fiche Cancer — principes d'accompagnement (RÈGLE N°62).", "alertes": ["Sang dans les selles, selles noires, changement de transit durable, anémie, perte de poids après 40 ans : coloscopie", "Occlusion (ventre ballonné, vomissements, absence de selles et de gaz) : urgence"], "aNePasFaire": ["Attribuer un saignement aux hémorroïdes sans examen", "Retarder une coloscopie", "Proposer des compléments sans l'oncologue"], "questions": ["Depuis quand le transit a-t-il changé ?", "Y a-t-il du sang ou une anémie ?", "Avez-vous fait le test de dépistage ?"], "outils": "Générateur : RÈGLES N°5sexies, N°62.", "voirAussi": ["Cancer — principes d'accompagnement", "Hémorroïdes", "MICI (Crohn / RCH)", "SII (syndrome de l'intestin irritable)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cancer de la thyroïde : nodules et signes d'alerte", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["nodule thyroïdien", "goitre", "cancer de la thyroïde", "thyroïdectomie totale"], "enBref": "Les nodules thyroïdiens sont fréquents et presque toujours bénins. Une minorité correspond à un cancer, le plus souvent différencié (papillaire) et de bon pronostic.", "physiologie": "La thyroïde peut former des nodules sous l'influence de la carence en iode, de l'hérédité ou du hasard. L'échographie et la ponction à l'aiguille fine permettent de distinguer le bénin du malin. Après thyroïdectomie totale, la lévothyroxine remplace l'hormone et peut être donnée à dose freinatrice pour limiter la récidive.", "symptomes": "Boule dans le cou, gêne à la déglutition, voix enrouée, ganglion du cou ; souvent aucun symptôme.", "diagnostic": "Échographie, TSH, cytoponction à l'aiguille fine, parfois scintigraphie.", "pec": "Surveillance ou chirurgie (lobectomie, thyroïdectomie totale), iode radioactif dans certains cas, lévothyroxine à vie.", "traitements": [{"label": "Lévothyroxine", "marques": ["Levothyrox"]}, {"label": "Iode radioactif", "marques": []}], "operations": [], "naturo": "Respecter la prise de lévothyroxine, à distance de fer, calcium, magnésium. Aucun iode, aucun kelp, aucun complément thyroïdien sans l'endocrinologue. Surveillance du calcium si les parathyroïdes ont été touchées. Pas de « soutien de la thyroïde » par complément en cas de nodule.", "alertes": ["Nodule qui grossit vite, voix modifiée, difficulté à avaler ou respirer : avis rapide", "Fourmillements des lèvres et mains après chirurgie : calcium bas, urgence"], "aNePasFaire": ["Donner de l'iode", "Modifier le traitement", "Annoncer qu'un nodule est « bénin » sans examen"], "questions": ["Une échographie a-t-elle été faite ?", "Avez-vous été opéré·e ?", "Quelle dose de lévothyroxine prenez-vous ?"], "outils": "Générateur : RÈGLES N°6, N°11, N°62.", "voirAussi": ["Cancer — principes d'accompagnement", "Hypothyroïdie et Hashimoto", "Thyroïdectomie"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Cancer de l'ovaire : signes d'alerte discrets", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["cancer de l'ovaire", "kyste suspect", "CA 125", "BRCA", "ballonnement persistant"], "enBref": "Cancer rare mais grave, souvent découvert tard parce que ses signes imitent un trouble digestif ou urinaire. Il n'existe pas de dépistage de masse.", "physiologie": "Les ovaires sont profonds dans le pelvis ; une tumeur reste longtemps silencieuse. Elle peut provoquer une accumulation de liquide, un ballonnement persistant, une satiété précoce, des envies fréquentes d'uriner. Des mutations des gènes BRCA1 et BRCA2 ou le syndrome de Lynch augmentent le risque.", "symptomes": "Ballonnement persistant et récent, douleur pelvienne ou abdominale, satiété précoce, besoin fréquent d'uriner, constipation nouvelle, fatigue, amaigrissement.", "diagnostic": "Examen clinique, échographie pelvienne, IRM, dosage du CA 125 en contexte (non fiable seul), consultation d'oncogénétique en cas d'antécédents familiaux.", "pec": "Chirurgie, chimiothérapie, inhibiteurs de PARP pour certaines mutations.", "traitements": [{"label": "Chimiothérapies", "marques": ["Carboplatine", "Taxol"]}, {"label": "Inhibiteurs de PARP", "marques": ["Lynparza (olaparib)", "Zejula (niraparib)"]}], "operations": [], "naturo": "Rôle d'alerte : un ballonnement qui dure depuis plus de 3 à 4 semaines, ou un « SII » qui apparaît après 50 ans, doit entraîner une consultation et une échographie, pas un régime. Antécédents familiaux de cancer du sein ou de l'ovaire : orienter vers l'oncogénétique. Après diagnostic : RÈGLE N°62.", "alertes": ["Ballonnement persistant récent, douleur pelvienne, saignement après la ménopause : avis gynécologique rapide", "Douleur abdominale brutale : urgence"], "aNePasFaire": ["Attribuer un ballonnement récent à un SIBO ou au SII sans examen après 45 ans", "Rassurer sans échographie"], "questions": ["Depuis quand le ventre est-il gonflé ?", "Y a-t-il des antécédents familiaux ?", "Une échographie pelvienne a-t-elle été faite ?"], "outils": "Générateur : à intégrer aux signaux d'alarme digestifs après 45 ans.", "voirAussi": ["Cancer — principes d'accompagnement", "Endométriose", "SII (syndrome de l'intestin irritable)"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Mélanome : repérage et suivi", "type": "maladie", "categorie": "Cancers et oncologie", "alias": ["grain de beauté", "mélanome", "naevus", "cancer de la peau", "ABCDE"], "enBref": "Cancer de la peau développé à partir des mélanocytes, potentiellement grave mais très curable à un stade précoce. Il se repère par l'évolution d'un grain de beauté ou l'apparition d'une tache nouvelle.", "physiologie": "Les UV abîment l'ADN des mélanocytes. Les coups de soleil, les cabines, le nombre de grains de beauté, la peau claire et les antécédents familiaux augmentent le risque. Le mélanome peut s'étendre en profondeur et essaimer. L'immunothérapie a changé le pronostic des formes avancées.", "symptomes": "Grain de beauté qui change (règle ABCDE : asymétrie, bords irréguliers, couleur inhomogène, diamètre supérieur à 6 mm, évolution), tache nouvelle, saignement, démangeaison.", "diagnostic": "Examen dermatologique avec dermoscopie, exérèse et analyse histologique en cas de doute.", "pec": "Exérèse chirurgicale large, ganglion sentinelle, immunothérapie et thérapies ciblées dans les formes avancées.", "traitements": [{"label": "Immunothérapie", "marques": ["Opdivo (nivolumab)", "Keytruda (pembrolizumab)"]}, {"label": "Thérapies ciblées", "marques": ["Tafinlar", "Mekinist"]}], "operations": [], "naturo": "Rôle d'alerte et de prévention : protection solaire, éviter les cabines, examen annuel de la peau par un dermatologue chez les personnes à risque. La vitamine D se corrige par complément plutôt que par exposition imprudente. Après diagnostic : RÈGLE N°62.", "alertes": ["Tache qui change, saigne, grossit : dermatologue sous 2 semaines", "Ganglion dur près de la lésion : avis rapide"], "aNePasFaire": ["Attendre « pour voir »", "Appliquer des produits naturels sur une lésion suspecte", "Banaliser un grain de beauté qui évolue"], "questions": ["Depuis quand ce grain de beauté a-t-il changé ?", "Avez-vous déjà eu un contrôle dermatologique ?", "Antécédents de coups de soleil ou de cancer de la peau dans la famille ?"], "outils": "Générateur : RÈGLE N°62.", "voirAussi": ["Cancer — principes d'accompagnement", "Psoriasis"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Mots de clientes qui ne sont pas des diagnostics", "type": "conduite", "categorie": "Terrain et axes fonctionnels", "alias": ["spasmophilie", "colopathie", "foie fragile", "crise de foie", "candida", "hypoglycémie", "fatigue des surrénales", "mauvaise circulation", "rétention d'eau", "intestin poreux", "acidité", "terrain acide", "déminéralisation", "mauvaise digestion", "ventre gonflé", "carence en magnésium"], "enBref": "Les clientes utilisent souvent des termes courants qui n'ont pas de définition médicale précise. Cette fiche aide à décoder ce qu'elles veulent dire et à orienter vers la bonne fiche, sans reprendre le terme comme un diagnostic.", "physiologie": "Un même mot recouvre souvent plusieurs situations. « Spasmophilie » : le plus souvent crise de panique avec hyperventilation (hypocapnie, fourmillements elle", "Candidose chronique", "Hypoglycémie réactionnelle", "Burn-out et « épuisement surrénalien »", "Syndrome métabolique"], "sources": [{"t": "À vérifier avant diffusion : HAS, Vidal ou société savante concernée", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}]}</script>
<script>
/* ──────────────────────────────────────────────────────────────────────────────
   ATLAS CLINIQUE — A VITA SERENA
   Les fiches sont dans le bloc JSON ci-dessus ("fiches-data"). Pour en ajouter ou en
   mettre à jour : demandez à Claude, il régénère ce fichier. Chaque fiche porte une date
   de mise à jour ("maj") et un statut ("nouvelle" = à relire par vous, "existante" =
   reprise des questionnaires). Les notes saisies ici restent sur cet appareil.
   ────────────────────────────────────────────────────────────────────────────── */
(function(){
  var DATA = JSON.parse(document.getElementById('fiches-data').textContent);
  var FICHES = DATA.fiches;
  var TYPES = {maladie:'Maladies', trouble:'Troubles alimentaires', intervention:'Interventions', conduite:'Conduites à tenir'};
  var state = {q:'', type:'', cat:'', sel:null, relire:false};

  function norm(s){ return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function esc(s){ return (s||'').toString().replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(id){ return document.getElementById(id); }
  function fmtDate(iso){ var p=(iso||'').split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : ''; }

  FICHES.forEach(function(f, i){
    f._i = i;
    var brands = (f.traitements||[]).map(function(t){ return (t.label||'')+' '+(t.marques||[]).join(' '); }).join(' ');
    f._hay = norm([f.nom,(f.alias||[]).join(' '),f.categorie,f.enBref,f.symptomes,f.physiologie,f.impact,f.diagnostic,f.pec,f.naturo,brands,(f.operations||[]).join(' ')].join(' | '));
    f._nom = norm(f.nom);
    f._alias = norm((f.alias||[]).join(' | '));
    f._brands = norm(brands);
  });

  function score(f, terms){
    var s = 0;
    for (var i=0;i<terms.length;i++){
      var t = terms[i], hit = false;
      if (f._nom.indexOf(t) === 0) { s += 12; hit = true; }
      else if (f._nom.indexOf(t) > -1) { s += 9; hit = true; }
      if (f._alias.indexOf(t) > -1) { s += 7; hit = true; }
      if (f._brands.indexOf(t) > -1) { s += 5; hit = true; }
      if (f._hay.indexOf(t) > -1) { s += 2; hit = true; }
      if (!hit) return 0;
    }
    return s;
  }

  function results(){
    var terms = norm(state.q).split(/\s+/).filter(Boolean);
    var arr = FICHES.filter(function(f){
      if (state.type && f.type !== state.type) return false;
      if (state.cat && f.categorie !== state.cat) return false;
      if (state.relire && f.statut !== 'nouvelle') return false;
      return true;
    }).map(function(f){ return {f:f, s: terms.length ? score(f, terms) : 1}; })
      .filter(function(r){ return r.s > 0; });
    if (terms.length) arr.sort(function(a,b){ return b.s - a.s || a.f.nom.localeCompare(b.f.nom,'fr'); });
    else arr.sort(function(a,b){ return a.f.categorie.localeCompare(b.f.categorie,'fr') || a.f.nom.localeCompare(b.f.nom,'fr'); });
    return arr.map(function(r){ return r.f; });
  }

  function renderChips(){
    var th = '<button class="chip'+(!state.type?' on':'')+'" data-type="">Toutes</button>';
    Object.keys(TYPES).forEach(function(k){
      if (FICHES.some(function(f){return f.type===k;})) th += '<button class="chip'+(state.type===k?' on':'')+'" data-type="'+k+'">'+TYPES[k]+'</button>';
    });
    th += '<button class="chip'+(state.relire?' on':'')+'" data-relire="1">À relire</button>';
    el('types').innerHTML = th;
    var cats = {};
    FICHES.forEach(function(f){ if (!state.type || f.type===state.type) cats[f.categorie] = (cats[f.categorie]||0)+1; });
    var names = Object.keys(cats).sort(function(a,b){return a.localeCompare(b,'fr');});
    var ch = '<option value="">Toutes les catégories ('+FICHES.filter(function(f){return !state.type||f.type===state.type;}).length+')</option>';
    names.forEach(function(n){ ch += '<option value="'+esc(n)+'"'+(state.cat===n?' selected':'')+'>'+esc(n)+' ('+cats[n]+')</option>'; });
    el('cats').innerHTML = ch;
  }

  function renderList(){
    var r = results();
    el('count').textContent = r.length + ' fiche' + (r.length>1?'s':'') + (state.q ? ' pour « '+state.q+' »' : '');
    var html = '', last = '';
    if (!r.length){
      html = '<div class="empty"><p><b>Aucune fiche pour « '+esc(state.q||'ces filtres')+' ».</b><br>Demandez-la à Claude : il l’ajoute à la base avec le même format.</p><button class="btn" id="ask">Copier la demande pour Claude</button></div>';
    } else {
      r.forEach(function(f){
        if (!state.q && f.categorie !== last){ html += '<div class="cat-t">'+esc(f.categorie)+'</div>'; last = f.categorie; }
        html += '<button class="item'+(state.sel===f._i?' sel':'')+'" data-i="'+f._i+'" role="listitem"><b>'
          + (f.statut==='nouvelle'?'<span class="tag new">À relire</span>':'') + esc(f.nom) + '</b><span>'+esc(shorten(f.enBref, 120))+'</span></button>';
      });
    }
    el('list').innerHTML = html;
  }
  function shorten(s, n){ s = s||''; return s.length>n ? s.slice(0,n).replace(/\s+\S*$/,'')+'…' : s; }

  function sec(title, body, cls){
    if (!body) return '';
    return '<section class="sec'+(cls?' '+cls:'')+'"><h3>'+title+'</h3>'+body+'</section>';
  }
  function ul(arr){ return arr && arr.length ? '<ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : ''; }
  function p(s){ return s ? '<p>'+esc(s)+'</p>' : ''; }

  function findByName(name){
    var n = norm(name);
    for (var i=0;i<FICHES.length;i++){ if (norm(FICHES[i].nom) === n) return FICHES[i]; }
    for (var j=0;j<FICHES.length;j++){ if (norm(FICHES[j].nom).indexOf(n) === 0 || norm(FICHES[j].nom).indexOf(n) > -1 && n.length > 6) return FICHES[j]; }
    return null;
  }
  function linkBtn(name){
    var f = findByName(name);
    return f ? '<button class="link" data-i="'+f._i+'">'+esc(name)+'</button>' : '<span class="link" style="cursor:default;opacity:.7">'+esc(name)+'</span>';
  }

  function renderDetail(){
    var d = el('detail');
    if (state.sel === null){
      var nb = FICHES.length, nn = FICHES.filter(function(f){return f.statut==='nouvelle';}).length;
      var nm = FICHES.filter(function(f){return f.type==='maladie'||f.type==='trouble'||f.type==='conduite';}).length;
      var ni = FICHES.filter(function(f){return f.type==='intervention';}).length;
      d.innerHTML = '<div class="welcome"><div class="d-cat">Bienvenue</div><h2>Cherchez une maladie, une intervention ou un médicament</h2>'
        + '<p class="lead">Chaque fiche explique ce qui se passe dans le corps, comment le diagnostic est posé, la prise en charge médicale et les traitements courants, puis ce que vous pouvez faire — et ce que vous ne devez jamais faire.</p>'
        + '<div class="grid"><div class="card" data-go="maladie"><b>'+nm+'</b>maladies, troubles et conduites à tenir</div><div class="card" data-go="intervention"><b>'+ni+'</b>interventions chirurgicales et examens</div><div class="card" data-go="relire"><b>'+nn+'</b>fiches nouvelles à relire</div></div>'
        + '<p class="sub">Astuce : tapez le nom d’un médicament (Levothyrox, Spasfon…) ou d’un symptôme (ballonnements) pour retrouver les fiches liées. Touche « / » pour aller dans la recherche.</p></div>';
      return;
    }
    var f = FICHES[state.sel];
    var html = '<div class="d-top"><div><div class="d-cat">'+esc(f.categorie)+((f.type==='intervention'||f.type==='conduite')?' · '+esc(TYPES[f.type]):'')+'</div><h2>'+esc(f.nom)+'</h2></div>'
      + '<div><button class="btn ghost" id="print">Imprimer la fiche</button></div></div>'
      + '<div class="d-meta">'+(f.statut==='nouvelle'?'<span class="tag new">Nouvelle — à relire par vous</span>':'<span class="tag type">Fiche existante des questionnaires</span>')
      + (f.maj?' Mise à jour le '+fmtDate(f.maj):'')+'</div>'
      + '<div class="lead">'+esc(f.enBref)+'</div>';
    html += sec('Ce qui se passe dans le corps', p(f.physiologie));
    html += sec('Impact sur l’organisme', p(f.impact));
    if (f.type==='intervention' && typeof f.definitif==='boolean') html += sec('Geste définitif', p(f.definitif ? 'Oui : il modifie durablement l’anatomie ou la fonction.' : 'Non : il n’entraîne pas de changement anatomique définitif.'));
    html += sec('Signes et symptômes', p(f.symptomes));
    html += sec('Comment le diagnostic est posé', p(f.diagnostic));
    html += sec('Prise en charge médicale', p(f.pec));
    if (f.traitements && f.traitements.length){
      html += sec('Traitements courants', '<div class="trait">'+f.traitements.map(function(t){
        return '<div>'+esc(t.label)+((t.marques&&t.marques.length)?'<small>Exemples : '+esc(t.marques.join(', '))+'</small>':'')+'</div>';
      }).join('')+'</div>');
    }
    if (f.operations && f.operations.length){
      html += sec('Interventions fréquentes associées', '<div class="links">'+f.operations.map(linkBtn).join('')+'</div>');
    }
    html += sec('Votre rôle de naturopathe', p(f.naturo), 'naturo');
    html += sec('Alertes — orienter sans attendre', ul(f.alertes), 'warn');
    html += sec('À ne jamais faire', ul(f.aNePasFaire), 'stop');
    html += sec('Questions à poser', ul(f.questions), 'q');
    html += sec('Dans vos outils', p(f.outils), 'tools');
    if (f.voirAussi && f.voirAussi.length) html += sec('Voir aussi', '<div class="links">'+f.voirAussi.map(linkBtn).join('')+'</div>');
    if (f.sources && f.sources.length){
      html += sec('Sources', '<ul class="src">'+f.sources.map(function(s){
        return '<li>'+(s.u?'<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>':esc(s.t)+'<span class="badge-src">à vérifier</span>')+'</li>';
      }).join('')+'</ul>');
    }
    html += '<section class="sec notes-wrap"><h3>Mes notes sur cette fiche</h3><textarea class="notes" id="notes" placeholder="Vos remarques, cas rencontrés, points à corriger… (enregistré sur cet appareil)"></textarea></section>';
    html += '<div class="foot">Cette fiche est un repère pour la praticienne : elle ne pose jamais de diagnostic et ne remplace jamais un avis médical.'
      + (f.statut==='nouvelle' ? ' Contenu rédigé par Claude à partir de sources médicales : à relire et valider avant de vous y fier.' : '') + '</div>';
    d.innerHTML = html;
    var ta = el('notes');
    if (ta){
      try { ta.value = localStorage.getItem('fiche-notes-'+f.nom) || ''; } catch(e){}
      ta.addEventListener('input', function(){ try { localStorage.setItem('fiche-notes-'+f.nom, ta.value); } catch(e){} });
    }
    var pr = el('print'); if (pr) pr.addEventListener('click', function(){ window.print(); });
  }

  function select(i, scroll){
    state.sel = i;
    renderList(); renderDetail();
    if (i !== null) { try { history.replaceState(null,'','#'+encodeURIComponent(FICHES[i].nom)); } catch(e){} }
    if (scroll && window.matchMedia('(max-width:960px)').matches) el('detail').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function refresh(){ renderChips(); renderList(); }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-i],[data-type],[data-cat],[data-relire],[data-go],#ask'); if (!t) return;
    if (t.id === 'ask'){
      var term = state.q || 'à préciser';
      var txt = 'Ajoute à la base de fiches la fiche « '+term+' » (maladie ou intervention) : ce qui se passe dans le corps, signes, comment le diagnostic est posé, prise en charge médicale, traitements courants avec marques, notre rôle de naturopathe, alertes, ce qu’il ne faut jamais faire, questions à poser, sources fiables, et les garde-fous de nos outils.';
      var done = function(){ t.textContent = 'Copié — collez-le dans votre message à Claude'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ window.prompt('Copiez cette demande :', txt); });
      else window.prompt('Copiez cette demande :', txt);
      return;
    }
    if (t.hasAttribute('data-i')) { select(parseInt(t.getAttribute('data-i'),10), true); return; }
    if (t.hasAttribute('data-go')) {
      var g = t.getAttribute('data-go');
      state.type = ''; state.cat = ''; state.relire = false;
      if (g==='relire') state.relire = true; else if (g==='intervention') state.type='intervention'; else { state.type=''; }
      if (g==='maladie') { state.type = 'maladie'; }
      state.sel = null; refresh(); renderDetail(); return;
    }
    if (t.hasAttribute('data-relire')) { state.relire = !state.relire; refresh(); return; }
    if (t.hasAttribute('data-type')) { state.type = t.getAttribute('data-type'); state.cat=''; refresh(); return; }
    if (t.hasAttribute('data-cat')) { state.cat = t.getAttribute('data-cat'); refresh(); return; }
  });
  el('cats').addEventListener('change', function(){ state.cat = this.value; renderList(); });
  el('q').addEventListener('input', function(){ state.q = this.value; renderList(); });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== el('q') && document.activeElement.tagName !== 'TEXTAREA'){ e.preventDefault(); el('q').focus(); }
  });

  el('sub').textContent = FICHES.length + ' fiches · base mise à jour le ' + fmtDate(DATA.maj);
  refresh(); renderDetail();
  var h = decodeURIComponent((location.hash||'').slice(1));
  if (h){ var f0 = findByName(h); if (f0) select(f0._i, false); }
})();
</script>

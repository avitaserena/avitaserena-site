<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas clinique — A VITA SERENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blanc:#FFFFFF; --off:#FDF4F8; --grege:#F3F2F2; --taupe:#E7E2E4;
  --sable:#F3B6CE; --ocre:#D6336C; --ardoise:#1A1A1A; --gris:#4A4547;
  --or-clair:#FDEEF3; --or:#99244F;
  --vert:#2F6B3A; --vert-clair:#EEF6EF; --rouge:#8B3A3A; --rouge-clair:#FBEAEA; --rouge-bd:#C0392B;
  --violet:#4B2A6B; --violet-clair:#F6F1FB; --violet-bd:#C9B7DF;
  --bleu:#0C447C; --bleu-clair:#ECF2FE;
  --shadow:0 12px 32px rgba(16,24,40,.09);
  --r99:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter',-apple-system,sans-serif;color:var(--ardoise);background:var(--blanc);font-size:16px;line-height:1.65;scroll-behavior:smooth}
body{background:var(--blanc);min-height:100vh}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.hdr{background:rgba(255,255,255,.9);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--taupe);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center}
.logo svg{width:96px;height:auto;display:block}
.logo svg path,.logo svg circle{fill:var(--ardoise)}
.hdr-tag{font-size:12px;color:var(--gris);background:var(--off);border:1px solid var(--taupe);padding:6px 15px;border-radius:var(--r99);font-weight:500}
.hdr-stripe{height:3px;background:linear-gradient(to right,var(--taupe),var(--ocre),var(--sable),var(--ocre),var(--taupe))}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto;padding:24px 32px 64px;align-items:start}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;gap:12px}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;line-height:1.15;color:var(--ardoise)}
.sub{font-size:13.5px;color:var(--gris)}
.search{position:relative}
.search input{width:100%;padding:14px 18px 14px 46px;border:1.5px solid var(--taupe);border-radius:var(--r99);background:var(--blanc);font-size:16px;transition:border-color .15s, box-shadow .15s}
.search input:focus{outline:none;border-color:var(--ocre);box-shadow:0 0 0 4px rgba(214,51,108,.12)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gris)}
select.cat{width:100%;padding:10px 14px;border:1.5px solid var(--taupe);border-radius:var(--r99);background:var(--blanc);font-size:14px}
select.cat:focus{outline:none;border-color:var(--ocre)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--taupe);background:var(--blanc);padding:6px 13px;border-radius:var(--r99);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--ardoise)}
.chip:hover{border-color:rgba(214,51,108,.45);background:var(--off);transform:translateY(-1px)}
.chip.on{background:var(--ocre);border-color:var(--ocre);color:#fff}
.count{font-size:12.5px;color:var(--gris)}
.list{overflow-y:auto;padding:2px 6px 8px 2px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.cat-t{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin:12px 0 2px}
.item{border:1px solid var(--taupe);border-radius:14px;padding:11px 14px;cursor:pointer;background:var(--blanc);transition:all .16s;text-align:left;width:100%}
.item:hover{border-color:rgba(214,51,108,.45);transform:translateY(-2px);box-shadow:0 8px 20px rgba(214,51,108,.1)}
.item.sel{border-color:var(--ocre);background:var(--or-clair)}
.item b{font-size:14.5px;font-weight:600;display:block}
.item span.tag{display:inline-block;margin:0 6px 0 0;font-size:10.5px;color:var(--violet)}
.item span{font-size:12.5px;color:var(--gris);display:block;margin-top:2px;line-height:1.45}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r99);margin-right:6px;vertical-align:1px}
.tag.new{background:var(--violet-clair);color:var(--violet);border:1px solid var(--violet-bd)}
.tag.type{background:var(--grege);color:var(--gris)}
.empty{border:1.5px dashed var(--sable);border-radius:16px;padding:20px;background:var(--off)}
.empty p{font-size:14px;margin-bottom:12px}
.btn{border:1.5px solid var(--ocre);background:var(--ocre);color:#fff;padding:10px 18px;border-radius:var(--r99);font-weight:600;cursor:pointer;transition:all .15s;font-size:14px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(214,51,108,.25)}
.btn.ghost{background:var(--blanc);color:var(--ocre)}
.detail{background:var(--blanc);border:1px solid var(--taupe);border-radius:22px;padding:32px 36px;box-shadow:var(--shadow);min-height:420px}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.d-cat{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or)}
.detail h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:38px;line-height:1.12;margin:4px 0 8px}
.d-meta{font-size:12.5px;color:var(--gris);margin-bottom:14px}
.lead{font-size:17px;line-height:1.75;background:var(--off);border-left:4px solid var(--ocre);padding:14px 18px;border-radius:0 14px 14px 0;margin:10px 0 20px}
.sec{margin:20px 0}
.sec h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.sec p{font-size:16px;line-height:1.75}
.sec ul{padding-left:20px}
.sec li{font-size:15.5px;line-height:1.7;margin-bottom:5px}
.sec.warn{background:var(--rouge-clair);border:1.5px solid var(--rouge-bd);border-radius:16px;padding:16px 20px}
.sec.warn h3{color:var(--rouge)}
.sec.stop{background:#FFF7F3;border:1.5px solid #E9B8A6;border-radius:16px;padding:16px 20px}
.sec.stop h3{color:#8C4B2E}
.sec.naturo{background:var(--vert-clair);border:1.5px solid #B9D6BE;border-radius:16px;padding:16px 20px}
.sec.naturo h3{color:var(--vert)}
.sec.tools{background:var(--violet-clair);border:1.5px solid var(--violet-bd);border-radius:16px;padding:16px 20px}
.sec.tools h3{color:var(--violet)}
.q li{font-style:italic}
.trait{display:flex;flex-direction:column;gap:8px}
.trait div{border:1px solid var(--taupe);border-radius:12px;padding:10px 14px}
.trait small{display:block;margin-top:3px;color:var(--gris);font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.link{border:1px solid var(--taupe);background:var(--blanc);padding:6px 14px;border-radius:var(--r99);font-size:13.5px;cursor:pointer;transition:all .15s;font-weight:500}
.link:hover{border-color:var(--ocre);background:var(--off);transform:translateY(-1px)}
.src a{color:var(--or)}
.src li{font-size:14px}
.badge-src{font-size:11px;font-weight:700;color:#8C5A00;background:#FFF4D6;border:1px solid #F0D58A;padding:2px 8px;border-radius:var(--r99);margin-left:6px}
textarea.notes{width:100%;min-height:90px;border:1.5px solid var(--taupe);border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;resize:vertical}
textarea.notes:focus{outline:none;border-color:var(--ocre)}
.foot{margin-top:30px;font-size:12.5px;color:var(--gris);border-top:1px solid var(--taupe);padding-top:14px}
.welcome{padding:10px 0}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.welcome .card{border:1px solid var(--taupe);border-radius:16px;padding:16px;background:var(--off);cursor:pointer;transition:all .16s}
.welcome .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(214,51,108,.12);border-color:var(--ocre)}
.welcome .card b{display:block;font-size:26px;font-family:'Cormorant Garamond',serif;color:var(--or)}
.back{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr;padding:16px}
  .side{position:static;max-height:none}
  .list{max-height:340px}
  .detail{padding:22px 20px}
  .detail h2{font-size:30px}
  .hdr{padding:12px 16px}
  .hdr-tag{display:none}
}
@media print{
  .hdr,.hdr-stripe,.side,.btn,.notes-wrap,.links{display:none!important}
  .app{display:block;padding:0}
  .detail{border:none;box-shadow:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

, "naturo": "Soutien du terrain nerveux (magnésium, axe intestin-cerveau) en complément du suivi psy, jamais à la place.", "traitements": [{"label": "ISRS (fluoxétine, sertraline — dose souvent élevée)", "marques": ["Prozac (fluoxétine)", "Zoloft (sertraline)"]}], "operations": [], "maj": "", "statut": "existante", "sources": []}, {"nom": "Bipolarité", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": [], "enBref": "Trouble de l'humeur avec alternance d'épisodes dépressifs et d'épisodes d'exaltation (manie ou hypomanie), nécessitant un traitement stabilisateur au long cours.", "symptomes": "Phases hautes (euphorie, impulsivité, besoin de sommeil réduit) alternant avec des phases dépressives.", "pec": "Thymorégulateurs (lithium, valproate, lamotrigine) au long cours — jamais d'arrêt sans avis du psychiatre.", "naturo": "Rythme de vie et sommeil très importants en soutien ; vigilance absolue sur toute plante ou complément pouvant interagir avec le lithium, à vérifier systématiquement.", "traitements": [{"label": "Lithium", "marques": ["Téralithe"]}, {"label": "Valproate / Divalproate", "marques": ["Dépakote", "Dépamide", "Micropakine"]}, {"label": "Lamotrigine", "marques": ["Lamictal"]}, {"label": "Antipsychotiques (certains épisodes)", "marques": ["Zyprexa (olanzapine)", "Abilify (aripiprazole)", "Xeroquel/Seroquel (quétiapine)"]}], "operations": [], "maj": "", "statut": "existante", "sources": []}, {"nom": "TDAH", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": [], "enBref": "Trouble neurodéveloppemental affectant l'attention, l'impulsivité et parfois l'hyperactivité, présent dès l'enfance même si diagnostiqué à l'âge adulte.", "symptomes": "Difficulté à se concentrer, impulsivité, désorganisation, procrastination, hyperactivité (variable selon le profil).", "pec": "Méthylphénidate (Ritaline, Concerta) ou autres stimulants/non-stimulants, souvent associé à un accompagnement psychologique.", "naturo": "Sommeil, glycémie, fer et fonction thyroïdienne peuvent moduler les symptômes, en complément du suivi médical.", "traitements": [{"label": "Méthylphénidate (Ritaline, Concerta, Quasym)", "marques": ["Ritaline", "Concerta", "Quasym"]}, {"label": "Atomoxétine (non stimulant)", "marques": ["Strattera"]}], "operations": [], "maj": "", "statut": "existante", "sources": []}, {"nom": "Fibromyalgie", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": [], "enBref": "Syndrome de douleur chronique diffuse, avec une sensibilité anormalement amplifiée à la douleur, souvent associée à une fatigue et des troubles du sommeil.", "symptomes": "Douleurs diffuses migrantes, fatigue non réparatrice, troubles du sommeil, brouillard mental.", "pec": "Peu de traitement médicamenteux spécifique — antidépresseurs à visée antalgique parfois, kinésithérapie, activité physique adaptée.", "naturo": "Terrain très naturopathique — sommeil, inflammation, stress, souvent travaillé en première ligne avec le médecin traitant.", "traitements": [{"label": "Antidépresseurs à visée antalgique (duloxétine, amitriptyline)", "marques": ["Cymbalta (duloxétine)", "Laroxyl (amitriptyline)"]}, {"label": "Antalgiques", "marques": ["Doliprane/Dafalgan (paracétamol)", "Contramal/Topalgic (tramadol)", "Lamaline"]}], "operations": [], "maj": "", "statut": "existante", "sources": []}, {"nom": "Migraines chroniques", "type": "maladie", "categorie": "Santé mentale et neurologie", "alias": [], "enBref": "Maux de tête récidivants (plus de 15 jours par mois), souvent pulsatiles et unilatéraux, parfois accompagnés de nausées.", "symptomes": "Céphalées pulsatiles, nausées, sensibilité à la lumière/au bruit, parfois aura visuelle avant la crise.", "pec": "Traitement de crise (triptans, AINS) et traitement de fond si fréquentes (bêta-bloquants, antiépileptiques, anti-CGRP).", "naturo": "Terrain hormonal, glycémique et hépatique souvent en cause, très travaillé en complément du traitement médical.", "traitements": [{"label": "Triptans (traitement de crise)", "marques": ["Imigrane (sumatriptan)", "Zomig (zolmitriptan)"]}, {"label": "Bêta-bloquants ou antiépileptiques (traitement de fond)", "marques": ["Avlocardyl (propranolol)", "Dépakine (valproate)", "Epitomax (topiramate)"]}, {"label": "Anti-CGRP (érénumab — migraines résistantes)", "marques": ["Aimovig (érénumab)"]}], "operations": [], "maj": "", "statut": "existante", "sources": []}, {"nom": "Trouble des conduites alimentaires (vue d'ensemble)", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["TCA"], "enBref": "Rapport perturbé à l'alimentation (restriction, crises, purges) avec un retentissement physique et psychologique important, nécessitant un accompagnement pluridisciplinaire.", "symptomes": "Variables selon le type (anorexie, boulimie, hyperphagie) — restriction, crises alimentaires, purges, préoccupation excessive du poids.", "pec": "Suivi pluridisciplinaire obligatoire (médecin, psychiatre ou psychologue, diététicien) — jamais un accompagnement isolé.", "naturo": "Jamais de plan alimentaire chiffré ni de conseil de perte de poids — accompagnement du terrain uniquement, toujours en coordination avec l'équipe spécialisée déjà en place.", "traitements": [{"label": "Suivi pluridisciplinaire (médecin, psy, diététicien) — obligatoire", "marques": []}], "operations": [], "maj": "", "statut": "existante", "sources": [], "voirAussi": ["Anorexie mentale", "Boulimie", "Hyperphagie boulimique", "Orthorexie", "Restriction alimentaire évitante (ARFID)"], "alertes": ["Voir les fiches détaillées ci-dessous pour les signes de gravité et la conduite à tenir"]}, {"nom": "Cœlioscopie diagnostique", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Chirurgie mini-invasive (petites incisions, caméra) pratiquée pour explorer le bassin et confirmer un diagnostic (endométriose, kystes, adhérences), sans geste thérapeutique associé.", "impact": "Anesthésie générale courte, récupération de quelques jours. Le gaz utilisé pour gonfler l'abdomen peut donner des douleurs d'épaule transitoires. Aucun changement anatomique définitif si seule l'exploration a été faite.", "naturo": "Soutien du foie et du transit dans les suites de l'anesthésie, apaisement de l'inflammation locale à court terme.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Échographie pelvienne", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Examen d'imagerie non invasif (sonde abdominale et/ou endovaginale) souvent en première intention pour rechercher des kystes ovariens, un endométriome ou une adénomyose.", "impact": "Aucun — examen indolore, sans anesthésie, sans suite particulière.", "naturo": "N'appelle aucun accompagnement spécifique en soi ; c'est surtout son résultat qui oriente le protocole (confirmation ou non de lésions, taille d'un endométriome à surveiller).", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Irm pelvienne", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Imagerie de référence pour cartographier une endométriose profonde (ligaments utéro-sacrés, cloison recto-vaginale, vessie) quand l'échographie ne suffit pas à trancher.", "impact": "Aucun — examen indolore, sans anesthésie, sans suite particulière. Certaines lésions superficielles restent invisibles même à l'IRM.", "naturo": "N'appelle aucun accompagnement spécifique en soi ; c'est surtout son résultat qui oriente le protocole.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Test salivaire — signature miRNA", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Test diagnostique récent basé sur une signature de 109 micro-ARN salivaires, avec une sensibilité et une spécificité très élevées en étude clinique (ENDO-miRNA, 2022). Encore peu répandu en pratique courante en France.", "impact": "Aucun — simple prélèvement salivaire, sans anesthésie.", "naturo": "Un diagnostic positif ne change pas la méthode : la recherche des causes (axe oestroprogestatif, immuno-inflammatoire, ionique) reste la même que le diagnostic soit posé par ce test, par imagerie ou par cœlioscopie — je ne traite jamais \"un diagnostic\", je traite ce qui l'entretient chez cette cliente précise.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Ultrasons focalisés — hifu", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Technique mini-invasive récente (ondes ultrasonores de haute intensité, voie endorectale) qui détruit une lésion d'endométriose ciblée en quelques minutes, sans incision. Devenue un standard pour l'endométriose digestive/rectale dans certains centres hospitaliers (ex. HCL Lyon, pionniers depuis 2015 ; technique désormais déployée dans d'autres CHU).", "impact": "Hospitalisation très courte (quelques heures à une nuit), pas de cicatrice, préservation de la fertilité rapportée par les équipes pionnières. Ne traite que la ou les lésions ciblées, pas le terrain qui les a fait apparaître.", "naturo": "Accompagnement anti-inflammatoire et hormonal pour limiter la récidive — la lésion détruite ne revient pas mais le terrain qui l'a fait apparaître (inflammation, excès d'œstrogènes) reste à travailler exactement comme après une chirurgie.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Destruction laser de lésions d'endométriose", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Destruction de lésions d'endométriose superficielles par laser, le plus souvent réalisée au cours d'une cœlioscopie.", "impact": "Suites comparables à une cœlioscopie classique. Comme pour l'exérèse chirurgicale, le risque de récidive dépend surtout du terrain, pas de la technique de destruction utilisée.", "naturo": "Accompagnement de la cicatrisation, soutien anti-inflammatoire et hormonal pour limiter la récidive des lésions.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Cœlioscopie — exérèse de lésions d'endométriose", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Même technique mini-invasive que la cœlioscopie diagnostique, avec en plus le retrait chirurgical des lésions d'endométriose repérées (kystes, implants, adhérences).", "impact": "Suites parfois plus longues qu'une cœlioscopie simple selon l'étendue des lésions retirées ; le tissu ovarien ou péritonéal peut être fragilisé localement.", "naturo": "Accompagnement de la cicatrisation, soutien anti-inflammatoire et hormonal pour limiter la récidive des lésions.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Kystectomie ovarienne", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation chirurgicale d'un kyste ovarien en préservant l'ovaire lui-même.", "impact": "La réserve ovarienne peut être légèrement diminuée selon la taille du kyste retiré et la quantité de tissu ovarien sain emportée avec lui.", "naturo": "Soutien de la cicatrisation ovarienne et de l'équilibre hormonal dans les mois qui suivent.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Ovariectomie / annexectomie", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation d'un ou des deux ovaires (annexectomie : ovaire + trompe).", "impact": "Si les deux ovaires sont retirés avant la ménopause naturelle, c'est une ménopause chirurgicale immédiate — changement hormonal définitif, souvent plus brutal qu'une ménopause naturelle.", "naturo": "Accompagnement hormonal renforcé (bouffées de chaleur, sommeil, os, cardiovasculaire) comme pour une ménopause précoce.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Hystérectomie (totale)", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation complète de l'utérus et du col de l'utérus. Les ovaires peuvent être conservés ou non selon l'indication.", "impact": "Plus de règles ni de grossesse possible — c'est un changement anatomique définitif. Si les ovaires sont conservés, la fonction hormonale se poursuit jusqu'à la ménopause naturelle.", "naturo": "Accompagnement de la cicatrisation et du transit ; si les ovaires ont été retirés en même temps, soutien hormonal comme pour une ménopause chirurgicale.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Hystérectomie (subtotale)", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation du corps de l'utérus en conservant le col utérin.", "impact": "Plus de règles ni de grossesse possible — changement anatomique définitif. Le col restant continue de nécessiter un suivi gynécologique (frottis).", "naturo": "Mêmes accompagnements que pour une hystérectomie totale : cicatrisation, transit, équilibre hormonal si les ovaires ont été touchés.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Myomectomie", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation chirurgicale d'un ou plusieurs fibromes utérins, en conservant l'utérus.", "impact": "L'utérus est préservé, une grossesse reste possible ensuite (parfois avec surveillance renforcée) ; risque de récidive de nouveaux fibromes avec le temps.", "naturo": "Soutien de la cicatrisation utérine et du terrain hormonal pouvant favoriser la formation de fibromes (excès relatif d'œstrogènes).", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Curetage", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Geste consistant à retirer le contenu de la cavité utérine (après une fausse couche, une IVG, ou pour explorer un saignement anormal).", "impact": "Geste ponctuel sans séquelle anatomique dans la grande majorité des cas ; de rares curetages répétés peuvent fragiliser la paroi utérine.", "naturo": "Soutien de la récupération hormonale et émotionnelle selon le contexte du curetage.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Ablation de polype utérin", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Retrait chirurgical d'un polype de la muqueuse utérine (endomètre), généralement sous hystéroscopie.", "impact": "Geste ponctuel, sans changement anatomique durable ; les polypes peuvent parfois récidiver.", "naturo": "Soutien du terrain hormonal (les polypes sont favorisés par un excès relatif d'œstrogènes) pour limiter la récidive.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Conisation (col utérin)", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Ablation d'une partie du col de l'utérus contenant des cellules anormales (lésions précancéreuses, souvent liées au HPV).", "impact": "Le col est raccourci ; selon l'ampleur du geste, cela peut augmenter légèrement un risque d'accouchement prématuré lors d'une grossesse ultérieure. Un suivi gynécologique régulier reste nécessaire.", "naturo": "Soutien de l'immunité locale et du terrain HPV pour limiter une nouvelle lésion.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Ligature des trompes", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Section ou occlusion chirurgicale des trompes de Fallope à visée contraceptive définitive.", "impact": "Contraception définitive — changement anatomique volontaire et permanent. Aucun impact hormonal : les ovaires continuent de fonctionner normalement.", "naturo": "Aucun accompagnement spécifique nécessaire au-delà de la cicatrisation post-opératoire habituelle.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Pose/ablation de diu (geste chirurgical)", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Pose ou retrait d'un dispositif intra-utérin (stérilet) — geste habituellement réalisé au cabinet, parfois sous anesthésie si complexe.", "impact": "Geste réversible, sans séquelle anatomique attendue.", "naturo": "Aucun accompagnement spécifique, sauf si des saignements ou douleurs post-pose persistent.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Césarienne", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Accouchement par incision chirurgicale de l'abdomen et de l'utérus.", "impact": "Cicatrice utérine à surveiller lors de grossesses ultérieures (tentative de voie basse possible selon le contexte). Récupération abdominale plus longue qu'un accouchement par voie basse.", "naturo": "Soutien de la cicatrisation (interne et cutanée), du transit et du périnée/sangle abdominale dans le post-partum.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Épisiotomie (réparée chirurgicalement)", "type": "intervention", "categorie": "Gynécologie et hormones", "alias": [], "enBref": "Incision du périnée pratiquée pendant l'accouchement pour faciliter le passage du bébé, suturée ensuite.", "impact": "Cicatrice périnéale pouvant occasionner une gêne (douleur, tension) dans les mois qui suivent, surtout si mal cicatrisée.", "naturo": "Soutien de la cicatrisation tissulaire et rééducation périnéale à ne pas négliger.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Appendicectomie", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Ablation chirurgicale de l'appendice, le plus souvent en urgence pour une appendicite.", "impact": "L'appendice ne joue pas de rôle digestif indispensable ; son retrait est sans conséquence fonctionnelle majeure connue, mais l'épisode inflammatoire et l'antibiothérapie associée peuvent avoir marqué le microbiote.", "naturo": "Soutien du microbiote intestinal et de la muqueuse digestive dans les mois qui suivent, surtout si une antibiothérapie a été nécessaire.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Cholécystectomie (ablation vésicule biliaire)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Ablation chirurgicale de la vésicule biliaire, le plus souvent pour des calculs biliaires symptomatiques.", "impact": "La bile s'écoule alors en continu du foie vers l'intestin au lieu d'être stockée puis libérée par à-coups — cela peut modifier durablement la digestion des graisses (transit plus rapide, selles molles) chez certaines personnes.", "naturo": "Soutien hépatobiliaire, digestion des graisses et adaptation alimentaire pour compenser l'absence de réservoir biliaire.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Hernie (ombilicale, inguinale, hiatale...)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Réparation chirurgicale d'une hernie — passage anormal d'un organe ou tissu à travers une zone de faiblesse de la paroi (abdominale ou diaphragmatique selon le type).", "impact": "Geste le plus souvent réparateur et définitif, parfois avec pose d'une plaque de renfort ; récidive possible selon la zone et la qualité tissulaire.", "naturo": "Soutien de la cicatrisation tissulaire et du transit dans les suites opératoires.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie bariatrique", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Chirurgie de restriction et/ou de malabsorption du tube digestif (sleeve, bypass...) réalisée dans le cadre d'une prise en charge de l'obésité.", "impact": "Modification anatomique définitive du tube digestif, avec risque durable de carences (fer, B12, vitamine D, calcium...) à surveiller à vie.", "naturo": "Suivi micronutritionnel rapproché et adaptation des formes galéniques (souvent liquides/sublinguales) pour limiter les carences.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Résection colique (côlon)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Ablation chirurgicale d'une partie du côlon (diverticulite compliquée, cancer, maladie inflammatoire...), avec ou sans stomie temporaire.", "impact": "Transit souvent modifié durablement (accélération, selles plus fréquentes) selon la portion retirée.", "naturo": "Soutien du microbiote et de la muqueuse digestive, adaptation alimentaire progressive selon la tolérance.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Stomie (colostomie/iléostomie)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Abouchement chirurgical de l'intestin à la peau de l'abdomen, temporaire ou définitif, pour dériver le transit vers une poche externe.", "impact": "Modification anatomique majeure du transit et de l'image corporelle ; peut être temporaire (fermeture prévue) ou définitive selon l'indication.", "naturo": "Accompagnement digestif adapté (hydratation, fibres selon tolérance) et soutien psycho-émotionnel de l'adaptation.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Hémorroïdectomie", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Ablation chirurgicale d'hémorroïdes internes ou externes volumineuses ou récidivantes.", "impact": "Récupération parfois inconfortable (douleur à la défécation les premiers jours) mais sans séquelle anatomique durable dans la majorité des cas.", "naturo": "Soutien du transit (éviter la constipation post-opératoire) et de la cicatrisation locale.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Cure de fistule ou d'abcès anal", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Traitement chirurgical d'une fistule ou d'un abcès de la région anale.", "impact": "Cicatrisation parfois lente ; récidive possible, notamment en cas de maladie de Crohn sous-jacente.", "naturo": "Soutien de la cicatrisation et du terrain digestif/inflammatoire, en particulier si un MICI est en cause.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie du reflux (fundoplicature)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Intervention (souvent par cœlioscopie) resserrant la jonction entre l'œsophage et l'estomac pour traiter un reflux gastro-œsophagien sévère.", "impact": "Peut durablement modifier la capacité à roter/vomir et la tolérance à certains aliments volumineux ou gazeux.", "naturo": "Accompagnement digestif et adaptation alimentaire (texture, volume des repas) dans les suites.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Autre chirurgie abdominale", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Catégorie générique pour toute intervention abdominale non listée par ailleurs — à préciser dans les effets ressentis.", "impact": "Impact variable selon le geste exact réalisé.", "naturo": "Accompagnement à ajuster selon l'organe concerné et les suites rapportées.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Thyroïdectomie", "type": "intervention", "categorie": "Endocrinien et métabolique", "alias": [], "enBref": "Ablation partielle ou totale de la glande thyroïde.", "impact": "Si l'ablation est totale, un traitement hormonal substitutif (lévothyroxine) à vie devient indispensable — changement anatomique et hormonal définitif.", "naturo": "Vérification systématique de la prise de lévothyroxine (interactions fer/calcium/IPP, RÈGLE existante) et soutien du terrain énergétique.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Amygdalectomie", "type": "intervention", "categorie": "ORL", "alias": [], "enBref": "Ablation chirurgicale des amygdales, le plus souvent pour des angines à répétition ou une hypertrophie gênante.", "impact": "Aucune séquelle immunitaire majeure connue à l'âge adulte ; récupération de quelques jours avec gêne à la déglutition.", "naturo": "Soutien de la cicatrisation locale et de l'immunité ORL dans les suites.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Adénoïdectomie (végétations)", "type": "intervention", "categorie": "ORL", "alias": [], "enBref": "Ablation des végétations adénoïdes, surtout pratiquée chez l'enfant en cas d'obstruction nasale ou d'otites à répétition.", "impact": "Geste sans séquelle durable connue ; amélioration attendue de la respiration nasale et du sommeil.", "naturo": "Soutien du terrain ORL et immunitaire dans les suites, notamment si des otites étaient associées.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Pose d'aérateurs transtympaniques (yoyos)", "type": "intervention", "categorie": "ORL", "alias": [], "enBref": "Pose de petits tubes dans le tympan pour drainer les otites séreuses à répétition, surtout chez l'enfant.", "impact": "Dispositif temporaire (expulsion spontanée au bout de quelques mois à 1-2 ans), sans changement anatomique définitif.", "naturo": "Soutien du terrain ORL et de l'immunité pour limiter les récidives d'otite.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Septoplastie (déviation de cloison nasale)", "type": "intervention", "categorie": "ORL", "alias": [], "enBref": "Correction chirurgicale d'une cloison nasale déviée gênant la respiration.", "impact": "Changement anatomique définitif visant à améliorer durablement la respiration nasale.", "naturo": "Soutien de la cicatrisation des muqueuses nasales et de la respiration dans les suites.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie de la cataracte", "type": "intervention", "categorie": "Ophtalmologie", "alias": [], "enBref": "Remplacement du cristallin opacifié par un implant artificiel.", "impact": "Changement anatomique définitif (implant à vie) ; amélioration attendue de la vision, parfois avec correction résiduelle à ajuster.", "naturo": "Soutien antioxydant général de la santé oculaire, sans interférence avec l'implant lui-même.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie réfractive (lasik et similaires)", "type": "intervention", "categorie": "Ophtalmologie", "alias": [], "enBref": "Correction chirurgicale de la myopie/hypermétropie/astigmatisme par remodelage de la cornée au laser.", "impact": "Changement anatomique définitif de la cornée ; sécheresse oculaire parfois durable chez certaines personnes.", "naturo": "Soutien du confort oculaire (hydratation, oméga-3) en cas de sécheresse résiduelle.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Prothèse de hanche", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Remplacement de l'articulation de la hanche usée ou fracturée par une prothèse artificielle.", "impact": "Changement anatomique définitif ; bonne récupération fonctionnelle attendue après rééducation, avec durée de vie de la prothèse à surveiller (10-20 ans).", "naturo": "Soutien de la cicatrisation osseuse et musculaire, accompagnement de la reprise d'activité physique progressive.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Prothèse de genou", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Remplacement de l'articulation du genou usée (arthrose sévère) par une prothèse artificielle.", "impact": "Changement anatomique définitif ; rééducation plus exigeante que pour la hanche, amplitude articulaire parfois incomplète.", "naturo": "Soutien inflammatoire et musculaire pendant la rééducation, accompagnement de la reprise d'activité.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Ligamentoplastie du genou (lca)", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Reconstruction chirurgicale du ligament croisé antérieur du genou, souvent après une rupture sportive.", "impact": "Rééducation longue (plusieurs mois) avant reprise sportive complète ; risque de laxité résiduelle selon la qualité de la rééducation.", "naturo": "Soutien de la cicatrisation ligamentaire et musculaire pendant la rééducation prolongée.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie de l'épaule (coiffe des rotateurs)", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Réparation chirurgicale d'un ou plusieurs tendons de la coiffe des rotateurs de l'épaule, rompus ou dégénérés.", "impact": "Rééducation longue avec immobilisation initiale ; récupération de la mobilité parfois incomplète selon l'étendue de la lésion.", "naturo": "Soutien de la cicatrisation tendineuse et accompagnement anti-inflammatoire pendant la rééducation.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie du rachis (hernie discale)", "type": "intervention", "categorie": "Digestif", "alias": [], "enBref": "Intervention sur la colonne vertébrale pour traiter une hernie discale compressive (ablation du fragment discal, parfois avec fusion).", "impact": "Amélioration attendue des douleurs radiculaires ; le segment vertébral opéré peut rester plus fragile, avec risque de sursollicitation des niveaux voisins si fusion.", "naturo": "Soutien musculaire et postural, accompagnement anti-inflammatoire dans les suites.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Cure de canal carpien", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Section chirurgicale du ligament comprimant le nerf médian au poignet (syndrome du canal carpien).", "impact": "Geste habituellement réparateur et durable ; récidive possible mais rare.", "naturo": "Soutien de la cicatrisation nerveuse et musculaire, accompagnement de la reprise des gestes fins.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie de l'hallux valgus (oignon du pied)", "type": "intervention", "categorie": "Orthopédie et rhumatologie", "alias": [], "enBref": "Correction chirurgicale d'une déviation du gros orteil (hallux valgus).", "impact": "Changement anatomique définitif visant à corriger la déformation ; récupération de plusieurs semaines avec appui progressif.", "naturo": "Soutien de la cicatrisation osseuse et accompagnement de la reprise de la marche.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Pontage coronarien", "type": "intervention", "categorie": "Cardiovasculaire", "alias": [], "enBref": "Création chirurgicale d'un ou plusieurs court-circuits vasculaires pour contourner une ou plusieurs artères coronaires bouchées.", "impact": "Changement anatomique définitif ; nécessite un suivi cardiovasculaire à vie et souvent un traitement (antiagrégant, statine) prolongé.", "naturo": "Soutien cardiovasculaire global (terrain inflammatoire, lipidique) en complément strict du suivi cardiologique, jamais en substitution.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Pose de stent coronarien", "type": "intervention", "categorie": "Cardiovasculaire", "alias": [], "enBref": "Mise en place d'un ressort métallique (stent) dans une artère coronaire rétrécie pour rétablir le flux sanguin.", "impact": "Dispositif définitif ; un traitement antiagrégant prolongé est indispensable pour éviter la thrombose du stent — vigilance sur toute interaction (RÈGLE anticoagulants/antiagrégants).", "naturo": "Soutien cardiovasculaire global en complément strict du suivi cardiologique et du traitement en cours, jamais en substitution.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie valvulaire cardiaque", "type": "intervention", "categorie": "Cardiovasculaire", "alias": [], "enBref": "Réparation ou remplacement chirurgical d'une valve cardiaque défaillante.", "impact": "Changement anatomique définitif ; suivi cardiologique à vie, traitement anticoagulant parfois indispensable selon le type de valve (mécanique).", "naturo": "Soutien cardiovasculaire global en complément strict du suivi cardiologique, jamais en substitution ; vigilance anticoagulants (RÈGLE vitamine K).", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Pose de pacemaker", "type": "intervention", "categorie": "Cardiovasculaire", "alias": [], "enBref": "Implantation d'un stimulateur cardiaque pour réguler le rythme du cœur.", "impact": "Dispositif électronique définitif nécessitant des contrôles réguliers et des précautions (champs magnétiques forts, certains appareils).", "naturo": "Soutien cardiovasculaire général en complément strict du suivi cardiologique, jamais en substitution.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie des varices (stripping/laser)", "type": "intervention", "categorie": "Cardiovasculaire", "alias": [], "enBref": "Ablation ou occlusion chirurgicale de veines superficielles dilatées (varices) des jambes.", "impact": "Amélioration circulatoire locale attendue ; récidive de nouvelles varices possible sur le long terme selon le terrain veineux.", "naturo": "Soutien veineux (circulation, tonicité de la paroi veineuse) pour limiter la formation de nouvelles varices.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Mastectomie", "type": "intervention", "categorie": "Sein", "alias": [], "enBref": "Ablation chirurgicale d'un sein, totale ou partielle, le plus souvent dans le cadre d'un cancer du sein.", "impact": "Changement anatomique définitif (sauf reconstruction) ; impact souvent important sur l'image corporelle, en plus des traitements associés (chimio, hormonothérapie).", "naturo": "Accompagnement de la cicatrisation et soutien global du terrain en lien avec les traitements oncologiques en cours — jamais en substitution du suivi oncologique.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Tumorectomie mammaire", "type": "intervention", "categorie": "Sein", "alias": [], "enBref": "Ablation chirurgicale limitée d'une tumeur du sein en conservant le sein.", "impact": "Cicatrice localisée ; souvent associée à une radiothérapie complémentaire selon le protocole oncologique.", "naturo": "Accompagnement de la cicatrisation et soutien global du terrain en lien avec les traitements oncologiques en cours — jamais en substitution du suivi oncologique.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Reconstruction mammaire", "type": "intervention", "categorie": "Sein", "alias": [], "enBref": "Reconstruction chirurgicale d'un sein après mastectomie (implant ou lambeau de tissu propre).", "impact": "Changement anatomique définitif ; plusieurs interventions sont parfois nécessaires pour finaliser le résultat.", "naturo": "Soutien de la cicatrisation sur les différents temps opératoires.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Réduction ou augmentation mammaire", "type": "intervention", "categorie": "Sein", "alias": [], "enBref": "Chirurgie esthétique ou fonctionnelle modifiant le volume des seins.", "impact": "Changement anatomique définitif ; sensibilité du mamelon parfois durablement modifiée.", "naturo": "Soutien de la cicatrisation dans les suites opératoires.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Prostatectomie", "type": "intervention", "categorie": "Urologie", "alias": [], "enBref": "Ablation chirurgicale totale ou partielle de la prostate, le plus souvent pour un cancer.", "impact": "Changement anatomique définitif ; troubles urinaires et/ou de l'érection possibles dans les suites, variables selon la technique et la récupération.", "naturo": "Accompagnement du confort urinaire et du terrain global en lien avec le suivi oncologique — jamais en substitution.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Néphrectomie", "type": "intervention", "categorie": "Urologie", "alias": [], "enBref": "Ablation chirurgicale totale ou partielle d'un rein.", "impact": "Si un seul rein est retiré, le rein restant compense généralement bien ; changement anatomique définitif nécessitant une vigilance rénale à long terme (hydratation, néphrotoxiques).", "naturo": "Soutien rénal doux (hydratation, éviter la surcharge en protéines/sel) et vigilance sur les compléments à élimination rénale.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie de la lithiase rénale (calculs)", "type": "intervention", "categorie": "Urologie", "alias": [], "enBref": "Fragmentation ou ablation chirurgicale de calculs rénaux ou urétéraux (lithotritie, urétéroscopie...).", "impact": "Geste ponctuel, sans changement anatomique durable dans la majorité des cas ; récidive de calculs possible selon le terrain.", "naturo": "Soutien de la filière urinaire (hydratation, terrain métabolique) pour limiter la récidive de calculs.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Circoncision", "type": "intervention", "categorie": "Urologie", "alias": [], "enBref": "Ablation chirurgicale du prépuce, pour raison médicale, rituelle ou culturelle.", "impact": "Changement anatomique définitif, sans conséquence fonctionnelle majeure connue.", "naturo": "Soutien de la cicatrisation locale dans les suites immédiates.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Cure de varicocèle", "type": "intervention", "categorie": "Urologie", "alias": [], "enBref": "Traitement chirurgical d'une dilatation des veines du cordon spermatique (varicocèle), parfois liée à une infertilité.", "impact": "Geste réparateur, sans séquelle anatomique durable attendue dans la majorité des cas.", "naturo": "Soutien circulatoire local dans les suites opératoires.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Exérèse de grain de beauté / lésion cutanée", "type": "intervention", "categorie": "Peau", "alias": [], "enBref": "Ablation chirurgicale d'une lésion cutanée (grain de beauté suspect, kyste, lipome...) à visée diagnostique ou thérapeutique.", "impact": "Geste ponctuel et localisé, sans changement anatomique notable au-delà de la cicatrice.", "naturo": "Soutien de la cicatrisation cutanée locale.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie d'un mélanome", "type": "intervention", "categorie": "Peau", "alias": [], "enBref": "Exérèse chirurgicale large d'un mélanome cutané, parfois associée à un curage ganglionnaire selon le stade.", "impact": "Cicatrice parfois étendue selon la marge de sécurité nécessaire ; suivi dermatologique régulier indispensable à vie.", "naturo": "Accompagnement de la cicatrisation et soutien du terrain immunitaire en lien avec le suivi oncologique — jamais en substitution.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Extraction de dents de sagesse", "type": "intervention", "categorie": "Dentaire et maxillo-facial", "alias": [], "enBref": "Ablation chirurgicale d'une ou plusieurs dents de sagesse, incluses ou mal positionnées.", "impact": "Geste ponctuel, récupération de quelques jours ; sans séquelle durable dans la majorité des cas.", "naturo": "Soutien de la cicatrisation buccale et accompagnement en cas d'antibiothérapie associée.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Chirurgie orthognathique (mâchoires)", "type": "intervention", "categorie": "Dentaire et maxillo-facial", "alias": [], "enBref": "Correction chirurgicale du positionnement des mâchoires (décalage important, trouble de l'occlusion).", "impact": "Changement anatomique définitif du squelette facial, avec immobilisation/rééducation masticatoire post-opératoire.", "naturo": "Soutien de la cicatrisation osseuse et adaptation alimentaire (textures) pendant la convalescence.", "definitif": true, "maj": "", "statut": "existante", "sources": []}, {"nom": "Autre chirurgie", "type": "intervention", "categorie": "Autres interventions", "alias": [], "enBref": "Catégorie générique pour toute intervention non listée par ailleurs — à préciser dans les effets ressentis.", "impact": "Impact variable selon le geste exact réalisé.", "naturo": "Accompagnement à ajuster selon l'organe concerné et les suites rapportées.", "definitif": false, "maj": "", "statut": "existante", "sources": []}, {"nom": "Anorexie mentale", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["anorexie", "anorexie restrictive", "TCA", "trouble du comportement alimentaire", "maigreur"], "enBref": "Maladie psychiatrique où la restriction alimentaire conduit à un poids significativement bas, avec une peur intense de prendre du poids et une perception déformée du corps. Elle existe sous deux formes : restrictive, ou avec crises de boulimie et conduites de purge.", "physiologie": "Face au manque d'énergie, le corps passe en économie : le métabolisme et le rythme cardiaque ralentissent, la température baisse (frilosité), la masse musculaire fond. L'hypothalamus freine l'axe hormonal : les règles s'arrêtent (aménorrhée hypothalamique) et la baisse des œstrogènes fragilise l'os. La digestion ralentit (vidange gastrique lente, constipation, ballonnements après quelques bouchées), ce qui entretient la peur de manger. Le cerveau en manque d'énergie accentue les pensées obsessionnelles autour de la nourriture. Une réalimentation trop rapide peut provoquer un syndrome de renutrition (chute du phosphore, du potassium et du magnésium) : elle doit être encadrée médicalement.", "symptomes": "Perte de poids, absence de règles, frilosité, fatigue, vertiges, chute de cheveux, duvet sur le corps (lanugo), peau sèche, constipation, ballonnements, rituels autour des repas (couper en tout petits morceaux, éviter les repas en société), hyperactivité physique, déni de la maigreur, irritabilité, isolement.", "diagnostic": "Critères DSM-5 : restriction conduisant à un poids significativement bas ; peur intense de prendre du poids ; altération de la perception du poids ou de la silhouette. Le diagnostic est posé par un médecin, avec un psychiatre. Suivi biologique et cardiaque : IMC, ECG, ionogramme (potassium, phosphore, magnésium), glycémie, numération sanguine ; ostéodensitométrie si la maladie dure.", "pec": "Toujours pluridisciplinaire : au moins un psychiatre ou psychologue et un médecin somaticien, avec un diététicien. Psychothérapies spécialisées (thérapie familiale chez l'adolescent, thérapies cognitivo-comportementales), réalimentation progressive et supervisée, parfois hospitalisation. Aucun médicament ne guérit l'anorexie : les psychotropes ne traitent que les troubles associés (anxiété, dépression).", "traitements": [{"label": "Suivi pluridisciplinaire (médecin, psychiatre ou psychologue, diététicien) — pilier du traitement", "marques": []}, {"label": "Psychothérapies spécialisées (thérapie familiale chez l'adolescent, TCC)", "marques": []}, {"label": "Réalimentation encadrée, parfois en hospitalisation", "marques": []}, {"label": "Correction des complications selon prescription (potassium, phosphore, vitamines, os)", "marques": []}], "naturo": "Repérer, orienter, soutenir le terrain EN PLUS de l'équipe de soins, jamais à sa place et jamais en pilotant l'alimentation. Ce qui reste possible : sommeil, gestion du stress, respiration et cohérence cardiaque, mouvement doux, rapport au corps, lien social. Compléments uniquement avec l'accord du médecin. Les symptômes digestifs (ballonnements, constipation, reflux) sont souvent la conséquence de la restriction : ne pas les traiter comme un SIBO ou un côlon irritable.", "alertes": ["Signes de gravité imposant une consultation médicale en urgence (HAS) : perte de poids de plus de 2 kg par semaine, refus de manger ou de boire, malaises ou vertiges en se levant, épuisement, IMC très bas (moins de 14 chez l'adulte), pouls très lent (moins de 40 par minute), confusion", "Idées suicidaires : voir la fiche « Idées suicidaires — conduite à tenir »", "Vomissements, laxatifs, diurétiques associés : risque de potassium bas et de troubles du rythme cardiaque"], "aNePasFaire": ["Proposer un régime, une éviction, un protocole FODMAP, un jeûne ou une fenêtre alimentaire (RÈGLE N°59 du générateur)", "Donner un chiffre : calories, grammes, poids cible, IMC, tour de taille", "Proposer un drainage, une détox, un laxatif végétal ou une plante diurétique", "Utiliser un vocabulaire qui moralise la nourriture (« propre », « mauvais », « interdit », « triche »)", "Proposer un complément sans l'accord du médecin (risque de déséquilibre en potassium et en électrolytes)"], "questions": ["La nourriture, le poids ou votre corps prennent-ils beaucoup de place dans vos pensées ?", "Y a-t-il des repas ou des aliments que vous vous interdisez ?", "Vos règles sont-elles absentes ou irrégulières depuis longtemps ?", "Quelqu'un de votre entourage s'inquiète-t-il de votre alimentation ou de votre poids ?"], "outils": "Générateur : RÈGLES N°26 (aménorrhée centrale), N°57 (perte de poids) et N°59 (garde-fou TCA, prioritaire). Questionnaires : repérage « Rapport à l'alimentation » (5 items) dans la section alimentation (consultation) et « Rapport à l'alimentation » (suivi).", "voirAussi": ["Boulimie", "Hyperphagie boulimique", "Orthorexie", "Restriction alimentaire évitante (ARFID)", "Idées suicidaires — conduite à tenir"], "sources": [{"t": "Vidal — Troubles du comportement alimentaire : confirmation du diagnostic et prise en charge (critères DSM-5, signes de gravité HAS)", "u": "https://www.vidal.fr/actualites/31616-troubles-du-comportement-alimentaire-confirmation-du-diagnostic-et-prise-en-charge.html"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Boulimie", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["boulimie nerveuse", "crises", "vomissements provoqués", "purges", "TCA"], "enBref": "Crises répétées pendant lesquelles la personne mange de grandes quantités en peu de temps avec une perte de contrôle, suivies de comportements pour « compenser » (vomissements provoqués, laxatifs, diurétiques, jeûne, sport excessif). Le poids est souvent normal : le trouble passe inaperçu.", "physiologie": "Le cycle s'entretient tout seul : restriction → faim intense → crise → culpabilité → compensation → restriction. Les vomissements, laxatifs et diurétiques font perdre du potassium, du sodium et du magnésium, d'où crampes, fatigue, et un risque de troubles du rythme cardiaque. L'acide gastrique abîme l'émail des dents, irrite l'œsophage (reflux) et fait gonfler les glandes salivaires (joues arrondies). Les laxatifs au long cours entretiennent la constipation. L'instabilité glycémique et la régulation perturbée de la satiété nourrissent les crises.", "symptomes": "Crises cachées, disparition après les repas, dents abîmées, joues gonflées, callosités sur le dos des doigts (signe de Russell), reflux, ballonnements, constipation, règles irrégulières, fatigue, crampes, variations de poids, honte et estime de soi très basse.", "diagnostic": "Critères DSM-5 : au moins une crise par semaine pendant 3 mois, suivie de comportements compensatoires. Diagnostic médical. Examens : ionogramme avec potassium, ECG en cas de purges, bilan dentaire.", "pec": "Pluridisciplinaire. Psychothérapie spécialisée (thérapies cognitivo-comportementales), régularisation des repas encadrée par l'équipe, traitement des complications (potassium, dents, reflux). Un antidépresseur peut être prescrit en complément de la psychothérapie.", "traitements": [{"label": "Thérapies cognitivo-comportementales spécialisées — traitement de référence", "marques": []}, {"label": "Antidépresseur (ISRS) en complément d'une psychothérapie, selon prescription", "marques": ["Prozac (fluoxétine)"]}, {"label": "Suivi médical et diététique pluridisciplinaire", "marques": []}], "naturo": "Même cadre que pour l'anorexie : repérer, orienter, soutenir le terrain en complément. Pas de drainage, de laxatif, de diurétique ni de détox, même végétaux. Le reflux et l'inconfort digestif sont fréquents et s'améliorent avec la régularité alimentaire encadrée par l'équipe. Compléments seulement avec l'accord du médecin.", "alertes": ["Vomissements fréquents, laxatifs ou diurétiques, palpitations, malaises, crampes intenses, faiblesse musculaire : consultation médicale rapide (potassium bas)", "Douleur thoracique, évanouissement : urgence", "Idées suicidaires : voir la fiche « Idées suicidaires — conduite à tenir »"], "aNePasFaire": ["Proposer un régime, une éviction, un protocole FODMAP, un jeûne ou une fenêtre alimentaire (RÈGLE N°59 du générateur)", "Donner un chiffre : calories, grammes, poids cible, IMC, tour de taille", "Proposer un drainage, une détox, un laxatif végétal ou une plante diurétique", "Utiliser un vocabulaire qui moralise la nourriture (« propre », « mauvais », « interdit », « triche »)", "Proposer un complément sans l'accord du médecin (risque de déséquilibre en potassium et en électrolytes)"], "questions": ["Vous arrive-t-il de manger beaucoup plus que prévu, avec l'impression de ne plus pouvoir vous arrêter ?", "Faites-vous quelque chose après avoir mangé pour « compenser » ?", "Ces moments sont-ils vécus avec de la honte, au point de les cacher ?"], "outils": "Générateur : RÈGLE N°59. Questionnaires : items « gestes pour compenser » et « perte de contrôle » du repérage « Rapport à l'alimentation ».", "voirAussi": ["Anorexie mentale", "Hyperphagie boulimique"], "sources": [{"t": "Vidal — Troubles du comportement alimentaire : confirmation du diagnostic et prise en charge (critères DSM-5, signes de gravité HAS)", "u": "https://www.vidal.fr/actualites/31616-troubles-du-comportement-alimentaire-confirmation-du-diagnostic-et-prise-en-charge.html"}, {"t": "HAS — Boulimie et hyperphagie boulimique : repérage et éléments généraux de prise en charge (2019)", "u": "https://www.has-sante.fr/jcms/c_985715/fr/boulimie-et-hyperphagie-boulimique-reperage-et-elements-generaux-de-prise-en-charge"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hyperphagie boulimique", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["binge eating", "BED", "compulsions alimentaires", "crises sans vomissement", "TCA"], "enBref": "Crises répétées avec perte de contrôle, comme dans la boulimie, mais sans comportement compensatoire. Elles s'accompagnent de honte, de culpabilité et d'une détresse marquée. Le surpoids est fréquent mais pas systématique. Ce n'est ni de la gourmandise ni un manque de volonté.", "physiologie": "Les régimes répétés et la restriction augmentent la faim et la réactivité aux aliments : le corps cherche à reconstituer ses réserves. Les émotions négatives (stress, tristesse, ennui) déclenchent les crises, qui apaisent brièvement avant de laisser place à la honte, puis à de nouvelles restrictions. Le trouble est associé à un risque plus élevé de diabète de type 2, d'hypertension, de reflux, d'apnée du sommeil, et il est fréquent chez les femmes avec un SOPK.", "symptomes": "Manger très vite, manger sans faim, manger jusqu'à l'inconfort, manger seule par honte, dégoût de soi ou culpabilité après, régimes répétés, prise de poids.", "diagnostic": "Critères DSM-5 : au moins une crise par semaine pendant 3 mois, avec au moins 3 caractéristiques (rapidité, absence de faim, inconfort abdominal marqué, isolement, honte, dégoût ou culpabilité) et sans comportement compensatoire. Diagnostic médical.", "pec": "Repose d'abord sur la psychothérapie (thérapies cognitivo-comportementales) et un suivi médical et diététique pluridisciplinaire. Un régime restrictif aggrave les crises et ne fait pas partie du traitement. Un médicament peut être discuté par le médecin selon les troubles associés.", "traitements": [{"label": "Thérapies cognitivo-comportementales spécialisées", "marques": []}, {"label": "Suivi pluridisciplinaire (médecin, psychologue, diététicien formé aux TCA)", "marques": []}], "naturo": "Aucun régime, aucun objectif de perte de poids, aucune restriction, aucun coupe-faim : tout cela entretient le cycle. Langage sans culpabilisation (« ce n'est pas un manque de volonté »). Soutien du terrain : sommeil, stress, activité plaisir, régularité douce des repas telle que définie avec l'équipe. Chez une cliente SOPK, vérifier le rapport à l'alimentation avant toute proposition alimentaire.", "alertes": ["Idées suicidaires ou détresse aiguë : voir la fiche « Idées suicidaires — conduite à tenir »", "Symptômes de diabète (soif intense, urines abondantes) ou hypertension : avis médical"], "aNePasFaire": ["Proposer un régime, une éviction, un protocole FODMAP, un jeûne ou une fenêtre alimentaire (RÈGLE N°59 du générateur)", "Donner un chiffre : calories, grammes, poids cible, IMC, tour de taille", "Proposer un drainage, une détox, un laxatif végétal ou une plante diurétique", "Utiliser un vocabulaire qui moralise la nourriture (« propre », « mauvais », « interdit », « triche »)", "Proposer un complément sans l'accord du médecin (risque de déséquilibre en potassium et en électrolytes)", "Annoncer un objectif de poids ou promettre une perte de poids"], "questions": ["Vous arrive-t-il de manger sans faim, très vite, jusqu'à l'inconfort ?", "Ces épisodes vous laissent-ils avec de la honte ou de la culpabilité ?", "Avez-vous fait beaucoup de régimes, avec des reprises de poids ?"], "outils": "Générateur : RÈGLES N°57 et N°59. Questionnaires : items « perte de contrôle » et « pensées envahissantes » du repérage « Rapport à l'alimentation ».", "voirAussi": ["Boulimie", "Anorexie mentale", "SOPK (syndrome des ovaires polykystiques)"], "sources": [{"t": "Vidal — Troubles du comportement alimentaire : confirmation du diagnostic et prise en charge (critères DSM-5, signes de gravité HAS)", "u": "https://www.vidal.fr/actualites/31616-troubles-du-comportement-alimentaire-confirmation-du-diagnostic-et-prise-en-charge.html"}, {"t": "HAS — Boulimie et hyperphagie boulimique : repérage et éléments généraux de prise en charge (2019)", "u": "https://www.has-sante.fr/jcms/c_985715/fr/boulimie-et-hyperphagie-boulimique-reperage-et-elements-generaux-de-prise-en-charge"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Orthorexie", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["orthorexie nerveuse", "manger sain", "alimentation pure", "obsession alimentaire", "TCA"], "enBref": "Obsession de manger « sain » ou « pur », avec des règles alimentaires de plus en plus strictes, de la culpabilité ou de l'angoisse au moindre écart et un retentissement sur la santé ou la vie sociale. Ce n'est pas un diagnostic officiel du DSM-5 ni de la CIM-11 : des critères de consensus ont été proposés en 2022. Elle diffère de l'anorexie par son but (la pureté de l'alimentation, pas la perte de poids), mais les deux peuvent se rejoindre.", "physiologie": "Les évictions s'accumulent : le microbiote s'appauvrit, les apports en fer, B12, zinc, calcium et protéines baissent, et la peur de certains aliments entretient un stress permanent qui active l'axe du cortisol et perturbe la digestion. Plus les règles sont strictes, plus l'écart devient anxiogène : la rigidité devient elle-même la source du problème. Le terrain est favorisé par des messages de santé qui moralisent les aliments (réseaux sociaux, certains discours de nutrition ou de naturopathie).", "symptomes": "Liste d'aliments interdits qui s'allonge, lecture obsessionnelle des étiquettes, temps important consacré à planifier les repas, refus de manger chez les autres, culpabilité ou angoisse après un écart, fatigue, carences, ballonnements, isolement social, parfois perte de poids.", "diagnostic": "Pas de diagnostic officiel. Un médecin ou un psychologue évalue le retentissement (carences, anxiété, perte de poids, isolement) et recherche un autre TCA, un trouble obsessionnel compulsif ou une anxiété associés.", "pec": "Psychothérapie (thérapies cognitivo-comportementales, exposition progressive aux aliments redoutés), diététicien formé aux TCA, correction des carences. L'objectif est d'élargir progressivement l'alimentation, pas de la restreindre autrement.", "traitements": [{"label": "Psychothérapie (TCC, exposition progressive)", "marques": []}, {"label": "Diététicien formé aux TCA et correction des carences", "marques": []}], "naturo": "Risque d'iatrogénie : une praticienne qui propose des évictions peut renforcer le trouble. Le protocole ALLÈGE les règles au lieu d'en ajouter. Pas de liste d'aliments à éviter, pas de vocabulaire « pur » ou « propre ». Chez une cliente SIBO ou SII, ne jamais enchaîner les évictions : encadrer la réintroduction. Orienter vers le médecin ou un diététicien formé si la rigidité est installée.", "alertes": ["Perte de poids, fatigue importante, carences, anxiété forte ou isolement : orientation médicale", "Idées suicidaires : voir la fiche « Idées suicidaires — conduite à tenir »"], "aNePasFaire": ["Proposer un régime, une éviction, un protocole FODMAP, un jeûne ou une fenêtre alimentaire (RÈGLE N°59 du générateur)", "Donner un chiffre : calories, grammes, poids cible, IMC, tour de taille", "Proposer un drainage, une détox, un laxatif végétal ou une plante diurétique", "Utiliser un vocabulaire qui moralise la nourriture (« propre », « mauvais », « interdit », « triche »)", "Proposer un complément sans l'accord du médecin (risque de déséquilibre en potassium et en électrolytes)", "Remplacer une éviction par une autre « plus saine »"], "questions": ["Avez-vous une liste d'aliments que vous vous interdisez, et qui s'allonge ?", "Que ressentez-vous quand vous mangez quelque chose qui n'est pas dans vos règles ?", "Évitez-vous des repas avec d'autres personnes à cause de ce que vous mangez ?"], "outils": "Générateur : RÈGLE N°59 point 6. Questionnaires : item « liste d'aliments interdits qui s'allonge » du repérage « Rapport à l'alimentation ». Particulièrement utile avant un protocole FODMAP (SIBO, SII).", "voirAussi": ["Anorexie mentale", "SIBO (pullulation bactérienne de l'intestin grêle)", "SII (syndrome de l'intestin irritable)"], "sources": [{"t": "Donini et al. (2022) — Consensus sur la définition et les critères diagnostiques de l'orthorexie nerveuse, Eating and Weight Disorders", "u": "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9803763/"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Restriction alimentaire évitante (ARFID)", "type": "trouble", "categorie": "Troubles du comportement alimentaire", "alias": ["ARFID", "trouble de l'alimentation évitante", "alimentation sélective", "phobie alimentaire", "peur de s'étouffer", "TCA"], "enBref": "Trouble où la personne mange trop peu ou trop sélectivement, non pas par peur de grossir, mais à cause d'une aversion sensorielle (textures, odeurs), d'une peur de s'étouffer ou de vomir, ou d'un très faible intérêt pour manger. Il entraîne une perte de poids, des carences ou une gêne dans la vie quotidienne. Il figure dans le DSM-5.", "physiologie": "L'alimentation réduite à quelques aliments « sûrs » apporte trop peu d'énergie et de micronutriments (fer, zinc, vitamines, protéines), avec fatigue, retard de croissance chez l'enfant et fragilité immunitaire. La peur ou le dégoût déclenchent une réaction de stress à chaque repas, qui perturbe la digestion et renforce l'évitement. Il est fréquent chez les personnes autistes, avec un TDAH ou une anxiété importante.", "symptomes": "Très peu d'aliments acceptés, refus de textures ou d'odeurs, peur de s'étouffer ou de vomir, appétit faible, perte de poids, carences, dépendance à des compléments, repas sources de conflits ou de stress.", "diagnostic": "Diagnostic médical (DSM-5) : restriction ou évitement avec perte de poids, carence, dépendance à une alimentation artificielle ou gêne importante, sans préoccupation de l'image du corps. Recherche des troubles associés.", "pec": "Pluridisciplinaire : médecin, psychologue ou psychiatre, diététicien. Thérapies cognitivo-comportementales adaptées avec exposition progressive aux aliments, correction des carences, parfois soutien nutritionnel médical.", "traitements": [{"label": "Thérapie cognitivo-comportementale adaptée avec exposition progressive", "marques": []}, {"label": "Suivi diététique et correction des carences", "marques": []}], "naturo": "Ne jamais forcer ni négocier un aliment. Orienter vers le médecin, soutenir le terrain (stress, sommeil, digestion) sans restreindre davantage. Aucun protocole alimentaire strict : la personne mange déjà très peu de variété.", "alertes": ["Perte de poids, retard de croissance, carences, malaises : consultation médicale", "Idées suicidaires : voir la fiche « Idées suicidaires — conduite à tenir »"], "aNePasFaire": ["Proposer un régime, une éviction, un protocole FODMAP, un jeûne ou une fenêtre alimentaire (RÈGLE N°59 du générateur)", "Donner un chiffre : calories, grammes, poids cible, IMC, tour de taille", "Proposer un drainage, une détox, un laxatif végétal ou une plante diurétique", "Utiliser un vocabulaire qui moralise la nourriture (« propre », « mauvais », « interdit », « triche »)", "Proposer un complément sans l'accord du médecin (risque de déséquilibre en potassium et en électrolytes)"], "questions": ["Y a-t-il peu d'aliments que vous acceptez de manger ?", "Est-ce à cause de textures, d'odeurs, de la peur de vous étouffer ou de vomir ?", "Cela a-t-il des conséquences sur votre poids, votre énergie ou vos sorties ?"], "outils": "Générateur : RÈGLE N°59. Questionnaires : repérage « Rapport à l'alimentation » (restriction marquée).", "voirAussi": ["Anorexie mentale", "Orthorexie"], "sources": [{"t": "Vidal — Troubles du comportement alimentaire : confirmation du diagnostic et prise en charge (critères DSM-5, signes de gravité HAS)", "u": "https://www.vidal.fr/actualites/31616-troubles-du-comportement-alimentaire-confirmation-du-diagnostic-et-prise-en-charge.html"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Idées suicidaires — conduite à tenir", "type": "conduite", "categorie": "Santé mentale et neurologie", "alias": ["suicide", "idées noires", "envie de mourir", "détresse", "urgence psychique", "3114"], "enBref": "Fiche de conduite à tenir pour une praticienne non médecin face à une cliente qui évoque des idées noires, l'envie de ne plus vivre ou de mourir. Il ne s'agit pas d'évaluer le risque seule, mais de réagir calmement et d'orienter sans attendre.", "physiologie": "La détresse extrême rétrécit la vision de la personne : elle ne voit plus d'autre issue que l'arrêt de la douleur. Les idées suicidaires accompagnent souvent la dépression, l'épuisement, un trouble bipolaire, un TCA, des addictions ou un événement de vie très douloureux. Elles fluctuent : une personne peut aller mieux puis très mal en quelques heures. Poser la question directement n'incite pas à passer à l'acte ; au contraire, cela soulage et ouvre la porte à une aide.", "symptomes": "Paroles sur l'envie de disparaître ou de ne plus être un poids, retrait, désespoir, insomnie, remise en ordre de ses affaires, don d'objets, adieux, comportement soudain apaisé après une période de grande détresse, consommation d'alcool ou de médicaments en hausse.", "diagnostic": "L'évaluation du risque relève d'un médecin ou d'un psychiatre (idées, plan, moyens, date, antécédents). Le médecin traitant est le premier interlocuteur.", "pec": "Suivi psychiatrique et psychothérapie, traitement de la cause (dépression, trouble bipolaire, etc.), plan de sécurité, éloignement des moyens, soutien de l'entourage. En danger immédiat : urgences.", "traitements": [{"label": "Évaluation et suivi médical ou psychiatrique, selon la situation", "marques": []}, {"label": "Numéro national de prévention du suicide : 3114 (gratuit, 24h/24)", "marques": []}, {"label": "Danger immédiat : 15 (SAMU) ou 112", "marques": []}], "naturo": "Accueillir sans juger, poser la question franchement (« avez-vous parfois des idées de mettre fin à vos jours ? »), écouter, ne pas banaliser, ne pas promettre de résoudre le problème. Dire que vous allez l'aider à trouver une aide adaptée. Orienter vers le médecin traitant dans les tout prochains jours et rappeler le 3114. En danger immédiat, ne pas la laisser seule et appeler le 15 ou le 112. Protocole naturopathique minimal ensuite (sommeil, rythme, repas réguliers, lien social), sans nouveau complément.", "alertes": ["Plan précis, moyens disponibles, date envisagée : danger immédiat, appeler le 15 ou le 112", "Idées présentes avec alcool, médicaments ou isolement complet : orientation médicale le jour même", "Après un geste ou une tentative : urgences"], "aNePasFaire": ["Banaliser (« ça va passer », « pensez à vos enfants »)", "Promettre de garder le secret quoi qu'il arrive", "Laisser la personne seule en cas de danger immédiat", "Proposer un nouveau complément ou un protocole chargé", "Se contenter d'un message : un appel ou un rendez-vous rapide avec le médecin est nécessaire"], "questions": ["Avez-vous eu des idées noires ces derniers temps ?", "Avez-vous parfois pensé à mettre fin à vos jours ?", "Y a-t-il un moment, un plan, un moyen en tête ?", "Avec qui pouvez-vous en parler aujourd'hui ?"], "outils": "Questionnaires : item « Moral — idées noires ou envie de ne plus vivre » (consultation, section humeur ; suivi, rubrique Émotionnel & mental). Générateur : alerte rouge avant génération et RÈGLE N°61 point 2 (orientation en premier, protocole minimal).", "voirAussi": ["Dépression / anxiété diagnostiquée", "Bipolarité", "Anorexie mentale"], "sources": [{"t": "Numéro national de prévention du suicide 3114 — ligne gratuite 24h/24 (à vérifier avant diffusion)", "u": "https://3114.fr"}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "Hypothyroïdie et Hashimoto", "type": "maladie", "categorie": "Endocrinien et métabolique", "alias": ["Hashimoto", "thyroïde", "thyroïdite", "hypothyroïdie", "TSH", "anti-TPO", "Levothyrox", "Lévothyrox"], "enBref": "La thyroïde produit trop peu d'hormones thyroïdiennes (T4, T3). Dans nos régions, la cause la plus fréquente est la thyroïdite de Hashimoto, une maladie auto-immune où des anticorps détruisent progressivement la glande.", "physiologie": "Les hormones thyroïdiennes règlent le rythme de chaque cellule : chaleur, énergie, transit, rythme cardiaque, cycles, peau et cheveux. Quand elles manquent, l'hypophyse réclame plus de TSH, qui monte. Dans Hashimoto, le système immunitaire produit des anticorps (anti-TPO, anti-thyroglobuline) qui attaquent la glande. La T4 doit ensuite être convertie en T3, active, grâce notamment au sélénium, au zinc, au fer et à un foie et un intestin fonctionnels. L'excès d'iode peut aggraver l'auto-immunité chez une personne prédisposée.", "symptomes": "Fatigue, frilosité, prise de poids, constipation, peau sèche, chute de cheveux, voix enrouée, règles abondantes ou irrégulières, moral bas, brouillard mental, goitre.", "diagnostic": "Dosage de la TSH, puis T4 libre ; anticorps anti-TPO pour Hashimoto ; échographie de la thyroïde. Les valeurs sont interprétées par un médecin.", "pec": "Substitution par lévothyroxine, le plus souvent à vie, à dose ajustée par le médecin sur la TSH. Prise à jeun avec de l'eau, 30 à 60 minutes avant le petit-déjeuner, à distance (au moins 4 heures) du fer, du calcium, du magnésium et des inhibiteurs de la pompe à protons.", "traitements": [{"label": "Lévothyroxine (substitution hormonale)", "marques": ["Levothyrox (lévothyroxine)", "L-Thyroxine SERB", "Euthyrox"]}], "naturo": "Ne jamais toucher au traitement. Sélénium avant iode (RÈGLE N°11) ; aucun iode concentré (kelp, fucus) en terrain auto-immun sans bilan. Soutenir la conversion T4/T3 (zinc, fer, vitamine D selon bilans), l'intestin, le stress et le sommeil. Si fer, calcium ou magnésium sont proposés, écrire l'espacement de 4 heures avec la lévothyroxine.", "alertes": ["Palpitations, perte de poids rapide, tremblements : possible excès d'hormones (hyperthyroïdie), avis médical", "Goitre qui grossit vite, douleur ou gêne au cou, voix qui change", "Somnolence extrême, hypothermie, confusion : urgence (coma myxœdémateux)"], "aNePasFaire": ["Proposer de l'iode, du kelp ou du fucus concentrés (surtout en Basedow)", "Suggérer de réduire ou d'arrêter la lévothyroxine", "Oublier l'espacement de 4 heures avec fer, calcium, magnésium ou IPP", "Annoncer qu'un protocole « guérit » Hashimoto"], "questions": ["Prenez-vous un traitement pour la thyroïde ? À quel moment de la journée ?", "Quand votre TSH et vos anticorps ont-ils été dosés pour la dernière fois ?", "Prenez-vous du fer, du calcium ou du magnésium ?"], "outils": "Générateur : RÈGLES N°6 (Lévothyrox), N°11 (soutien thyroïdien), N°43 (lecture du bilan thyroïdien). Voir aussi la fiche Basedow / hyperthyroïdie.", "voirAussi": ["Basedow / hyperthyroïdie"], "sources": [{"t": "Recommandations HAS sur la prise en charge de l'hypothyroïdie (à vérifier avant diffusion)", "u": ""}], "maj": "2026-10-15", "statut": "nouvelle"}, {"nom": "SIBO (pullulation bactérienne de l'intestin grêle)", "type": "maladie", "categorie": "Digestif", "alias": ["SIBO", "pullulation bactérienne", "IMO", "SIBO méthane", "SIBO hydrogène", "ballonnements", "breath test", "intestin grêle"], "enBref": "Un excès de bactéries dans l'intestin grêle, normalement peu peuplé, fermente les glucides trop tôt dans la digestion. Il produit des gaz (hydrogène, méthane, sulfure d'hydrogène) qui causent ballonnements, douleurs et troubles

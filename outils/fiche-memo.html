<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Mémo — Avita Serena</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blanc:#FFFFFF;--off:#F7F6F4;--grege:#EDE9E1;--taupe:#D5CFC6;
  --sable:#C4A882;--ocre:#B4906A;--ardoise:#1E1E1C;--gris:#6B6560;
  --or-clair:#FBF3E4;--or:#9B7230;
  --vert-clair:#EAF0E6;--vert:#3D6B2C;
  --rose-clair:#F5EAEE;--rose:#8A3A52;
  --rouge-clair:#F9EDEC;--rouge:#8B3A3A;
  --bleu-clair:#EAF2F8;--bleu:#2C5E8A;
  --violet-clair:#F0EAF8;--violet:#6B4E8A;
  --amber-clair:#FBF4E2;--amber:#8B6010;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Be Vietnam Pro',sans-serif;color:var(--ardoise);background:var(--off);font-size:15px;line-height:1.65}
body{max-width:720px;margin:0 auto;padding:0 0 80px}

/* ── HEADER ── */
.hdr{background:var(--ardoise);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.logo .avita{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--blanc)}
.logo .serena{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;font-size:22px;color:var(--blanc)}
.hdr-badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sable);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:5px 14px;border-radius:99px;font-weight:600}
.hdr-stripe{height:3px;background:linear-gradient(to right,var(--taupe),var(--sable),var(--ocre),var(--sable),var(--taupe))}

/* ── HERO ── */
.hero{background:var(--blanc);border-bottom:1px solid var(--taupe);padding:22px 28px 18px}
.hero-prenom{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--ardoise)}
.hero-sub{font-size:12px;color:var(--gris);margin-top:3px;letter-spacing:.04em}
.hero-date{font-size:11px;color:var(--ocre);font-weight:600;margin-top:6px}
.hero-desc{font-size:13px;color:var(--gris);margin-top:10px;line-height:1.7;padding-top:10px;border-top:1px solid var(--grege)}

/* ── PROGRESSION ── */
.prog-wrap{background:var(--blanc);border-bottom:1px solid var(--taupe);padding:12px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.prog-bar{flex:1;height:5px;background:var(--grege);border-radius:3px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--sable),var(--ocre));transition:width .4s cubic-bezier(.4,0,.2,1)}
.prog-label{font-size:11px;font-weight:700;color:var(--ocre);white-space:nowrap}

/* ── PAGE ── */
.page{padding:18px 28px}

/* ── PILIER HEADER ── */
.pilier-hdr{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.pilier-hdr:first-child{margin-top:8px}
.pilier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pilier-name{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* ── RECO CARD ── */
.reco-list{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.reco-card{background:var(--blanc);border:1.5px solid var(--taupe);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:all .15s;user-select:none}
.reco-card:hover{border-color:var(--sable);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.reco-card.ok{background:var(--vert-clair);border-color:var(--vert)}
.reco-card.partiel{background:var(--amber-clair);border-color:var(--amber)}
.reco-card.non{background:var(--rouge-clair);border-color:var(--rouge)}

.reco-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--taupe);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:all .15s;background:var(--off);margin-top:1px}
.reco-card.ok .reco-check{background:var(--vert);border-color:var(--vert);color:var(--blanc)}
.reco-card.partiel .reco-check{background:var(--amber);border-color:var(--amber);color:var(--blanc)}
.reco-card.non .reco-check{background:var(--rouge);border-color:var(--rouge);color:var(--blanc)}

.reco-text{flex:1;font-size:13.5px;line-height:1.6;color:var(--ardoise)}
.reco-card.ok .reco-text{color:var(--vert)}
.reco-card.partiel .reco-text{color:var(--amber)}
.reco-card.non .reco-text{color:var(--rouge)}

.reco-titre-bloc{font-size:10px;color:var(--gris);letter-spacing:.04em;margin-bottom:3px;display:block}

/* ── LÉGENDE ── */
.legende{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px;font-size:11px;font-weight:600}
.leg-item{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;cursor:default}
.leg-item.ok{background:var(--vert-clair);color:var(--vert)}
.leg-item.partiel{background:var(--amber-clair);color:var(--amber)}
.leg-item.non{background:var(--rouge-clair);color:var(--rouge)}
.leg-item.vide{background:var(--grege);color:var(--gris)}

/* ── NOTE PRATICIEN ── */
.note-praticien{background:var(--blanc);border:1.5px solid var(--taupe);border-radius:10px;padding:14px 16px;margin-top:16px}
.note-praticien label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ocre);display:block;margin-bottom:7px}
.note-praticien textarea{width:100%;border:1px solid var(--taupe);border-radius:7px;padding:9px 12px;font-family:'Be Vietnam Pro',sans-serif;font-size:13px;color:var(--ardoise);background:var(--off);resize:vertical;min-height:70px;outline:none;line-height:1.6;transition:border-color .15s}
.note-praticien textarea:focus{border-color:var(--ocre);background:var(--blanc)}
.note-praticien textarea::placeholder{color:var(--taupe)}

/* ── ACTIONS ── */
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn-primary{background:var(--ardoise);color:var(--blanc);border:none;border-radius:99px;padding:13px 26px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--blanc);color:var(--ardoise);border:1.5px solid var(--taupe);border-radius:99px;padding:12px 24px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-secondary:hover{border-color:var(--ardoise)}
.btn-ocre{background:var(--ocre);color:var(--blanc);border:none;border-radius:99px;padding:13px 26px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-ocre:hover{opacity:.85}

/* ── ÉTAT SAUVEGARDÉ ── */
.save-indicator{font-size:11px;color:var(--vert);font-weight:600;opacity:0;transition:opacity .3s;display:flex;align-items:center;gap:4px}
.save-indicator.show{opacity:1}

/* ── MODE PRATICIEN ── */
.praticien-panel{background:var(--or-clair);border:1.5px solid rgba(180,144,106,.3);border-radius:12px;padding:16px 18px;margin-top:20px;display:none}
.praticien-panel.open{display:block}
.praticien-panel h3{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--or);margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{background:var(--blanc);border-radius:8px;padding:10px;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:var(--ardoise)}
.stat-lbl{font-size:10px;color:var(--gris);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.stat-box.ok .stat-num{color:var(--vert)}
.stat-box.partiel .stat-num{color:var(--amber)}
.stat-box.non .stat-num{color:var(--rouge)}

/* ── VIDE ── */
.empty-state{text-align:center;padding:60px 24px;color:var(--gris)}
.empty-state .ico{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.7}
.empty-state a{color:var(--ocre);font-weight:600;text-decoration:none}

/* ── PRINT ── */
@media print{
  .prog-wrap,.actions,.note-praticien,.praticien-panel,.btn-primary,.btn-secondary,.btn-ocre{display:none!important}
  body{background:white;max-width:100%}
  .reco-card{break-inside:avoid;border:1px solid #ccc}
  .hdr{background:#1E1E1C!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

@media(max-width:600px){
  .hdr,.page,.hero,.prog-wrap{padding-left:16px;padding-right:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .actions{flex-direction:column}
  .btn-primary,.btn-secondary,.btn-ocre{width:100%;text-align:center}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo"><span class="avita">avita</span><span class="serena">serena</span></div>
  <div class="hdr-badge">Fiche Mémo Suivi</div>
</div>
<div class="hdr-stripe"></div>

<div id="hero-wrap" class="hero" style="display:none">
  <div class="hero-prenom" id="hero-prenom">—</div>
  <div class="hero-sub" id="hero-sub">Protocole d'Hygiène Vitale · Avita Serena</div>
  <div class="hero-date" id="hero-date"></div>
  <div class="hero-desc">Voici vos recommandations personnalisées. Cochez chaque item selon votre vécu depuis notre dernière consultation. Soyez sincère — c'est votre boussole pour le suivi.</div>
</div>

<div class="prog-wrap" id="prog-wrap" style="display:none">
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-label" id="prog-label">0 / 0 réalisé·es</div>
</div>

<div class="page">
  <div id="main-content"></div>
</div>

<script>
const PILIER_LABELS = {
  alimentation:'🌿 Alimentation',
  psychologie:'🧠 Psychologie & émotions',
  activite:'🏃 Activité physique',
  complements:'✦ Compléments ciblés',
  bilan:'📊 Bilan & suivi',
  autre:'— Autre',
};
const PILIER_COLORS = {
  alimentation:{dot:'#3D6B2C',name:'#3D6B2C'},
  psychologie: {dot:'#6B4E8A',name:'#6B4E8A'},
  activite:    {dot:'#2C5E8A',name:'#2C5E8A'},
  complements: {dot:'#9B7230',name:'#9B7230'},
  bilan:       {dot:'#8A3A52',name:'#8A3A52'},
  autre:       {dot:'#6B6560',name:'#6B6560'},
};

const STATES = ['','ok','partiel','non'];
const STATE_ICONS = {'':'','ok':'✓','partiel':'~','non':'✗'};
const STATE_LABELS = {'':'Non renseigné','ok':'Tenu','partiel':'Partiellement','non':'Pas encore'};

let memoData = null;
let states = {}; // rec index -> state
let noteText = '';

function load() {
  // Essayer localStorage
  try {
    const raw = localStorage.getItem('avita_memo');
    if (raw) {
      memoData = JSON.parse(raw);
    }
  } catch(e){}

  if (!memoData || !memoData.recs || !memoData.recs.length) {
    document.getElementById('main-content').innerHTML = `
      <div class="empty-state">
        <div class="ico">📋</div>
        <p>Aucune fiche mémo disponible.<br>
        Générez un protocole depuis le <a href="generateur.html">Générateur PHV</a> puis cliquez sur "Fiche mémo cliente".</p>
      </div>`;
    return;
  }

  // Charger états sauvegardés
  try {
    const savedKey = 'avita_memo_states_' + (memoData.prenom||'') + '_' + (memoData.date||'');
    const savedRaw = localStorage.getItem(savedKey);
    if (savedRaw) { const s = JSON.parse(savedRaw); states = s.states||{}; noteText = s.note||''; }
  } catch(e){}

  render();
}

function render() {
  const d = memoData;
  document.getElementById('hero-prenom').textContent = d.prenom || '—';
  document.getElementById('hero-sub').textContent = d.sous_titre || 'Protocole d\'Hygiène Vitale · Avita Serena';
  document.getElementById('hero-date').textContent = d.date ? 'Généré le ' + new Date(d.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : '';
  document.getElementById('hero-wrap').style.display = 'block';
  document.getElementById('prog-wrap').style.display = 'flex';

  // Grouper par pilier
  const groups = {};
  d.recs.forEach((rec, i) => {
    const p = rec.pilier || 'autre';
    if (!groups[p]) groups[p] = [];
    groups[p].push({...rec, idx: i});
  });

  const pilierOrder = ['alimentation','psychologie','activite','complements','bilan','autre'];

  let html = '';

  // Légende
  html += `<div class="legende">
    <div class="leg-item vide">○ À évaluer</div>
    <div class="leg-item ok">✓ Tenu</div>
    <div class="leg-item partiel">~ Partiellement</div>
    <div class="leg-item non">✗ Pas encore</div>
  </div>`;

  pilierOrder.forEach(p => {
    if (!groups[p]) return;
    const pc = PILIER_COLORS[p] || PILIER_COLORS.autre;
    html += `<div class="pilier-hdr">
      <div class="pilier-dot" style="background:${pc.dot}"></div>
      <div class="pilier-name" style="color:${pc.name}">${PILIER_LABELS[p]||p}</div>
    </div>
    <div class="reco-list">`;
    groups[p].forEach(rec => {
      const st = states[rec.idx] || '';
      html += `<div class="reco-card ${st}" onclick="toggleState(${rec.idx})" id="reco-${rec.idx}">
        <div class="reco-check">${STATE_ICONS[st]}</div>
        <div class="reco-text">
          <span class="reco-titre-bloc">${escH(rec.titre_bloc||'')}</span>
          ${escH(rec.texte)}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  // Note praticien
  html += `<div class="note-praticien">
    <label>📝 Note de suivi (usage praticien)</label>
    <textarea id="note-input" placeholder="Observations, ajustements à prévoir, points à retravailler en consultation…" oninput="saveNote(this.value)">${escH(noteText)}</textarea>
  </div>`;

  // Panel stats praticien
  html += `<div class="praticien-panel" id="praticien-panel">
    <h3>Vue praticien — Bilan d'observance</h3>
    <div class="stats-grid" id="stats-grid"></div>
  </div>`;

  // Actions
  html += `<div class="actions">
    <button class="btn-primary" onclick="window.print()">🖨 Imprimer / PDF</button>
    <button class="btn-ocre" onclick="togglePraticienPanel()">📊 Vue praticien</button>
    <button class="btn-secondary" onclick="resetAll()">↺ Réinitialiser</button>
    <span class="save-indicator" id="save-ok">✓ Sauvegardé</span>
  </div>`;

  document.getElementById('main-content').innerHTML = html;
  updateProgress();
}

function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleState(idx) {
  const current = states[idx] || '';
  const ci = STATES.indexOf(current);
  const next = STATES[(ci + 1) % STATES.length];
  states[idx] = next;

  const card = document.getElementById('reco-'+idx);
  if (card) {
    card.className = 'reco-card ' + next;
    card.querySelector('.reco-check').textContent = STATE_ICONS[next];
  }
  saveStates();
  updateProgress();
  updateStatsPanel();
}

function updateProgress() {
  if (!memoData) return;
  const total = memoData.recs.length;
  const done = Object.values(states).filter(s => s === 'ok').length;
  const pct = total ? Math.round(done/total*100) : 0;
  const fill = document.getElementById('prog-fill');
  const label = document.getElementById('prog-label');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = done + ' / ' + total + ' tenu·es (' + pct + '%)';
}

function updateStatsPanel() {
  const panel = document.getElementById('praticien-panel');
  if (!panel || !panel.classList.contains('open')) return;
  renderStats();
}

function renderStats() {
  const total = memoData.recs.length;
  const ok = Object.values(states).filter(s=>s==='ok').length;
  const partiel = Object.values(states).filter(s=>s==='partiel').length;
  const non = Object.values(states).filter(s=>s==='non').length;
  const vide = total - ok - partiel - non;
  const grid = document.getElementById('stats-grid');
  if (!grid) return;
  grid.innerHTML = `
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-box ok"><div class="stat-num">${ok}</div><div class="stat-lbl">Tenus</div></div>
    <div class="stat-box partiel"><div class="stat-num">${partiel}</div><div class="stat-lbl">Partiels</div></div>
    <div class="stat-box non"><div class="stat-num">${non}</div><div class="stat-lbl">Pas encore</div></div>`;
}

function togglePraticienPanel() {
  const panel = document.getElementById('praticien-panel');
  if (!panel) return;
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderStats();
}

function saveStates() {
  try {
    const key = 'avita_memo_states_' + (memoData.prenom||'') + '_' + (memoData.date||'');
    localStorage.setItem(key, JSON.stringify({ states, note: noteText }));
    const ind = document.getElementById('save-ok');
    if (ind) { ind.classList.add('show'); clearTimeout(ind._t); ind._t = setTimeout(()=>ind.classList.remove('show'), 1800); }
  } catch(e){}
}

function saveNote(val) {
  noteText = val;
  saveStates();
}

function resetAll() {
  if (!confirm('Réinitialiser toutes les cases à cocher ?')) return;
  states = {};
  noteText = '';
  saveStates();
  render();
}

load();
</script>
</body>
</html>

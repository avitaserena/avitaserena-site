<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boîte à outils compléments — A VITA SERENA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ═══ A VITA SERENA — socle commun des outils praticienne (même charte que le CRM v7 « Atelier ») ═══ */
:root{
  --ink:#1E1E1C; --ink3:#4B4641; --muted:#6B6560;
  --border:#E7E2D9; --border2:#D5CFC6;
  --canvas:#F7F6F4; --white:#FFFFFF; --grege:#EDE9E1; --side:#F1EEE7;
  --gold:#B4906A; --gold-lt:#F5EFE6; --gold-dk:#7A5C38; --sable:#C4A882;
  --green:#4F7A57; --green-lt:#E8F0E6;
  --orange:#A9702A; --orange-lt:#F8EEDC;
  --red:#B4452F; --red-lt:#F8E8E2;
  --violet:#6E5A78; --violet-lt:#EFEAF1;
  --blue:#4A6B82; --blue-lt:#E9EFF2;
  --font:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --r8:10px; --r12:14px; --r16:18px; --r99:999px;
  --sw:272px; --pad:36px;
  --sh2:0 10px 30px rgba(30,30,28,.09); --sh3:0 18px 48px rgba(30,30,28,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(180,144,106,.3)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
mark{background:rgba(180,144,106,.28);color:inherit;border-radius:3px;padding:0 1px}
.ico{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ── Coque ── */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sw);flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--border);padding:24px 14px 16px;display:flex;flex-direction:column;gap:4px;z-index:300}
.sb-head{padding:2px 10px 20px;display:flex;flex-direction:column;gap:10px}
.sb-logo svg{width:124px;height:auto;display:block}
.sb-logo svg path,.sb-logo svg circle{fill:var(--ink)}
.sb-pill{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r12);color:var(--ink);font-size:14.5px;font-weight:500;position:relative;transition:background .15s;text-align:left;width:100%;background:none;border:none;text-decoration:none}
.sb-item:hover{background:rgba(255,255,255,.7)}
.sb-item.active{background:var(--white);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.sb-item.active::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.sb-item .ico{color:var(--muted)}
.sb-item.active .ico{color:var(--gold-dk)}
.sb-lbl{flex:1;min-width:0}
.sb-n{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sb-item.sub{font-size:13.5px;padding:7px 12px 7px 40px;font-weight:500;color:var(--ink3)}
.sb-item.sub.active{color:var(--ink)}
.sb-item.sub.active::before{left:-14px}
.sb-item.sb-ext{font-size:13.5px;color:var(--ink3);padding:7px 12px}
.sb-item.sb-ext .sb-lbl::after{content:' ↗';color:var(--muted);font-size:12px}
.sb-scroll{display:flex;flex-direction:column;gap:2px}
.sb-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:22px;padding:16px var(--pad);background:rgba(247,246,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-title{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1;white-space:nowrap}
.topbar-count{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ── Recherche + suggestions ── */
.gsearch{position:relative;flex:1;max-width:640px;margin-left:auto}
.gsearch input{width:100%;height:46px;border:1px solid var(--border2);border-radius:var(--r99);background:var(--white);padding:0 74px 0 46px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.gsearch input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(180,144,106,.18)}
.gsearch>.ico{position:absolute;left:17px;top:14px;color:var(--muted);pointer-events:none}
.gs-kbd{position:absolute;right:14px;top:12px;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--border2);border-radius:7px;padding:1px 8px;background:var(--canvas);pointer-events:none}
.gs-clear{position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:50%;border:none;background:var(--grege);display:none;align-items:center;justify-content:center;color:var(--ink3)}
.gsearch.has-q .gs-clear{display:flex}.gsearch.has-q .gs-kbd{display:none}
.gs-res{position:absolute;left:0;right:0;top:54px;background:var(--white);border:1px solid var(--border2);border-radius:var(--r16);box-shadow:var(--sh3);padding:8px;display:none;z-index:500;max-height:70vh;overflow-y:auto;animation:fade .12s}
.gs-res.open{display:block}
.gs-grp{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);padding:10px 12px 4px}
.gs-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r8);cursor:pointer}
.gs-row.sel,.gs-row:hover{background:var(--gold-lt)}
.gs-row .gs-t{font-size:14.5px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-row .gs-k{font-size:11.5px;color:var(--muted);white-space:nowrap}
.gs-row .ico{color:var(--muted)}
.gs-none{padding:14px 12px;color:var(--muted);font-size:13.5px}
.gs-foot{display:flex;gap:14px;padding:9px 12px 4px;border-top:1px solid var(--border);margin-top:6px;font-size:11.5px;color:var(--muted)}

/* ── Éléments de base ── */
.page{padding:28px var(--pad) 72px;max-width:1320px;width:100%;margin:0 auto;animation:fade .2s}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 15px;border-radius:var(--r99);font-size:13.5px;font-weight:500;border:1px solid var(--border2);color:var(--ink);background:var(--white);transition:all .15s}
.chip:hover{background:var(--grege)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:var(--r99);line-height:1.4;white-space:nowrap}
.tag.gold{background:var(--gold-lt);color:var(--gold-dk)}
.tag.violet{background:var(--violet-lt);color:var(--violet)}
.tag.green{background:var(--green-lt);color:var(--green)}
.tag.red{background:var(--red-lt);color:var(--red)}
.tag.gray{background:var(--grege);color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 17px;border-radius:var(--r99);border:1px solid var(--border2);background:var(--white);color:var(--ink);font-size:13.5px;font-weight:600;transition:all .15s;text-decoration:none}
.btn:hover{background:var(--grege)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#3A3732}
.lab{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk)}
.lab::before{content:'';width:24px;height:2px;border-radius:2px;background:var(--gold)}
.empty{border:1.5px dashed var(--border2);border-radius:var(--r16);padding:26px;background:var(--white);text-align:center;color:var(--ink3)}
.empty b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r16);padding:20px 22px;text-align:left;transition:border-color .15s}
.stat:hover{border-color:var(--border2)}
.stat b{display:block;font-family:var(--serif);font-size:46px;font-weight:600;line-height:1.05}
.stat span{font-size:13.5px;color:var(--ink3)}
.hero-t{font-family:var(--serif);font-size:54px;font-weight:600;line-height:1.02;letter-spacing:-.01em}
.hero-s{font-size:16px;color:var(--ink3);max-width:640px;margin:10px 0 24px}

@media(max-width:1080px){:root{--pad:22px}.topbar{flex-wrap:wrap;gap:12px}.gsearch{max-width:none;flex-basis:100%;order:3;margin-left:0}}
@media(max-width:900px){:root{--sw:68px}.sidebar{padding:18px 10px;align-items:stretch}.sb-lbl,.sb-sec,.sb-pill,.sb-foot,.sb-n,.sb-item.sub{display:none}.sb-item{justify-content:center;padding:10px}.sb-item.active::before{left:-10px}.sb-logo svg{width:46px}.sb-head{padding:0 0 12px;align-items:center}.hero-t{font-size:40px}}
@media(max-width:640px){.topbar-title{font-size:26px}}
@media print{.sidebar,.topbar,.no-print{display:none!important}.page{padding:0}body{background:#fff}}

/* ═══ Boîte à outils : spécifique ═══ */
.sb-cat{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r8);font-size:13.5px;font-weight:500;color:var(--ink3);width:100%;text-align:left;background:none;border:none;transition:background .15s;position:relative}
.sb-cat:hover{background:rgba(255,255,255,.7)}
.sb-cat.active{background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.sb-cat.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.sb-cat .sb-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:900px){.sb-cat{display:none}}
.page{max-width:1240px}
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink3);background:none;border:none;padding:0}
.back:hover{color:var(--ink)}
.found{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 22px;padding:12px 16px;border-radius:var(--r12);background:var(--gold-lt);border:1px solid #E6D8C3;font-size:14px;color:var(--ink3)}
.found b{color:var(--ink)}
.found .chip{padding:4px 12px;font-size:12.5px}
.found .x{margin-left:auto;background:none;border:none;font-size:13px;font-weight:600;color:var(--gold-dk)}
.sh{font-family:var(--serif);font-size:30px;font-weight:600;margin:34px 0 14px;line-height:1.1}
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.atile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px 20px;background:var(--white);border:1px solid var(--border);border-radius:var(--r16);transition:all .15s;min-height:128px}
.atile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh2)}
.atile h3{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1}
.atile .f{font-size:13.5px;color:var(--ink3);line-height:1.45}
.atile .f b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:2px}
.atile .n{margin-top:auto;font-size:12px;color:var(--muted);font-weight:600}
/* fiche actif */
.a-h{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.a-h h1{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.a-src{margin-top:10px;font-size:13px;color:var(--muted);max-width:760px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r99);background:var(--grege);border:1px solid var(--border)}
.seg button{display:inline-flex;align-items:center;gap:6px;border:none;background:none;height:32px;padding:0 14px;border-radius:var(--r99);font-size:13px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 0 0 1px var(--border)}
.best{margin-top:24px;padding:26px 30px;background:var(--white);border:1px solid #E6D8C3;border-left:4px solid var(--gold);border-radius:var(--r16);box-shadow:var(--sh2)}
.best .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.best h2{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1}
.why{margin:12px 0 4px;font-size:16.5px;line-height:1.7;color:var(--ink);max-width:860px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.fc{padding:14px 16px;border-radius:var(--r12);background:var(--canvas);border:1px solid var(--border)}
.fc.ci.red{background:var(--red-lt);border-color:#EBC9BE}.fc.ci.green{background:var(--green-lt);border-color:#CFE0CC}.fc.ci.amber{background:var(--orange-lt);border-color:#EBD5AE}
.fc .l{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fc.ci.red .l{color:var(--red)}.fc.ci.green .l{color:var(--green)}.fc.ci.amber .l{color:var(--orange)}
.fc .v{font-size:15px;line-height:1.55}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{font-size:13px;font-weight:500;padding:3px 11px;border-radius:12px;background:var(--white);border:1px solid var(--border2);color:var(--ink);transition:all .15s}
button.bchip:hover{background:var(--gold-lt);border-color:var(--gold)}
.meter{display:flex;gap:4px;margin:2px 0 8px}
.meter i{flex:1;height:6px;border-radius:4px;background:var(--border2);position:relative;overflow:hidden}
.meter i::after{content:'';position:absolute;inset:0;width:var(--w,0%);background:var(--gold);border-radius:4px}
.meter.l3 i::after{background:var(--green)}.meter.l1 i::after{background:var(--orange)}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.form{padding:20px 22px;background:var(--white);border:1px solid var(--border);border-radius:var(--r16);display:flex;flex-direction:column;gap:12px}
.form h3{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
.form .why{font-size:15px;margin:0;line-height:1.65;color:var(--ink3)}
.form .fgrid{grid-template-columns:1fr;margin-top:2px;gap:8px}
.alt{display:flex;gap:14px;align-items:flex-start;margin-top:24px;padding:18px 22px;border-radius:var(--r16);background:var(--blue-lt);border:1px solid #D2DEE5;font-size:15.5px;line-height:1.65}
.alt .ico{color:var(--blue);width:22px;height:22px;margin-top:2px}
.alt b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.twrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r16);background:var(--white);margin-top:22px}
table.t{border-collapse:collapse;width:100%;min-width:900px;font-size:14.5px}
.t th{position:sticky;top:0;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);background:var(--side);padding:12px 16px;border-bottom:1px solid var(--border)}
.t td{padding:14px 16px;vertical-align:top;border-bottom:1px solid var(--border);line-height:1.55}
.t tr:last-child td{border-bottom:none}
.t tr.best-r td{background:var(--gold-lt)}
.t td b{font-weight:600}.t td small{display:block;color:var(--ink3);font-size:13px;margin-top:3px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pn button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 20px;border-radius:var(--r12);border:1px solid var(--border);background:var(--white);font-weight:600;font-size:15px;min-width:200px}
.pn button:hover{border-color:var(--gold)}
.pn button small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pn button:last-child{align-items:flex-end;text-align:right;margin-left:auto}
/* catalogue */
.cat-h{display:grid;grid-template-columns:minmax(210px,1.2fr) minmax(220px,1.4fr) minmax(190px,1fr) minmax(220px,1.3fr);gap:20px;padding:12px 20px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);position:sticky;top:var(--tb,78px);z-index:20;background:var(--side);border:1px solid var(--border);border-radius:var(--r12);margin-top:6px}
.cat-g{font-family:var(--serif);font-size:25px;font-weight:600;margin:26px 4px 10px;display:flex;align-items:baseline;gap:12px}
.cat-g small{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted)}
.crow{display:grid;grid-template-columns:minmax(210px,1.2fr) minmax(220px,1.4fr) minmax(190px,1fr) minmax(220px,1.3fr);gap:20px;padding:16px 20px;background:var(--white);border:1px solid var(--border);border-radius:var(--r12);margin-bottom:8px;transition:border-color .15s;font-size:14.5px;line-height:1.55}
.crow:hover{border-color:var(--border2);box-shadow:var(--sh2)}
.crow .nm{font-weight:600;font-size:15.5px;line-height:1.4}
.crow .ct{display:inline-block;margin-top:6px}
.crow .lb{display:none;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.crow .po{margin-top:6px;color:var(--ink3);font-size:13.5px}
.crow .po b{font-weight:600;color:var(--ink)}
.crow .al{margin-top:8px;font-size:13px;color:var(--blue);line-height:1.5}
.crow .ci{font-size:13.5px;color:var(--ink);background:var(--red-lt);border-radius:var(--r8);padding:9px 12px;line-height:1.5}
.crow .ci.none{background:var(--green-lt);color:var(--green)}
.cnote{margin:22px 4px 0;font-size:13px;color:var(--muted);max-width:760px;line-height:1.6}
/* marques */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:var(--r16);padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.mc h3{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.mc dl{display:grid;gap:12px}
.mc dt{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:2px}
.mc dd{font-size:15px;line-height:1.6;word-break:break-word}
.mc dd a{color:var(--gold-dk);font-weight:500}
.mc .q{padding:12px 14px;border-radius:var(--r12);background:var(--orange-lt);border:1px solid #EBD5AE}
.mc .q.ok{background:var(--green-lt);border-color:#CFE0CC}
.mc .q dt{color:var(--orange)}.mc .q.ok dt{color:var(--green)}
.mc .nt{margin-top:auto;padding:12px 14px;border-radius:var(--r12);background:var(--grege);font-size:14px;line-height:1.6;color:var(--ink3)}

/* produits & problématiques */
.pcard{padding:20px 22px;background:var(--white);border:1px solid var(--border);border-radius:var(--r16);margin-bottom:12px;scroll-margin-top:calc(var(--tb,78px) + 20px)}
.pcard.flash{animation:flash 2.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(180,144,106,.45);border-color:var(--gold)}100%{box-shadow:none}}
.pcard .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pcard .nm{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15}
.pcard .pm{margin-top:6px;font-size:15px;line-height:1.55;color:var(--ink3);max-width:760px}
.pcard .fgrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}
.pcard .fc.ok{background:var(--gold-lt);border-color:#E6D8C3}
.pcard .fc.ok .l{color:var(--gold-dk)}
.sb2{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.sb2.ok{background:var(--green-lt);color:var(--green)}
.sb2.chk{background:var(--orange-lt);color:var(--orange)}
.srcl{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4}
.todo{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:var(--r12);border:1.5px dashed var(--border2);font-size:13.5px;color:var(--ink3)}
.pcard .alt{margin-top:12px;padding:12px 16px;font-size:14.5px}
.pcard .alt .ico{width:18px;height:18px}
.pcard .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pg{margin-top:20px}
.pgh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pgh button{border:none;font-size:13px}
.assoc{margin:2px 0 8px;padding:14px 18px;border-radius:var(--r12);background:var(--gold-lt);border:1px solid #E6D8C3}
.assoc b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:8px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ptile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:18px 20px;background:var(--white);border:1px solid var(--border);border-radius:var(--r16);transition:all .15s}
.ptile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--sh2)}
.ptile h3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15}
.ptile .n{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:auto}
.bar{height:5px;border-radius:4px;background:var(--grege);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
@media(max-width:1100px){.cat-h{display:none}.crow{grid-template-columns:1fr 1fr}.crow .lb{display:block}}
@media(max-width:720px){.crow{grid-template-columns:1fr}.a-h h1{font-size:36px}.others,.mgrid{grid-template-columns:1fr}.best{padding:20px}}
.print-logo{display:none}
@media print{.print-logo{display:block!important;width:150px;margin:0 0 16px}.print-logo svg{width:150px;height:auto}.print-logo svg path,.print-logo svg circle{fill:#1E1E1C}.seg,.pn,.back,.found{display:none!important}.form,.best,.crow,.mc{break-inside:avoid}}
</style>

 on 30-Sep-2026 08-15-21).txt", "duree": "valider", "froid": "valider", "avec": "cours: MODULE_DP_M3_EL - 8 - Cannabinoïdes  (transcribed on 30-Sep-2026 08-15-21).txt"}, "note": "Le cours confirme l'absence d'effet secondaire aux doses recommandées, mais des interactions médicamenteuses (inhibition des cytochromes et de la P-gp, surtout anticancéreux) et la précaution grossesse/allaitement. Le cours donne 20 à 100 mg/j au maximum et conseille de débuter bas : conforme à la posologie existante. Durée à valider."}, {"cat": "2.2 Terrain inflammatoire/allergique", "nom": "PEA (palmitoyléthanolamide)", "marque": "Nutrixeal PEAlgic (référence unique) — qualité OptiPEA, 400mg/gélule", "dose": "Aigu 3 gél/j (1200mg), entretien 1-2 gél/j (400-600mg)", "ci": "Grossesse, allaitement, enfant", "forme": "Gélule", "alt": "Référence unique retenue (RÈGLE N°37)", "actif": null, "moment": "En 3 prises par jour réparties (matin, midi, soir) : l'effet est maximal 1 à 2 heures après la prise et dure 4 à 6 heures, d'où la nécessité de prises régulières.", "duree": "Phase aiguë jusqu'à 1200 mg/j, puis réduction vers environ 600 mg/j (parfois moins) selon la douleur et l'inflammation. Le PEA est symptomatique : à associer à la prise en charge des causes, sans durée chiffrée dans le cours.", "froid": "", "avec": "", "src": {"moment": "cours: MODULE_DP_M3_EL - 8 - Cannabinoïdes  (transcribed on 30-Sep-2026 08-15-21).txt", "duree": "cours: MODULE_DP_M3_EL - 8 - Cannabinoïdes  (transcribed on 30-Sep-2026 08-15-21).txt", "froid": "vide", "avec": "vide"}, "note": "Le cours : pas d'effet indésirable, pas de risque de surdosage (dégradation enzymatique), contre-indication de précaution femme enceinte/allaitante et enfant. Il précise que le PEA ne traite ni la dysbiose, ni l'hyperperméabilité, ni la parodontite. Aucune consigne de conservation ni d'association alimentaire lue : champs laissés vides. Posologie existante (aigu 1200 mg, entretien 400-600 mg) cohérente avec le cours."}, {"cat": "2.2 Terrain inflammatoire/allergique", "nom": "Sélénium", "marque": "Nutripure ou noix du Brésil", "dose": "55µg/j", "ci": "—", "forme": "Gélule", "alt": "Alternative alimentaire déjà prévue (noix du Brésil)", "actif": 10, "moment": "Au cours du petit-déjeuner ou du déjeuner : le sélénium est le cofacteur de la glutathion peroxydase (défense antioxydante) et la prise avec un repas améliore la tolérance.", "duree": "Cure de 2 à 3 mois, avec contrôle avant renouvellement : ne jamais compléter à l'aveugle ni au-delà des apports recommandés.", "froid": "Température ambiante, à l'abri de la chaleur, de la lumière et de l'humidité (se conformer à la notice du fabricant).", "avec": "Une approche antioxydante globale : zinc (cofacteur de la SOD), glutathion (substrat de la GPx), vitamines C et E. Les antioxydants et les enzymes antioxydantes fonctionnent en famille.", "src": {"moment": "valider", "duree": "valider", "froid": "valider", "avec": "cours: MODULE_DP_M3_EL - 7 - Stress oxydatif (transcribed on 29-Sep-2026 19-17-06).txt"}, "note": "Le cours (oligo-éléments) précise que le sélénium consommé à partir de 200 µg est pro-oxydant et toxique : la dose de 55 µg/j est bien en dessous de ce seuil. Le cours thyroïde le range parmi les nutriments à ne jamais donner à l'aveugle. Moment et durée non trouvés dans les cours, à valider."}, {"cat": "2.2 Terrain inflammatoire/allergique", "nom": "Vitamine C", "marque": "—", "dose": "500mg-1g/j entretien", "ci": "Prudence lithiase oxalocalcique", "forme": "Comprimé/gélule/poudre", "alt": "Existe très largement en poudre (acide ascorbique pur ou acérola en poudre) — alternative facile et courante", "actif": 5, "moment": "Le matin avant le petit-déjeuner, ou à distance d'un repas : vitamine hydrosoluble, elle est mieux absorbée à estomac vide, sans compétition de transport avec les nutriments du repas.", "duree": "Cure de 1 à 3 mois, ou prises ponctuelles en saison allergique ou infectieuse, puis réévaluation.", "froid": "Température ambiante, à l'abri de la chaleur, de la lumière et de l'humidité (se conformer à la notice du fabricant). La vitamine C s'oxyde à la lumière et à l'humidité.", "avec": "Vitamine E (la vitamine C la recycle, puis est elle-même recyclée par le glutathion) et fer végétal, dont elle améliore l'absorption (par exemple lentilles avec un comprimé ou une orange).", "src": {"moment": "cours: MODULE_DP_M3_EL - 7 - Stress oxydatif (transcribed on 29-Sep-2026 19-17-06).txt", "duree": "valider", "froid": "valider", "avec": "cours: MODULE_DP_M3_EL - 7 - Stress oxydatif (transcribed on 29-Sep-2026 19-17-06).txt"}, "note": "Le cours précise que la vitamine C n'améliore que l'absorption du fer végétal. Le cours allergie la cite comme antihistaminique (synergie avec quercétine et bromélaïne, active la DAO, limite la synthèse d'histamine). Dose de 500 mg à 1 g/j non contredite ; contre-indication existante (lithiase oxalocalcique) conservée."}, {"cat": "2.2 Terrain inflammatoire/allergique", "nom": "Vitamine E", "marque": "—", "dose": "100-200mg/j au repas", "ci": "Prudence anticoagulant", "forme": "Gélule (capsule molle)", "alt": "Existe en flacon liquide (huile de germe de blé riche en vit E) — alternative alimentaire", "actif": null, "moment": "Au cours d'un repas contenant des graisses (midi ou soir) : vitamine liposoluble, elle nécessite des lipides et une bonne chasse biliaire pour être absorbée.", "duree": "Cure de 2 à 3 mois, puis réévaluation : la vitamine E n'est efficace qu'au sein d'un apport antioxydant complet.", "froid": "Température ambiante, à l'abri de la chaleur, de la lumière et de l'humidité (se conformer à la notice du fabricant). Éviter la chaleur.", "avec": "Vitamine C, acide alpha-lipoïque et glutathion : ils recyclent la vitamine E oxydée. Donnée seule, elle réduit peu le stress oxydatif ; elle protège aussi les oméga-3 de l'oxydation.", "src": {"moment": "cours: MODULE_DP_M3_EL - 7 - Stress oxydatif (transcribed on 29-Sep-2026 19-17-06).txt", "duree": "valider", " ss avec manifestations digestives (reflux, gastrite), synergie GABAergique.", "src": {"moment": "valider", "duree": "valider", "froid": "valider", "avec": "cours: MODULE_DP_M5_EL - 19 - Indolamines.pdf"}, "note": "Le cours (neuro-excitabilité) donne 600 mg d'extrait sec/j ou EPS 5-10 ml, avec précaution d'emploi : interaction avec le récepteur de la TSH. À surveiller en hypothyroïdie/Hashimoto (déjà indiqué en contre-indication existante)."}, {"cat": "4.2 Neuroexcitabilité/GABA", "nom": "Valériane officinale", "marque": "—", "dose": "400-500mg/j ou EPS 5-10ml/j", "ci": "Enfant, grossesse, allaitement, sédatifs/alcool", "forme": "Gélule ou liquide (EPS)", "alt": "EPS déjà sans gélule", "actif": null, "moment": "En fin de journée ou au coucher : la valériane est anxiolytique, spasmolytique et hypnotique (libération de GABA, moindre dégradation du GABA), elle détend les tensions musculaires et prépare au sommeil.", "duree": "Cure de 3 à 4 semaines, puis pause et réévaluation ; ne pas prolonger sans réévaluation.", "froid": "Température ambiante, à l'abri de la chaleur, de la lumière et de l'humidité ; flacon bien fermé (odeur marquée).", "avec": "Avec la mélisse : 2/3 valériane - 1/3 mélisse en cas de stress avec tensions musculaires (posturales), synergie GABAergique. Pas d'alcool ni de sédatifs.", "src": {"moment": "valider", "duree": "valider", "froid": "valider", "avec": "cours: MODULE_DP_M5_EL - 19 - Indolamines.pdf"}, "note": "Cohérent avec le cours : 400-500 mg/j ou EPS 5-10 ml, contre-indiquée chez l'enfant, la femme enceinte, avec somnifères ou alcool. L'horaire précis n'est pas dans les cours."}, {"cat": "4.2 Neuroexcitabilité/GABA", "nom": "Théanine", "marque": "—", "dose": "100-200mg/j", "ci": "—", "forme": "Gélule", "alt": "Existe en poudre pure", "actif": null, "moment": "En milieu d'après-midi ou le soir si la tension monte : la théanine, acide aminé du thé vert, agit comme neuromodulateur sur l'équilibre GABA/glutamate et favorise la détente sans sédati     home:'<path d="M3 11 12 4l9 7v9H3ZM9 20v-6h6v6"/>'
  };
  A.ico=function(n,c){return '<svg class="ico'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(P[n]||P.tag)+'</svg>';};
  /* surbrillance tolérante aux accents : on garde la correspondance caractère par caractère */
  A.hl=function(text,terms){
    text=text==null?'':String(text);
    if(!terms||!terms.length) return A.esc(text);
    var n='',map=[],i,k,c;
    for(i=0;i<text.length;i++){c=A.norm(text[i]);for(k=0;k<c.length;k++){n+=c[k];map.push(i);}}
    var spans=[];
    terms.forEach(function(t){ if(!t) return; var p=0,j; while((j=n.indexOf(t,p))>-1){spans.push([map[j],map[j+t.length-1]+1]);p=j+t.length;} });
    if(!spans.length) return A.esc(text);
    spans.sort(function(a,b){return a[0]-b[0];});
    var out='',pos=0;
    spans.forEach(function(s){ if(s[1]<=pos) return; var a=Math.max(s[0],pos); out+=A.esc(text.slice(pos,a))+'<mark>'+A.esc(text.slice(a,s[1]))+'</mark>'; pos=s[1]; });
    return out+A.esc(text.slice(pos));
  };
  A.lev=function(a,b){
    if(a===b) return 0; if(Math.abs(a.length-b.length)>2) return 9;
    var m=[],i,j; for(i=0;i<=a.length;i++){m[i]=[i];} for(j=0;j<=b.length;j++){m[0][j]=j;}
    for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return m[a.length][b.length];
  };
  /* rang d'une entrée pour une requête : 0 = commence par · 1 = un mot commence par · 2 = tous les mots · 3 = contient · 4 = approchant */
  A.rank=function(key,terms,q,allowFuzzy){
    if(key.indexOf(q)===0) return 0;
    var words=key.split(/[\s\-\/'’(),;·]+/).filter(Boolean);
    if(words.some(function(w){return w.indexOf(terms[0])===0;}) && terms.every(function(t){return key.indexOf(t)>-1;})) return 1;
    if(terms.every(function(t){return words.some(function(w){return w.indexOf(t)===0;});})) return 2;
    if(terms.every(function(t){return key.indexOf(t)>-1;})) return 3;
    if(allowFuzzy && q.length>=4 && terms.length===1){
      var tol=q.length>=7?2:1;
      for(var i=0;i<words.length;i++){ var w=words[i].slice(0,q.length+1); if(Math.min(A.lev(q,words[i]),A.lev(q,w))<=tol) return 4; }
    }
    return -1;
  };
  /* Recherche prédictive : input + panneau, entrées {label,key,kind,group,meta,icon}. */
  A.suggest=function(o){
    var inp=o.input,box=o.panel,wrap=o.wrap,items=[],sel=-1,shown=[];
    function build(){ items=o.index(); items.forEach(function(it){ it.key=it.key||A.norm(it.label); }); }
    function terms(q){return A.norm(q).trim().split(/\s+/).filter(Boolean);}
    function compute(q){
      var t=terms(q),nq=t.join(' ');
      if(!t.length) return (o.idle?o.idle():[]).map(function(x){return {it:x,r:0};});
      var res=[],r,it,i,pass;
      for(pass=0;pass<2;pass++){
        for(i=0;i<items.length;i++){ it=items[i]; r=A.rank(it.key,t,nq,pass===1); if(r>-1) res.push({it:it,r:r}); }
        if(res.length) break;
      }
      var seen={};
      res=res.filter(function(x){var k=x.it.group+'|'+x.it.key; if(seen[k]) return false; seen[k]=1; return true;});
      res.sort(function(a,b){var ga=o.groups.indexOf(a.it.group),gb=o.groups.indexOf(b.it.group);return (a.r-b.r)||(ga-gb)||(a.it.label.length-b.it.label.length);});
      var cnt={},out=[];
      res.forEach(function(x){cnt[x.it.group]=(cnt[x.it.group]||0)+1; if(cnt[x.it.group]<=(o.perGroup||5) && out.length<(o.max||14)) out.push(x);});
      out.sort(function(a,b){return o.groups.indexOf(a.it.group)-o.groups.indexOf(b.it.group)||a.r-b.r;});
      return out;
    }
    function render(){
      var q=inp.value,t=terms(q);
      var r=compute(q); shown=r.map(function(x){return x.it;});
      var h='',last='',n=0;
      if(!t.length && shown.length) h+='<div class="gs-grp">Pour commencer</div>';
      r.forEach(function(x,i){
        var it=x.it;
        if(t.length && it.group!==last){h+='<div class="gs-grp">'+A.esc(it.group)+'</div>';last=it.group;}
        h+='<div class="gs-row'+(i===sel?' sel':'')+'" data-k="'+i+'">'+A.ico(it.icon||'search')+'<span class="gs-t">'+(t.length?A.hl(it.label,t):A.esc(it.label))+'</span>'+(it.meta?'<span class="gs-k">'+A.esc(it.meta)+'</span>':'')+'</div>';
      });
      if(t.length&&!shown.length) h+='<div class="gs-none">Aucune suggestion pour « '+A.esc(q)+' ». Appuyez sur Entrée pour chercher dans tout le texte.</div>';
      if(t.length&&shown.length&&o.fullText) h+='<div class="gs-row gs-full" data-k="full">'+A.ico('search')+'<span class="gs-t">Chercher « '+A.esc(q.trim())+' » dans tout le texte</span><span class="gs-k">Entrée</span></div>';
      h+='<div class="gs-foot"><span>↑↓ naviguer</span><span>↵ ouvrir</span><span>Échap fermer</span></div>';
      box.innerHTML=h; box.classList.toggle('open',!!(shown.length||t.length));
    }
    function pick(i){
      if(i==='full'||i===-1){ close(); o.onSubmit&&o.onSubmit(inp.value); return; }
      var it=shown[i]; if(!it) return;
      close(); if(it.fill!==false) inp.value=it.label; wrap.classList.toggle('has-q',!!inp.value);
      o.onPick(it);
    }
    function close(){box.classList.remove('open');sel=-1;}
    inp.addEventListener('input',function(){sel=-1;wrap.classList.toggle('has-q',!!inp.value);o.onInput&&o.onInput(inp.value);render();});
    inp.addEventListener('focus',function(){ if(!items.length) build(); render(); });
    inp.addEventListener('keydown',function(e){
      var max=shown.length+(box.querySelector('.gs-full')?1:0);
      if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(max-1,sel+1);render();scrollSel();}
      else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(-1,sel-1);render();scrollSel();}
      else if(e.key==='Enter'){e.preventDefault(); if(sel>=0) pick(sel>=shown.length?'full':sel); else {close();o.onSubmit&&o.onSubmit(inp.value);} }
      else if(e.key==='Escape'){ if(box.classList.contains('open')) close(); else if(inp.value){inp.value='';wrap.classList.remove('has-q');o.onInput&&o.onInput('');} else inp.blur(); }
    });
    function scrollSel(){var s=box.querySelector('.gs-row.sel'); if(s&&s.scrollIntoView) s.scrollIntoView({block:'nearest'});}
    box.addEventListener('mousedown',function(e){e.preventDefault();});
    box.addEventListener('click',function(e){var r=e.target.closest('.gs-row'); if(!r) return; var k=r.getAttribute('data-k'); pick(k==='full'?'full':parseInt(k,10));});
    document.addEventListener('click',function(e){ if(!wrap.contains(e.target)) close(); });
    inp.addEventListener('blur',function(){setTimeout(close,120);});
    var clr=wrap.querySelector('.gs-clear');
    if(clr) clr.addEventListener('click',function(){inp.value='';wrap.classList.remove('has-q');o.onInput&&o.onInput('');inp.focus();render();});
    document.addEventListener('keydown',function(e){
      var tag=(document.activeElement||{}).tagName;
      if(((e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'&&tag!=='SELECT')||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))){e.preventDefault();inp.focus();inp.select();}
    });
    return {rebuild:function(){items=[];build();},render:render,close:close};
  };
  return A;
})();

<script>
(function(){
  var D = JSON.parse(document.getElementById('boite-data').textContent);
  var ACT = D.actifs, CAT = D.catalogue, MQ = D.marques;
  var norm = AS.norm, esc = AS.esc, ico = AS.ico;
  var state = {view:'actifs', actif:null, q:'', cat:'', mode:'cards', hl:null};
  function el(id){ return document.getElementById(id); }
  function terms(){ return norm(state.q).trim().split(/\s+/).filter(Boolean); }
  function hit(hay, ts){ return ts.every(function(t){ return hay.indexOf(t) > -1; }); }
  function natKey(c){ var m = /^(\d+)(?:\.(\d+))?/.exec(c); return m ? (parseInt(m[1],10)*100 + (m[2]?parseInt(m[2],10):0)) : 9999; }

  ACT.forEach(function(a, i){ a._i = i; a._hay = norm([a.nom,a.source,a.alt].concat(a.formes.map(function(f){return [f.nom,f.pourquoi,f.bio,f.marques,f.dose,f.ci].join(' ');})).join(' ')); });
  CAT.forEach(function(c, i){ c._i = i; c._n = natKey(c.cat); c._hay = norm([c.cat,c.nom,c.marque,c.dose,c.ci,c.forme,c.alt,c.moment,c.duree,c.froid,c.avec].join(' ')); });
  MQ.forEach(function(m){ m._hay = norm(m.nom+' '+m.champs.map(function(c){return c.l+' '+c.v;}).join(' ')+' '+m.notes); });
  var CATS = {}; CAT.forEach(function(c){ CATS[c.cat] = (CATS[c.cat]||0)+1; });
  var CATNAMES = Object.keys(CATS).sort(function(a,b){ return natKey(a)-natKey(b) || a.localeCompare(b,'fr'); });

  function counts(){
    var ts = terms();
    return {actifs: ACT.filter(function(a){return hit(a._hay,ts);}).length, problematiques: CATNAMES.filter(function(c){return CAT.some(function(r){return r.cat===c && hit(r._hay,ts);});}).length, catalogue: CAT.filter(function(c){return hit(c._hay,ts);}).length, marques: MQ.filter(function(m){return hit(m._hay,ts);}).length};
  }

  /* ── Barre latérale ── */
  function renderSide(){
    var h = '<div class="sb-sec">Vues</div>';
    h += '<button class="sb-item'+(state.view==='actifs'?' active':'')+'" data-view="actifs">'+ico('flask')+'<span class="sb-lbl">Comparatifs actifs</span><span class="sb-n">'+ACT.length+'</span></button>';
    if (state.view==='actifs') ACT.forEach(function(a){ h += '<button class="sb-item sub'+(state.actif===a._i?' active':'')+'" data-actif="'+a._i+'">'+esc(a.nom)+'</button>'; });
    h += '<button class="sb-item'+(state.view==='problematiques'?' active':'')+'" data-view="problematiques">'+ico('activity')+'<span class="sb-lbl">Par problématique</span><span class="sb-n">'+CATNAMES.length+'</span></button>';
    h += '<button class="sb-item'+(state.view==='catalogue'?' active':'')+'" data-view="catalogue">'+ico('list')+'<span class="sb-lbl">Catalogue complet</span><span class="sb-n">'+CAT.length+'</span></button>';
    if (state.view==='catalogue' || state.view==='problematiques') {
      h += '<div class="sb-sec">Problématiques</div>';
      CATNAMES.forEach(function(c){ h += '<button class="sb-cat'+(state.cat===c?' active':'')+'" data-cat="'+esc(c)+'" title="'+esc(c)+'"><span class="sb-lbl">'+esc(c)+'</span><span class="sb-n">'+CATS[c]+'</span></button>'; });
    }
    h += '<button class="sb-item'+(state.view==='marques'?' active':'')+'" data-view="marques">'+ico('store')+'<span class="sb-lbl">Marques — où acheter</span><span class="sb-n">'+MQ.length+'</span></button>';
    h += '<div class="sb-sec">Mes outils</div>';
    h += '<a class="sb-item sb-ext" href="atlas-clinique.html">'+ico('book')+'<span class="sb-lbl">Atlas clinique</span></a>';
    h += '<a class="sb-item sb-ext" href="crm.html" target="_blank" rel="noopener">'+ico('users')+'<span class="sb-lbl">CRM</span></a>';
    el('sbnav').innerHTML = h;
  }

  /* ── Aides d'affichage ── */
  function bioLevel(t){
    var n = norm(t).slice(0,60);
    if (/faible/.test(n) && /moyenne/.test(n)) return 1.5;
    if (/moyenne/.test(n) && /(bonne|elevee)/.test(n)) return 2.5;
    if (/^faible|faible/.test(n)) return 1;
    if (/^moyenne/.test(n)) return 2;
    if (/^(elevee|bonne|excellente|tres)/.test(n)) return 3;
    return 0;
  }
  function meter(t){
    var l = bioLevel(t); if (!l) return '';
    var c = l>=2.5?'l3':(l<=1.5?'l1':'l2');
    return '<div class="meter '+c+'" aria-hidden="true">'+[0,1,2].map(function(i){ return '<i style="--w:'+Math.round(Math.max(0,Math.min(1,l-i))*100)+'%"></i>'; }).join('')+'</div>';
  }
  function ciBox(t){
    var n = norm(t||'');
    var cls = /^aucune majeure$/.test(n.replace(/[.\s]+$/,'')) ? 'green' : (/^aucune/.test(n) ? 'amber' : 'red');
    return '<div class="fc ci '+cls+'"><div class="l">'+ico(cls==='green'?'check':'alert')+'Contre-indications et interactions</div><div class="v">'+esc(t||'—')+'</div></div>';
  }
  function chips(s, clickable){
    return '<div class="bchips">'+String(s||'').split(/\s·\s/).filter(Boolean).map(function(x){
      return clickable ? '<button class="bchip" data-mq="'+esc(x.split(/[\s(—-]/)[0])+'">'+esc(x)+'</button>' : '<span class="bchip">'+esc(x)+'</span>';
    }).join('')+'</div>';
  }
  function found(){
    if (!state.q) return '';
    var c = counts(), tot = c.actifs + c.catalogue + c.marques;
    var h = '<div class="found">'+ico('search')+'<span><b>'+tot+'</b> résultat'+(tot>1?'s':'')+' pour « '+esc(state.q)+' » :</span>';
    [['actifs','actif'+(c.actifs>1?'s':''),c.actifs],['problematiques','problématique'+(c.problematiques>1?'s':''),c.problematiques],['catalogue','complément'+(c.catalogue>1?'s':''),c.catalogue],['marques','marque'+(c.marques>1?'s':''),c.marques]].forEach(function(v){
      h += '<button class="chip'+(state.view===v[0]?' on':'')+'" data-view="'+v[0]+'">'+v[2]+' '+v[1]+'</button>';
    });
    return h + '<button class="x" data-clearq="1">Effacer</button></div>';
  }

  /* ── Vue : comparatifs ── */
  function viewActifs(){
    var ts = terms(), h = '';
    if (state.actif === null){
      var list = ACT.filter(function(a){ return hit(a._hay, ts); });
      h += '<div class="lab">Comparatifs de formes</div><h1 class="hero-t" style="margin-top:14px">Choisir la bonne forme.</h1>'
        + '<p class="hero-s">Pour chaque actif : la forme que vous conseillez et pourquoi, la biodisponibilité des autres formes, les marques repères, la dose typique et les contre-indications à vérifier.</p>' + found();
      if (!list.length) h += '<div class="empty"><b>Aucun actif</b>ne correspond à « '+esc(state.q)+' ».</div>';
      h += '<div class="atiles">' + list.map(function(a){
        var best = a.formes.filter(function(f){return f.conseillee;})[0] || a.formes[0];
        return '<button class="atile" data-actif="'+a._i+'"><h3>'+AS.hl(a.nom,ts)+'</h3><div class="f"><b>Forme conseillée</b>'+AS.hl(best.nom,ts)+'</div><div class="n">'+a.formes.length+' forme'+(a.formes.length>1?'s':'')+' comparée'+(a.formes.length>1?'s':'')+'</div></button>';
      }).join('') + '</div>';
      return h;
    }
    var a = ACT[state.actif], best = a.formes.filter(function(f){return f.conseillee;})[0], rest = a.formes.filter(function(f){return f!==best;});
    h += '<div class="print-logo">'+document.querySelector('.sb-logo').innerHTML+'</div>';
    h += '<section id="'+esc(a.id)+'"><div class="crumbs"><button class="back" data-actif="-1">'+ico('back')+'Tous les actifs</button></div>'
      + '<div class="a-h"><div><h1>'+esc(a.nom)+'</h1><div class="a-src">'+esc(a.source)+'</div></div>'
      + '<div class="seg no-print"><button data-mode="cards" class="'+(state.mode==='cards'?'on':'')+'">'+ico('cards')+'Cartes</button><button data-mode="table" class="'+(state.mode==='table'?'on':'')+'">'+ico('table')+'Tableau</button></div></div>';
    if (state.mode === 'table'){
      h += '<div class="twrap"><table class="t"><thead><tr><th>Forme</th><th>Biodisponibilité</th><th>Marques repères</th><th>Dose typique</th><th>Contre-indications et interactions</th></tr></thead><tbody>'
        + a.formes.map(function(f){ return '<tr class="'+(f.conseillee?'best-r':'')+'"><td>'+(f.conseillee?'<span class="tag gold" style="margin-bottom:6px">★ Conseillée</span><br>':'')+'<b>'+esc(f.nom)+'</b>'+(f.pourquoi?'<small>'+esc(f.pourquoi)+'</small>':'')+'</td><td>'+esc(f.bio)+'</td><td>'+esc(f.marques)+'</td><td>'+esc(f.dose)+'</td><td>'+esc(f.ci)+'</td></tr>'; }).join('')
        + '</tbody></table></div>';
    } else {
      if (best) h += '<div class="best"><div class="top"><span class="tag gold">★ Forme conseillée</span></div><h2 style="margin-top:10px">'+esc(best.nom)+'</h2>'
        + (best.pourquoi?'<p class="why">'+esc(best.pourquoi)+'</p>':'')
        + '<div class="fgrid"><div class="fc"><div class="l">Biodisponibilité</div>'+meter(best.bio)+'<div class="v">'+esc(best.bio)+'</div></div>'
        + '<div class="fc"><div class="l">Dose typique</div><div class="v">'+esc(best.dose)+'</div></div>'
        + '<div class="fc"><div class="l">Marques repères</div>'+chips(best.marques)+'</div>'+ciBox(best.ci)+'</div></div>';
      if (rest.length) h += '<h2 class="sh">Autres formes</h2><div class="others">' + rest.map(function(f){
        return '<div class="form"><h3>'+esc(f.nom)+'</h3>'+(f.pourquoi?'<p class="why">'+esc(f.pourquoi)+'</p>':'')
          + '<div class="fgrid"><div class="fc"><div class="l">Biodisponibilité</div>'+meter(f.bio)+'<div class="v">'+esc(f.bio)+'</div></div>'
          + '<div class="fc"><div class="l">Dose typique</div><div class="v">'+esc(f.dose)+'</div></div>'
          + '<div class="fc"><div class="l">Marques repères</div>'+chips(f.marques)+'</div>'+ciBox(f.ci)+'</div></div>';
      }).join('') + '</div>';
    }
    if (a.alt) h += '<div class="alt">'+ico('drop')+'<div><b>Alternative sans avaler</b>'+esc(a.alt)+'</div></div>';
    var lk = CAT.filter(function(c){ return c.actif===a._i; });
    if (lk.length){
      var gs = {}; lk.forEach(function(c){ (gs[c.cat]=gs[c.cat]||[]).push(c); });
      h += '<h2 class="sh">Dans vos protocoles</h2><p class="hero-s" style="margin:-4px 0 6px">Le même actif sert dans plusieurs problématiques : posologie, durée de cure et compléments associés changent selon le terrain.</p>';
      Object.keys(gs).sort(function(x,y){return natKey(x)-natKey(y);}).forEach(function(cat){
        var others = CAT.filter(function(r){ return r.cat===cat && r.actif!==a._i; });
        h += '<div class="pg"><div class="pgh"><button class="tag gold" data-prob="'+esc(cat)+'">'+esc(cat)+' →</button></div>'
          + gs[cat].map(function(c){ return prodCard(c, [], {noActif:true, noProb:true}); }).join('');
        if (others.length) h += '<div class="assoc"><b>Dans la même problématique, pensez aussi à</b><div class="bchips">'+others.map(function(r){ return '<button class="bchip" data-prob="'+esc(cat)+'" data-hl="'+r._i+'">'+esc(r.nom)+'</button>'; }).join('')+'</div></div>';
        h += '</div>';
      });
    }
    var XL = {'Probiotiques':[{t:'Si hyperperméabilité intestinale : pensez aussi à la Perméaline (Pileje) — glutamine qui nourrit les entérocytes pendant que les probiotiques rééquilibrent la flore.',cat:'1.2 Dysbiose/SIBO/Hyperperméabilité',nom:'Glutamine (Permealine)'}]};
    (XL[a.nom]||[]).forEach(function(x){ var r = CAT.filter(function(c){return c.cat===x.cat && c.nom===x.nom;})[0]; if (r) h += '<div class="assoc" style="margin-top:18px"><b>Voir aussi</b><p style="margin:4px 0 8px">'+esc(x.t)+'</p><div class="bchips"><button class="bchip" data-prob="'+esc(x.cat)+'" data-hl="'+r._i+'">'+esc(r.nom)+' →</button></div></div>'; });
    var pv = ACT[(state.actif+ACT.length-1)%ACT.length], nx = ACT[(state.actif+1)%ACT.length];
    h += '<div class="pn no-print"><button data-actif="'+pv._i+'"><small>← Précédent</small>'+esc(pv.nom)+'</button><button data-actif="'+nx._i+'"><small>Suivant →</small>'+esc(nx.nom)+'</button></div></section>';
    return h;
  }


  /* ── Fiche produit (une ligne du catalogue) ── */
  var PF = [['moment','Moment de prise','clock'],['duree','Durée de cure','calendar'],['froid','Conservation','snow'],['avec','À prendre avec','plus']];
  function prodCard(c, ts, opts){
    opts = opts || {};
    var filled = PF.filter(function(f){ return c[f[0]]; });
    var none = /^aucune/.test(norm(c.ci)) && norm(c.ci).length < 40;
    var h = '<div class="pcard'+(state.hl===c._i?' flash':'')+'" id="p'+c._i+'"><div class="ph"><div><div class="nm">'+AS.hl(c.nom,ts)+'</div>'+((c.marque && c.marque!=='—')?'<div class="pm">'+AS.hl(c.marque,ts)+'</div>':'')+'</div>'+(c.forme?'<span class="tag gray">'+esc(c.forme)+'</span>':'')+'</div><div class="fgrid">';
    h += '<div class="fc"><div class="l">Posologie</div><div class="v">'+esc(c.dose||'—')+'</div></div>';
    filled.forEach(function(f){
      var s = (c.src && c.src[f[0]]) || '', cours = /^cours/.test(s);
      h += '<div class="fc ok"><div class="l">'+ico(f[2])+f[1]+'<span class="sb2 '+(cours?'ok':'chk')+'">'+(cours?'Cours':'À valider')+'</span></div><div class="v">'+esc(c[f[0]])+'</div>'+(cours?'<div class="srcl">'+esc(s.replace(/^cours:\s*/,''))+'</div>':'')+'</div>'; });
    h += '<div class="fc ci '+(none?'green':'red')+'"><div class="l">'+ico(none?'check':'alert')+'Contre-indications</div><div class="v">'+esc(c.ci||'—')+'</div></div></div>';
    if (c.note) h += '<div class="todo" style="border-style:solid;border-color:#EBD5AE;background:var(--orange-lt);color:var(--ink)">'+ico('alert')+'<span><b>À vérifier :</b> '+esc(c.note)+'</span></div>';
    if (filled.length < PF.length) h += '<div class="todo">'+ico('note')+'<span>À compléter : '+PF.filter(function(f){return !c[f[0]];}).map(function(f){return f[1].toLowerCase();}).join(', ')+'</span></div>';
    if (c.alt) h += '<div class="alt">'+ico('drop')+'<div><b>Alternative sans avaler</b>'+esc(c.alt)+'</div></div>';
    var foot = '';
    if (c.actif!=null && !opts.noActif) foot += '<button class="bchip" data-actif="'+c.actif+'">Comparatif des formes : '+esc(ACT[c.actif].nom)+' →</button>';
    if (!opts.noProb) foot += '<button class="bchip" data-prob="'+esc(c.cat)+'" data-hl="'+c._i+'">Problématique : '+esc(c.cat.replace(/^[\d.]+\s*/,''))+' →</button>';
    if (foot) h += '<div class="foot">'+foot+'</div>';
    return h + '</div>';
  }
  function pctx(cat){ var n = CAT.filter(function(r){return r.cat===cat;}); return {n:n.length, done:n.filter(function(r){return PF.every(function(f){return r[f[0]];});}).length}; }
  function viewProb(){
    var ts = terms(), h = '';
    if (!state.cat){
      h += '<div class="lab">Par problématique</div><h1 class="hero-t" style="margin-top:14px">Tout ce que je donne pour un terrain.</h1>'
        + '<p class="hero-s">Chaque problématique réunit ses compléments au même endroit : produit, posologie, forme, contre-indications — et les actifs dont vous pouvez comparer les formes.</p>' + found();
      var cats = CATNAMES.filter(function(c){ return CAT.some(function(r){ return r.cat===c && hit(r._hay,ts); }); });
      if (!cats.length) return h + '<div class="empty"><b>Aucune problématique</b>ne correspond à « '+esc(state.q)+' ».</div>';
      h += '<div class="ptiles">' + cats.map(function(c){
        var x = pctx(c), ac = {}; CAT.forEach(function(r){ if (r.cat===c && r.actif!=null) ac[r.actif]=1; });
        return '<button class="ptile" data-prob="'+esc(c)+'"><h3>'+AS.hl(c,ts)+'</h3>'
          + (Object.keys(ac).length?'<div class="bchips">'+Object.keys(ac).map(function(i){return '<span class="bchip">'+esc(ACT[i].nom)+'</span>';}).join('')+'</div>':'')
          + '<div class="bar"><i style="width:'+Math.round(100*x.done/x.n)+'%"></i></div><div class="n">'+x.n+' produit'+(x.n>1?'s':'')+' · '+x.done+' fiche'+(x.done>1?'s':'')+' complète'+(x.done>1?'s':'')+'</div></button>';
      }).join('') + '</div>';
      return h;
    }
    var rows = CAT.filter(function(r){ return r.cat===state.cat && hit(r._hay,ts); });
    var ac = {}; rows.forEach(function(r){ if (r.actif!=null) ac[r.actif]=1; });
    h += '<div class="crumbs"><button class="back" data-prob="">'+ico('back')+'Toutes les problématiques</button></div>'
      + '<div class="print-logo">'+document.querySelector('.sb-logo').innerHTML+'</div>'
      + '<h1 class="hero-t" style="font-size:44px">'+esc(state.cat)+'</h1>'
      + '<p class="hero-s" style="margin-bottom:14px">'+rows.length+' produit'+(rows.length>1?'s':'')+' dans ce protocole.</p>' + found();
    if (Object.keys(ac).length) h += '<div class="assoc" style="margin-bottom:18px"><b>Comparer les formes de</b><div class="bchips">'+Object.keys(ac).map(function(i){return '<button class="bchip" data-actif="'+i+'">'+esc(ACT[i].nom)+' →</button>';}).join('')+'</div></div>';
    if (!rows.length) return h + '<div class="empty"><b>Aucun produit</b>pour cette recherche dans cette problématique.</div>';
    return h + rows.map(function(r){ return prodCard(r,ts,{noProb:true}); }).join('');
  }

  /* ── Vue : catalogue ── */
  function viewCatalogue(){
    var ts = terms(), rows = CAT.filter(function(c){ return (!state.cat || c.cat===state.cat) && hit(c._hay, ts); });
    rows.sort(function(a,b){ return a._n-b._n || a.cat.localeCompare(b.cat,'fr') || a._i-b._i; });
    var h = '<div class="lab">Catalogue complet</div><h1 class="hero-t" style="margin-top:14px">Tous les compléments, par terrain.</h1>'
      + '<p class="hero-s">Chaque ligne reprend le complément, la marque actuelle, la posologie, les contre-indications, la forme galénique et l’alternative sans avaler.</p>' + found();
    if (state.cat) h += '<div class="chips" style="margin-bottom:14px"><button class="chip on" data-cat="">'+esc(state.cat)+' ✕</button></div>';
    h += '<div class="lead-count" style="font-size:13.5px;color:var(--ink3);margin:0 4px 8px"><b>'+rows.length+'</b> ligne'+(rows.length>1?'s':'')+'</div>';
    if (!rows.length) return h + '<div class="empty"><b>Aucun résultat</b>pour cette recherche dans le catalogue.</div>';
    h += '<div class="cat-h"><div>Complément</div><div>Marque et posologie</div><div>Forme et alternative</div><div>Contre-indications</div></div>';
    var last = '';
    rows.forEach(function(c){
      if (c.cat !== last){ last = c.cat; h += '<div class="cat-g">'+esc(c.cat)+'<small>'+rows.filter(function(r){return r.cat===c.cat;}).length+' ligne'+'s</small></div>'; }
      var none = /^aucune/.test(norm(c.ci)) && norm(c.ci).length < 40;
      h += '<div class="crow"><div><div class="lb">Complément</div><div class="nm">'+AS.hl(c.nom,ts)+'</div></div>'
        + '<div><div class="lb">Marque et posologie</div><div>'+AS.hl(c.marque,ts)+'</div>'+(c.dose?'<div class="po"><b>Posologie :</b> '+esc(c.dose)+'</div>':'')+'</div>'
        + '<div><div class="lb">Forme</div>'+(c.forme?'<span class="tag gray">'+esc(c.forme)+'</span>':'')+(c.alt?'<div class="al"><b>Sans avaler :</b> '+esc(c.alt)+'</div>':'')+'</div>'
        + '<div><div class="lb">Contre-indications</div><div class="ci'+(none?' none':'')+'">'+esc(c.ci||'—')+'</div></div></div>';
    });
    if (D.noteBas) h += '<p class="cnote">'+esc(D.noteBas)+'</p>';
    return h;
  }

  /* ── Vue : marques ── */
  function linkify(v){
    return esc(v).replace(/(https?:\/\/[^\s)]+)/g, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\/(www\.)?/,'')+'</a>'; });
  }
  function viewMarques(){
    var ts = terms(), list = MQ.filter(function(m){ return hit(m._hay, ts); });
    var h = '<div class="lab">Où acheter</div><h1 class="hero-t" style="margin-top:14px">Les marques, côté pratique.</h1>'
      + '<p class="hero-s">Distribution, site de référence, programme professionnel et vérification qualité pour chaque marque.</p>' + found();
    if (!list.length) return h + '<div class="empty"><b>Aucune marque</b>ne correspond à « '+esc(state.q)+' ».</div>';
    h += '<div class="mgrid">' + list.map(function(m){
      var body = m.champs.map(function(c){
        if (/qualit/i.test(c.l)){
          var ok = /✅/.test(c.v) && !/⚠/.test(c.v);
          return '<div class="q'+(ok?' ok':'')+'"><dt>'+esc(c.l)+'</dt><dd>'+esc(c.v)+'</dd></div>';
        }
        return '<div><dt>'+esc(c.l)+'</dt><dd>'+linkify(c.v)+'</dd></div>';
      }).join('');
      return '<article class="mc"><h3>'+AS.hl(m.nom,ts)+'</h3><dl>'+body+'</dl>'+(m.notes?'<div class="nt">'+esc(m.notes)+'</div>':'')+'</article>';
    }).join('') + '</div>';
    return h;
  }

  function render(){
    renderSide();
    var v = state.view === 'actifs' ? viewActifs() : state.view === 'problematiques' ? viewProb() : state.view === 'catalogue' ? viewCatalogue() : viewMarques();
    el('page').innerHTML = v;
    if (state.hl !== null){ var hn = el('p'+state.hl); if (hn && hn.scrollIntoView) hn.scrollIntoView({block:'center'}); state.hl = null; }
    var c = counts();
    el('sub').textContent = ACT.length+' actifs · '+CAT.length+' compléments · '+MQ.length+' marques';
  }
  function go(view, opts){
    state.view = view; if (view!=='actifs') state.actif = null;
    if (opts) for (var k in opts) state[k] = opts[k];
    render(); if (state.hl === null) window.scrollTo({top:0});
    try { if (view==='actifs' && state.actif!==null) history.replaceState(null,'','#'+ACT[state.actif].id); else history.replaceState(null,'',location.pathname+location.search); } catch(e){}
  }
  function bestView(){
    var c = counts(); if (c[state.view] > 0) return state.view;
    var order = ['actifs','problematiques','catalogue','marques']; order.sort(function(a,b){ return c[b]-c[a]; });
    return c[order[0]] > 0 ? order[0] : state.view;
  }
  function setQ(v){ state.q = v; el('q').value = v; el('gs').classList.toggle('has-q', !!v); }

  /* ── Recherche prédictive ── */
  function buildIndex(){
    var out = [], seen = {};
    ACT.forEach(function(a){
      out.push({label:a.nom, kind:'actif', group:'Actifs', meta:a.formes.length+' formes', icon:'flask', i:a._i});
      a.formes.forEach(function(f){ out.push({label:f.nom, kind:'actif', group:'Formes', meta:a.nom, icon:'pill', i:a._i}); });
    });
    CAT.forEach(function(c){ var k = norm(c.nom); if (seen[k]) return; seen[k]=1; out.push({label:c.nom, kind:'cat-item', group:'Compléments du catalogue', meta:c.cat.replace(/^[\d.]+\s*/,''), icon:'list'}); });
    MQ.forEach(function(m){ out.push({label:m.nom, kind:'marque', group:'Marques', meta:'où acheter', icon:'store'}); });
    CATNAMES.forEach(function(c){ out.push({label:c, kind:'cat', group:'Problématiques', meta:CATS[c]+' produits', icon:'activity'}); });
    return out;
  }
  var SG = AS.suggest({
    input: el('q'), panel: el('gsres'), wrap: el('gs'),
    groups: ['Actifs','Formes','Problématiques','Compléments du catalogue','Marques'],
    perGroup: 4, max: 14, fullText: true,
    index: buildIndex,
    idle: function(){ return ACT.slice(0,5).map(function(a){ return {label:a.nom,kind:'actif',group:'Actifs',meta:a.formes.length+' formes',icon:'flask',i:a._i}; }); },
    onInput: function(v){ state.q = v; if (state.actif===null || !v) { render(); } },
    onSubmit: function(v){ state.q = v; state.actif = null; go(v ? bestView() : state.view); },
    onPick: function(it){
      if (it.kind==='actif'){ setQ(''); go('actifs',{actif:it.i}); }
      else if (it.kind==='cat'){ setQ(''); go('problematiques',{cat:it.label}); }
      else if (it.kind==='cat-item'){ state.q = it.label; go('catalogue',{cat:''}); }
      else { state.q = it.label; go('marques'); }
    }
  });

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-view],[data-actif],[data-cat],[data-mode],[data-clearq],[data-mq],[data-prob]'); if (!t) return;
    if (t.hasAttribute('data-prob')){ var pc = t.getAttribute('data-prob'), hh = t.getAttribute('data-hl'); state.hl = hh===null ? null : parseInt(hh,10); go('problematiques',{cat:pc}); return; }
    if (t.hasAttribute('data-mode')){ state.mode = t.getAttribute('data-mode'); render(); return; }
    if (t.hasAttribute('data-clearq')){ setQ(''); render(); return; }
    if (t.hasAttribute('data-mq')){ setQ(t.getAttribute('data-mq')); go('marques'); return; }
    if (t.hasAttribute('data-view')){ var v = t.getAttribute('data-view'); go(v, {actif:null, cat: (v==='catalogue'||v==='problematiques') ? state.cat : ''}); return; }
    if (t.hasAttribute('data-actif')){ var i = parseInt(t.getAttribute('data-actif'),10); go('actifs',{actif: i<0 ? null : i}); return; }
    if (t.hasAttribute('data-cat')){ var c = t.getAttribute('data-cat'); go(state.view==='problematiques'?'problematiques':'catalogue',{cat: state.cat===c ? '' : c}); return; }
  });

  function measure(){ document.documentElement.style.setProperty('--tb', el('topbar').offsetHeight + 'px'); }
  window.addEventListener('resize', measure); window.addEventListener('load', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  measure();

  /* ancres conservées : #actif-zinc, #actif-magnesium… */
  function fromHash(){
    var h = (location.hash||'').slice(1);
    for (var i=0;i<ACT.length;i++){ if (ACT[i].id === h){ state.view='actifs'; state.actif=i; return true; } }
    return false;
  }
  window.addEventListener('hashchange', function(){ if (fromHash()) render(); });
  var qp = new URLSearchParams(location.search).get('q');
  if (qp){ setQ(qp); state.view = bestView(); }
  fromHash();
  render();
})();
</script>
</body>
</html>
